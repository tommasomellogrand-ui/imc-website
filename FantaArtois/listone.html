<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listone | Fanta Artois</title><style>*{box-sizing:border-box}body{margin:0;background:#07120f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:24px 16px 80px}a{color:#e2b04a;text-decoration:none}h1{margin:18px 0 4px}.sub{color:#9aaba5;margin-bottom:20px}.search{width:100%;padding:15px 17px;border-radius:16px;border:1px solid #294338;background:#10231d;color:#fff;font-size:16px;margin-bottom:12px}.filters{display:flex;gap:7px;margin-bottom:15px}.filters button{border:1px solid #315044;background:#10231d;color:#dfe9e4;padding:8px 12px;border-radius:99px}.filters .on{background:#e2b04a;color:#111;border-color:#e2b04a}.row{display:grid;grid-template-columns:1fr 44px 54px;gap:8px;align-items:center;padding:14px 13px;background:#10231d;border:1px solid #203d32;border-radius:16px;margin:7px 0}.name{font-weight:800}.team{font-size:12px;color:#91a59c;margin-top:3px}.num{text-align:center}.role{display:inline-block;background:#e2b04a;color:#111;font-weight:900;font-size:11px;border-radius:50%;width:25px;height:25px;line-height:25px;text-align:center;margin-right:8px}.head{display:grid;grid-template-columns:1fr 44px 54px;color:#80968c;font-size:11px;padding:0 13px 4px}.loading{text-align:center;color:#9aaba5;padding:35px}</style></head><body><main class="w"><a href="./">← Fanta Artois</a><h1>Listone</h1><div class="sub" id="count">Fantacalcio 2026/27</div><input class="search" id="q" placeholder="Cerca calciatore o squadra"><div class="filters" id="filters"><button class="on" data-r="">Tutti</button><button data-r="P">P</button><button data-r="D">D</button><button data-r="C">C</button><button data-r="A">A</button></div><div class="head"><span>CALCIATORE</span><span>QA</span><span>FVM</span></div><div id="list" class="loading">Caricamento listone…</div></main><script>
const U='https://ugjeexyiowmqgkytukiz.supabase.co/rest/v1/fantacalcio_listone?select=id,r,rm,nome,squadra,qt_a,fvm,status&status=eq.ATTIVO&order=r.asc,nome.asc';
const K='sb_publishable_MBMbggUOaQCVvcWcMBSFNA_cy_TPgkH';let all=[],role='';
async function load(){try{let r=await fetch(U,{headers:{apikey:K}});if(!r.ok)throw new Error(r.status);all=await r.json();render()}catch(e){document.getElementById('list').innerHTML='Listone non disponibile ('+e.message+')'}}
function render(){let q=document.getElementById('q').value.toLowerCase().trim();let a=all.filter(x=>(!role||x.r===role)&&(!q||x.nome.toLowerCase().includes(q)||(x.squadra||'').toLowerCase().includes(q)));document.getElementById('count').textContent=a.length+' giocatori · Fantacalcio 2026/27';document.getElementById('list').className='';document.getElementById('list').innerHTML=a.map(x=>'<div class="row"><div><span class="role">'+x.r+'</span><span class="name">'+x.nome+'</span><div class="team">'+x.squadra+(x.rm?' · '+x.rm:'')+'</div></div><div class="num">'+x.qt_a+'</div><div class="num">'+x.fvm+'</div></div>').join('')}
document.getElementById('q').oninput=render;document.getElementById('filters').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');role=e.target.dataset.r;render()};load();
</script></body></html>
