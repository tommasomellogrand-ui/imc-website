<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Live Center | Fanta Artois</title><style>*{box-sizing:border-box}body{margin:0;background:#07120f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:20px 14px 80px}a{color:#d6b24e;text-decoration:none}.hero{margin:15px 0;padding:18px;border:1px solid #6e5b31;border-radius:20px;background:#10231d}.live{color:#ff6262;font-weight:900;font-size:12px}.score{text-align:center;font:900 28px Georgia;margin:12px}.teams{display:flex;justify-content:space-between;font-weight:900}.status{color:#93a59b;text-align:center;font-size:11px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}.team{background:#10231d;border:1px solid #304438;border-radius:16px;padding:10px}.team h2{font:900 18px Georgia;color:#d6b24e}.p{display:grid;grid-template-columns:1fr 34px 34px;gap:4px;align-items:center;padding:9px 3px;border-bottom:1px solid #243a31}.p small{display:block;color:#81958a}.v{font-weight:900;text-align:center}.fv{color:#d6b24e}.head{display:grid;grid-template-columns:1fr 34px 34px;font-size:9px;color:#81958a}.warn{padding:10px;border-radius:10px;background:#2a2114;color:#d8c69b;font-size:11px;margin:10px 0}@media(max-width:430px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}.team{padding:7px}.team h2{font-size:15px}.p{grid-template-columns:minmax(0,1fr) 26px 26px;gap:2px;padding:8px 1px;font-size:11px}.p small{font-size:9px}.head{grid-template-columns:minmax(0,1fr) 26px 26px;font-size:8px}.v{font-size:11px}.score{font-size:20px}}</style></head><body><main class="w"><a href="./">← Fanta Artois</a><section class="hero"><div class="live">● LIVE CENTER</div><div class="score">MONZA <span id="score">0 – 0</span> SASSUOLO</div><div class="status" id="updated">Connessione al bridge…</div></section><div class="warn">FANTACALCIO.IT LIVE · Titolari e panchina dal feed ufficiale. Voti aggiornati automaticamente ogni 15 secondi.</div><section class="cols"><div class="team"><h2>🏠 MONZA</h2><div class="head"><span>GIOCATORE</span><span>VOTO</span><span></span></div><div id="Monza"></div></div><div class="team"><h2>SASSUOLO ✈️</h2><div class="head"><span>GIOCATORE</span><span>V</span><span>FV</span></div><div id="Sassuolo"></div></div></section></main><script>
const B='https://ugjeexyiowmqgkytukiz.supabase.co/functions/v1/fantacalcio-official-live',S='https://ugjeexyiowmqgkytukiz.supabase.co/rest/v1/',K='sb_publishable_MBMbggUOaQCVvcWcMBSFNA_cy_TPgkH';let fantasy={};
const clean=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
const vote=v=>v==null?'—':(Number(v)>30?Number(v)/10:Number(v));
async function fantasyMap(){let [rr,tt]=await Promise.all([fetch(S+'fanta_rosters?select=team_id,player_id',{headers:{apikey:K}}),fetch(S+'fanta_teams?select=id,name',{headers:{apikey:K}})]),ros=await rr.json(),teams=await tt.json(),tn=Object.fromEntries(teams.map(x=>[x.id,x.name])),ids=ros.map(x=>x.player_id).join(',');let pp=ids?await(await fetch(S+'fantacalcio_listone?select=id,nome&id=in.('+ids+')',{headers:{apikey:K}})).json():[];fantasy={};ros.forEach(x=>{let p=pp.find(y=>y.id===x.player_id);if(p)fantasy[clean(p.nome)]=tn[x.team_id]})}
function row(x,starter){let ft=fantasy[clean(x.name)]||'Non assegnato';return '<div class="p"><div><b>'+x.name+'</b><small>⚽ '+ft+(starter?' · TITOLARE':' · PANCHINA')+'</small></div><div class="v">'+vote(x.vote)+'</div><div></div></div>'}
function renderTeam(id,players){let real=players.filter(x=>x.position!=='ALL'),starters=real.filter(x=>x.substitutionId==null).slice(0,11),bench=real.filter(x=>x.substitutionId!=null);document.getElementById(id).innerHTML=starters.map(x=>row(x,true)).join('')+'<div class="role">PANCHINA</div>'+bench.map(x=>row(x,false)).join('')}
async function load(){try{await fantasyMap();let r=await fetch(B+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error||'bridge');let matches=d.data?.protoData||[],m=matches.find(x=>clean(x.teamHome)==='monza'&&clean(x.teamAway)==='sassuolo');if(!m)throw Error('partita non trovata nel feed ufficiale');renderTeam('Monza',m.playersHome||[]);renderTeam('Sassuolo',m.playersAway||[]);score.textContent=(m.goalHome??0)+' – '+(m.goalAway??0);updated.textContent='Fantacalcio.it LIVE · aggiornato '+new Date(d.updated_at).toLocaleTimeString('it-IT')}catch(e){updated.textContent='Fantacalcio Live in riconnessione · '+e.message}}
load();setInterval(load,15000);
</script></body></html>
