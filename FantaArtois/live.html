<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Live Center | Fanta Artois</title><style>*{box-sizing:border-box}body{margin:0;background:#07120f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:20px 14px 80px}a{color:#d6b24e;text-decoration:none}.hero{margin:15px 0;padding:18px;border:1px solid #6e5b31;border-radius:20px;background:#10231d}.live{color:#ff6262;font-weight:900;font-size:12px}.score{text-align:center;font:900 28px Georgia;margin:12px}.teams{display:flex;justify-content:space-between;font-weight:900}.status{color:#93a59b;text-align:center;font-size:11px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}.team{background:#10231d;border:1px solid #304438;border-radius:16px;padding:10px}.team h2{font:900 18px Georgia;color:#d6b24e}.p{display:grid;grid-template-columns:1fr 34px 34px;gap:4px;align-items:center;padding:9px 3px;border-bottom:1px solid #243a31}.p small{display:block;color:#81958a}.v{font-weight:900;text-align:center}.fv{color:#d6b24e}.head{display:grid;grid-template-columns:1fr 34px 34px;font-size:9px;color:#81958a}.warn{padding:10px;border-radius:10px;background:#2a2114;color:#d8c69b;font-size:11px;margin:10px 0}@media(max-width:430px){.cols{grid-template-columns:1fr}.p{font-size:13px}}</style></head><body><main class="w"><a href="./">← Fanta Artois</a><section class="hero"><div class="live">● LIVE CENTER</div><div class="score">MONZA <span id="score">0 – 0</span> SASSUOLO</div><div class="status" id="updated">Connessione al bridge…</div></section><div class="warn">Voti live dal bridge esterno; V = voto, FV = fantavoto. Aggiornamento automatico ogni 30 secondi.</div><section class="cols"><div class="team"><h2>Monza</h2><div class="head"><span>GIOCATORE</span><span>V</span><span>FV</span></div><div id="Monza"></div></div><div class="tea </script></body></html>
