<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Squadra 1 | Fanta Artois</title><style>*{box-sizing:border-box}body{margin:0;background:#07120f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:22px 14px 80px}a{color:#d6b24e;text-decoration:none}h1{font:900 32px Georgia;margin:18px 0 3px}.muted{color:#8fa095}.tabs{display:flex;gap:7px;margin:18px 0}.tabs button{padding:9px 12px;border-radius:99px;border:1px solid #554a2b;background:#10231d;color:#fff}.tabs .on{background:#d6b24e;color:#111}.role{margin-top:16px;color:#d6b24e;font-weight:900}.player{display:flex;justify-content:space-between;background:#10231d;border:1px solid #294137;border-radius:12px;padding:11px;margin:6px 0}.player small{color:#8fa095}.field{background:linear-gradient(#17492e,#0e3621);border:2px solid #d8d1a655;border-radius:18px;padding:18px 8px;margin-top:14px;min-height:480px}.line{display:flex;justify-content:space-evenly;gap:5px;margin:24px 0}.slot{width:82px;min-height:54px;background:#f3e6c9;color:#241b11;border:2px solid #b79a52;border-radius:10px;padding:7px 3px;text-align:center;font-size:10px;font-weight:800}.slot b{display:block;color:#a11a1f}.slot{cursor:pointer}.bench{margin-top:14px;background:#10231d;border:1px solid #5b4d2b;border-radius:14px;padding:12px}.bench h3{margin:0 0 8px;font-size:13px;color:#d6b24e}.bp{display:inline-block;margin:4px;padding:8px 9px;border:1px solid #40574b;border-radius:9px;background:#172a21;color:#fff;font-size:11px}.picker{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:20}.picker.on{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#0c1913;border-radius:20px 20px 0 0;padding:16px;max-height:70%;overflow:auto}.pick{width:100%;text-align:left;padding:13px;margin:5px 0;border-radius:11px;border:1px solid #385044;background:#14271e;color:#fff}.close{width:100%;padding:12px;margin-top:8px;border:0;border-radius:11px;background:#d6b24e;font-weight:900}.mods{width:100%;padding:12px;border-radius:12px;background:#10231d;color:white;border:1px solid #66572f;font-weight:800}.save{width:100%;padding:13px;background:#ad1b21;color:#fff;border:0;border-radius:12px;font-weight:900;margin-top:12px}</style></head><body><main class="w"><a href="squadre.html">← Tutte le squadre</a><h1>Squadra 1</h1><div class="muted">Rosa demo · 25 giocatori</div><div class="tabs"><button id="tr" class="on">Rosa</button><button id="tf">Schiera formazione</button></div><section id="roster">Caricamento rosa…</section><section id="formation" hidden><select id="mod" class="mods"><option>3-4-3</option><option>3-5-2</option><option>4-3-3</option><option>4-4-2</option><option>4-5-1</option><option>5-3-2</option><option>5-4-1</option></select><div id="field" class="field"></div><button class="save">SALVA FORMAZIONE DEMO</button></section></main><script>
const U='https://ugjeexyiowmqgkytukiz.supabase.co/rest/v1/';const K='sb_publishable_MBMbggUOaQCVvcWcMBSFNA_cy_TPgkH';let players=[];
async function load(){let rr=await fetch(U+'fanta_rosters?select=role,player_id&team_id=eq.1',{headers:{apikey:K}});let ros=await rr.json();let ids=ros.map(x=>x.player_id).join(',');let pr=await fetch(U+'fantacalcio_listone?select=id,nome,squadra,r&id=in.('+ids+')',{headers:{apikey:K}});let pp=await pr.json();players=ros.map(r=>({...r,...pp.find(p=>p.id===r.player_id)}));drawRoster();drawField()}
function drawRoster(){let out='';for(const r of ['P','D','C','A']){out+='<div class="role">'+r+'</div>'+players.filter(x=>x.role===r).map(x=>'<div class="player"><b>'+x.nome+'</b><small>'+x.squadra+'</small></div>').join('')}document.getElementById('roster').innerHTML=out}
function drawField(){let [d,c,a]=document.getElementById('mod').value.split('-').map(Number);let used=new Set();function slots(r,n){let arr=players.filter(x=>x.role===r).slice(0,n);arr.forEach(x=>used.add(x.id));return '<div class="line">'+arr.map(x=>'<div class="slot"><b>'+r+'</b>'+x.nome+'</div>').join('')+'</div>'}document.getElementById('field').innerHTML=slots('A',a)+slots('C',c)+slots('D',d)+slots('P',1)}
document.getElementById('mod').onchange=drawField;document.getElementById('tr').onclick=()=>{roster.hidden=false;formation.hidden=true;tr.className='on';tf.className=''};document.getElementById('tf').onclick=()=>{roster.hidden=true;formation.hidden=false;tf.className='on';tr.className=''};load();
</script></body></html>
