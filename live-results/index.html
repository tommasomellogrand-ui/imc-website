/* --- MD10 GOLD 3D DEMO --- */

}

${D.games.map((g,i)=>{let[h,a]=sc[i],ev=g[2].filter(e=>+e[0]<=S.minute);return`<div class="game"><div class="score"><div class="team homeTeam">${logoHTML(g[0])}<span>${g[0]}</span></div><div class="num">${h}–${a}</div><div class="team away awayTeam"><span>${g[1]}</span>${logoHTML(g[1])}</div></div><div class="events">${ev.length?ev.map(e=>`<span class="event"><b>${e[0]}'</b> ${e[2]}</span>`).join(""):`<span class="waiting">${S.minute===0?'IN ATTESA DEL CALCIO D’INIZIO':'NESSUN GOL FINORA'}</span>`}</div></div>`}).join("")}</section>
<section class="section"><h2>ULTIMI EVENTI</h2><div class="table" id="feed">${latestFeed(div,S.minute)}</div></section>
<section class="section"><h2>${S.minute>=90?'CLASSIFICA AGGIORNATA':'CLASSIFICA LIVE'}</h2><div class="table">${lt.map((r,i)=>{let old=base[r[0]],now=i+1,cls=now<old?'up':now>old?'down':'same',sym=now<old?'▲':now>old?'▼':'•';return`<div class="row"><span class="pos">${now}</span><span class="club">${r[0]}</span><span class="pts">${r[1]} PT</span><span class="chg ${cls}">${sym}</span></div>`}).join("")}</div><div class="legend">La classifica viene ricalcolata minuto per minuto sui risultati correnti. Risultati, marcatori e minuti ufficiali del Matchday 10.</div></section>`}
function step(){
  let S=state[div];
  if(popupBusy || goalQueue.length) return;
  if(S.minute>=90)return;
  S.minute++;
  const hadGoals=collectGoalEvents();
  render();
  if(hadGoals){
    pauseTickerForPopup();
    processGoalQueue();
    return;
  }
  if(S.minute===45)showSpecial("HALF","TIME","Intervallo");
  if(S.minute===90){
    S.running=false;
    clearInterval(S.timer);
    showSpecial("FULL","TIME","Finale");
    setTimeout(showRecap,1250)
  }
}
function toggle(){
  let S=state[div];
  if(S.running){
    S.running=false;
    if(S.timer){clearInterval(S.timer);S.timer=null;}
    render();
    return;
  }
  if(S.minute>=90){resetDiv();S=state[div]}
  S.running=true;
  if(!popupBusy && !goalQueue.length){
    S.timer=setInterval(step,1000);
  }
  render();
}
function resetDiv(){let S=state[div];if(S.timer)clearInterval(S.timer);goalQueue=[];popupBusy=false;state[div]={minute:0,running:false,timer:null,shown:new Set(),finished:false};hideOverlay();render()}
function setDiv(d){let cur=state[div];if(cur&&cur.timer){clearInterval(cur.timer);cur.timer=null;cur.running=false;}goalQueue=[];popupBusy=false;div=d;render()}
function collectGoalEvents(){
  let S=state[div],D=DATA[div],found=false;
  let before=liveTable(div,Math.max(0,S.minute-1));
  D.games.forEach((g,i)=>g[2].forEach((e,j)=>{
    let key=i+"-"+j;
    if(+e[0]===S.minute&&!S.shown.has(key)){
      S.shown.add(key);
      found=true;
      let sc=scoresAt(div,S.minute)[i];
      let after=liveTable(div,S.minute);
      let oldPos=before.findIndex(r=>r[0]===e[1])+1;
      let newPos=after.findIndex(r=>r[0]===e[1])+1;
      goalQueue.push({min:e[0],player:e[2],h:g[0],a:g[1],sc,team:e[1],oldPos,newPos});
    }
  }));
  return found;
}
function pauseTickerForPopup(){
  let S=state[div];
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
}
function resumeTickerAfterPopups(){
  let S=state[div];
  popupBusy=false;
  if(S.running && S.minute<90 && !S.timer){
    S.timer=setInterval(step,1000);
  }
  if(S.minute===45)showSpecial("HALF","TIME","Intervallo");
  if(S.minute===90){
    S.running=false;
    if(S.timer){clearInterval(S.timer);S.timer=null;}
    showSpecial("FULL","TIME","Finale");
    setTimeout(showRecap,1250);
  }
}
function processGoalQueue(){
  if(popupBusy)return;
  if(!goalQueue.length){
    resumeTickerAfterPopups();
    return;
  }
  popupBusy=true;
  const g=goalQueue.shift();
  showGoal(g.min,g.player,g.h,g.a,g.sc,g.team,g.oldPos,g.newPos,()=>{
    popupBusy=false;
    processGoalQueue();
  });
}
function showGoal(min,player,h,a,sc,team,oldPos,newPos,onDone){
  let o=document.getElementById("overlay");
  let logo=(typeof LOGOS!=="undefined"&&LOGOS[team])?`<img class="ovlogo3d" src="assets/clubs/${LOGOS[team]}" alt="">`:"";
  o.className="overlay show goal3d";
  o.innerHTML=`<div class="entryFlash"></div><div class="premiumGlow"></div><div class="premiumClub">${logo}</div><div class="ovbox premiumPanel">
<div id="goalPhase" class="popupPhase">${logo}<div class="ovsmall">${min}' · GOL</div><div class="ovbig">GOAL</div><div class="ovtext">${player}</div><div class="ovmatch">${h} ${sc[0]}–${sc[1]} ${a}</div><div class="imcStamp">IMC · ROAD TO HISTORY</div></div>
<div id="tablePhase" class="tablePhase"></div>
</div>`;
  document.querySelector(".center")?.classList.add("shake");
  setTimeout(()=>document.querySelector(".center")?.classList.remove("shake"),360);
  const changed=oldPos>0&&newPos>0&&oldPos!==newPos;
  if(changed){
    setTimeout(()=>{
      const gp=document.getElementById("goalPhase"),tp=document.getElementById("tablePhase");
      if(!gp||!tp)return;
      gp.classList.add("fade");
      setTimeout(()=>{
        gp.style.display="none";
        const headline=newPos===1?"⚡ NUOVA CAPOLISTA":(newPos<oldPos?"▲ SALE IN CLASSIFICA":"▼ SCENDE IN CLASSIFICA");
        tp.innerHTML=`<div class="tableKicker">CLASSIFICA LIVE</div><div class="tableHeadline">${headline}</div><div class="tableClub">${team}</div><div class="tableMove"><span>${oldPos}°</span> → <span class="arrow">${newPos}°</span></div><div class="tableNote">EFFETTO DEL GOL SULLA CLASSIFICA</div><div class="imcStamp">IMC · ROAD TO HISTORY</div>`;
        tp.classList.add("show");
      },180);
    },2750);
  }
  setTimeout(()=>{
    hideOverlay();
    if(typeof onDone==="function")onDone();
  },6400);
}
function showSpecial(a,b,t){let o=document.getElementById("overlay");o.innerHTML=`<div class="ovbox"><div class="ovsmall">${t}</div><div class="ovbig">${a}<br>${b}</div></div>`;o.classList.add("show");setTimeout(hideOverlay,1100)}
function showRecap(){let D=DATA[div],sc=scoresAt(div,90),tot=sc.reduce((n,x)=>n+x[0]+x[1],0),o=document.getElementById('overlay');o.innerHTML=`<div class="ovbox"><div class="ovsmall">${div} · FINALE</div><div class="ovbig">5 PARTITE<br>${tot} GOL</div><div class="ovtext">${D.games.map((g,i)=>`${g[0]} ${sc[i][0]}–${sc[i][1]} ${g[1]}`).join('<br>')}</div></div>`;o.classList.add('show');setTimeout(hideOverlay,3200)}

function showTableAlert(team,oldPos,newPos){
  if(oldPos===newPos)return;
  let box=document.getElementById("tableAlert");
  let headline = newPos===1 ? "⚡ NUOVA CAPOLISTA" : (newPos<oldPos ? "▲ SALE IN CLASSIFICA" : "▼ SCENDE IN CLASSIFICA");
  box.innerHTML=`<div class="tableAlert3d"><div class="small">CLASSIFICA LIVE</div><div class="big">${headline}<br>${team}</div><div class="sub">${oldPos}° → ${newPos}° posto</div></div>`;
  setTimeout(()=>{box.innerHTML=""},2100);
}
function hideOverlay(){document.getElementById("overlay").classList.remove("show")}
render();
</script><div id="tableAlert"></div></body></html>
