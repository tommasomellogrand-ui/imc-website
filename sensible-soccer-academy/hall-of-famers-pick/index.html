<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Hall Of Famers · Pick Ceremony · Host</title><style>*{box-sizing:border-box}body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}.shell{min-height:100vh;padding:10px;background:#09214a}.screen{max-width:1100px;margin:auto;background:#0b2c5d;border:6px solid #d4d4d4;box-shadow:0 0 0 5px #111}.top{padding:14px;text-align:center;background:#071a39;border-bottom:4px solid #000}.top b{color:#ffd43c}.pitch{padding:18px;background:repeating-linear-gradient(90deg,#2f9b48 0 78px,#23813a 78px 156px)}.card{background:#071a39;border:4px solid #f0e6b4;box-shadow:4px 4px #000;padding:14px;margin-bottom:14px}.stage{text-align:center;min-height:250px;display:grid;place-items:center}.label{color:#9fc0e7;font-weight:900}.big{font-size:clamp(32px,7vw,72px);font-weight:900;color:#ffd43c;text-shadow:4px 4px #000}.slot{font-size:clamp(70px,18vw,150px)}button{width:100%;padding:15px;margin-top:10px;background:#208b3d;color:#fff;border:4px solid #fff;box-shadow:4px 4px #000;font:900 16px "Courier New"}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.row{background:#0c2852;padding:8px;border-bottom:2px solid #061326}.row b{color:#ffd43c}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links a{display:block;padding:12px;text-align:center;background:#0d3c77;color:#fff;border:3px solid #fff;text-decoration:none;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.links{grid-template-columns:1fr}}body{background:#17120d}.shell{background:radial-gradient(circle at 50% 10%,#5a472b 0,#1a140d 45%,#080604 100%)}.screen{background:#d7cfbd;border:10px double #9b7a3c;box-shadow:0 0 0 6px #302516,0 20px 60px #000}.top{background:linear-gradient(#e5ddcc,#b9ab91);color:#241c13;border-bottom:7px double #9b7a3c;font-family:Georgia,serif}.top b{color:#79561e}.pitch{background:linear-gradient(90deg,#8e826e 0 5%,#d8cfbd 5% 9%,#9b8e78 9% 13%,#18120c 13% 87%,#9b8e78 87% 91%,#d8cfbd 91% 95%,#8e826e 95%);padding:24px 9%}.card{background:radial-gradient(circle,#33281b,#17110b 72%);border:3px double #b18b46;box-shadow:0 8px 20px #000}.stage{min-height:330px;border-radius:48%;box-shadow:inset 0 0 0 10px #8f6f36,inset 0 0 0 14px #d2b16c,inset 0 0 60px #000}.label{color:#c8ad74;letter-spacing:.18em}.big{font-family:Georgia,serif;color:#e0bd70;text-transform:uppercase}.slot{color:#f0d18d}.row{background:linear-gradient(135deg,#ded5c3,#a99b82);color:#241d15;border:1px solid #7d653d;box-shadow:2px 2px #5d4d36}.row b{color:#73531f}.links a,button{background:linear-gradient(#4a3822,#21180f);border-color:#c6a15d;color:#f3dfb4;font-family:Georgia,serif}.grid{grid-template-columns:repeat(4,1fr)}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><main class="screen"><header class="top"><div>ITALIAN MASTERS CLUB</div><h1>HALL OF FAMERS</h1><b>THE PICK CEREMONY · HOST</b></header><section class="pitch"><div class="card links"><a href="live/" target="_blank">🏛 LIVE CEREMONY</a><a href="live/?replay=1" target="_blank">THE HALL · VIEW</a></div><div class="card stage"><div><div class="label" id="phase">READY</div><div class="big" id="manager">PRESS START</div><div class="big slot" id="slot">#--</div></div></div><div class="card"><button id="start">▶ START CEREMONY</button><button id="next" disabled>🏛 EXTRACT MANAGER + PICK</button><button id="reset" style="background:#8b2f2f">RESET CEREMONY</button></div><div class="card"><div class="label">THE HALL · <span id="count">0</span>/16</div><div class="grid" id="history"></div></div></section></main></div><script>(()=>{const managers=['Giorgio Grugni','Giovanni Iodice','Lorenzo Errico','Max Palace','Pep Buitre','Ringhio Gattuso','Tommaso Mello','Vincenzo Martorano','Giovanni Cabrioli','Giuseppe Trovato','Luciano Tana','Tommaso Prisco','Vardan Minasyan','Luciano Catalano','Luca Nudo','Sir Simone'];const $=x=>document.getElementById(x),api='api.php';let state={assignments:[]},busy=false;async function call(body){const r=await fetch(api,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):null,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'request_failed');return j}function render(s){state=s;$('count').textContent=s.assignments.length;$('history').innerHTML=[...s.assignments].sort((a,b)=>a.slot-b.slot).map(a=>'<div class="row"><b>SLOT '+a.slot+'</b><br>'+a.manager+'</div>').join('');if(s.manager)$('manager').textContent=s.manager;if(s.slot)$('slot').textContent='#'+s.slot;$('phase').textContent=String(s.phase||'READY').toUpperCase();$('next').disabled=busy||s.event==='waiting'||s.event==='completed';$('start').disabled=s.event!=='waiting'}async function spin(){if(busy)return;busy=true;$('next').disabled=true;const usedM=new Set(state.assignments.map(a=>a.manager)),usedS=new Set(state.assignments.map(a=>+a.slot)),ms=managers.filter(m=>!usedM.has(m)),ss=Array.from({length:16},(_,i)=>i+1).filter(n=>!usedS.has(n));if(!ms.length){busy=false;return}await call({action:'host_phase',phase:'manager_spinning'});for(let i=0;i<18;i++){const m=ms[Math.floor(Math.random()*ms.length)];$('manager').textContent=m;await new Promise(r=>setTimeout(r,55+i*7))}const manager=ms[Math.floor(Math.random()*ms.length)];$('manager').textContent=manager;await call({action:'host_phase',phase:'manager_selected',manager});$('phase').textContent='SLOT SPINNING';for(let i=0;i<20;i++){const n=ss[Math.floor(Math.random()*ss.length)];$('slot').textContent='#'+n;await new Promise(r=>setTimeout(r,50+i*7))}const slot=ss[Math.floor(Math.random()*ss.length)];$('slot').textContent='#'+slot;state=await call({action:'host_assignment',manager,slot});busy=false;render(state)}$('start').onclick=async()=>render(await call({action:'host_start'}));$('next').onclick=spin;$('reset').onclick=async()=>{if(confirm('Reset completo del sorteggio?'))render(await call({action:'host_reset'}))};call().then(render);setInterval(()=>{if(!busy)call().then(render).catch(()=>{})},2000)})();</script></body></html>
