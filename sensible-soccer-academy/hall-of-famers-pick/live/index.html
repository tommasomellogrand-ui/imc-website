<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>GW010 · World Cup Draw · Live</title><style>*{box-sizing:border-box}body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}.shell{min-height:100vh;padding:10px;background:#09214a}.screen{max-width:1100px;margin:auto;background:#0b2c5d;border:6px solid #d4d4d4;box-shadow:0 0 0 5px #111}.top{padding:14px;text-align:center;background:#071a39;border-bottom:4px solid #000}.top b{color:#ffd43c}.pitch{padding:18px;background:repeating-linear-gradient(90deg,#2f9b48 0 78px,#23813a 78px 156px)}.card{background:#071a39;border:4px solid #f0e6b4;box-shadow:4px 4px #000;padding:14px;margin-bottom:14px}.stage{text-align:center;min-height:300px;display:grid;place-items:center}.label{color:#9fc0e7;font-weight:900}.big{font-size:clamp(32px,7vw,72px);font-weight:900;color:#ffd43c;text-shadow:4px 4px #000}.slot{font-size:clamp(70px,18vw,150px)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.row{background:#0c2852;padding:8px;border-bottom:2px solid #061326}.row b{color:#ffd43c}.live{display:inline-block;background:#c92f2f;border:3px solid #fff;padding:7px 12px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><main class="screen"><header class="top"><div>SENSIBLE SOCCER ACADEMY</div><h1>GW010 · WORLD CUP DRAW</h1><b>MANAGER LIVE ACCESS</b></header><section class="pitch"><div class="card stage"><div><div class="live" id="event">WAITING FOR HOST</div><div class="label" id="phase" style="margin-top:16px">READY</div><div class="big" id="manager">-</div><div class="big slot" id="slot">#--</div></div></div><div class="card"><div class="label">ORDINE SCELTA NAZIONALI · <span id="count">0</span>/24</div><div class="grid" id="history"></div></div></section></main></div><script>(()=>{const $=x=>document.getElementById(x);async function load(){try{const r=await fetch('../api.php?t='+Date.now(),{cache:'no-store'}),s=await r.json();if(!s.ok)return;$('count').textContent=s.assignments.length;$('event').textContent=s.event==='completed'?'DRAW COMPLETE':s.event==='live'?'● LIVE':'WAITING FOR HOST';$('phase').textContent=String(s.phase||'ready').toUpperCase();$('manager').textContent=s.manager||'-';$('slot').textContent=s.slot?'#'+s.slot:'#--';$('history').innerHTML=[...s.assignments].sort((a,b)=>a.slot-b.slot).map(a=>'<div class="row"><b>SLOT '+a.slot+'</b><br>'+a.manager+'</div>').join('')||'<div class="row">Nessuna estrazione ancora.</div>'}catch(e){$('event').textContent='RECONNECTING...'}}load();setInterval(load,900)})();</script></body></html>
