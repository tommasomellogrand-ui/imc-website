<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Hall Of Famers · Player Lottery · Host</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;background:#0d0a07;color:#f5ead2;font-family:Georgia,serif}
.shell{width:100%;max-width:100%;min-height:100vh;padding:10px;background:radial-gradient(circle at 50% 0,#59462b,#17110b 45%,#070503);overflow:hidden}
.temple{width:min(100%,1180px);max-width:1180px;margin:0 auto;border:8px double #a8874b;background:#17110c;overflow:hidden}
.head{text-align:center;padding:20px 12px;background:linear-gradient(#e4dccb,#b9aa8f);color:#261d13;border-bottom:7px double #92703a}
.head small{letter-spacing:.32em}.head h1{margin:5px 0;font-size:clamp(30px,6vw,62px);letter-spacing:.08em}.head b{color:#77541c;letter-spacing:.18em}
.hall{width:100%;padding:22px 8%;background:linear-gradient(90deg,#c7bca8 0 5%,#1b140d 5% 95%,#c7bca8 95%);overflow:hidden}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.links a,button{display:block;width:100%;padding:13px;border:2px solid #c8a35c;background:linear-gradient(#4b3820,#21170e);color:#f5dfad;text-decoration:none;text-align:center;font:bold 15px Georgia}
.stage{width:100%;min-height:370px;margin:0;padding:32px 20px;border:3px double #b28d49;background:radial-gradient(circle,#382b1b,#15100b 70%);display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
.stagecontent{width:100%;max-width:760px;margin:0 auto;padding:0;text-align:center}
.meta{color:#c8ad74;letter-spacing:.15em;font-weight:bold}.manager{font-size:clamp(28px,5vw,54px);font-weight:bold;text-transform:uppercase;text-align:center}.player{font-size:clamp(34px,7vw,70px);color:#e4bd6c;font-weight:bold;text-shadow:3px 3px #000;text-align:center}.details{font-size:18px;line-height:1.35;margin-top:8px;text-align:center}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.controls button:disabled{opacity:.35}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#c9bea9;color:#281f16;padding:12px;text-align:center;border:1px solid #846b42}.stat b{display:block;font-size:24px;color:#73531f}
.history{margin-top:14px;background:#c9bea9;color:#281f16;padding:14px;overflow:hidden}.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.row{min-width:0;padding:8px;background:linear-gradient(135deg,#e3dac8,#b3a58c);border:1px solid #89724c;overflow-wrap:anywhere}.row b{color:#73531f}
@media(max-width:700px){
 .shell{padding:4px}.temple{width:100%;max-width:100%;margin:0;border-width:4px}
 .head{padding:14px 8px}.head small{font-size:10px;letter-spacing:.16em}.head h1{font-size:32px;line-height:1.05}.head b{font-size:11px;letter-spacing:.08em}
 .hall{padding:14px 18px;background:linear-gradient(90deg,#c7bca8 0 6%,#1b140d 6% 94%,#c7bca8 94%)}
 .links,.controls,.stats,.rows{grid-template-columns:1fr}
 .stage{min-height:330px;padding:28px 18px}
 .stagecontent{width:100%;max-width:100%}
 .meta,.manager,.player,.details{width:100%;max-width:100%;margin-left:auto;margin-right:auto;text-align:center;overflow-wrap:anywhere}
 .meta{font-size:12px}.manager{font-size:clamp(26px,8vw,34px);line-height:1.08}.player{font-size:clamp(36px,11vw,48px);line-height:1.04}.details{font-size:15px}
 .links a,button{min-height:52px}.stat{padding:9px}.stat b{font-size:21px}.history{padding:10px}.row{font-size:14px}
}
</style></head><body><div class="shell"><main class="temple"><header class="head"><small>ITALIAN MASTERS CLUB</small><h1>HALL OF FAMERS</h1><b>PLAYER LOTTERY · HOST</b></header><section class="hall"><div class="links"><a href="live/" target="_blank">🏛 LIVE VIEW</a><a href="#history">THE DRAFT</a></div><div class="stage"><div class="stagecontent"><div class="meta" id="meta">READY</div><div class="manager" id="manager">PRESS START</div><div class="player" id="player">84 PLAYERS</div><div class="details" id="details">64 estrazioni · 4 round</div></div><div class="controls"><button id="start">START LOTTERY</button><button id="draw" disabled>EXTRACT PLAYER</button><button id="reset">RESET</button></div><div class="stats"><div class="stat"><b id="call">0/64</b>CALL</div><div class="stat"><b id="round">—</b>ROUND</div><div class="stat"><b id="pick">—</b>PICK</div><div class="stat"><b id="remaining">84</b>AVAILABLE</div></div><div class="history" id="history"><b>EXTRACTIONS</b><div class="rows" id="rows"></div></div></section></main></div><script>
(()=>{const $=id=>document.getElementById(id);let state=null,busy=false;async function api(action){const r=await fetch('./api.php?ts='+Date.now(),{method:action?'POST':'GET',headers:action?{'Content-Type':'application/json'}:{},body:action?JSON.stringify({action}):null,cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'api_error');return j}
function render(s){state=s;const n=s.draws.length;$('call').textContent=n+'/64';$('round').textContent=s.completed?'4':s.round;$('pick').textContent=s.completed?'16':s.pick+'/16';$('remaining').textContent=s.remaining.length;$('manager').textContent=s.completed?'CEREMONY COMPLETE':(s.started?s.manager:'PRESS START');$('meta').textContent=s.completed?'64 / 64':(s.started?'ROUND '+s.round+' · PICK '+s.pick+' · CALL '+s.call+'/64':'READY');if(n){const d=s.draws[n-1];$('player').textContent=d.player;$('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.value+' · '+d.club}else{$('player').textContent='84 PLAYERS';$('details').textContent='64 estrazioni · 4 round'}$('draw').disabled=!s.started||s.completed||busy;$('start').disabled=s.started;$('rows').innerHTML=[...s.draws].reverse().map(d=>'<div class="row"><b>#'+d.call+' · R'+d.round+' P'+d.pick+'</b> · '+d.manager+'<br><strong>'+d.player+'</strong> · '+d.rating+' · '+d.age+' · '+d.club+'</div>').join('')}
async function animateTo(d,before){busy=true;$('draw').disabled=true;const pool=before.remaining;for(let i=0;i<28;i++){const p=pool[Math.floor(Math.random()*pool.length)];$('player').textContent=p[0];$('details').textContent='RATING '+p[1]+' · '+p[2]+' ANNI · '+p[3]+' · '+p[4];await new Promise(r=>setTimeout(r,45+i*6))}$('player').textContent=d.player;$('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.value+' · '+d.club;busy=false}
$('start').onclick=async()=>{try{render(await api('start'))}catch(e){alert(e.message)}};$('draw').onclick=async()=>{if(busy)return;try{const before=state;const next=await api('draw');const d=next.draws[next.draws.length-1];await animateTo(d,before);render(next)}catch(e){busy=false;alert(e.message)}};$('reset').onclick=async()=>{if(confirm('Cancellare tutta la Player Lottery?'))render(await api('reset'))};api().then(render).catch(e=>{$('meta').textContent='API ERROR';$('manager').textContent=e.message})})();
</script></body></html>
