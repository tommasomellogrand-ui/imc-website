<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Hall Of Famers · Player Lottery · Live</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0a07;color:#f5ead2;font-family:Georgia,serif}.shell{min-height:100vh;padding:14px;background:radial-gradient(circle at 50% 0,#59462b,#17110b 45%,#070503)}.temple{max-width:1180px;margin:auto;border:8px double #a8874b;background:#17110c}.head{text-align:center;padding:20px;background:linear-gradient(#e4dccb,#b9aa8f);color:#261d13;border-bottom:7px double #92703a}.head small{letter-spacing:.32em}.head h1{margin:5px 0;font-size:clamp(30px,6vw,62px);letter-spacing:.08em}.head b{color:#77541c;letter-spacing:.18em}.hall{padding:24px 8%;background:linear-gradient(90deg,#a89d89 0 4%,#d8cfbd 4% 8%,#1b140d 8% 92%,#d8cfbd 92% 96%,#a89d89 96%)}.stage{min-height:430px;border:3px double #b28d49;background:radial-gradient(circle,#382b1b,#15100b 70%);display:grid;place-items:center;text-align:center;padding:24px}.ring{width:min(590px,86vw);min-height:310px;border:14px double #aa8745;border-radius:50%;display:grid;place-items:center;padding:30px}.meta{color:#c8ad74;letter-spacing:.15em;font-weight:bold}.manager{font-size:clamp(28px,5vw,56px);font-weight:bold;text-transform:uppercase}.player{font-size:clamp(36px,7vw,74px);color:#e4bd6c;font-weight:bold;text-shadow:3px 3px #000}.details{font-size:18px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:#c9bea9;color:#281f16;padding:12px;text-align:center;border:1px solid #846b42}.stat b{display:block;font-size:24px;color:#73531f}.history{margin-top:14px;background:#c9bea9;color:#281f16;padding:14px}.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.row{padding:8px;background:linear-gradient(135deg,#e3dac8,#b3a58c);border:1px solid #89724c}.row b{color:#73531f}@media(max-width:700px){.stats,.rows{grid-template-columns:1fr}.hall{padding-left:10%;padding-right:10%}}</style></head><body><div class="shell"><main class="temple"><header class="head"><small>ITALIAN MASTERS CLUB</small><h1>HALL OF FAMERS</h1><b>PLAYER LOTTERY · LIVE</b></header><section class="hall"><div class="stage"><div class="ring"><div><div class="meta" id="meta">WAITING FOR HOST</div><div class="manager" id="manager">—</div><div class="player" id="player">84 PLAYERS</div><div class="details" id="details">64 estrazioni · 4 round</div></div></div></div><div class="stats"><div class="stat"><b id="call">0/64</b>CALL</div><div class="stat"><b id="round">—</b>ROUND</div><div class="stat"><b id="pick">—</b>PICK</div><div class="stat"><b id="remaining">84</b>AVAILABLE</div></div><div class="history"><b>THE DRAFT</b><div class="rows" id="rows"></div></div></section></main></div><script>(()=>{const $=id=>document.getElementById(id);async function load(){try{const r=await fetch('../api.php?t='+Date.now(),{cache:'no-store'}),s=await r.json();if(!s.ok)return;const n=s.draws.length;$('call').textContent=n+'/64';$('round').textContent=s.completed?'4':s.round;$('pick').textContent=s.completed?'16':s.pick+'/16';$('remaining').textContent=s.remaining.length;$('manager').textContent=s.completed?'CEREMONY COMPLETE':(s.started?s.manager:'—');$('meta').textContent=s.completed?'64 / 64':(s.started?'ROUND '+s.round+' · PICK '+s.pick+' · CALL '+s.call+'/64':'WAITING FOR HOST');if(n){const d=s.draws[n-1];$('player').textContent=d.player;$('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.value+' · '+d.club}else{$('player').textContent='84 PLAYERS'}$('rows').innerHTML=[...s.draws].reverse().map(d=>'<div class="row"><b>#'+d.call+' · R'+d.round+' P'+d.pick+'</b> · '+d.manager+'<br><strong>'+d.player+'</strong> · '+d.rating+' · '+d.age+' · '+d.club+'</div>').join('')}catch(e){$('meta').textContent='RECONNECTING...'}}load();setInterval(load,800)})();</script></body></html>
