<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06142f">
<title>IMC | Rivedi il sorteggio live</title>
<style>
:root{--navy:#06142f;--gold:#f6ce43;--green:#11834b;--blue:#1b55a8;--white:#f8f7ef;--muted:#9aa8bc}*{box-sizing:border-box}body{margin:0;background:#02070e;color:var(--white);font-family:"Courier New",monospace}.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#174b91 0,#091f48 34%,#041126 67%,#02070e 100%);padding:18px}.shell{max-width:1080px;margin:auto}.top{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center}.logo{width:86px}.brand{text-align:center;text-transform:uppercase;text-shadow:4px 4px 0 #000}.brand .sensible{font-size:clamp(30px,5vw,62px);font-weight:900;line-height:.9}.brand .soccer{font-size:clamp(40px,7vw,86px);font-weight:900;line-height:.8;-webkit-text-stroke:2px #d72b2b}.brand .academy{display:inline-block;margin-top:8px;padding:5px 14px;background:#08101c;border:3px solid #fff;border-left-color:#168b4e;border-right-color:#d72b2b;font-size:clamp(16px,2.5vw,28px);font-weight:900;letter-spacing:3px}.hero{margin:22px 0;text-align:center;padding:18px;background:rgba(7,20,37,.96);border:4px solid var(--gold);box-shadow:0 0 0 4px #000}.hero h1{margin:0;color:var(--gold);font-size:clamp(24px,5vw,48px)}.hero p{margin:8px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:linear-gradient(180deg,rgba(8,28,58,.97),rgba(2,10,20,.98));border:3px solid var(--gold);box-shadow:0 0 0 3px #000,inset 0 0 0 2px #33547e;border-radius:8px;overflow:hidden}.panel.sa{border-color:#d7b63c}.title{padding:11px;text-align:center;font-size:20px;font-weight:900;color:var(--gold);background:#0b2a58;border-bottom:3px solid #000}.sa .title{background:#0b472e}.list{padding:8px}.row{padding:10px;border-bottom:1px solid #274567;font-size:14px}.row b{color:var(--gold)}.empty{padding:18px;text-align:center;color:var(--muted)}.meta{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}.back{display:inline-block;margin-top:16px;padding:12px 16px;background:#0f6d43;color:white;text-decoration:none;border:2px solid white;font-weight:900;box-shadow:0 4px 0 #000}@media(max-width:700px){.app{padding:10px}.top{grid-template-columns:58px 1fr}.logo{width:54px}.brand .sensible{font-size:28px}.brand .soccer{font-size:40px;-webkit-text-stroke:1px #d72b2b}.brand .academy{font-size:13px;letter-spacing:2px}.grid{grid-template-columns:1fr}.row{font-size:12px}}
</style>
</head>
<body>
<div class="app"><div class="shell">
<header class="top"><img class="logo" src="/site-assets/images/imc-logo.png" alt="Italian Master Club"><div class="brand"><div class="sensible">Sensible</div><div class="soccer">Soccer</div><div class="academy">Academy</div></div></header>
<section class="hero"><h1>CIAO, RIVEDI IL SORTEGGIO LIVE</h1><p>Game World 010 · Italian Master Club</p></section>
<div class="grid"><section class="panel sa"><div class="title">🌎 SUD AMERICA</div><div class="list" id="saList"><div class="empty">Caricamento sorteggio...</div></div></section><section class="panel"><div class="title">🇪🇺 EUROPA</div><div class="list" id="euList"><div class="empty">Caricamento sorteggio...</div></div></section></div>
<div class="meta" id="meta"></div><div style="text-align:center"><a class="back" href="/sensible-soccer-academy/">TORNA ALLA IMC WHEEL</a></div>
</div></div>
<script>
(async()=>{const sa=document.getElementById('saList'),eu=document.getElementById('euList'),meta=document.getElementById('meta');try{const r=await fetch('../replay-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('not_found');const d=await r.json();const groups={SA:[],EU:[]};for(const a of d.assignments||[]){if(groups[a.region])groups[a.region].push(a)};function render(el,arr){el.innerHTML='';if(!arr.length){el.innerHTML='<div class="empty">Nessun sorteggio salvato.</div>';return}arr.forEach((a,i)=>{const div=document.createElement('div');div.className='row';div.innerHTML=(i+1)+'. <b>'+a.manager+'</b> → <b>'+a.team+'</b>';el.appendChild(div)})}render(sa,groups.SA);render(eu,groups.EU);meta.textContent=(d.drawId?'ID: '+d.drawId+' · ':'')+(d.savedAt?'Salvato: '+new Date(d.savedAt).toLocaleString('it-IT'):'');}catch(e){sa.innerHTML='<div class="empty">Il sorteggio ufficiale non è ancora stato salvato.</div>';eu.innerHTML='<div class="empty">Torna qui dopo il sorteggio live.</div>';meta.textContent='Replay non ancora disponibile.';}})();
</script>
</body>
</html>
