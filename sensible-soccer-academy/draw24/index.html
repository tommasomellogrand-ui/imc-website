<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>GW010 · Sensible Soccer Academy · 24 Slot Draw</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}.game{min-height:100vh;background:#0a234b;padding:10px}.screen{max-width:1200px;margin:auto;background:#0b2c5d;border:6px solid #d4d4d4;box-shadow:0 0 0 5px #111,0 0 0 9px #737373}.top{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px;background:linear-gradient(#163c76,#0a2551);border-bottom:4px solid #050505}.title{font-size:clamp(20px,4vw,32px);font-weight:900;text-shadow:3px 3px #000}.counter{background:#020813;border:3px solid #fff;padding:8px;color:#ffd43c;font-weight:900}.menu{display:grid;grid-template-columns:repeat(4,1fr);background:#06152d}.menu div{text-align:center;padding:10px;border-right:2px solid #000}.menu .active{background:#248b42}.pitch{background:repeating-linear-gradient(90deg,#2f9b48 0 80px,#23813a 80px 160px);padding:20px}.panel{background:#071a39;border:4px solid #f0e6b4;box-shadow:4px 4px #000;margin-bottom:14px}.head{background:#05162f;color:#ffd840;padding:9px;text-align:center;font-weight:900}.wheelwrap{position:relative;width:min(620px,94vw);margin:12px auto}.wheel{width:100%;aspect-ratio:1;border-radius:50%;border:14px solid #07152c;background:conic-gradient(#287fd5 0 15deg,#e04a3d 15deg 30deg,#287fd5 30deg 45deg,#e04a3d 45deg 60deg,#287fd5 60deg 75deg,#e04a3d 75deg 90deg,#287fd5 90deg 105deg,#e04a3d 105deg 120deg,#287fd5 120deg 135deg,#e04a3d 135deg 150deg,#287fd5 150deg 165deg,#e04a3d 165deg 180deg,#287fd5 180deg 195deg,#e04a3d 195deg 210deg,#287fd5 210deg 225deg,#e04a3d 225deg 240deg,#287fd5 240deg 255deg,#e04a3d 255deg 270deg,#287fd5 270deg 285deg,#e04a3d 285deg 300deg,#287fd5 300deg 315deg,#e04a3d 315deg 330deg,#287fd5 330deg 345deg,#e04a3d 345deg 360deg);box-shadow:7px 8px #000;transition:transform 3s cubic-bezier(.1,.7,.1,1)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:#f4f4e8 url('../../site-assets/images/imc-logo.png') center/76% auto no-repeat;border:7px solid #06152f;box-shadow:0 0 0 5px #fff}.pointer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);border-left:22px solid transparent;border-right:22px solid transparent;border-top:48px solid #fff;z-index:4}.winner{margin:8px 12px 12px;background:#041126;border:3px solid #fff;padding:10px;text-align:center;color:#ffd43c;font-weight:900}.team{display:none}.team.show{display:block}.controls{background:#071a39;border:4px solid #f0e6b4;padding:10px}.btn{width:100%;padding:14px;background:#208b3d;color:#fff;border:4px solid #fff;box-shadow:4px 4px #000;font:900 16px "Courier New"}.status{text-align:center;padding:10px;color:#ffd43c}.history{background:#071a39;border:4px solid #f0e6b4;margin-top:14px;padding:8px}.hrow{display:grid;grid-template-columns:42px 1fr 1.3fr 100px;gap:6px;align-items:center;padding:8px;background:#0f356e;border-bottom:2px solid #071a39;font-size:12px}.hrow b{color:#ffd43c}.popup{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.popup.show{display:flex}.popupbox{width:min(500px,90vw);background:#0d376f;border:5px solid #f2e8b6;box-shadow:7px 7px #000;text-align:center;padding:14px}.popupbox h1{color:#ffd43c}.crest{width:82px;height:82px;object-fit:contain;background:#fff;border:4px solid #fff}.footer{text-align:center;background:#06152f;padding:12px;color:#9fc0e7}@media(max-width:700px){.hrow{grid-template-columns:34px 1fr 1.2fr}.hrow span:last-child{display:none}.hub{width:88px;height:88px}.pitch{padding:10px}}</style></head><body><div class="game"><main class="screen"><header class="top"><div class="title">SENSIBLE SOCCER ACADEMY · GW010</div><div class="counter" id="counter">24 SLOT<br>24 CLUB</div></header><nav class="menu"><div>CAREER</div><div>TACTICS</div><div class="active">LIVE DRAW</div><div>RESULTS</div></nav><section class="pitch"><div class="panel"><div class="head">SELECT MANAGER</div><div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="mw"></div><div class="hub"></div></div><div class="winner" id="mwinner">READY</div></div><div class="panel team" id="teamstage"><div class="head" id="ttitle">SELECT CLUB</div><div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="tw"></div><div class="hub"></div></div><div class="winner" id="twinner">WAITING</div></div><div class="controls"><button class="btn" id="start">▶ START LIVE DRAW</button><div class="status" id="status">24 SLOT · 24 CLUB</div></div><section class="history"><div class="head">MATCH ASSIGNMENTS</div><div id="history"></div></section></section><footer class="footer">ITALIAN MASTER CLUB · SENSIBLE SOCCER ACADEMY · 1990s MODE</footer></main></div><div class="popup" id="popup"><div class="popupbox"><div style="color:#ffd43c;font-weight:900">TRANSFER / ASSIGNMENT CONFIRMED</div><h2 id="pm"></h2><div id="pr"></div><div style="font-size:24px">↓</div><img id="pcrest" class="crest"><h1 id="pt"></h1></div></div><script>(()=>{const E=[['Max Palace','EU'],['Luciano Catalano','EU'],['Tommaso Mello','SA'],['Sir Simone','EU'],['Ringhio Gattuso','EU'],['Vincenzo Martorano','SA'],['Andrea Meneghini','EU'],['Davide Rapisarda','EU'],['Vardan Minasyan','SA'],['Francesco Senesi','EU'],['Oleksandr Medvid','EU'],['Giuseppe Trovato','SA'],['Luciano Tana','EU'],['Carlo Colombo','EU'],['Nick Pepe','SA'],['Chicco Belin','EU'],['Marco Aloisi','EU'],['Cosimo Lonoce','SA'],['Nessun manager 1','SA'],['Nessun manager 2','SA'],['Nessun manager 3','SA'],['Nessun manager 4','SA'],['Nessun manager 5','SA'],['Nessun manager 6','SA']].map(x=>({name:x[0],region:x[1]}));const T={SA:['Peñarol','Colo-Colo','Millonarios','Bolívar','Olimpia','Alianza Lima','Santos','São Paulo','Grêmio','Argentinos Juniors',"Newell's Old Boys",'Vélez Sarsfield'],EU:['Atalanta','Ferencváros','IFK Göteborg','Aberdeen','Siviglia','West Ham United','Stoccarda','Anderlecht','Ajax','Olympique Lyonnais','Dinamo Zagreb','Benfica']};const ID={'Peñarol':376,'Colo-Colo':362,'Millonarios':618,'Bolívar':1238,'Olimpia':613,'Alianza Lima':621,'Santos':304,'São Paulo':306,'Grêmio':602,'Argentinos Juniors':267,"Newell's Old Boys":278,'Vélez Sarsfield':285,'Atalanta':96,'Ferencváros':1416,'IFK Göteborg':471,'Aberdeen':420,'Siviglia':168,'West Ham United':85,'Stoccarda':417,'Anderlecht':353,'Ajax':180,'Olympique Lyonnais':329,'Dinamo Zagreb':365,'Benfica':218};const $=x=>document.getElementById(x),rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;let managers=[...E.keys()],teams={SA:[...T.SA],EU:[...T.EU]},a=[],run=false,paused=false,spin=false,rotM=0,rotT=0;function render(){$('counter').innerHTML=managers.length+' SLOT<br>'+(teams.SA.length+teams.EU.length)+' CLUB';$('history').innerHTML=a.map(x=>'<div class="hrow"><span>#'+x.seq+'</span><b>'+x.manager+'</b><b>'+x.team+'</b><span>'+(x.region==='SA'?'S. AMERICA':'EUROPE')+'</span></div>').join('')}function turn(el,isM,cb){spin=true;const add=2160+rnd(1440);if(isM){rotM+=add;el.style.transform='rotate('+rotM+'deg)'}else{rotT+=add;el.style.transform='rotate('+rotT+'deg)'}setTimeout(()=>{spin=false;cb()},3100)}function popup(x){$('pm').textContent=x.manager;$('pr').textContent=x.region==='SA'?'SOUTH AMERICA':'EUROPE';$('pt').textContent=x.team;$('pcrest').src='../draw/crest.php?id='+ID[x.team];$('popup').classList.add('show');setTimeout(()=>$('popup').classList.remove('show'),4500)}function next(){if(!run||spin||!managers.length)return;paused=false;$('start').disabled=true;$('mwinner').textContent='SPINNING...';turn($('mw'),true,()=>{const pos=rnd(managers.length),mi=managers[pos],m=E[mi];$('mwinner').textContent=m.name;$('teamstage').classList.add('show');$('ttitle').textContent='SELECT CLUB · '+(m.region==='SA'?'SOUTH AMERICA':'EUROPE');$('twinner').textContent='SPINNING...';setTimeout(()=>turn($('tw'),false,()=>{const ti=rnd(teams[m.region].length),team=teams[m.region][ti],x={seq:a.length+1,manager:m.name,region:m.region,team,timestamp:new Date().toISOString()};managers.splice(pos,1);teams[m.region].splice(ti,1);a.push(x);$('twinner').textContent=team;render();popup(x);if(a.length===24){paused=true;$('start').disabled=true;$('start').textContent='24/24 · READY TO FINALIZE';$('status').textContent='DRAW COMPLETE · 24/24'}else{paused=true;$('start').disabled=false;$('start').textContent='▶ NEXT DRAW';$('status').textContent='ASSEGNAZIONE #'+a.length+' COMPLETATA'}},400),700)})}function start(){if(spin)return;if(run&&paused){$('popup').classList.remove('show');next();return}if(run)return;run=true;$('start').textContent='DRAW IN PROGRESS';setTimeout(next,800)}$('start').onclick=start;render()})();</script></body></html>
