<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>GW010 · Sensible Soccer Academy · Draw</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}.game{min-height:100vh;background:#0a234b;padding:8px}.screen{max-width:1100px;margin:auto;background:#0b2c5d;border:5px solid #d4d4d4;box-shadow:0 0 0 5px #111}.top{display:grid;grid-template-columns:1fr auto;align-items:center;padding:10px 14px;background:linear-gradient(#163c76,#0a2551);border-bottom:4px solid #050505}.title{font-size:clamp(18px,3vw,29px);font-weight:900;text-shadow:3px 3px #000}.counter{background:#020813;border:3px solid #fff;padding:7px;color:#ffd43c;font-weight:900;font-size:12px}.menu{display:grid;grid-template-columns:repeat(4,1fr);background:#06152d}.menu div{text-align:center;padding:8px;border-right:2px solid #000;font-size:11px}.menu .active{background:#248b42}.pitch{background:repeating-linear-gradient(90deg,#2f9b48 0 80px,#23813a 80px 160px);padding:14px}.panel,.controls,.history{max-width:760px;margin:0 auto 12px;background:#071a39;border:4px solid #f0e6b4;box-shadow:4px 4px #000}.head{background:#05162f;color:#ffd840;padding:8px;text-align:center;font-weight:900}.wheelwrap{position:relative;width:min(560px,88vw);margin:8px auto}.wheelwrap canvas{display:block;width:100%;height:auto;border-radius:50%;filter:drop-shadow(5px 6px 0 #000)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:#f4f4e8 url('../../site-assets/images/imc-logo.png') center/76% auto no-repeat;border:6px solid #06152f;box-shadow:0 0 0 4px #fff,3px 3px 0 6px #000}.pointer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:42px solid #fff;z-index:5}.winner{margin:5px 10px 10px;background:#041126;border:3px solid #fff;padding:8px;text-align:center;color:#ffd43c;font-weight:900}.team{display:none}.team.show{display:block}.controls{padding:9px}.btn{width:100%;padding:12px;background:#208b3d;color:#fff;border:4px solid #fff;box-shadow:4px 4px #000;font:900 15px "Courier New"}.btn.gold{background:#9b7100}.status{text-align:center;padding:8px;color:#ffd43c;font-size:12px}.history{padding:7px}.hrow{display:grid;grid-template-columns:38px 1fr 1.35fr 95px;gap:5px;align-items:center;padding:7px;background:#0f356e;border-bottom:2px solid #071a39;font-size:11px}.hrow b{color:#ffd43c}.clubcell{display:flex;align-items:center;gap:6px}.mini{width:26px;height:26px;object-fit:contain;background:#fff}.popup{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.popup.show{display:flex}.popupbox{width:min(480px,88vw);background:#0d376f;border:5px solid #f2e8b6;box-shadow:7px 7px #000;text-align:center;padding:12px}.crest{width:68px;height:68px;object-fit:contain;background:#fff;border:3px solid #fff}.popupbox h1{color:#ffd43c;margin:5px}.footer{text-align:center;background:#06152f;padding:10px;color:#9fc0e7;font-size:10px}@media(max-width:700px){.wheelwrap{width:min(500px,88vw)}.hub{width:70px;height:70px}.pitch{padding:8px}.hrow{grid-template-columns:32px 1fr 1.2fr}.hrow span:last-child{display:none}}</style></head><body><div class="game"><main class="screen"><header class="top"><div class="title">SENSIBLE SOCCER ACADEMY · GW010</div><div class="counter" id="counter">24 SLOT<br>24 CLUB</div></header><nav class="menu"><div>CAREER</div><div>TACTICS</div><div class="active">LIVE DRAW</div><div>RESULTS</div></nav><section class="pitch"><div class="panel"><div class="head">SELECT MANAGER</div><div class="wheelwrap"><canvas id="mw" width="900" height="900"></canvas><div class="pointer"></div><div class="hub"></div></div><div class="winner" id="mwinner">READY</div></div><div class="panel team" id="teamstage"><div class="head" id="ttitle">SELECT CLUB</div><div class="wheelwrap"><canvas id="tw" width="900" height="900"></canvas><div class="pointer"></div><div class="hub"></div></div><div class="winner" id="twinner">WAITING</div></div><div class="controls"><button class="btn" id="start">▶ START LIVE DRAW</button><div class="status" id="status">24 SLOT · 24 CLUB</div></div><section class="history"><div class="head">MATCH ASSIGNMENTS</div><div id="history"></div></section></section><footer class="footer">ITALIAN MASTER CLUB · SENSIBLE SOCCER ACADEMY · 1990s MODE</footer></main></div><div class="popup" id="popup"><div class="popupbox"><b style="color:#ffd43c">ASSIGNMENT CONFIRMED</b><h2 id="pm"></h2><div id="pr"></div><div>↓</div><img id="pcrest" class="crest"><h1 id="pt"></h1></div></div><script src="../assets/crest-overrides.js"></script><script>(()=>{'use strict';const E=[['Max Palace','EU'],['Luciano Catalano','EU'],['Tommaso Mello','SA'],['Sir Simone','EU'],['Ringhio Gattuso','EU'],['Vincenzo Martorano','SA'],['Andrea Meneghini','EU'],['Davide Rapisarda','EU'],['Vardan Minasyan','SA'],['Francesco Senesi','EU'],['Oleksandr Medvid','EU'],['Giuseppe Trovato','SA'],['Luciano Tana','EU'],['Carlo Colombo','EU'],['Nick Pepe','SA'],['Chicco Belin','EU'],['Marco Aloisi','EU'],['Cosimo Lonoce','SA'],['Nessun manager 1','SA'],['Nessun manager 2','SA'],['Nessun manager 3','SA'],['Nessun manager 4','SA'],['Nessun manager 5','SA'],['Nessun manager 6','SA']].map(x=>({name:x[0],region:x[1]}));const T={SA:['Peñarol','Colo-Colo','Millonarios','Bolívar','Olimpia','Alianza Lima','Santos','São Paulo','Grêmio','Argentinos Juniors',"Newell's Old Boys",'Vélez Sarsfield'],EU:['Atalanta','Ferencváros','IFK Göteborg','Aberdeen','Siviglia','West Ham United','Stoccarda','Anderlecht','Ajax','Olympique Lyonnais','Dinamo Zagreb','Benfica']};const $=id=>document.getElementById(id),TAU=Math.PI*2,P=-Math.PI/2,mw=$('mw'),tw=$('tw'),mc=mw.getContext('2d'),tc=tw.getContext('2d'),imgs={};let managers=E.map((_,i)=>i),teams={EU:[...T.EU],SA:[...T.SA]},assignments=[],spinning=false,saving=false,ma=0,ta=0,reg='EU',currentTeams=[];const crestSrc=n=>(window.IMC_CREST_OVERRIDES&&window.IMC_CREST_OVERRIDES[n])||'';[...T.SA,...T.EU].forEach(n=>{const im=new Image();im.onload=()=>{imgs[n]=im;drawAll()};im.src=crestSrc(n);imgs[n]=im});function norm(v){return((v%TAU)+TAU)%TAU}function rand(n){if(n<=1)return 0;try{return crypto.getRandomValues(new Uint32Array(1))[0]%n}catch(e){return Math.floor(Math.random()*n)}}function clean(n){return n.replace(/ \d+$/,'')}function person(c,x,y,s,region,empty){c.save();c.translate(x,y);if(empty){c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(-11*s,-19*s,22*s,35*s);c.fillStyle='#fff';c.font='900 '+14*s+'px Courier New';c.textAlign='center';c.fillText('?',0,4*s)}else{c.fillStyle='#d99d68';c.fillRect(-6*s,-20*s,12*s,10*s);c.fillStyle=region==='SA'?'#d94a3f':'#2879d5';c.fillRect(-11*s,-9*s,22*s,18*s);c.fillStyle='#fff';c.fillRect(-9*s,9*s,18*s,8*s);c.fillStyle='#111';c.fillRect(-10*s,17*s,7*s,6*s);c.fillRect(3*s,17*s,7*s,6*s)}c.restore()}function crest(c,n,size){const im=imgs[n];if(!im||!im.complete||!im.naturalWidth)return;c.save();const k=Math.min((size-4)/im.naturalWidth,(size-4)/im.naturalHeight);c.fillStyle='#fff';c.fillRect(-size/2,-size/2,size,size);c.drawImage(im,-im.naturalWidth*k/2,-im.naturalHeight*k/2,im.naturalWidth*k,im.naturalHeight*k);c.restore()}function wheel(c,items,angle,type,region){const W=c.canvas.width,C=W/2,R=W*.43,n=Math.max(1,items.length),step=TAU/n;c.clearRect(0,0,W,W);for(let i=0;i<n;i++){const rr=type==='m'?E[items[i]].region:region,a0=angle+i*step,a1=a0+step,mid=a0+step/2;c.beginPath();c.moveTo(C,C);c.arc(C,C,R,a0,a1);c.closePath();c.fillStyle=rr==='SA'?(i%2?'#a93631':'#d84a3e'):(i%2?'#17559e':'#2d80d4');c.fill();c.lineWidth=3;c.strokeStyle='#f0e6b4';c.stroke();const x=C+Math.cos(mid)*R*.67,y=C+Math.sin(mid)*R*.67;c.save();c.translate(x,y);c.rotate(mid+Math.PI/2);c.textAlign='center';c.fillStyle='#fff';if(type==='m'){const e=E[items[i]],empty=e.name.startsWith('Nessun manager');person(c,0,-20,n>18?.9:1.05,rr,empty);c.font='900 '+(n>18?12:15)+'px Courier New';let l=empty?'NESSUN MANAGER':clean(e.name);if(l.length>18)l=l.slice(0,17)+'…';c.fillText(l,0,31)}else{const name=items[i];crest(c,name,n>10?38:48);c.font='900 '+(n>10?12:15)+'px Courier New';let l=name;if(l.length>18)l=l.slice(0,17)+'…';c.fillText(l,0,n>10?30:36)}c.restore()}c.beginPath();c.arc(C,C,R,0,TAU);c.lineWidth=14;c.strokeStyle='#07152c';c.stroke()}function drawAll(){wheel(mc,managers,ma,'m','EU');if(currentTeams.length)wheel(tc,currentTeams,ta,'t',reg)}function render(){$('counter').innerHTML=managers.length+' SLOT<br>'+(teams.EU.length+teams.SA.length)+' CLUB';$('history').innerHTML=assignments.map(a=>'<div class="hrow"><span>#'+a.seq+'</span><b>'+clean(a.manager)+'</b><div class="clubcell"><img class="mini" src="'+crestSrc(a.team)+'"><b>'+a.team+'</b></div><span>'+(a.region==='SA'?'S. AMERICA':'EUROPE')+'</span></div>').join('');drawAll()}function targetFor(index,n,current,turns){const desired=P-(index+.5)*(TAU/n);return current+turns*TAU+norm(desired-current)}function animate(which,to,dur,done){const from=which==='m'?ma:ta,t0=performance.now();function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4),v=from+(to-from)*e;if(which==='m'){ma=v;wheel(mc,managers,ma,'m','EU')}else{ta=v;wheel(tc,currentTeams,ta,'t',reg)}if(p<1)requestAnimationFrame(f);else done()}requestAnimationFrame(f)}function popup(a){$('pm').textContent=clean(a.manager);$('pr').textContent=a.region==='SA'?'SOUTH AMERICA':'EUROPE';$('pt').textContent=a.team;$('pcrest').src=crestSrc(a.team);$('popup').classList.add('show');setTimeout(()=>$('popup').classList.remove('show'),3000)}function spinOne(){if(spinning||saving||!managers.length)return;spinning=true;$('start').disabled=true;$('teamstage').classList.remove('show');$('mwinner').textContent='SPINNING...';const pickM=rand(managers.length),mId=managers[pickM],m=E[mId],toM=targetFor(pickM,managers.length,ma,7+rand(3));animate('m',toM,2200,()=>{ma=toM;reg=m.region;currentTeams=[...teams[reg]];$('mwinner').textContent=clean(m.name);$('teamstage').classList.add('show');$('ttitle').textContent='SELECT CLUB · '+(reg==='SA'?'SOUTH AMERICA':'EUROPE');ta=0;wheel(tc,currentTeams,ta,'t',reg);$('twinner').textContent='SPINNING...';setTimeout(()=>{const pickT=rand(currentTeams.length),team=currentTeams[pickT],toT=targetFor(pickT,currentTeams.length,ta,7+rand(3));animate('t',toT,2000,()=>{ta=toT;const a={seq:assignments.length+1,manager:m.name,region:reg,team,timestamp:new Date().toISOString()};managers.splice(managers.indexOf(mId),1);teams[reg].splice(teams[reg].indexOf(team),1);assignments.push(a);currentTeams=[...teams[reg]];$('twinner').textContent=team;spinning=false;render();popup(a);if(assignments.length===24){$('start').disabled=false;$('start').classList.add('gold');$('start').textContent='TERMINA SORTEGGIO E SALVA REPLAY';$('status').textContent='DRAW COMPLETE · 24/24'}else{$('start').disabled=false;$('start').textContent='▶ NEXT DRAW';$('status').textContent='ASSEGNAZIONE #'+a.seq+' COMPLETATA'}})},450)})}async function finalize(){if(saving||assignments.length!==24)return;saving=true;$('start').disabled=true;$('status').textContent='SALVATAGGIO REPLAY...';try{const r=await fetch('../save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameWorld:'GW010',title:'Sensible Soccer Academy',assignments}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'save_failed');$('start').textContent='REPLAY SALVATO';$('status').textContent='REPLAY SALVATO · '+j.draw_id;setTimeout(()=>{location.href=j.replay_url||'/sensible-soccer-academy/replay/'},700)}catch(e){saving=false;$('start').disabled=false;$('status').textContent='ERRORE SALVATAGGIO · '+e.message}}function start(){if(assignments.length===24)finalize();else spinOne()}$('start').onclick=start;window.IMC_DRAW_START=start;window.IMC_DRAW_READY=true;render();requestAnimationFrame(drawAll);})();</script></body></html>
