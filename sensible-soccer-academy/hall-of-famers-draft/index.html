<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Hall Of Famers Draft</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:#0b0805;color:#f5ead2;font-family:Georgia,serif}
.page{width:100%;max-width:720px;margin:0 auto;padding:4px}
.frame{width:100%;border:4px double #a88648;background:#17110c;overflow:hidden}
.header{text-align:center;padding:22px 10px;background:linear-gradient(#e6dece,#b9ab91);color:#251d14;border-bottom:5px double #9a773e}
.header small{font-size:10px;letter-spacing:.22em}
.header h1{margin:8px 0 4px;font-size:clamp(34px,10vw,54px);line-height:1}
.header b{color:#77541c;letter-spacing:.1em}
.body{padding:18px;background:linear-gradient(90deg,#c7bca8 0 7%,#17110c 7% 93%,#c7bca8 93%)}
.stage{height:360px;border:3px double #b28d49;background:radial-gradient(circle,#302416,#110d09 72%)}
</style>
</head>
<body>
<main class="page">
<section class="frame">
<header class="header"><small>ITALIAN MASTERS CLUB</small><h1>HALL OF FAMERS</h1><b>DRAFT</b></header>
<div class="body"><div class="stage"></div></div>
</section>
</main>
</body>
</html>
