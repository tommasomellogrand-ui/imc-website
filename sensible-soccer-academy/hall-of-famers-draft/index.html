<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Hall Of Famers Draft HOST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden;background:#0b0805;color:#f5ead2;font-family:Georgia,serif}.page{max-width:720px;margin:auto;padding:4px}.frame{border:4px double #a88648;background:#17110c}.head{text-align:center;padding:20px 8px;background:linear-gradient(#e6dece,#b9ab91);color:#251d14;border-bottom:5px double #9a773e}.head h1{margin:5px;font-size:40px}.body{padding:16px 20px}.stage{min-height:330px;border:3px double #b28d49;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.meta{color:#c8ad74}.manager{font-size:30px;font-weight:bold;margin:8px}.player{font-size:40px;color:#e4bd6c;font-weight:bold;margin:10px;overflow-wrap:anywhere}.details{font-size:15px}.controls button{width:100%;min-height:56px;margin-top:10px;background:#332415;color:#f5dfad;border:2px solid #c7a15c;font:bold 16px Georgia}.history{margin-top:10px;background:#c9bea9;color:#281f16;padding:8px}.row{padding:6px;border-bottom:1px solid #998b73;font-size:13px}</style></head><body><main class="page"><section class="frame"><header class="head">ITALIAN MASTERS CLUB<h1>HALL OF FAMERS</h1><b>DRAFT · HOST</b></header><div class="body"><div class="stage"><div><div class="meta" id="meta">READY · 0/64</div><div class="manager" id="manager">PRESS START</div><div class="player" id="player">64 PLAYERS</div><div class="details" id="details">4 PICK · 16 MANAGER</div></div></div><div class="controls"><button id="start">START DRAFT</button></div><div class="history" id="history"></div></div></section></main><script>(()=>{const q=x=>document.getElementById(x);let timer=null,busy=false;async function api(a){const o={method:a?'POST':'GET',cache:'no-store'};if(a){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify({action:a})}const r=await fetch('/sensible-soccer-academy/hall-of-famers-draft/api.php?t='+Date.now(),o);const j=await r.json();if(!r.ok||!j.ok)throw Error('api');return j}function show(s){const n=Number(s.revealed||0);q('meta').textContent=(n>=64?'DRAFT COMPLETE':(s.running?'LIVE':'READY'))+' · '+n+'/64';if(n&&s.draft[n-1]){const d=s.draft[n-1];q('manager').textContent=d.manager+' · PICK '+d.round;q('player').textContent=d.player;q('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.club}else{q('manager').textContent='PRESS START';q('player').textContent='64 PLAYERS';q('details').textContent='4 PICK · 16 MANAGER'}q('history').innerHTML=(s.draft||[]).slice(0,n).reverse().map(d=>'<div class="row"><b>#'+d.call+' · PICK '+d.round+' · '+d.manager+'</b> → '+d.player+'</div>').join('');q('start').disabled=busy}async function poll(){try{const s=await api();show(s);if(Number(s.revealed)>=64&&timer){clearInterval(timer);timer=null;busy=false;q('start').disabled=false}}catch(e){}}q('start').onclick=async()=>{if(busy)return;busy=true;q('start').disabled=true;if(timer){clearInterval(timer);timer=null}try{const s=await api('start');show(s);timer=setInterval(poll,500)}catch(e){busy=false;q('start').disabled=false}};poll()})();</script></body></html>
