<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall Of Famers Player Draft Host</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden;background:#0b0805;color:#f4ead5;font-family:Georgia,serif}.page{max-width:720px;margin:auto;padding:4px}.frame{border:4px double #a88648;background:#17110c;overflow:hidden}.head{text-align:center;padding:20px 8px;background:linear-gradient(#e6dece,#b9ab91);color:#251d14;border-bottom:5px double #9a773e}.head small{font-size:10px;letter-spacing:.2em}.head h1{margin:7px 0 4px;font-size:40px}.head b{color:#77541c}.body{padding:14px 18px;background:linear-gradient(90deg,#c7bca8 0 7%,#17110c 7% 93%,#c7bca8 93%)}.stage{min-height:320px;border:3px double #b28d49;background:#18110b;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.meta{color:#c8ad74;font-weight:bold}.manager{font-size:32px;font-weight:bold;text-transform:uppercase;margin:8px}.player{font-size:42px;color:#e4bd6c;font-weight:bold;margin:8px;overflow-wrap:anywhere}.details{font-size:15px}.controls{display:grid;gap:8px;margin-top:10px}button{min-height:54px;border:2px solid #c7a15c;background:#332415;color:#f5dfad;font:bold 15px Georgia}button:disabled{opacity:.4}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:8px}.stat{background:#c9bea9;color:#281f16;padding:8px;text-align:center}.stat b{display:block;font-size:20px}.history{margin-top:8px;background:#c9bea9;color:#281f16;padding:8px}.row{font-size:12px;padding:6px;border-bottom:1px solid #9b8c73}</style></head><body><main class="page"><section class="frame"><header class="head"><small>ITALIAN MASTERS CLUB</small><h1>HALL OF FAMERS</h1><b>PLAYER DRAFT · HOST</b></header><div class="body"><div class="stage"><div><div class="meta" id="meta">READY</div><div class="manager" id="manager">PRESS START</div><div class="player" id="player">64 PLAYERS</div><div class="details" id="details">4 PICK · 16 MANAGER</div></div></div><div class="controls"><button id="start">START DRAFT</button></div><div class="stats"><div class="stat"><b id="count">0/64</b>CALL</div><div class="stat"><b id="available">64</b>AVAILABLE</div></div><div class="history" id="history"></div></div></section></main><script>
(()=>{const q=id=>document.getElementById(id);let running=false;
async function req(action){const o={method:action?'POST':'GET',cache:'no-store'};if(action){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify({action})}const r=await fetch('api-v2.php?x='+Date.now(),o);const j=await r.json();if(!r.ok||!j.ok)throw Error('api');return j}
function paint(x){q('count').textContent=x.count+'/64';q('available').textContent=x.remaining.length;q('meta').textContent=x.completed?'DRAFT COMPLETE':(x.started?'PICK '+x.round+' · '+x.pick+'/16 · CALL '+(x.count+1)+'/64':'READY');q('manager').textContent=x.completed?'COMPLETE':(x.started?x.manager:'PRESS START');if(x.count){const d=x.draws[x.count-1];q('player').textContent=d.player;q('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.club}else{q('player').textContent='64 PLAYERS';q('details').textContent='4 PICK · 16 MANAGER'}q('start').disabled=running||x.completed;q('history').innerHTML=[...x.draws].reverse().map(d=>'<div class="row"><b>#'+d.call+' · PICK '+d.round+' · '+d.manager+'</b> → '+d.player+' · '+d.rating+'</div>').join('')}
q('start').onclick=async()=>{if(running)return;running=true;q('start').disabled=true;try{await req('reset');const full=await req('generate');for(let i=1;i<=64;i++){const view={...full,draws:full.draws.slice(0,i),count:i,remaining:full.remaining.slice(0,64-i),completed:i===64,started:true,round:Math.min(4,Math.floor((i-1)/16)+1),pick:((i-1)%16)+1,manager:i<64?full.draws[i].manager:null};paint(view);await new Promise(r=>setTimeout(r,1600));}}finally{running=false}};
req().then(paint).catch(console.error);
})();
</script></body></html>
