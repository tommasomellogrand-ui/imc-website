<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOF Draft Host</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden;background:#0b0805;color:#f5ead2;font-family:Georgia,serif}.page{max-width:720px;margin:auto;padding:4px}.frame{border:4px double #a88648;background:#17110c}.head{text-align:center;padding:20px 8px;background:linear-gradient(#e6dece,#b9ab91);color:#251d14;border-bottom:5px double #9a773e}.head h1{margin:5px;font-size:40px}.body{padding:16px 20px}.stage{min-height:330px;border:3px double #b28d49;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.manager{font-size:30px;font-weight:bold}.player{font-size:40px;color:#e4bd6c;font-weight:bold;margin:10px}.meta{color:#c8ad74}.controls button{width:100%;min-height:56px;margin-top:10px;background:#332415;color:#f5dfad;border:2px solid #c7a15c;font:bold 16px Georgia}.history{margin-top:10px;background:#c9bea9;color:#281f16;padding:8px}.row{padding:6px;border-bottom:1px solid #998b73;font-size:13px}</style></head><body><main class="page"><section class="frame"><header class="head">ITALIAN MASTERS CLUB<h1>HALL OF FAMERS</h1><b>PLAYER DRAFT · HOST</b></header><div class="body"><div class="stage"><div><div class="meta" id="meta">READY · 0/64</div><div class="manager" id="manager">PRESS START</div><div class="player" id="player">64 PLAYERS</div></div></div><div class="controls"><button id="start">START DRAFT</button></div><div class="history" id="history"></div></div></section></main><script>(()=>{const q=x=>document.getElementById(x);let busy=false;async function api(a){const o={method:a?'POST':'GET',cache:'no-store'};if(a){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify({action:a})}return await(await fetch('api.php?'+Date.now(),o)).json()}function show(s){const n=s.revealed;q('meta').textContent=(n>=64?'DRAFT COMPLETE':'LIVE')+' · '+n+'/64';if(n){const d=s.draft[n-1];q('manager').textContent=d.manager+' · PICK '+d.round;q('player').textContent=d.player}else{q('manager').textContent='PRESS START';q('player').textContent='64 PLAYERS'}q('history').innerHTML=s.draft.slice(0,n).reverse().map(d=>'<div class="row"><b>#'+d.call+' · PICK '+d.round+' · '+d.manager+'</b> → '+d.player+'</div>').join('')}q('start').onclick=async()=>{if(busy)return;busy=true;let s=await api('start');show(s);while(s.revealed<64){await new Promise(r=>setTimeout(r,1600));s=await api('reveal');show(s)}busy=false};api().then(show)})();</script></body></html>
