<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Hall Of Famers · Player Draft · HOST CONTROL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;background:#0b0805;color:#f4ead5;font-family:Georgia,serif}.page{width:100%;max-width:720px;margin:0 auto;padding:4px}.frame{width:100%;border:4px double #a88648;background:#17110c;overflow:hidden}.header{text-align:center;padding:20px 8px;background:linear-gradient(#e6dece,#b9ab91);color:#251d14;border-bottom:5px double #9a773e}.header small{font-size:10px;letter-spacing:.2em}.header h1{margin:7px 0 4px;font-size:clamp(34px,10vw,54px);line-height:1}.header b{color:#77541c;letter-spacing:.1em}.body{padding:14px 18px;background:linear-gradient(90deg,#c7bca8 0 7%,#17110c 7% 93%,#c7bca8 93%)}.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.nav a,button{display:block;width:100%;padding:14px;border:2px solid #c7a15c;background:linear-gradient(#4b3820,#21170e);color:#f5dfad;text-decoration:none;text-align:center;font:bold 14px Georgia}.stage{min-height:330px;border:3px double #b28d49;background:radial-gradient(circle,#302416,#110d09 72%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}.content{width:100%;text-align:center}.meta{color:#c8ad74;letter-spacing:.12em;font-weight:bold}.manager{font-size:clamp(28px,8vw,40px);font-weight:bold;text-transform:uppercase;margin:8px 0}.player{font-size:clamp(34px,10vw,50px);font-weight:bold;color:#e4bd6c;margin:8px 0;overflow-wrap:anywhere}.details{font-size:15px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.controls button:disabled{opacity:.35}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.stat{background:#c9bea9;color:#281f16;padding:8px 3px;text-align:center;border:1px solid #846b42;font-size:10px}.stat b{display:block;font-size:18px;color:#73531f}.history{margin-top:10px;background:#c9bea9;color:#281f16;padding:9px}.row{padding:7px;border-bottom:1px solid #9b8c73;font-size:12px;overflow-wrap:anywhere}@media(max-width:500px){.nav{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="page"><section class="frame"><header class="header"><small>ITALIAN MASTERS CLUB</small><h1>HALL OF FAMERS</h1><b>PLAYER DRAFT · HOST CONTROL</b></header><div class="body"><nav class="nav"><a href="live/" target="_blank">🏛 LIVE VIEW</a><a href="#history">THE DRAFT</a></nav><div class="stage"><div class="content"><div class="meta" id="meta">READY</div><div class="manager" id="manager">PRESS START</div><div class="player" id="player">64 PLAYERS</div><div class="details" id="details">4 PICK · 16 MANAGER</div></div></div><div class="controls"><button id="start">START DRAFT</button><button id="draw" disabled>EXTRACT PLAYER</button><button id="auto">AUTO PICK 1</button><button id="stop" disabled>STOP AUTO</button><button id="reset">RESET</button></div><div class="stats"><div class="stat"><b id="call">0/64</b>CALL</div><div class="stat"><b id="round">—</b>PICK</div><div class="stat"><b id="pos">—</b>POSITION</div><div class="stat"><b id="remaining">64</b>AVAILABLE</div></div><div class="history" id="history"></div></div></section></main><script>(()=>{const $=x=>document.getElementById(x);let s,busy=false,autoRunning=false,stopRequested=false;async function api(action){const url=window.location.origin+'/sensible-soccer-academy/hall-of-famers-player-draft/api.php?ts='+Date.now();const opts={method:action?'POST':'GET',cache:'no-store'};if(action){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify({action})}const r=await fetch(url,opts),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'api');return j}function render(x){s=x;const n=x.draws.length;$('call').textContent=n+'/64';$('round').textContent=x.round;$('pos').textContent=x.pick+'/16';$('remaining').textContent=x.remaining.length;$('manager').textContent=x.completed?'DRAFT COMPLETE':(x.started?x.manager:'PRESS START');$('meta').textContent=x.completed?'64 / 64':(x.started?'PICK '+x.round+' · '+x.pick+'/16 · CALL '+x.call+'/64':'READY');if(n){const d=x.draws[n-1];$('player').textContent=d.player;$('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.value+' · '+d.club}else{$('player').textContent='64 PLAYERS';$('details').textContent='4 PICK · 16 MANAGER'}$('draw').disabled=!x.started||x.completed||busy||autoRunning;$('start').disabled=x.started;const nextPick=x.completed?4:x.round;$('auto').textContent=x.completed?'DRAFT COMPLETE':'AUTO PICK '+nextPick;$('auto').disabled=!x.started||x.completed||autoRunning;$('stop').disabled=!autoRunning;$('history').innerHTML=[...x.draws].reverse().map(d=>'<div class="row"><b>#'+d.call+' · PICK '+d.round+' · '+d.manager+'</b><br>'+d.player+' · '+d.rating+' · '+d.age+' · '+d.club+'</div>').join('')}async function spin(next,before){busy=true;const pool=before.remaining;for(let i=0;i<24;i++){const p=pool[Math.floor(Math.random()*pool.length)];$('player').textContent=p[0];$('details').textContent='RATING '+p[1]+' · '+p[2]+' ANNI · '+p[3]+' · '+p[4];await new Promise(r=>setTimeout(r,45+i*7))}busy=false;render(next)}async function runAutoPick(){
 if(autoRunning||!s||!s.started||s.completed)return;
 autoRunning=true;stopRequested=false;
 const target=Math.min((Math.floor(s.draws.length/16)+1)*16,64);
 while(!stopRequested && s.draws.length<target){
   try{
     s=await api('draw');
     render(s);
     if(s.draws.length>=target)break;
     await new Promise(r=>setTimeout(r,1500));
   }catch(e){
     await new Promise(r=>setTimeout(r,1500));
     try{s=await api();render(s)}catch(_){}
   }
 }
 autoRunning=false;busy=false;render(s);
}$('start').onclick=async()=>{try{const x=await api('start');render(x)}catch(e){console.error('START ERROR',e)}};$('draw').onclick=async()=>{if(busy)return;try{const before=s,next=await api('draw');await spin(next,before)}catch(e){busy=false;console.error('DRAW ERROR',e)}};$('auto').onclick=()=>runAutoPick().catch(e=>{autoRunning=false;busy=false;console.error(e);render(s)});$('stop').onclick=()=>{stopRequested=true;autoRunning=false;render(s)};$('reset').onclick=async()=>{if(confirm('Reset completo?')){stopRequested=true;autoRunning=false;render(await api('reset'))}};api().then(render).catch(e=>console.error('API ERROR',e))})();</script></body></html>
