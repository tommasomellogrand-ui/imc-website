<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Hall Of Famers · Player Draft · HOST CONTROL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;background:#0b0805;color:#f4ead5;font-family:Georgia,serif}.page{width:100%;max-width:720px;margin:0 auto;padding:4px}.frame{width:100%;border:4px double #a88648;background:#17110c;overflow:hidden}.header{text-align:center;padding:20px 8px;background:linear-gradient(#e6dece,#b9ab91);color:#251d14;border-bottom:5px double #9a773e}.header small{font-size:10px;letter-spacing:.2em}.header h1{margin:7px 0 4px;font-size:clamp(34px,10vw,54px);line-height:1}.header b{color:#77541c;letter-spacing:.1em}.body{padding:14px 18px;background:linear-gradient(90deg,#c7bca8 0 7%,#17110c 7% 93%,#c7bca8 93%)}.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.nav a,button{display:block;width:100%;padding:14px;border:2px solid #c7a15c;background:linear-gradient(#4b3820,#21170e);color:#f5dfad;text-decoration:none;text-align:center;font:bold 14px Georgia}.stage{min-height:330px;border:3px double #b28d49;background:radial-gradient(circle,#302416,#110d09 72%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}.content{width:100%;text-align:center}.meta{color:#c8ad74;letter-spacing:.12em;font-weight:bold}.manager{font-size:clamp(28px,8vw,40px);font-weight:bold;text-transform:uppercase;margin:8px 0}.player{font-size:clamp(34px,10vw,50px);font-weight:bold;color:#e4bd6c;margin:8px 0;overflow-wrap:anywhere}.details{font-size:15px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.controls button:disabled{opacity:.35}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.stat{background:#c9bea9;color:#281f16;padding:8px 3px;text-align:center;border:1px solid #846b42;font-size:10px}.stat b{display:block;font-size:18px;color:#73531f}.history{margin-top:10px;background:#c9bea9;color:#281f16;padding:9px}.row{padding:7px;border-bottom:1px solid #9b8c73;font-size:12px;overflow-wrap:anywhere}@media(max-width:500px){.nav{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="page"><section class="frame"><header class="header"><small>ITALIAN MASTERS CLUB</small><h1>HALL OF FAMERS</h1><b>PLAYER DRAFT · HOST CONTROL</b></header><div class="body"><nav class="nav"><a href="live/" target="_blank">🏛 LIVE VIEW</a><a href="#history">THE DRAFT</a></nav><div class="stage"><div class="content"><div class="meta" id="meta">READY</div><div class="manager" id="manager">PRESS START</div><div class="player" id="player">64 PLAYERS</div><div class="details" id="details">4 PICK · 16 MANAGER</div></div></div><div class="controls"><button id="start">START DRAFT</button><button id="draw" disabled>EXTRACT PLAYER</button><button id="auto">AUTO DRAFT · 1 → 64</button><button id="stop" disabled>STOP AUTO</button><button id="reset">RESET</button></div><div class="stats"><div class="stat"><b id="call">0/64</b>CALL</div><div class="stat"><b id="round">—</b>PICK</div><div class="stat"><b id="pos">—</b>POSITION</div><div class="stat"><b id="remaining">64</b>AVAILABLE</div></div><div class="history" id="history"></div></div></section></main><script>
(function(){
 const $=id=>document.getElementById(id);
 let state=null,running=false,stop=false;
 async function request(action){
   const opts={method:action?'POST':'GET',cache:'no-store'};
   if(action){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify({action:action});}
   const res=await fetch('/sensible-soccer-academy/hall-of-famers-player-draft/api.php?x='+Date.now(),opts);
   const data=await res.json();
   if(!res.ok||!data.ok)throw new Error(data.error||'api');
   return data;
 }
 function paint(x){
   state=x;const n=x.draws.length;
   $('call').textContent=n+'/64';$('round').textContent=x.round;$('pos').textContent=x.pick+'/16';$('remaining').textContent=x.remaining.length;
   $('meta').textContent=x.completed?'64 / 64':(x.started?'PICK '+x.round+' · '+x.pick+'/16 · CALL '+x.call+'/64':'READY');
   $('manager').textContent=x.completed?'DRAFT COMPLETE':(x.started?x.manager:'PRESS START');
   if(n){const d=x.draws[n-1];$('player').textContent=d.player;$('details').textContent='RATING '+d.rating+' · '+d.age+' ANNI · '+d.club;}
   else{$('player').textContent='64 PLAYERS';$('details').textContent='4 PICK · 16 MANAGER';}
   $('start').disabled=!!x.started||n>0;
   $('draw').disabled=!x.started||x.completed||running;
   $('auto').disabled=x.completed||running;
   $('stop').disabled=!running;
   $('history').innerHTML=[...x.draws].reverse().map(d=>'<div class="row"><b>#'+d.call+' · PICK '+d.round+' · '+d.manager+'</b><br>'+d.player+' · '+d.rating+' · '+d.age+' · '+d.club+'</div>').join('');
 }
 async function refresh(){state=await request();paint(state);}
 $('start').addEventListener('click',async()=>{try{state=await request('start');paint(state)}catch(e){console.error(e)}});
 $('draw').addEventListener('click',async()=>{try{state=await request('draw');paint(state)}catch(e){console.error(e)}});
 $('auto').addEventListener('click',async()=>{
   if(running)return;running=true;stop=false;
   try{
     state=await request();
     if(!state.started){state=await request('start');paint(state);}
     while(!stop&&state.draws.length<64){
       try{state=await request('draw');paint(state);}
       catch(e){try{state=await request();paint(state)}catch(_){}}
       if(state.completed||state.draws.length>=64)break;
       await new Promise(r=>setTimeout(r,1600));
     }
   }finally{running=false;if(state)paint(state);}
 });
 $('stop').addEventListener('click',()=>{stop=true;});
 $('reset').addEventListener('click',async()=>{if(!confirm('Reset completo?'))return;stop=true;running=false;try{state=await request('reset');paint(state)}catch(e){console.error(e)}});
 refresh().catch(console.error);
})();
</script></body></html>
