<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Sensible Soccer Academy · Host</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}body{min-height:100vh}.shell{min-height:100vh;padding:10px;background:#09214a}.bar{max-width:1220px;margin:auto;background:#071a39;border:5px solid #f0e6b4;box-shadow:5px 5px #000;padding:10px;transition:.2s}.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.title{font-weight:900;color:#ffd43c}.hostcontrols{display:flex;gap:8px;flex-wrap:wrap}.hostcontrols button{border:4px solid #fff;padding:10px;font:900 13px "Courier New",monospace;background:#258b42;color:#fff;box-shadow:3px 3px #000;cursor:pointer}.hostcontrols button.gold{background:#9b7100}.hostcontrols button:disabled{opacity:.38;cursor:not-allowed}.status{margin-top:8px;padding:8px;background:#041126;border:3px solid #fff;color:#d7e8ff;font-size:12px}.frame{max-width:1220px;margin:12px auto 0;border:5px solid #777;box-shadow:0 0 0 5px #111;background:#000}.frame iframe{display:block;width:100%;height:86vh;border:0;background:#000}@media(max-width:800px){.shell{padding:4px}.top{grid-template-columns:1fr}.hostcontrols{display:grid;grid-template-columns:1fr 1fr}.frame{margin-top:6px}.frame iframe{height:88vh}.live-mode .bar{padding:5px;border-width:3px;box-shadow:2px 2px #000;position:sticky;top:0;z-index:20}.live-mode .intro{display:none}.live-mode .top{display:block}.live-mode .status{margin-top:5px;padding:5px;font-size:10px}.live-mode .frame iframe{height:92vh}}</style></head><body><div class="shell"><div class="bar"><div class="top"><div class="intro"><div class="title">🎮 SENSIBLE SOCCER ACADEMY · HOST CONSOLE</div><div style="font-size:11px;color:#9fc0e7">Sorteggio automatico. Dopo START, le 18 assegnazioni procedono senza interventi manuali.</div></div><div class="hostcontrols"><button id="arm">ARM LIVE</button><button id="start">▶ START AUTOMATIC DRAW</button><button id="finalize" class="gold" disabled>✓ FINALIZE DRAW</button></div></div><div class="status" id="status">DRAW IN CARICAMENTO</div></div><div class="frame"><iframe id="draw" src="../draw/?hostview=1"></iframe></div></div><script>(()=>{const api='../live/api.php',$=id=>document.getElementById(id),frame=$('draw');let armed=false,lastPhase='',lastSeq=0,watcher=null,autoTimer=null,finalRetryTimer=null,finalFailTimer=null,lastSavedManager='',lastSavedTeam='';async function call(action,extra={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'request_failed');return j}async function state(){const r=await fetch(api+'?t='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'state_failed');return j}function setStatus(t){$('status').textContent=t}function injectCompactPopup(){const d=frame.contentDocument;if(!d)return;let st=d.getElementById('hostCompactPopup');if(!st){st=d.createElement('style');st.id='hostCompactPopup';d.head.appendChild(st)}st.textContent='#popup .popupbox{width:min(470px,88vw)!important;max-height:56vh!important;padding:10px 14px!important;border-width:4px!important;overflow:auto!important}#popup .popup-head{padding:5px!important;margin-bottom:6px!important;font-size:11px!important}#popup .bigman{width:116px!important;height:58px!important;transform:scale(.38)!important;transform-origin:center top!important;margin:2px auto 8px!important}#popup .popup-crest{width:66px!important;height:66px!important;border-width:3px!important;margin:4px auto!important}#popup .popupbox h1{font-size:24px!important;margin:5px 0 2px!important}#popup .popupbox h2{font-size:17px!important;line-height:1.15!important;margin:4px 0 2px!important;position:relative!important;z-index:2!important}#popup #pr{font-size:11px!important;margin-top:2px!important}'}function clearAutoTimers(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}if(finalRetryTimer){clearTimeout(finalRetryTimer);finalRetryTimer=null}if(finalFailTimer){clearTimeout(finalFailTimer);finalFailTimer=null}}function refreshButtons(){$('finalize').disabled=lastSeq!==18}async function arm(){try{await call('host_reset');clearAutoTimers();armed=true;lastPhase='';lastSeq=0;lastSavedManager='';lastSavedTeam='';refreshButtons();setStatus('HOST ARMATO · WAITING ROOM PRONTA · AUTOMATIC DRAW')}catch(e){setStatus('ERRORE HOST: '+e.message)}}async function start(){if(!armed){setStatus('Prima premi ARM LIVE');return}try{await call('host_start');const d=frame.contentDocument,s=d&&d.getElementById('start');if(!s)throw new Error('draw_not_ready');injectCompactPopup();document.body.classList.add('live-mode');s.disabled=false;s.click();$('start').disabled=true;$('arm').disabled=true;setStatus('COUNTDOWN AVVIATO · AUTOMATIC DRAW');watch()}catch(e){setStatus('ERRORE START: '+e.message)}}function domAssignments(){const d=frame.contentDocument;if(!d)return[];return[...d.querySelectorAll('#history .hrow')].filter(r=>/^#\d+/.test((r.children[0]?.textContent||'').trim())).map(r=>({seq:parseInt((r.children[0]?.textContent||'').replace('#',''),10),manager:(r.children[1]?.textContent||'').trim(),team:(r.children[2]?.textContent||'').trim(),region:(r.children[3]?.textContent||'').includes('S. AMERICA')?'SA':'EU'}))}function regionFrom(doc){const txt=(doc.getElementById('continent')?.innerText||'').toUpperCase();return txt.includes('SOUTH AMERICA')?'SA':txt.includes('EUROPE')?'EU':null}async function publishPhase(phase,extra={}){if(phase===lastPhase&&phase!=='manager_selected'&&phase!=='assignment')return;lastPhase=phase;try{await call(phase==='manager_spinning'?'host_live':'host_phase',phase==='manager_spinning'?{}:{phase,...extra})}catch(e){setStatus('SYNC ERROR: '+e.message)}}function triggerEngineNext(targetSeq){if(lastSeq!==targetSeq-1||targetSeq>18)return;const d=frame.contentDocument,p=d&&d.getElementById('popup'),s=d&&d.getElementById('start');if(p)p.classList.remove('show');if(!s){setStatus('AUTO ERROR: draw_not_ready');return}s.disabled=false;s.click();setStatus('AUTOMATIC DRAW · ESTRAZIONE #'+targetSeq);if(targetSeq===18)armFinalWatchdog()}function scheduleAutomaticNext(seq){if(seq>=18)return;if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(()=>{autoTimer=null;triggerEngineNext(seq+1)},4000)}function armFinalWatchdog(){if(finalRetryTimer)clearTimeout(finalRetryTimer);if(finalFailTimer)clearTimeout(finalFailTimer);finalRetryTimer=setTimeout(()=>{if(lastSeq!==17)return;const d=frame.contentDocument,s=d&&d.getElementById('start'),mw=(d&&d.getElementById('mwinner')?.textContent||'').trim(),tw=(d&&d.getElementById('twinner')?.textContent||'').trim();if(s&&mw!=='SPINNING...'&&tw!=='SPINNING...'&&domAssignments().length===17){s.disabled=false;s.click();setStatus('AUTOMATIC DRAW · RETRY INTERNO #18')}},7000);finalFailTimer=setTimeout(()=>{if(lastSeq===17)setStatus('AUTO ERROR: final_draw_timeout')},16000)}async function saveAssignment(a){if(!a||a.seq<=lastSeq)return;await call('host_assignment',{seq:a.seq,manager:a.manager,team:a.team,region:a.region});lastSeq=a.seq;lastSavedManager=a.manager;lastSavedTeam=a.team;refreshButtons();if(a.seq===18){clearAutoTimers();setStatus('ASSEGNAZIONE #18 · '+a.manager+' → '+a.team+' · PRONTO PER FINALIZE')}else{setStatus('ASSEGNAZIONE #'+a.seq+' · '+a.manager+' → '+a.team+' · PROSSIMA AUTOMATICA TRA 4s');scheduleAutomaticNext(a.seq)}}function uniqueAssignments(arr){if(!Array.isArray(arr)||arr.length!==18)return false;const managers=new Set(),teams=new Set();for(const a of arr){if(!a||!a.manager||!a.team||!['SA','EU'].includes(a.region)||managers.has(a.manager)||teams.has(a.team))return false;managers.add(a.manager);teams.add(a.team)}return true}async function finalize(){try{let st=await state(),assignments=Array.isArray(st.assignments)?st.assignments.slice():[];const dom=domAssignments();if(dom.length>assignments.length)assignments=dom;if(!uniqueAssignments(assignments))throw new Error(assignments.length===18?'assignments_not_unique':'18th_assignment_not_ready');assignments=assignments.slice().sort((a,b)=>(+a.seq)-(+b.seq)).map((a,i)=>({seq:i+1,manager:a.manager,team:a.team,region:a.region,time:a.time||null}));setStatus('SALVATAGGIO REPLAY IN CORSO...');const sr=await fetch('../save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameWorld:'GW010',title:'Sensible Soccer Academy',assignments}),cache:'no-store'}),text=await sr.text();let sj={};try{sj=JSON.parse(text)}catch(e){}if(!sr.ok||!sj.ok)throw new Error(sj.error||('replay_save_failed_'+sr.status));await call('host_finalize');$('finalize').disabled=true;setStatus('DRAW FINALIZZATO · REPLAY SALVATO · '+sj.draw_id)}catch(e){setStatus('FINALIZE ERROR: '+e.message)}}function watch(){if(watcher)clearInterval(watcher);watcher=setInterval(async()=>{try{injectCompactPopup();const d=frame.contentDocument;if(!d)return;const rows=domAssignments();if(rows.length>lastSeq){const missing=rows.filter(r=>r.seq>lastSeq).sort((a,b)=>a.seq-b.seq);for(const a of missing)await saveAssignment(a);return}const mw=(d.getElementById('mwinner')?.textContent||'').trim(),tw=(d.getElementById('twinner')?.textContent||'').trim(),teamShow=d.getElementById('teamstage')?.classList.contains('show'),popup=d.getElementById('popup')?.classList.contains('show');if(mw==='SPINNING...'){await publishPhase('manager_spinning');return}if(teamShow&&mw&&mw!=='READY'&&mw!=='SPINNING...'){const region=regionFrom(d);if(tw==='SPINNING...'){await publishPhase('team_spinning',{manager:mw,region});return}if(tw&&tw!=='WAITING'&&tw!=='SPINNING...'){if(popup)await publishPhase('assignment',{manager:mw,team:tw,region});else await publishPhase('manager_selected',{manager:mw,region});return}}if(mw==='READY')await publishPhase('idle')}catch(e){setStatus('SYNC ERROR: '+e.message)}},400)}$('arm').onclick=arm;$('start').onclick=start;$('finalize').onclick=finalize;frame.addEventListener('load',()=>{injectCompactPopup();setStatus(armed?'HOST ARMATO · AUTOMATIC DRAW PRONTO':'DRAW PRONTO · PREMI ARM LIVE')});refreshButtons()})();</script></body></html>
