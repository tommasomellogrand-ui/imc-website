<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Sensible Soccer Academy · Host</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}body{min-height:100vh}.shell{min-height:100vh;padding:10px;background:#09214a}.bar{max-width:1220px;margin:auto;background:#071a39;border:5px solid #f0e6b4;box-shadow:5px 5px #000;padding:10px}.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.title{font-weight:900;color:#ffd43c}.hostcontrols{display:flex;gap:8px;flex-wrap:wrap}.hostcontrols button{border:4px solid #fff;padding:10px;font:900 13px "Courier New",monospace;background:#258b42;color:#fff;box-shadow:3px 3px #000;cursor:pointer}.hostcontrols button.red{background:#b92f2f}.hostcontrols button.gold{background:#9b7100}.hostcontrols button:disabled{opacity:.38;cursor:not-allowed}.status{margin-top:8px;padding:8px;background:#041126;border:3px solid #fff;color:#d7e8ff;font-size:12px}.frame{max-width:1220px;margin:12px auto 0;border:5px solid #777;box-shadow:0 0 0 5px #111;background:#000}.frame iframe{display:block;width:100%;height:86vh;border:0;background:#000}@media(max-width:800px){.top{grid-template-columns:1fr}.hostcontrols{display:grid;grid-template-columns:1fr}.frame iframe{height:78vh}}</style></head><body><div class="shell"><div class="bar"><div class="top"><div><div class="title">🎮 SENSIBLE SOCCER ACADEMY · HOST CONSOLE</div><div style="font-size:11px;color:#9fc0e7">Controllo ufficiale del live draw. Gli invitati non vedono questi comandi.</div></div><div class="hostcontrols"><button id="arm">ARM LIVE</button><button id="start">▶ START LIVE DRAW</button><button id="finalize" class="gold" disabled>✓ FINALIZE DRAW</button><button id="reset" class="red">RESET LIVE STATE</button></div></div><div class="status" id="status">DRAW IN CARICAMENTO</div></div><div class="frame"><iframe id="draw" src="../draw/?hostview=1"></iframe></div></div><script>(()=>{const api='../live/api.php',$=id=>document.getElementById(id),frame=$('draw');let armed=false,lastPhase='',lastSeq=0,watcher=null;async function call(action,extra={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'request_failed');return j}function setStatus(t){$('status').textContent=t}function finalReady(){ $('finalize').disabled=lastSeq!==18 }async function arm(){try{await call('host_reset');armed=true;lastPhase='';lastSeq=0;finalReady();setStatus('HOST ARMATO · WAITING ROOM PRONTA')}catch(e){setStatus('ERRORE HOST: '+e.message)}}async function start(){if(!armed){setStatus('Prima premi ARM LIVE');return}try{await call('host_start');const d=frame.contentDocument,s=d&&d.getElementById('start');if(!s)throw new Error('draw_not_ready');s.click();setStatus('COUNTDOWN AVVIATO');watch()}catch(e){setStatus('ERRORE START: '+e.message)}}async function finalize(){if(lastSeq!==18){setStatus('FINALIZE BLOCCATO · SERVONO 18/18 ASSEGNAZIONI');return}try{const d=frame.contentDocument,rows=[...d.querySelectorAll('#history .hrow')].filter(r=>/^#\d+/.test((r.children[0]?.textContent||'').trim()));const assignments=rows.map(r=>({seq:parseInt((r.children[0]?.textContent||'').replace('#',''),10),manager:(r.children[1]?.textContent||'').trim(),team:(r.children[2]?.textContent||'').trim(),region:(r.children[3]?.textContent||'').includes('S. AMERICA')?'SA':'EU'}));if(assignments.length!==18)throw new Error('history_not_complete');const sr=await fetch('../save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameWorld:'GW010',title:'Sensible Soccer Academy',assignments}),cache:'no-store'}),sj=await sr.json();if(!sr.ok||!sj.ok)throw new Error(sj.error||'replay_save_failed');await call('host_finalize');$('finalize').disabled=true;$('start').disabled=true;setStatus('DRAW FINALIZZATO · REPLAY SALVATO · '+sj.draw_id)}catch(e){setStatus('FINALIZE ERROR: '+e.message)}}function regionFrom(doc){const txt=(doc.getElementById('continent')?.innerText||'').toUpperCase();return txt.includes('SOUTH AMERICA')?'SA':txt.includes('EUROPE')?'EU':null}async function publishPhase(phase,extra={}){if(phase===lastPhase&&phase!=='manager_selected'&&phase!=='assignment')return;lastPhase=phase;try{await call(phase==='manager_spinning'?'host_live':'host_phase',phase==='manager_spinning'?{}:{phase,...extra});setStatus('LIVE · '+phase.toUpperCase().replaceAll('_',' '))}catch(e){setStatus('SYNC ERROR: '+e.message)}}function watch(){if(watcher)clearInterval(watcher);watcher=setInterval(async()=>{try{const d=frame.contentDocument;if(!d)return;const mw=(d.getElementById('mwinner')?.textContent||'').trim(),tw=(d.getElementById('twinner')?.textContent||'').trim(),teamShow=d.getElementById('teamstage')?.classList.contains('show'),popup=d.getElementById('popup')?.classList.contains('show');if(mw==='SPINNING...'){await publishPhase('manager_spinning');return}if(teamShow&&mw&&mw!=='READY'&&mw!=='SPINNING...'){const region=regionFrom(d);if(tw==='SPINNING...'){await publishPhase('team_spinning',{manager:mw,region});return}if(tw&&tw!=='WAITING'&&tw!=='SPINNING...'){const rows=[...d.querySelectorAll('#history .hrow')].filter(r=>/^#\d+/.test((r.children[0]?.textContent||'').trim()));const n=rows.length;if(n>lastSeq){const r=rows[n-1],seq=parseInt((r.children[0]?.textContent||'').replace('#',''),10),manager=(r.children[1]?.textContent||'').trim(),team=(r.children[2]?.textContent||'').trim();lastSeq=n;finalReady();await call('host_assignment',{seq,manager,team,region});setStatus('ASSEGNAZIONE #'+seq+' · '+manager+' → '+team+(seq===18?' · PRONTO PER FINALIZE':''));return}if(popup)await publishPhase('assignment',{manager:mw,team:tw,region});else await publishPhase('manager_selected',{manager:mw,region});return}}if(mw==='READY')await publishPhase('idle')}catch(e){}},350)}$('arm').onclick=arm;$('start').onclick=start;$('finalize').onclick=finalize;$('reset').onclick=async()=>{try{await call('host_reset');armed=true;lastSeq=0;lastPhase='';finalReady();$('start').disabled=false;setStatus('LIVE STATE RESET · WAITING')}catch(e){setStatus('RESET ERROR: '+e.message)}};frame.addEventListener('load',()=>setStatus(armed?'HOST ARMATO · DRAW PRONTO':'DRAW PRONTO · PREMI ARM LIVE'));})();</script></body></html>
