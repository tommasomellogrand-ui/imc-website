<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Sensible Soccer Academy · Host</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02050a;color:#fff;font-family:"Courier New",monospace}body{min-height:100vh}.shell{min-height:100vh;padding:10px;background:#09214a}.bar{max-width:1220px;margin:auto;background:#071a39;border:5px solid #f0e6b4;box-shadow:5px 5px #000;padding:10px}.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.title{font-weight:900;color:#ffd43c}.hostcontrols{display:flex;gap:8px;flex-wrap:wrap}.hostcontrols button{border:4px solid #fff;padding:10px;font:900 13px "Courier New",monospace;background:#258b42;color:#fff;box-shadow:3px 3px #000}.hostcontrols button.gold{background:#9b7100}.hostcontrols button:disabled{opacity:.38}.status{margin-top:8px;padding:8px;background:#041126;border:3px solid #fff;color:#d7e8ff;font-size:12px}.frame{max-width:1220px;margin:12px auto 0;border:5px solid #777;box-shadow:0 0 0 5px #111;background:#000}.frame iframe{display:block;width:100%;height:86vh;border:0;background:#000}@media(max-width:800px){.shell{padding:4px}.top{grid-template-columns:1fr}.hostcontrols{display:grid;grid-template-columns:1fr 1fr}.frame{margin-top:6px}.frame iframe{height:88vh}.live-mode .bar{padding:5px;border-width:3px;position:sticky;top:0;z-index:20}.live-mode .intro{display:none}.live-mode .status{font-size:10px}.live-mode .frame iframe{height:92vh}}</style></head><body><div class="shell"><div class="bar"><div class="top"><div class="intro"><div class="title">🎮 SENSIBLE SOCCER ACADEMY · HOST CONSOLE</div><div style="font-size:11px;color:#9fc0e7">24 CLUB · 24 SLOT · AUTOMATIC DRAW</div></div><div class="hostcontrols"><button id="arm">ARM LIVE</button><button id="start">▶ START AUTOMATIC DRAW</button><button id="finalize" class="gold" disabled>✓ FINALIZE DRAW</button></div></div><div class="status" id="status">DRAW IN CARICAMENTO</div></div><div class="frame"><iframe id="draw" src="../draw24/?hostview=1"></iframe></div></div><script>(()=>{const TOTAL=24,api='../live/api.php',$=id=>document.getElementById(id),frame=$('draw');let armed=false,lastSeq=0,watcher=null,autoTimer=null,reloading=false;async function call(action,extra={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra}),cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'request_failed');return j}function status(t){$('status').textContent=t}function rows(){const d=frame.contentDocument;if(!d)return[];return[...d.querySelectorAll('#history .hrow')].filter(r=>/^#\d+/.test((r.children[0]?.textContent||'').trim())).map(r=>({seq:+(r.children[0].textContent.replace('#','')),manager:r.children[1].textContent.trim(),team:r.children[2].textContent.trim(),region:(r.children[3]?.textContent||'').includes('S. AMERICA')?'SA':'EU'}))}function next(seq){if(seq>=TOTAL)return;if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(()=>{const d=frame.contentDocument,s=d&&d.getElementById('start'),p=d&&d.getElementById('popup');if(p)p.classList.remove('show');if(s){s.disabled=false;s.click();status('AUTOMATIC DRAW · ESTRAZIONE #'+(seq+1))}},4000)}async function save(a){await call('host_assignment',a);lastSeq=a.seq;$('finalize').disabled=lastSeq!==TOTAL;if(lastSeq<TOTAL){status('ASSEGNAZIONE #'+lastSeq+' · '+a.manager+' → '+a.team+' · PROSSIMA TRA 4s');next(lastSeq)}else status('24/24 COMPLETATO · PRONTO PER FINALIZE')}async function arm(){if(watcher){clearInterval(watcher);watcher=null}if(autoTimer){clearTimeout(autoTimer);autoTimer=null}await call('host_reset');armed=false;lastSeq=0;$('finalize').disabled=true;$('start').disabled=true;$('arm').disabled=true;document.body.classList.remove('live-mode');reloading=true;status('RESET COMPLETO · RICARICO IL SORTEGGIO DA 0');frame.src='../draw24/?hostview=1&reset='+Date.now()}async function start(){if(!armed){status('Prima premi ARM LIVE');return}await call('host_start');const d=frame.contentDocument,s=d&&d.getElementById('start');if(!s){status('ERRORE: draw_not_ready');return}document.body.classList.add('live-mode');s.disabled=false;s.click();$('start').disabled=true;$('arm').disabled=true;status('AUTOMATIC DRAW AVVIATO');watch()}function watch(){if(watcher)clearInterval(watcher);watcher=setInterval(async()=>{try{const rr=rows();for(const a of rr.filter(x=>x.seq>lastSeq).sort((a,b)=>a.seq-b.seq))await save(a)}catch(e){status('SYNC ERROR: '+e.message)}},350)}async function finalize(){try{const assignments=rows();if(assignments.length!==TOTAL)throw new Error('24th_assignment_not_ready');const sr=await fetch('../save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameWorld:'GW010',title:'Sensible Soccer Academy',assignments}),cache:'no-store'}),j=await sr.json();if(!sr.ok||!j.ok)throw new Error(j.error||'save_failed');await call('host_finalize');$('finalize').disabled=true;status('DRAW FINALIZZATO · REPLAY SALVATO · '+j.draw_id)}catch(e){status('FINALIZE ERROR: '+e.message)}}$('arm').onclick=()=>arm().catch(e=>{reloading=false;$('arm').disabled=false;$('start').disabled=false;status('ERRORE HOST: '+e.message)});$('start').onclick=()=>start().catch(e=>status('ERRORE START: '+e.message));$('finalize').onclick=finalize;frame.onload=()=>{if(reloading){reloading=false;armed=true;$('arm').disabled=false;$('start').disabled=false;status('HOST ARMATO · RESET 0/24 COMPLETATO · DRAW PRONTO')}else status(armed?'HOST ARMATO · DRAW PRONTO':'DRAW PRONTO · PREMI ARM LIVE')};})();</script></body></html>
