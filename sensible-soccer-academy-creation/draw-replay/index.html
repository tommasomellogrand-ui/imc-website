<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07162f"><title>Sensible Soccer Academy · Draw Replay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02070e;color:#fff;font-family:"Courier New",monospace}body{min-height:100vh}.app{min-height:100vh;background:linear-gradient(#09265a 0 250px,#0b3b72 250px 330px,#16894a 330px);position:relative}.pitch{position:absolute;inset:325px 0 0;background:repeating-linear-gradient(90deg,#168747 0 72px,#209b51 72px 144px)}.shell{position:relative;z-index:2;max-width:1080px;margin:auto;padding:14px}.top{min-height:230px;display:grid;grid-template-columns:100px 1fr 100px;gap:14px;align-items:center}.imcLogo{width:84px;filter:drop-shadow(4px 4px #000)}.academyLogo{display:block;width:min(660px,100%);max-height:210px;object-fit:contain;margin:auto;filter:drop-shadow(6px 6px #000)}.gw{text-align:right;font-weight:900}.gw b{color:#f4c93d}.roomTitle{text-align:center;margin:6px 0 14px;font-size:clamp(20px,4vw,34px);font-weight:900;color:#f4c93d;text-shadow:3px 3px #000;letter-spacing:2px}.sceneBox{background:linear-gradient(180deg,#0a1930,#071629 68%,#04101d);border:6px solid #f0e6b4;box-shadow:0 0 0 6px #000;padding:10px}.sceneHead{text-align:center;background:#06111f;border:3px solid #f4c93d;padding:8px;color:#f4c93d;font-weight:900;letter-spacing:2px;text-shadow:3px 3px #000}.sceneStage{margin-top:10px;padding:10px;display:grid;grid-template-columns:1fr;gap:12px;background:repeating-linear-gradient(90deg,#168747 0 86px,#209b51 86px 172px);border:5px solid #fff;box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),0 8px 0 #02070e;position:relative}.zone{width:100%;min-height:190px;padding:0;display:grid;grid-template-columns:29% 29% 42%;align-items:stretch;background:linear-gradient(180deg,#0c213e,#071629);border:4px solid #fff;box-shadow:6px 6px #02070e;opacity:.28;transform:scale(.985);transition:.18s}.zone.active{opacity:1;transform:scale(1);box-shadow:6px 6px #02070e,0 0 0 2px #f4c93d,0 0 24px rgba(244,201,61,.22)}.zone.sa{border-color:#d9483f}.zone.eu{border-color:#3d83e6}.cell{min-width:0;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;border-right:2px solid rgba(240,230,180,.72)}.cell:last-child{border-right:0}.step{font-size:clamp(13px,2vw,21px);font-weight:900;line-height:1.35;letter-spacing:1px;color:#f4c93d;text-shadow:2px 2px #000}.step span{display:block}.visual{background:rgba(2,7,14,.22)}.player{width:24px;height:35px;position:relative;display:block;transform:scale(2.15);filter:drop-shadow(2px 2px #000)}.player i{display:block;position:absolute}.pHead{width:10px;height:10px;left:7px;top:0;background:#efb178;box-shadow:0 0 0 2px #111}.pBody{width:15px;height:14px;left:5px;top:13px;box-shadow:0 0 0 2px #111;background:#3d83e6}.player.sa .pBody{background:#d9483f}.pLeg1,.pLeg2{width:5px;height:9px;top:28px;background:#fff;box-shadow:0 0 0 2px #111}.pLeg1{left:4px}.pLeg2{right:4px}.pBall{width:6px;height:6px;right:-2px;bottom:0;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #111}.managerName,.clubName{font-size:clamp(20px,3.5vw,35px);font-weight:900;line-height:1.12;text-shadow:3px 3px #000;overflow-wrap:anywhere}.managerName span{display:block}.managerName .surname{margin-top:6px}.crest{width:112px;height:112px;max-width:86%;object-fit:contain;background:#fff;border:5px solid #f0e6b4;box-shadow:6px 6px #000}.divisionChoices{grid-column:2 / 4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:18px;align-items:center}.divisionBanner{min-height:78px;padding:10px 6px;border:3px solid #35557e;background:#071629;color:#dce8f7;box-shadow:4px 4px #000;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2vw,22px);font-weight:900}.divisionBanner.selected{background:#f4c93d;color:#06111f;border-color:#fff;box-shadow:5px 5px #000,0 0 0 2px #f4c93d;transform:translateY(-2px)}.sceneStatus{text-align:center;margin-top:12px;min-height:42px;font-weight:900;font-size:18px;color:#f4c93d;background:#02070e;border:2px solid #35557e;padding:8px}.sceneFinal{display:none;margin-top:10px;padding:10px;text-align:center;background:#06111f;border:4px solid #f4c93d}.sceneFinal.show{display:block}.chain{margin-top:8px;font-size:16px}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}.btn{background:#198247;color:#fff;border:4px solid #fff;box-shadow:4px 4px #000;padding:11px 16px;font:900 13px "Courier New",monospace;cursor:pointer}.btn.alt{background:#0b3b72}.meta{text-align:center;margin-top:10px;color:#9eb9db;font-size:11px}.empty{padding:30px;text-align:center;background:#071629;border:5px solid #f0e6b4;box-shadow:0 0 0 5px #000}.footer{text-align:center;margin-top:16px;padding:10px;background:#06111f;border-top:4px solid #f4c93d;font-size:10px;letter-spacing:2px}@media(max-width:700px){.top{grid-template-columns:70px 1fr}.gw{display:none}.imcLogo{width:58px}.sceneStage{padding:7px;gap:9px}.zone{grid-template-columns:30% 28% 42%;min-height:150px}.cell{padding:8px}.step{font-size:12px}.player{transform:scale(1.55)}.managerName,.clubName{font-size:18px}.crest{width:78px;height:78px;border-width:4px}.divisionChoices{padding:9px;gap:6px}.divisionBanner{min-height:62px;font-size:11px;padding:6px 3px;border-width:2px}}
</style>
</head>
<body><div class="app"><div class="pitch"></div><main class="shell"><header class="top"><img class="imcLogo" src="/site-assets/images/imc-logo.png" alt="IMC"><img class="academyLogo" src="../gw-setting/sensible-soccer-academy-logo.svg" alt="Sensible Soccer Academy IMC GW010"><div class="gw"><b>GW010</b><br>DRAW REPLAY</div></header><div class="roomTitle">DRAW REPLAY</div><div id="empty" class="empty">CARICAMENTO REPLAY...</div><section id="replay" class="sceneBox" hidden><div class="sceneHead">SENSIBLE DRAFT SYSTEM · REPLAY</div><div class="sceneStage"><div class="zone managerZone" id="managerZone"><div class="cell"><div class="step"><span>STEP 1</span><span>MANAGER</span></div></div><div class="cell visual"><span id="player" class="player"><i class="pHead"></i><i class="pBody"></i><i class="pLeg1"></i><i class="pLeg2"></i><i class="pBall"></i></span></div><div class="cell"><div id="manager" class="managerName">WAITING</div></div></div><div class="zone clubZone" id="clubZone"><div class="cell"><div class="step"><span>STEP 2</span><span>CLUB</span></div></div><div class="cell visual"><img id="crest" class="crest" alt=""></div><div class="cell"><div id="club" class="clubName">WAITING</div></div></div><div class="zone divZone" id="divZone"><div class="cell"><div class="step"><span>STEP 3</span><span>DIVISIONE</span></div></div><div class="divisionChoices"><div class="divisionBanner">DIVISIONE 1</div><div class="divisionBanner">DIVISIONE 2</div><div class="divisionBanner">DIVISIONE 3</div></div></div></div><div id="status" class="sceneStatus">READY</div><div id="final" class="sceneFinal"><strong>MATCH LOCKED</strong><div id="chain" class="chain"></div></div><div class="controls"><button class="btn" id="play">▶ PLAY</button><button class="btn alt" id="pause">Ⅱ PAUSA</button><button class="btn alt" id="restart">↺ RICOMINCIA</button></div><div class="meta" id="meta"></div></section><footer class="footer">ITALIAN MASTERS CLUB · SENSIBLE SOCCER ACADEMY · DRAW REPLAY</footer></main></div>
<script>
(()=>{const api='./replay.php';const $=id=>document.getElementById(id);let data=null,timers=[],playing=false,startWall=0,pausedAt=0,index=0;const esc=s=>String(s||'');function split(v){const p=esc(v).trim().split(/\s+/).filter(Boolean);return p.length<2?[p[0]||'WAITING','']:[p[0],p.slice(1).join(' ')];}function clearTimers(){timers.forEach(clearTimeout);timers=[];}function apply(e){const [f,l]=split(e.manager);$('manager').innerHTML=`<span>${f}</span>${l?`<span class="surname">${l}</span>`:''}`;$('club').textContent=e.club||'WAITING';$('crest').src=e.crest||'';$('player').classList.toggle('sa',e.region==='SA');$('player').classList.toggle('eu',e.region!=='SA');$('managerZone').classList.toggle('sa',e.region==='SA');$('managerZone').classList.toggle('eu',e.region==='EU');$('managerZone').classList.toggle('active',!!e.active?.manager);$('clubZone').classList.toggle('active',!!e.active?.club);$('divZone').classList.toggle('active',!!e.active?.division);const m=String(e.division||'').match(/([123])/);document.querySelectorAll('.divisionBanner').forEach((x,i)=>x.classList.toggle('selected',!!m&&Number(m[1])===i+1));$('status').textContent=e.status||'';$('chain').textContent=e.chain||'';$('final').classList.toggle('show',!!e.locked);}
function schedule(fromMs=0){if(!data||playing)return;playing=true;startWall=Date.now()-fromMs;for(let i=index;i<data.events.length;i++){const e=data.events[i];if(e.t<fromMs)continue;timers.push(setTimeout(()=>{index=i+1;pausedAt=e.t;apply(e);if(i===data.events.length-1)playing=false;},Math.max(0,e.t-fromMs)));}}
function restart(){clearTimers();playing=false;pausedAt=0;index=0;if(data?.events?.length)apply(data.events[0]);schedule(0);}function pause(){if(!playing)return;pausedAt=Math.max(0,Date.now()-startWall);clearTimers();playing=false;index=data.events.findIndex(e=>e.t>=pausedAt);if(index<0)index=data.events.length;}async function load(){try{const r=await fetch(api+'?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(!j.ok||!j.replay){$('empty').textContent='NESSUN SORTEGGIO SALVATO';return;}data=j.replay;$('empty').hidden=true;$('replay').hidden=false;$('meta').textContent=`${data.events.length} EVENTI · DURATA ${Math.round((data.duration_ms||0)/1000)}s · SALVATO ${new Date(data.created_at).toLocaleString('it-IT')}`;apply(data.events[0]);schedule(0);}catch(e){$('empty').textContent='REPLAY NON DISPONIBILE';}}
$('play').addEventListener('click',()=>schedule(pausedAt));$('pause').addEventListener('click',pause);$('restart').addEventListener('click',restart);load();})();
</script></body></html>
