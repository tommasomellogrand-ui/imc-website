<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f">
<title>Sensible Soccer Academy · Draft Matrix</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02070e;color:#fff;font-family:"Courier New",monospace}body{min-height:100vh}.app{min-height:100vh;background:linear-gradient(#09265a 0 185px,#0b3b72 185px 310px,#16894a 310px);position:relative}.pitch{position:absolute;inset:305px 0 0;background:repeating-linear-gradient(90deg,#168747 0 72px,#209b51 72px 144px)}.shell{position:relative;z-index:2;max-width:1480px;margin:auto;padding:14px}.top{display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:10px;min-height:165px}.logo{width:108px;filter:drop-shadow(4px 4px #000)}.brand{text-align:center;text-transform:uppercase;text-shadow:5px 5px #000}.brand .a{font-size:clamp(30px,4vw,60px);font-weight:900;line-height:.85}.brand .b{font-size:clamp(44px,6vw,88px);font-weight:900;line-height:.78;-webkit-text-stroke:2px #d51f1f}.brand .c{display:inline-block;margin-top:10px;padding:4px 18px;background:#07101a;border:4px solid #fff;border-left-color:#11864b;border-right-color:#d32727;font-weight:900;letter-spacing:3px}.gw{text-align:right;font-weight:900}.gw b{color:#f4c93d}.matrix{display:grid;grid-template-columns:1fr 320px 1fr;gap:14px;align-items:start}.panel{background:#071629;border:4px solid #f0e6b4;box-shadow:0 0 0 4px #000,inset 0 0 0 2px #35557e}.panel h2{margin:0;padding:10px;text-align:center;background:#06111f;color:#f4c93d;border-bottom:4px solid #000;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}.card{min-height:54px;padding:7px;border:2px solid #395b86;background:#0b213e;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;transition:.16s}.card.sa{border-color:#d9483f}.card.eu{border-color:#3d83e6}.card.locked{opacity:.34;filter:grayscale(.35)}.badge{width:30px;height:30px;display:grid;place-items:center;border:2px solid #fff;font-weight:900}.sa .badge{background:#b62420}.eu .badge{background:#1956a6}.name{font-size:11px;font-weight:900}.meta{font-size:9px;margin-top:3px;opacity:.75}.club{grid-template-columns:42px 1fr}.crest{width:38px;height:38px;object-fit:contain;background:#fff;border:2px solid #fff}.core{position:sticky;top:10px;background:#06111f;border:4px solid #f4c93d;box-shadow:0 0 0 4px #000;padding:12px;text-align:center}.core h1{font-size:20px;margin:0 0 10px;color:#f4c93d}.scanner{min-height:205px;border:3px solid #35557e;background:#02070e;padding:10px;display:grid;place-items:center}.lock{width:100%}.lock small{display:block;color:#8fb6e8}.lock .manager,.lock .clubname,.lock .division{font-weight:900;margin:8px 0}.lock .manager{font-size:18px}.lock .clubname{font-size:20px;color:#f4c93d}.lock .division{font-size:16px}.lock img{width:82px;height:82px;object-fit:contain;background:#fff;border:4px solid #fff}.btn{margin-top:12px;width:100%;min-height:56px;background:#198247;border:4px solid #fff;box-shadow:4px 4px #000;color:#fff;font:900 16px "Courier New",monospace;cursor:pointer}.btn:disabled{opacity:.4;cursor:default}.count{margin-top:10px;font-weight:900;color:#f4c93d}.divisions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.divisionBox{background:#071629;border:4px solid #f0e6b4;box-shadow:0 0 0 4px #000}.divisionBox h3{margin:0;padding:9px;text-align:center;background:#06111f;color:#f4c93d}.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:7px}.slot{min-height:38px;padding:6px;border:1px solid #35557e;background:#0b213e;font-size:10px}.slot.sa{border-color:#d9483f}.slot.eu{border-color:#3d83e6}.slot b{display:block}.legend{text-align:center;margin:12px 0 0;font-size:11px;font-weight:900}.legend .saT{color:#ff5a50}.legend .euT{color:#63a9ff}.footer{text-align:center;margin-top:16px;padding:10px;background:#06111f;border-top:4px solid #f4c93d;font-size:10px;letter-spacing:2px}@media(max-width:1050px){.matrix{grid-template-columns:1fr}.core{position:relative;top:0;order:-1}.top{grid-template-columns:70px 1fr}.logo{width:62px}.gw{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.shell{padding:8px}.top{min-height:135px}.brand .a{font-size:27px}.brand .b{font-size:40px}.brand .c{font-size:12px;letter-spacing:1px;padding:3px 8px}.grid{grid-template-columns:1fr}.divisions{grid-template-columns:1fr}.matrix{gap:10px}}
</style>
</head>
<body>
<div class="app"><div class="pitch"></div><main class="shell">
<header class="top"><img class="logo" src="/site-assets/images/imc-logo.png" alt="IMC"><div class="brand"><div class="a">Sensible</div><div class="b">Soccer</div><div class="c">Academy · Draft Matrix</div></div><div class="gw"><b>GW010</b><br>GW SETTING</div></header>
<div class="legend"><span class="saT">■ SUD AMERICA</span> &nbsp; <span class="euT">■ EUROPA</span> &nbsp; MANAGER → CLUB → DIVISIONE</div>
<section class="matrix">
<div class="panel"><h2>24 MANAGER SLOT</h2><div class="grid" id="managerGrid"></div></div>
<div class="core"><h1>DRAFT MATRIX</h1><div class="scanner"><div class="lock" id="lock"><small>SISTEMA PRONTO</small><div class="manager">24 SLOT</div><div class="clubname">24 CLUB</div><div class="division">3 DIVISIONI · 4 EU + 4 SA</div></div></div><button class="btn" id="draftBtn">▶ DRAFT NEXT</button><div class="count" id="count">0 / 24 LOCKED</div></div>
<div class="panel"><h2>24 CLUB</h2><div class="grid" id="clubGrid"></div></div>
</section>
<section class="divisions" id="divisions"></section>
<footer class="footer">ITALIAN MASTERS CLUB · SENSIBLE SOCCER ACADEMY · DRAFT MATRIX</footer>
</main></div>
<script src="./crest-overrides.js"></script>
<script>
(()=>{
const managers=[
{name:'Tommaso Mello',region:'SA'},{name:'Vincenzo Martorano',region:'SA'},{name:'Vardan Minasyan',region:'SA'},{name:'Giuseppe Trovato',region:'SA'},{name:'Nick Pepe',region:'SA'},{name:'Cosimo Lonoce',region:'SA'},
{name:'Max Palace',region:'EU'},{name:'Luciano Catalano',region:'EU'},{name:'Sir Simone',region:'EU'},{name:'Ringhio Gattuso',region:'EU'},{name:'Andrea Meneghini',region:'EU'},{name:'Davide Rapisarda',region:'EU'},{name:'Francesco Senesi',region:'EU'},{name:'Oleksandr Medvid',region:'EU'},{name:'Luciano Tana',region:'EU'},{name:'Carlo Colombo',region:'EU'},{name:'Chicco Belin',region:'EU'},{name:'Marco Aloisi',region:'EU'},
{name:'NESSUN MANAGER 1',region:'SA',empty:true},{name:'NESSUN MANAGER 2',region:'SA',empty:true},{name:'NESSUN MANAGER 3',region:'SA',empty:true},{name:'NESSUN MANAGER 4',region:'SA',empty:true},{name:'NESSUN MANAGER 5',region:'SA',empty:true},{name:'NESSUN MANAGER 6',region:'SA',empty:true}
];
const clubs=[
...['Peñarol','Colo-Colo','Millonarios','Bolívar','Olimpia','Alianza Lima','Santos','São Paulo','Grêmio','Argentinos Juniors',"Newell's Old Boys",'Vélez Sarsfield'].map(name=>({name,region:'SA'})),
...['Atalanta','Ferencváros','IFK Göteborg','Aberdeen','Siviglia','West Ham United','Stoccarda','Anderlecht','Ajax','Olympique Lyonnais','Dinamo Zagreb','Benfica'].map(name=>({name,region:'EU'}))
];
const state={remainingManagers:managers.map((_,i)=>i),remainingClubs:clubs.map((_,i)=>i),assignments:[],divisions:[{EU:[],SA:[]},{EU:[],SA:[]},{EU:[],SA:[]}]};
const $=id=>document.getElementById(id);const crest=name=>(window.IMC_CREST_OVERRIDES&&window.IMC_CREST_OVERRIDES[name])||'';
function rnd(n){if(n<2)return 0;try{return crypto.getRandomValues(new Uint32Array(1))[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function managerAssignment(i){return state.assignments.find(a=>a.managerIndex===i)}function clubAssignment(i){return state.assignments.find(a=>a.clubIndex===i)}
function renderManagers(){const g=$('managerGrid');g.innerHTML='';managers.forEach((m,i)=>{const a=managerAssignment(i),d=document.createElement('div');d.className='card '+m.region.toLowerCase()+(a?' locked':'');d.innerHTML='<div class="badge">'+(i+1)+'</div><div><div class="name">'+m.name+'</div><div class="meta">'+(m.region==='SA'?'SUD AMERICA':'EUROPA')+(a?' · LOCKED':'')+'</div></div>';g.append(d)})}
function renderClubs(){const g=$('clubGrid');g.innerHTML='';clubs.forEach((c,i)=>{const a=clubAssignment(i),d=document.createElement('div');d.className='card club '+c.region.toLowerCase()+(a?' locked':'');d.innerHTML='<img class="crest" src="'+crest(c.name)+'" alt=""><div><div class="name">'+c.name+'</div><div class="meta">'+(c.region==='SA'?'SUD AMERICA':'EUROPA')+(a?' · DIV '+a.division:'')+'</div></div>';g.append(d)})}
function renderDivisions(){const root=$('divisions');root.innerHTML='';state.divisions.forEach((d,idx)=>{const box=document.createElement('div');box.className='divisionBox';const entries=[...d.SA.map(a=>({a,r:'SA'})),...Array.from({length:4-d.SA.length},()=>({r:'SA'})),...d.EU.map(a=>({a,r:'EU'})),...Array.from({length:4-d.EU.length},()=>({r:'EU'}))];box.innerHTML='<h3>DIVISIONE '+(idx+1)+' · '+(d.SA.length+d.EU.length)+'/8</h3><div class="slots">'+entries.map(x=>x.a?'<div class="slot '+x.r.toLowerCase()+'"><b>'+clubs[x.a.clubIndex].name+'</b>'+managers[x.a.managerIndex].name+'</div>':'<div class="slot '+x.r.toLowerCase()+'">'+(x.r==='SA'?'SA':'EU')+' SLOT LIBERO</div>').join('')+'</div>';root.append(box)})}
function render(){renderManagers();renderClubs();renderDivisions();$('count').textContent=state.assignments.length+' / 24 LOCKED';$('draftBtn').disabled=state.assignments.length===24}
function draft(){if(state.assignments.length===24)return;const mp=rnd(state.remainingManagers.length),managerIndex=state.remainingManagers[mp],m=managers[managerIndex];const compatible=state.remainingClubs.filter(i=>clubs[i].region===m.region);const clubIndex=compatible[rnd(compatible.length)],clubPos=state.remainingClubs.indexOf(clubIndex);const eligible=state.divisions.map((d,i)=>({d,i})).filter(x=>x.d[m.region].length<4);const pick=eligible[rnd(eligible.length)],division=pick.i+1;const a={seq:state.assignments.length+1,managerIndex,clubIndex,region:m.region,division};state.assignments.push(a);state.remainingManagers.splice(mp,1);state.remainingClubs.splice(clubPos,1);state.divisions[pick.i][m.region].push(a);const c=clubs[clubIndex];$('lock').innerHTML='<small>MATCH LOCKED · #'+a.seq+'</small><div class="manager">'+m.name+'</div><img src="'+crest(c.name)+'" alt=""><div class="clubname">'+c.name+'</div><div class="division">DIVISIONE '+division+' · '+(m.region==='SA'?'SUD AMERICA':'EUROPA')+'</div>';render()}
$('draftBtn').onclick=draft;render();
})();
</script>
</body>
</html>
