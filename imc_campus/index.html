<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IMC Campus · Italian Masters Club</title><meta name="theme-color" content="#142436">
<style>
*{box-sizing:border-box}
body{margin:0;background:#142436}
main{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.map{position:relative;width:min(100vw,52vh);width:min(100vw,52dvh);flex:none}
.photo{display:block;width:100%;height:auto;aspect-ratio:852/1846}
.crest{position:absolute;left:49.4%;top:85.5%;width:20.5%;height:auto;transform:translate(-50%,-50%);pointer-events:none}
.building{position:absolute;left:var(--x);top:var(--y);width:39%;height:9%;transform:translate(-50%,-50%)}
.building:first-of-type{width:57%;height:14%}
.building span{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
.building:focus-visible{outline:3px solid ivory;border-radius:4px}
@media(orientation:landscape){.map{width:calc(100vh * 852 / 1846);width:calc(100dvh * 852 / 1846)}}
</style></head>
<body>
<main><nav class="map" aria-label="Edifici del campus"><img class="photo" src="campus-arco.webp" width="852" height="1846" alt=""><img class="crest" src="/site-assets/images/imc-logo.png" alt="">
<a class="building" href="/imc_campus/one/" style="--x:50%;--y:25%"><span>ONE</span></a>
<a class="building" href="/imc_campus/nexus_lab/" style="--x:25%;--y:51%"><span>Nexus Lab</span></a>
<a class="building" href="/imc_campus/the_dugout/" style="--x:76%;--y:51%"><span>The Dugout</span></a>
<a class="building" href="/imc_campus/world_center/" style="--x:23%;--y:61.5%"><span>World Center</span></a>
<a class="building" href="/imc_campus/media_center/" style="--x:78%;--y:61.5%"><span>Media Center</span></a>
<a class="building" href="/imc_campus/trophy_room/" style="--x:21%;--y:73%"><span>Trophy Room</span></a>
<a class="building" href="/imc_campus/club_house/" style="--x:79%;--y:74%"><span>Club House</span></a>
</nav></main></body></html>
