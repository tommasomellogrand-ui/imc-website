name: Restore ATPF five programme banners
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-atpf-home.yml']
permissions:
  contents: read
concurrency:
  group: imc-public-website-production
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore only ATPF home and layout
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import io,os,ssl,json,urllib.request
          from ftplib import FTP_TLS
          files=json.loads('{"index.html": "<!doctype html><html lang=\\"it\\"><head><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\"><base href=\\"/nexus/alltoplayfor/\\"><title>ALL TO PLAY FOR | ALL TO PLAY FOR</title><link rel=\\"canonical\\" href=\\"https://www.italianmastersclub.it/nexus/alltoplayfor/\\"><link rel=\\"stylesheet\\" href=\\"style.css?v=12\\"><link rel=\\"stylesheet\\" href=\\"/nexus/assets/navigation.css\\"><link rel=\\"stylesheet\\" href=\\"programme-tabs.css?v=3\\"><link rel=\\"stylesheet\\" href=\\"banner.css?v=2\\"><link rel=\\"stylesheet\\" href=\\"programmes.css?v=20261023-pages1\\"><link rel=\\"stylesheet\\" href=\\"home-layout-v2.css?v=20261023-entry1\\"></head><body data-programme=\\"home\\"><main class=\\"atpf-pages\\"><header class=\\"programme-heading\\"><h1 class=\\"sr-only\\">ALL TO PLAY FOR</h1><img class=\\"section-banner\\" src=\\"assets/all-to-play-for-brand-v1.webp\\" alt=\\"ALL TO PLAY FOR\\" width=\\"2048\\" height=\\"683\\"></header><section class=\\"series-intro\\"><h2>Benvenuti in ALL TO PLAY FOR</h2><p>I programmi di approfondimento di Road To History: notizie, mercato, storie dai campi e il racconto delle partite. Scegli il tuo programma ed entra nel mondo GW001.</p></section><section class=\\"programme-grid\\" aria-label=\\"I cinque programmi\\"><a class=\\"programme-card card-rth-24\\" href=\\"/nexus/alltoplayfor/rth-24/\\"><img src=\\"assets/rth-24-v1.webp\\" alt=\\"\\" width=\\"2048\\" height=\\"683\\"><span>RTH 24 <b aria-hidden=\\"true\\">\\u2192</b></span></a><a class=\\"programme-card card-coffee-time\\" href=\\"/nexus/alltoplayfor/coffee-time/\\"><img src=\\"assets/coffee-time-v1.webp\\" alt=\\"\\" width=\\"2048\\" height=\\"683\\"><span>Coffee Time <b aria-hidden=\\"true\\">\\u2192</b></span></a><a class=\\"programme-card card-daytime\\" href=\\"/nexus/alltoplayfor/daytime/\\"><img src=\\"assets/daytime-v1.webp\\" alt=\\"\\" width=\\"2048\\" height=\\"683\\"><span>Daytime <b aria-hidden=\\"true\\">\\u2192</b></span></a><a class=\\"programme-card card-final-whistle\\" href=\\"/nexus/alltoplayfor/final-whistle/\\"><img src=\\"assets/final-whistle-v1.webp\\" alt=\\"\\" width=\\"2048\\" height=\\"683\\"><span>Final Whistle <b aria-hidden=\\"true\\">\\u2192</b></span></a><a class=\\"programme-card card-diretta-gol\\" href=\\"/nexus/alltoplayfor/diretta-gol/\\"><img src=\\"assets/diretta-gol-v1.webp\\" alt=\\"\\" width=\\"2048\\" height=\\"683\\"><span>Diretta Gol <b aria-hidden=\\"true\\">\\u2192</b></span></a></section><footer>ALL TO PLAY FOR \\u00b7 ROAD TO HISTORY \\u00b7 GW001</footer></main><script defer src=\\"/nexus/assets/navigation.js\\"></script><script defer src=\\"programmes.js?v=20261023-pages1\\"></script></body></html>", "home-layout-v2.css": "body[data-programme=home] .programme-grid{display:grid;grid-template-columns:1fr;gap:20px;margin:28px 0 48px}body[data-programme=home] .programme-card{display:block;line-height:0;border:1px solid #dce2eb;border-radius:14px;overflow:hidden;background:white}body[data-programme=home] .programme-card img{display:block;width:100%;height:auto;object-fit:contain}body[data-programme=home] .programme-card span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.series-intro{text-align:center;max-width:760px;margin:28px auto;padding:0 12px}.series-intro h2{font-size:clamp(20px,3vw,28px);margin:0 0 12px;color:#14213b}.series-intro p{font-size:16px;line-height:1.7;margin:0;color:#536075}@media(max-width:600px){body[data-programme=home] .programme-grid{gap:16px}.series-intro{margin:24px auto}.series-intro p{font-size:15px}}\\n.replay-select{display:flex;flex-wrap:wrap;gap:16px}.replay-select label{display:grid;gap:6px;font-weight:700}.replay-select select{min-height:44px;padding:8px;border:1px solid #c9d1de;border-radius:8px;background:white;color:#14213b;font:inherit}.replay-note{padding:16px;background:#fff;border-left:3px solid #bda063;border-radius:8px}\\n", "programmes.css": ".atpf-pages{max-width:1200px;margin:auto;padding:0 18px;color:#14213b;font-family:Inter,system-ui,sans-serif}\\n.atpf-pages [hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\\n.programme-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px 0}.programme-links a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 6px;border:1px solid #dce2eb;border-bottom:3px solid #bda063;border-radius:10px;color:#14213b;background:#fff;text-decoration:none;font-weight:750;text-align:center}.programme-links a[aria-current=page]{background:#14213b;color:#fff}\\n.programme-heading{margin:24px 0}.programme-heading .section-banner{display:block;width:100%;height:auto;object-fit:contain;border-radius:14px}\\n.programme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin:24px 0 48px}.programme-card{display:block;overflow:hidden;border:1px solid #dce2eb;border-radius:14px;background:#fff;color:#14213b;text-decoration:none;box-shadow:0 6px 20px #14213b0a}.programme-card img{display:block;width:100%;height:auto}.programme-card span{display:block;padding:16px;font-weight:750;text-align:center;border-top:1px solid #edf0f5}.programme-card:hover{border-color:#bda063}\\n.edition-heading{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin:18px 0;padding:16px 0;border-bottom:1px solid #e0e5ed}.edition-heading p{margin:0;font-weight:700}.edition-heading a,.programme-return a{color:#183d69;display:inline-flex;align-items:center;min-height:44px}.edition-archive{margin:38px 0;padding:24px;border:1px solid #dde3ec;border-radius:14px;background:#fff}.edition-archive nav{display:flex;flex-wrap:wrap;gap:12px}.archive-link{display:flex;align-items:center;min-height:48px;padding:10px 16px;color:#14213b;text-decoration:none;background:#f4f6f9;border-radius:9px}.news-waiting{padding:30px;text-align:center;background:#fff;border:1px solid #e1e5ec;border-radius:14px}.atpf-pages a:focus-visible{outline:3px solid #bda063;outline-offset:3px}\\nbody[data-programme=daytime] .daytime-edition-status{display:none}body[data-programme=daytime] .daytime-root{margin-top:0}.atpf-pages footer{margin:40px 0;text-align:center;color:#687387;font-size:12px}\\n@media(max-width:600px){.atpf-pages{padding:0 12px}.programme-grid{grid-template-columns:1fr;gap:16px}.programme-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.programme-links a{font-size:14px}.edition-archive{padding:18px}.edition-heading{font-size:14px}.programme-heading{margin:18px 0}.series-breadcrumb{flex-wrap:wrap}}\\n", "programmes.js": "(()=>{\'use strict\';\\n const base=\'/nexus/alltoplayfor/\',body=document.body;\\n // Retain old shared links while removing the shared date selector from the site.\\n if(body.dataset.programme===\'home\'){\\n  const u=new URL(location.href),program=u.searchParams.get(\'section\')||(u.hash.startsWith(\'#postmatch-\')?\'final-whistle\':null);\\n  if([\'coffee-time\',\'daytime\',\'final-whistle\',\'rth-24\'].includes(program)){\\n   fetch(\'programmes-catalog.json?v=20261023-pages1\').then(r=>r.json()).then(c=>{\\n    const rubric=program===\'daytime\'&&c.daytime.rubrics[u.searchParams.get(\'daytime\')]?u.searchParams.get(\'daytime\'):null;\\n    const entry=rubric?c.daytime.rubrics[rubric]:c[program],date=u.searchParams.get(\'date\');\\n    let target=base+program+\'/\'+(rubric?rubric+\'/\':\'\')+(entry.editions.includes(date)?date+\'/\':\'\');\\n    if(u.searchParams.has(\'club\'))target+=\'?\'+new URLSearchParams({club:u.searchParams.get(\'club\')});\\n    location.replace(target+u.hash);\\n   }).catch(()=>{});\\n  }\\n }\\n // Hash links in old edition renderers must stay on the current dedicated page.\\n document.addEventListener(\'click\',e=>{\\n  const a=e.target.closest(\'a\');if(!a||!a.getAttribute(\'href\')?.startsWith(\'#\'))return;\\n  e.preventDefault();const id=a.getAttribute(\'href\').slice(1),target=document.getElementById(id);\\n  if(target){history.replaceState(null,\'\',location.pathname+location.search+\'#\'+id);target.scrollIntoView({behavior:\'smooth\'})}\\n });\\n})();\\n"}')
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect('ftp.italianmastersclub.it',21,timeout=60)
          f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p()
          f.cwd('/www.italianmastersclub.it/nexus/alltoplayfor')
          for name in ['home-layout-v2.css','programmes.css','programmes.js','index.html']:
              data=files[name].encode();f.storbinary('STOR '+name,io.BytesIO(data))
              check=io.BytesIO();f.retrbinary('RETR '+name,check.write);assert check.getvalue()==data
              with urllib.request.urlopen('https://www.italianmastersclub.it/nexus/alltoplayfor/'+name+'?verify='+os.environ['GITHUB_SHA'],timeout=45) as r:assert r.read()==data
          f.quit()
          assert files['index.html'].count('class="programme-card ')==5
          print('Five programme banners restored and verified')
          PYCODE
