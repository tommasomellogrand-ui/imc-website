name: IMC DB 001-04 Adjust Legacy Drop Guard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/imc-db-001-04-enable-drop-table.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Database Manager guard
        run: python3 .github/scripts/imc-db-001-04-dbguard.py

      - name: Validate Database Manager
        run: |
          php -l __imc-sm-master/admin/database-manager/index.php
          git diff --check

      - name: Commit guard adjustment
        run: |
          set -euo pipefail
          git config user.name 'IMC Database Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add __imc-sm-master/admin/database-manager/index.php
          git commit -m 'IMC-DB-001-04: distinguish legacy imc_ tables from protected IMC identifiers'
          git push origin HEAD:main
