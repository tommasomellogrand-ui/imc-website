name: IMC ivory theme
on:
  push:
    branches: [main, imc-ivory-preview]
    paths: ['ops/ivory-theme-files.json', 'site-assets/css/imc-ivory.css', 'tests/ivory-*', '.github/workflows/imc-ivory-theme.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imc-ivory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser preview
        run: |
          npm install --prefix /tmp/ivory-browser --ignore-scripts playwright@1.51.1
          node --check roadtohistory/competitions/competition-view.js
          node --check roadtohistory/competitions/competition-catalog.js
          python3 tests/ivory-preview-server.py > /tmp/preview.log 2>&1 &
      - name: Verify mobile and desktop
        env:
          IMC_PLAYWRIGHT_PATH: /tmp/ivory-browser/node_modules/playwright
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/ivory-theme.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivory-previews
          path: /tmp/ivory-shots
      - name: Publish changed public theme files
        if: github.ref == 'refs/heads/main'
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,json,os,ssl,urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS,error_perm
          from concurrent.futures import ThreadPoolExecutor
          files=json.loads(Path('ops/ivory-theme-files.json').read_text())
          def upload(chunk):
              ctx=ssl.create_default_context();ctx.check_hostname=False
              ftp=FTP_TLS(context=ctx);ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
              ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);ftp.prot_p()
              for name in chunk:
                  p=Path(name);data=p.read_bytes()
                  try: ftp.cwd('/www.italianmastersclub.it/'+str(p.parent))
                  except error_perm as e:
                      if 'No such file or directory' not in str(e): raise
                      print('Not deployed: archived directory absent on server:',p.parent)
                      continue
                  ftp.storbinary('STOR '+p.name,io.BytesIO(data));check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
                  assert check.getvalue()==data,name
              ftp.quit()
          upload(['site-assets/css/imc-ivory.css'])
          files=[f for f in files if f!='site-assets/css/imc-ivory.css']
          with ThreadPoolExecutor(max_workers=4) as ex:list(ex.map(upload,[files[i::4] for i in range(4)]))
          for name in ['site-assets/css/imc-ivory.css','roadtohistory/competitions/competition-catalog.js','roadtohistory/competitions/competition-view.js','roadtohistory/competitions/view.html','roadtohistory/rth-champions-league/index.html','index.html']:
              with urllib.request.urlopen('https://www.italianmastersclub.it/'+name+'?ivory='+os.environ['GITHUB_SHA'],timeout=60) as r:
                  assert r.read()==Path(name).read_bytes(),name
          print('Public ivory theme deployed and live bytes verified')
          PY
