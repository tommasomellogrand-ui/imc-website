name: Create IMC Schedule repositories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-imc-schedule-repositories.yml'

permissions:
  contents: read

jobs:
  create-and-verify:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Create IMC Schedule repositories on Aruba MySQL 2 and 3
        shell: bash
        env:
          MYSQL_PWD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/create_imc_schedule.sql
          databases = ['Sql1956795_2', 'Sql1956795_3']
          cols = [
              ('game_world_id','VARCHAR(16)'),
              ('sm_fixture_id','BIGINT UNSIGNED'),
              ('source_competition_key','VARCHAR(255)'),
              ('sm_action','VARCHAR(64)'),
              ('sm_country','VARCHAR(128)'),
              ('sm_division','VARCHAR(128)'),
              ('competition_stage','VARCHAR(128)'),
              ('competition_round','VARCHAR(128)'),
              ('match_date','DATE'),
              ('match_time','TIME'),
              ('home_sm_team_id','BIGINT UNSIGNED'),
              ('home_name','VARCHAR(255)'),
              ('away_sm_team_id','BIGINT UNSIGNED'),
              ('away_name','VARCHAR(255)'),
              ('home_sm_manager_id','BIGINT UNSIGNED'),
              ('away_sm_manager_id','BIGINT UNSIGNED'),
              ('logged_manager_id','BIGINT UNSIGNED'),
              ('fingerprint','CHAR(64)'),
          ]
          def ddl(db, table, cols):
              body = ',\n  '.join(f'`{name}` {typ}' for name, typ in cols)
              return f'CREATE TABLE IF NOT EXISTS `{db}`.`{table}` (\n  {body}\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;'
          for db in databases:
              for i in range(1, 26):
                  gw=f'GW{i:03d}'
                  print(ddl(db, f'{gw}_IMC Schedule', cols))
          PY
          mysql --host="$MYSQL_HOST" --user="$MYSQL_USERNAME" < /tmp/create_imc_schedule.sql

      - name: Verify exact IMC Schedule structures
        shell: bash
        env:
          MYSQL_PWD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys
          host=os.environ['MYSQL_HOST']; user=os.environ['MYSQL_USERNAME']
          expected = [
              ('game_world_id','varchar(16)'),
              ('sm_fixture_id','bigint unsigned'),
              ('source_competition_key','varchar(255)'),
              ('sm_action','varchar(64)'),
              ('sm_country','varchar(128)'),
              ('sm_division','varchar(128)'),
              ('competition_stage','varchar(128)'),
              ('competition_round','varchar(128)'),
              ('match_date','date'),
              ('match_time','time'),
              ('home_sm_team_id','bigint unsigned'),
              ('home_name','varchar(255)'),
              ('away_sm_team_id','bigint unsigned'),
              ('away_name','varchar(255)'),
              ('home_sm_manager_id','bigint unsigned'),
              ('away_sm_manager_id','bigint unsigned'),
              ('logged_manager_id','bigint unsigned'),
              ('fingerprint','char(64)'),
          ]
          def q(sql):
              r=subprocess.run(['mysql',f'--host={host}',f'--user={user}','--batch','--skip-column-names','-e',sql],text=True,capture_output=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(r.returncode)
              return r.stdout.strip().splitlines()
          for db in ('Sql1956795_2','Sql1956795_3'):
              for i in range(1,26):
                  table=f'GW{i:03d}_IMC Schedule'
                  rows=q("SELECT CONCAT(column_name,'\\t',column_type) FROM information_schema.columns WHERE table_schema='%s' AND table_name='%s' ORDER BY ordinal_position"%(db,table))
                  got=[tuple(x.split('\t',1)) for x in rows]
                  if got != expected:
                      print('STRUCTURE_MISMATCH',db,table,got)
                      sys.exit(1)
              count=q("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='%s' AND table_type='BASE TABLE' AND table_name REGEXP '^GW(00[1-9]|01[0-9]|02[0-5])_IMC Schedule$'"%db)
              if count != ['25']:
                  print('TABLE_COUNT_MISMATCH',db,count)
                  sys.exit(1)
              print('VERIFIED',db,'25 IMC Schedule repositories')
          PY
