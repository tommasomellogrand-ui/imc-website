name: IMC Worlds
on:
  push:
    branches: [main]
    paths:
      - 'roadtohistory/**'
      - 'halloffamers/**'
      - 'kickoff/**'
      - 'sensiblesocceracademy/**'
      - 'subbuteosuperleague/**'
      - 'worldleague/**'
      - 'masterleagueworld/**'
      - 'scudetto/**'
      - 'scripts/verify-single-worlds.py'
      - 'scripts/single-worlds.json'
      - '.github/workflows/deploy-single-worlds.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: single-worlds-production
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      worlds: ${{ steps.select.outputs.worlds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          worlds=[w['slug'] for w in json.loads(Path('scripts/single-worlds.json').read_text())]
          before=os.environ.get('BEFORE','')
          if os.environ.get('EVENT_NAME')=='workflow_dispatch' or not before or set(before)=={'0'}:
              selected=worlds
          else:
              changed=subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines()
              common={'scripts/verify-single-worlds.py','scripts/single-worlds.json','.github/workflows/deploy-single-worlds.yml'}
              selected=worlds if any(p in common for p in changed) else [w for w in worlds if any(p.startswith(w+'/') for p in changed)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('worlds='+json.dumps(selected,separators=(',',':'))+'\n')
          print('Worlds selected:',selected)
          PY
  deploy:
    needs: detect
    if: ${{ needs.detect.outputs.worlds != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        world: ${{ fromJSON(needs.detect.outputs.worlds) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and JavaScript
        env:
          WORLD: ${{ matrix.world }}
        run: |
          find "$WORLD" -name '*.php' -exec php -l {} \;
          find "$WORLD" -name '*.js' -exec node --check {} \;
      - name: Publish world and verify file bytes
        env:
          WORLD: ${{ matrix.world }}
          GH_TOKEN: ${{ github.token }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,os,ssl,json,urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS,error_perm
          world=os.environ['WORLD'];root='/www.italianmastersclub.it/'
          ctx=ssl.create_default_context();ctx.check_hostname=False # Existing Aruba alias; CA verification retained.
          ftp=FTP_TLS(context=ctx);ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          files=[p for p in sorted(Path(world).rglob('*')) if p.is_file()]
          try:
              api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              def gh(path):
                  with urllib.request.urlopen(urllib.request.Request(api+path,headers=headers),timeout=30) as r:return json.load(r)
              runs=gh('/actions/workflows/deploy-single-worlds.yml/runs?status=success&branch=main&per_page=1')['workflow_runs']
              if runs:
                  diff=gh('/compare/'+runs[0]['head_sha']+'...'+os.environ['GITHUB_SHA'])
                  if diff.get('status') in ['ahead','identical'] and len(diff.get('files',[]))<300:
                      files=[Path(f['filename']) for f in diff.get('files',[]) if f['filename'].startswith(world+'/') and Path(f['filename']).is_file()]
              print('Files to publish:',len(files),flush=True)
          except Exception:print('Full publication',flush=True)
          managed=set(json.loads(Path('ops/world-engine-files.json').read_text()))
          files=[p for p in files if p.as_posix() not in managed]
          previous=None
          for p in files:
              if not p.is_file():continue
              parent=root+p.parent.as_posix()
              if previous!=parent:
                  ftp.cwd('/')
                  for part in parent.strip('/').split('/'):
                      try:ftp.cwd(part)
                      except error_perm:ftp.mkd(part);ftp.cwd(part)
                  previous=parent
              data=p.read_bytes();ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              assert check.getvalue()==data,'Byte verification failed: '+str(p)
          ftp.quit();print('Published and byte verified',world)
          PY
      - name: Verify live pages, profiles and world data
        if: ${{ matrix.world != 'roadtohistory' }}
        run: python3 scripts/verify-single-worlds.py '${{ matrix.world }}'
      - name: Verify IMC001 live data and pages
        if: ${{ matrix.world == 'roadtohistory' }}
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://www.italianmastersclub.it/roadtohistory/'
          for path in ('','matchday/','clubs/','competitions/','transfers/','players/'):
              with urllib.request.urlopen(base+path,timeout=90) as r:
                  assert r.status==200 and r.read(),path
          for path in ('clubs/directory.php','competitions/catalog.php','matchday/data.php','transfers/data.php?limit=1'):
              with urllib.request.urlopen(base+path,timeout=90) as r:
                  data=json.load(r)
                  assert data.get('ok'),(path,data.get('error'))
          print('IMC001 verified')
          PY
