name: Deploy Road To History
on:
  push:
    branches: [main]
    paths:
      - 'roadtohistory/**'
      - '.github/workflows/deploy-roadtohistory.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: roadtohistory-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate club PHP and JavaScript
        run: |
          for file in roadtohistory/clubs/*.php roadtohistory/nations/*.php roadtohistory/competitions/*.php roadtohistory/transfers/*.php roadtohistory/players/*.php; do php -l "$file"; done
          for file in roadtohistory/nations/*.js roadtohistory/competitions/*.js roadtohistory/transfers/*.js roadtohistory/players/*.js; do node --check "$file"; done
          find roadtohistory/alltoplayfor -name '*.php' -exec php -l {} \;
          find roadtohistory/alltoplayfor -name '*.js' -exec node --check {} \;
          for file in roadtohistory/imc-cups/*.php; do php -l "$file"; done
          for file in roadtohistory/imc-cups/*.js; do node --check "$file"; done
          php -l roadtohistory/trophyroom/data.php
          node --check roadtohistory/trophyroom/trophy-room.js
          node --check roadtohistory/trophyroom/page.js
          php -l roadtohistory/matchday/data.php
          node --check roadtohistory/matchday/home.js
          node --check roadtohistory/clubs/directory.js
          node --check roadtohistory/clubs/detail.js
          node --check roadtohistory/managers/manager-profile.js
      - name: Publish only Road To History and verify bytes
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, secrets, hashlib, time, urllib.request, json, subprocess
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          files=[str(p.relative_to('roadtohistory')) for p in Path('roadtohistory').rglob('*') if p.is_file()]
          # Compare with the latest verified deployment, including intervening non-site commits.
          try:
              api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              def gh(path):
                  with urllib.request.urlopen(urllib.request.Request(api+path,headers=headers),timeout=30) as response:return json.load(response)
              runs=gh('/actions/workflows/deploy-roadtohistory.yml/runs?status=success&branch=main&per_page=1')['workflow_runs']
              if runs:
                  baseline=runs[0]['head_sha']
                  diff=gh('/compare/'+baseline+'...'+os.environ['GITHUB_SHA'])
                  if diff.get('status') in ['ahead','identical'] and len(diff.get('files',[]))<300:
                      files=[str(Path(f['filename']).relative_to('roadtohistory')) for f in diff.get('files',[]) if f['filename'].startswith('roadtohistory/') and Path(f['filename']).is_file()]
                      print('Incremental deployment:',len(files),'changed files',flush=True)
          except Exception:
              print('Using full deployment',flush=True)
          root='/www.italianmastersclub.it/roadtohistory'
          ctx=ssl.create_default_context()
          ctx.check_hostname=False # Existing Aruba FTPS alias policy; CA validation remains enabled.
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          last_directory=None
          def directory(path):
              global last_directory
              if last_directory==path:return
              ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
              last_directory=path
          for name in files:
              p=Path('roadtohistory')/name
              data=p.read_bytes()
              assert data, str(p)
              directory(root+'/'+str(Path(name).parent))
              ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              assert check.getvalue()==data,'Byte verification failed: '+name
              print('Verified:',name,flush=True)
          # Aruba's official HiSpeed Cache purger uses localhost:8889/purge + Host.
          # Limit this temporary authenticated helper to the three home URLs.
          token=secrets.token_hex(32)
          helper='cache-update-'+secrets.token_hex(16)+'.php'
          php="""<?php
          header('Cache-Control: no-store, no-cache, must-revalidate');
          header('Content-Type: application/json');
          if ($_SERVER['REQUEST_METHOD'] !== 'POST' || time() > DEADLINE ||
              !hash_equals('TOKENHASH', hash('sha256', $_SERVER['HTTP_X_DEPLOY_TOKEN'] ?? ''))) {
              http_response_code(403); exit;
          }
          $out=[];
          foreach (['/roadtohistory/', '/roadtohistory/index.html', '/roadtohistory/index.php'] as $path) {
              $c=curl_init('http://127.0.0.1:8889/purge'.$path);
              curl_setopt_array($c, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>10,
                  CURLOPT_HTTPHEADER=>['Host: www.italianmastersclub.it']]);
              curl_exec($c);
              $out[$path]=curl_getinfo($c, CURLINFO_HTTP_CODE);
              curl_close($c);
          }
          echo json_encode($out);
          """.replace('DEADLINE',str(int(time.time())+600)).replace('TOKENHASH',hashlib.sha256(token.encode()).hexdigest())
          directory(root)
          try:
              ftp.storbinary('STOR '+helper,io.BytesIO(php.encode()))
              request=urllib.request.Request('https://www.italianmastersclub.it/roadtohistory/'+helper,
                  data=b'',headers={'X-Deploy-Token':token},method='POST')
              with urllib.request.urlopen(request,timeout=45) as response:
                  print('Home cache invalidation:',response.read().decode())
          finally:
              ftp.delete(helper)
              ftp.quit()
          print('Published and byte verified Road To History mockup only.')
          PY
      - name: Verify public page and artwork
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib
          from pathlib import Path
          base='https://www.italianmastersclub.it/roadtohistory/'
          for name in ['assets/notte-allo-stadio.webp','index.html','managers/index.html','managers/profile.html','managers/directory.js','clubs/index.html','clubs/detail.html','clubs/directory.js','clubs/detail.js','competitions/index.html','competitions/view.html','competitions/competition-catalog.js','competitions/competition-view.js','competitions/match.html','transfers/index.html','transfers/cards.js','transfers/transfers.js','transfers/style.css','players/index.html','players/profile.html','players/directory.js','players/profile.js','players/style.css']:
              with urllib.request.urlopen(base+name+'?release=${{ github.sha }}',timeout=60) as response:
                  assert response.status==200
                  data=response.read()
              assert hashlib.sha256(data).digest()==hashlib.sha256((Path('roadtohistory')/name).read_bytes()).digest(),name
          with urllib.request.urlopen(base,timeout=60) as response:
              assert response.status==200
              assert 'no-store' in response.headers.get('Cache-Control','')
              html=response.read()
              assert b'href="/theroadalmanac/"' in html and b'href="/roadtohistory/competitions/?division=1"' in html
          print('Public URL and exact artwork verified.')
          PY


      - name: Verify dedicated club data
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://www.italianmastersclub.it/roadtohistory/clubs/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=60) as r:
                  assert r.status==200
                  d=json.load(r)
                  assert d['ok'],d
                  return d
          d=get('directory.php')
          assert d['game_world_id']=='GW001' and len(d['rows'])>0
          cid=d['rows'][0]['world_id']
          detail=get('detail.php?id='+str(cid)+'&world=GW002')
          assert detail['game_world_id']=='GW001' and detail['team']
          get('stats.php?sm_club='+str(cid))
          get('roster.php?sm_club='+str(cid))
          print('Dedicated clubs directory, detail, stats and roster verified')
          PY

      - name: Verify dedicated competition data
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://www.italianmastersclub.it/roadtohistory/competitions/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=90) as r:
                  d=json.load(r)
                  assert d.get('ok'),d
                  return d
          d=get('catalog.php?world=GW002&season=2')
          assert d['game_world_id']=='GW001' and d['rows']
          key=urllib.parse.quote(d['rows'][0]['competition_key'])
          for endpoint in ['results','schedule','standings']:
              get(endpoint+'.php?season=2&competition='+key)
          get('match-report.php?season=2&competition='+key+'&mode=stats')
          print('Road to History competition catalog, results, schedule, standings and statistics verified')
          PY

      - name: Verify Road to History transfers
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://www.italianmastersclub.it/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=90) as response:
                  d=json.load(response)
                  assert d['ok'],d
                  return d
          d=get('roadtohistory/transfers/data.php?world=GW002')
          source=get('nexus/transfers/index.php?world=GW001')
          assert d['game_world_id']=='GW001'
          assert len(d['rows'])==len(source['rows'])
          print('Dedicated transfers verified against Nexus source:',len(d['rows']))
          PY

      - name: Verify dedicated Player Codex
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://www.italianmastersclub.it/roadtohistory/players/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=120) as response:
                  d=json.load(response)
                  assert d['ok'],d
                  return d
          d=get('world.php?world=GW002')
          assert d['game_world_id']=='GW001' and d['rows']
          p=get('profile.php?world=GW002&player='+str(d['rows'][0]['player_id']))
          assert p['world']=='GW001' and p['player']
          assert 'matches' in p and 'transfers' in p and 'rating_history' in p
          print('Player Codex and dedicated player profile verified')
          PY

      - name: Verify All To Play For pages and feeds
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          from pathlib import Path
          base='https://www.italianmastersclub.it/roadtohistory/alltoplayfor/'
          root=Path('roadtohistory/alltoplayfor')
          for file in root.rglob('*.html'):
              name=str(file.relative_to(root))
              with urllib.request.urlopen(base+name+'?release=${{ github.sha }}',timeout=90) as r:
                  assert r.status==200
                  assert hashlib.sha256(r.read()).digest()==hashlib.sha256(file.read_bytes()).digest(),name
          for path in ['programmes-catalog.json','rth-24/flash-news.json','context.php','coffee-source.php?date=2026-11-03']:
              with urllib.request.urlopen(base+path,timeout=120) as r:
                  d=json.load(r)
                  assert d and d.get('ok',True),path
          print('All programme pages, archives, Club News and editorial feeds verified')
          PY

      - name: Verify dedicated IMC cups
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          from pathlib import Path
          base='https://www.italianmastersclub.it/roadtohistory/'
          for slug in ['champions-league','europa-league','conference-league','club-world-cup']:
              path='rth-'+slug+'/index.html'
              with urllib.request.urlopen(base+path+'?release=${{ github.sha }}',timeout=90) as r:
                  assert hashlib.sha256(r.read()).digest()==hashlib.sha256((Path('roadtohistory')/path).read_bytes()).digest(),path
              key='IMC001|IMC|'+slug.replace('-','')
              for endpoint in ['results.php','schedule.php']:
                  with urllib.request.urlopen(base+'competitions/'+endpoint+'?season=2&competition='+key,timeout=90) as r:
                      d=json.load(r)
                      assert d.get('ok') and d.get('competition_key')==key
              legacy='GW001_IMC_'+slug.upper().replace('-','_')
              with urllib.request.urlopen(base+'competitions/results.php?season=2&competition='+legacy,timeout=90) as r:
                  d=json.load(r)
                  assert d.get('ok') and d.get('competition_key')==key
          print('Four IMC cup pages and database-backed data endpoints verified')
          PY

      - name: Verify Nations pages and data
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib
          from pathlib import Path
          base='https://www.italianmastersclub.it/roadtohistory/nations/'
          for name in ['index.html','detail.html','directory.js','detail.js','style.css']:
              with urllib.request.urlopen(base+name+'?release=${{ github.sha }}',timeout=90) as r:
                  assert hashlib.sha256(r.read()).digest()==hashlib.sha256((Path('roadtohistory/nations')/name).read_bytes()).digest(),name
          def get(path):
              with urllib.request.urlopen(base+path,timeout=90) as r:
                  d=json.load(r)
                  assert d.get('ok'),d
                  assert d.get('game_world_id')=='GW001',d
                  return d
          d=get('directory.php?world=GW002&type=clubs')
          assert d['rows']
          team=next((r for r in d['rows'] if r.get('manager',{} ) and r['manager'].get('is_imc')),d['rows'][0])
          cid=str(team['world_id'])
          detail=get('detail.php?id='+cid+'&world=GW002&type=club')
          assert detail['type']=='nation' and detail['team']
          get('stats.php?sm_club='+cid)
          get('matches.php?sm_club='+cid)
          roster=get('roster.php?sm_club='+cid)
          assert roster['roster_source']=='match_reports_history'
          assert len({str(p['player_id']) for p in roster['rows']})==len(roster['rows'])
          assert 'TRANSFERS' not in Path('roadtohistory/nations/detail.js').read_text().split(":['OVERVIEW'")[1].split(';')[0]
          print('Nations pages, fixed world/type, statistics, matches and historical roster verified')
          PY

      - name: Verify home Matchday
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          from pathlib import Path
          base='https://www.italianmastersclub.it/roadtohistory/'
          for path in ['matchday/home.js','matchday/home.css']:
              with urllib.request.urlopen(base+path+'?release=${{ github.sha }}',timeout=90) as r:
                  assert hashlib.sha256(r.read()).digest()==hashlib.sha256((Path('roadtohistory')/path).read_bytes()).digest(),path
          def get(mode,date=None):
              url=base+'matchday/data.php?world=GW002&mode='+mode
              if date:url+='&date='+date
              with urllib.request.urlopen(url,timeout=90) as r:
                  d=json.load(r)
                  assert d.get('ok') and d['game_world_id']=='GW001' and d['mode']==mode,d
                  return d
          for mode in ['results','schedule']:
              d=get(mode)
              assert d['dates']==sorted(set(d['dates']),reverse=mode=='results')
              for r in d['rows']:
                  assert r['match_date'][:10]==d['date']
                  assert r.get('competition_name')
                  if mode=='results':
                      assert r['home_score'] is not None and r['away_score'] is not None
                  else:assert r['match_date'][:10]>=d['today']
              ids=[(r['competition_key'],str(r['sm_fixture_id'])) for r in d['rows'] if r.get('sm_fixture_id')]
              assert len(ids)==len(set(ids))
              if len(d['dates'])>1:
                  other=get(mode,d['dates'][1])
                  assert other['date']==d['dates'][1]
              print(mode+': date navigation, data scope and fixtures verified')
          with urllib.request.urlopen(base,timeout=90) as r:
              html=r.read().decode()
              assert 'matchday/home.js' in html and 'I risultati arriveranno qui' not in html
          PY

      - name: Verify Road to History Trophy Room
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          from pathlib import Path
          base='https://www.italianmastersclub.it/roadtohistory/trophyroom/'
          for name in ['index.html','style.css','trophy-room.js','page.js']:
              with urllib.request.urlopen(base+name+'?release=${{ github.sha }}',timeout=90) as r:
                  assert hashlib.sha256(r.read()).digest()==hashlib.sha256((Path('roadtohistory/trophyroom')/name).read_bytes()).digest(),name
          with urllib.request.urlopen(base+'data.php?world=GW002',timeout=90) as r:
              d=json.load(r)
              assert d['ok'] and d['game_world_id']=='GW001'
              assert isinstance(d['rows'],list)
              imc=[x for x in d['competitions'] if x['competition_group']=='IMC']
              assert len(imc)>=4,imc
              assert all(x['nexus_view'] for x in imc)
              for row in d['rows']:
                  assert row['game_world_id']=='GW001'
                  assert 'winner_manager_id' in row and 'winner_logo_url' in row
              print('Trophy Room live data verified:',len(d['rows']),'awards')
          with urllib.request.urlopen(base,timeout=90) as r:
              assert r.status==200 and 'Trophy Room' in r.read().decode()
          PY
