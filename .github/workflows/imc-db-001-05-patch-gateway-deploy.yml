name: IMC DB 001-05 Patch Gateway Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/imc-db-001-05-patch-gateway-deploy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch deploy workflow
        run: python3 .github/scripts/imc-db-001-05-fix-gateway-deploy.py
      - name: Validate workflow diff
        run: git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'IMC Database Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy-website-aruba.yml
          git commit -m 'IMC-DB-001-05: deploy gateway database dependency'
          git push origin HEAD:main
