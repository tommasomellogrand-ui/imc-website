name: Remove legacy minisites from Aruba
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-minisites.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remove-legacy-minisites
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only obsolete GW001-GW009 minisite directories
        env:
          FTP_USER: ${{ secrets.ARUBA_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          root='/www.italianmastersclub.it/minisite'
          targets=[f'GW{i:03d}' for i in range(1,10)]
          ctx=ssl.create_default_context()
          ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx,timeout=60)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASS'])
          ftp.prot_p()
          ftp.cwd(root)
          def remove_tree(path):
              for name, facts in ftp.mlsd(path):
                  if name in ('.','..'): continue
                  child=path.rstrip('/')+'/'+name
                  if facts.get('type')=='dir':
                      remove_tree(child)
                      ftp.rmd(child)
                  else:
                      ftp.delete(child)
          for name in targets:
              path=root+'/'+name
              try:
                  ftp.cwd(path)
              except error_perm:
                  print(name,'already absent',flush=True)
                  continue
              ftp.cwd(root)
              remove_tree(path)
              ftp.rmd(path)
              print(name,'deleted',flush=True)
          for name in targets:
              try:
                  ftp.cwd(root+'/'+name)
              except error_perm:
                  print(name,'verified absent',flush=True)
              else:
                  raise RuntimeError('Directory still exists: '+name)
          ftp.quit()
          PY
