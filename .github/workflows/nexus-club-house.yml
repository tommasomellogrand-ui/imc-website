name: Nexus Club House
on:
  push:
    branches: [main, nexus-admin-assignments]
    paths: ['nexus/club-house/**', 'tests/nexus-club-house*', '.github/workflows/nexus-club-house.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-club-house
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: club-house-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pclub-house-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_TEST_PASSWORD: club-house-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify Match Report-only engine
        run: |
          for file in nexus/club-house/*.php; do php -l "$file"; done
          php tests/nexus-club-house.php
          php tests/nexus-club-house-ranking.php
          node --check nexus/club-house/club-house.js
          node --check nexus/assets/home.js
      - name: Verify tabs and responsive layout
        run: |
          mkdir -p /tmp/club-house-test
          npm install --prefix /tmp/club-house-test --package-lock-only --ignore-scripts playwright@1.62.1
          npm ci --prefix /tmp/club-house-test --ignore-scripts
          NEXUS_PLAYWRIGHT_PATH=/tmp/club-house-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-club-house-ui.cjs
          NEXUS_PLAYWRIGHT_PATH=/tmp/club-house-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-club-house-entry.cjs
          NEXUS_PLAYWRIGHT_PATH=/tmp/club-house-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-club-house-ranking.cjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify all ten worlds (read only)
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, json, urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          root='/www.italianmastersclub.it/'
          try: ftp.mkd(root+'nexus/club-house')
          except error_perm: ftp.cwd(root+'nexus/club-house')
          files=[*Path('nexus/club-house').glob('*'),Path('nexus/assets/home.js'),Path('nexus/index.html')]
          for local in files:
              if not local.is_file(): continue
              ftp.cwd(root+local.parent.as_posix()); data=local.read_bytes()
              ftp.storbinary('STOR '+local.name,io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary('RETR '+local.name,check.write)
              if check.getvalue()!=data: raise RuntimeError('Upload mismatch: '+str(local))
          ftp.quit()
          base='https://www.italianmastersclub.it/nexus/club-house/'
          def get(query=''):
              with urllib.request.urlopen(base+'data.php'+query,timeout=60) as r: return json.load(r)
          meta=get(); assert meta['ok'] and meta['managers']
          ids={m['manager_id'] for m in meta['managers']}
          for i in range(1,11):
              gw=f'GW{i:03d}'; d=get('?world='+gw+'&manager=MNG001')
              assert d['ok'] and d['scope']=='club' and d['source']=='Match Report'
              assert not d['trophy_error'], gw+' trophy read failed'
              assert len(d['matches'])==d['managers']['MNG001']['stats']['played']
              assert len({m['fixture_id'] for m in d['matches']})==len(d['matches'])
              for m in d['matches']:
                  assert m['identity_source']=='id'
                  assert m['opponent_id'] is None or (m['opponent_id'] in ids and m['opponent_identity_source']=='id')
              for v in d['managers'].values():
                  s=v['stats']; assert s['played']==s['won']+s['drawn']+s['lost']; assert s['played']==s['matched_by_id']; assert s['matched_by_name']==0
                  r=v['ranking']; weight=3 if gw in ['GW001','GW008'] else 2 if gw in ['GW002','GW003'] else 1
                  assert r['version']==5 and r['weight']==weight and r['match_points']==(s['played']+0.5*s['won']-0.5*s['lost'])
                  assert r['trophy_points']==r['trophy_base']*weight and r['total']==r['match_points']+r['trophy_points']
                  assert r['unscored_trophies']==0, (gw, r['awards'])
                  assert len(r['awards'])==v['trophies']
              print(gw,'OK',sum(v['stats']['matched_by_id'] for v in d['managers'].values()),'by ID;',sum(v['stats']['matched_by_name'] for v in d['managers'].values()),'by name;',len(d['matches']),'MNG001 matches')
          with urllib.request.urlopen(base,timeout=30) as r: assert 'Club House' in r.read().decode()
          print('Club House online; all ten GW verified without database writes')
          PY
