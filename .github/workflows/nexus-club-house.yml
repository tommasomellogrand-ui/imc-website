name: Nexus Club House
on:
  push:
    branches: [main, nexus-admin-assignments]
    paths: ['nexus/club-house/**', 'tests/nexus-club-house*', '.github/workflows/nexus-club-house.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-club-house
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: club-house-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pclub-house-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_TEST_PASSWORD: club-house-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify Club House and Results-only ranking
        run: |
          for file in nexus/club-house/*.php; do php -l "$file"; done
          php tests/nexus-club-house.php
          php tests/nexus-club-house-career-results.php
          php tests/nexus-club-house-national.php
          php tests/nexus-club-house-ranking.php
          node --check nexus/club-house/club-house.js
          node --check nexus/assets/home.js
      - name: Verify tabs and responsive layout
        run: |
          mkdir -p /tmp/club-house-test
          npm install --prefix /tmp/club-house-test --package-lock-only --ignore-scripts playwright@1.62.1
          npm ci --prefix /tmp/club-house-test --ignore-scripts
          NEXUS_PLAYWRIGHT_PATH=/tmp/club-house-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-club-house-ui.cjs
          NEXUS_PLAYWRIGHT_PATH=/tmp/club-house-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-club-house-entry.cjs
          NEXUS_PLAYWRIGHT_PATH=/tmp/club-house-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-club-house-ranking.cjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify all ten worlds (read only)
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, json, urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          root='/www.italianmastersclub.it/'
          try: ftp.mkd(root+'nexus/club-house')
          except error_perm: ftp.cwd(root+'nexus/club-house')
          files=[*Path('nexus/club-house').glob('*'),Path('nexus/assets/h2h.js'),Path('nexus/assets/home.js'),Path('nexus/index.html')]
          files=sorted(files,key=lambda p:p.suffix=='.html')
          for local in files:
              if not local.is_file(): continue
              ftp.cwd(root+local.parent.as_posix()); data=local.read_bytes()
              ftp.storbinary('STOR '+local.name,io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary('RETR '+local.name,check.write)
              if check.getvalue()!=data: raise RuntimeError('Upload mismatch: '+str(local))
          ftp.quit()
          base='https://www.italianmastersclub.it/nexus/club-house/'
          def get(query=''):
              with urllib.request.urlopen(base+'data.php'+query,timeout=60) as r: return json.load(r)
          meta=get(); assert meta['ok'] and meta['managers']
          ids={m['manager_id'] for m in meta['managers']}
          national_total=0; report_id_total=0
          for i in range(1,11):
              gw=f'GW{i:03d}'; d=get('?world='+gw+'&manager=MNG001')
              assert d['ok'] and d['scope']=='club' and d['source']=='Match Report'
              assert not d['trophy_error'], gw+' trophy read failed'
              coverage=d['national_ranking_coverage']; report_id_total+=coverage['report_manager_sides']
              assert coverage['manager_source']=='Results'
              assert d['ranking_source']=='Results' and not d['ranking_error']
              assert d['ranking_coverage']['manager_source']=='Results'
              print(gw,'ranking report manager IDs (must be zero):',coverage['report_manager_sides'],'Results manager IDs:',coverage['result_manager_sides'],'MNG001 national games:',d['managers']['MNG001']['national_stats']['played'])
              assert len(d['matches'])==d['managers']['MNG001']['stats']['played']
              assert len({m['fixture_id'] for m in d['matches']})==len(d['matches'])
              for m in d['matches']:
                  assert m['identity_source']=='id'
                  assert m['opponent_id'] is None or (m['opponent_id'] in ids and m['opponent_identity_source']=='id')
              for v in d['managers'].values():
                  s=v['stats']; assert s['played']==s['won']+s['drawn']+s['lost']; assert s['played']==s['matched_by_id']; assert s['matched_by_name']==0
                  r=v['ranking']; weight=3 if gw in ['GW001','GW008'] else 2 if gw in ['GW002','GW003'] else 1
                  n=v['national_stats']; national_total+=n['played']
                  assert n['played']==n['won']+n['drawn']+n['lost']==n['matched_by_id']
                  assert not d['national_ranking_error'] and d['national_ranking_coverage']['source']=='Results'
                  assert r['version']==8 and r['weight']==weight
                  rs=v['ranking_club_stats']; assert rs['played']==rs['won']+rs['drawn']+rs['lost']==rs['matched_by_id']
                  assert r['club_points']==(rs['played']+0.5*rs['won']-0.5*rs['lost'])*weight
                  assert r['national_points']==(n['played']+0.5*n['won']-0.5*n['lost'])*weight
                  assert r['match_points']==r['club_points']+r['national_points']
                  assert r['trophy_points']==r['trophy_base']*weight and r['total']==r['match_points']+r['trophy_points']
                  assert r['unscored_trophies']==0, (gw, r['awards'])
                  assert len(r['awards'])==v['trophies']
              print(gw,'OK',sum(v['stats']['matched_by_id'] for v in d['managers'].values()),'by ID;',sum(v['stats']['matched_by_name'] for v in d['managers'].values()),'by name;',len(d['matches']),'MNG001 matches')
          assert report_id_total==0, 'Ranking must not use manager IDs from reports'
          assert national_total>0, 'No attributed national Results'
          print('National Results manager appearances included:',national_total)
          for i in range(1,11):
              gw=f'GW{i:03d}'
              national=get('?world='+gw+'&manager=MNG001&scope=national_team')
              global_data=get('?world='+gw+'&manager=MNG001&scope=global')
              club=get('?world='+gw+'&manager=MNG001&scope=club')
              assert national['source']=='Results' and national['national_coverage']['identity_source']=='assignment_dates'
              n=national['managers']['MNG001']['stats']; c=club['managers']['MNG001']['stats']; g=global_data['managers']['MNG001']['stats']
              assert n['played']==len(national['matches'])==n['matched_by_assignment']
              assert len({m['fixture_id'] for m in national['matches']})==n['played']
              for key in ['played','won','drawn','lost','gf','ga','penalty_won','penalty_lost']:
                  assert g[key]==n[key]+c[key], (gw,key,g,c,n)
              for m in national['matches']:
                  assert m['source']=='Results' and m['identity_source']=='assignment_dates'
                  matches=[a for a in national['assignments'] if a['game_world_id']==gw and a['assignment_type']=='national_team' and str(national['nations'].get(str(a['national_team_id']),{}).get('world_id',a['national_team_id']))==str(m['team_id']) and a['start_date'] and a['start_date']<=m['date'] and (not a['end_date'] or a['end_date']>=m['date'])]
                  assert matches,(gw,m)
              opponents={m['opponent_id'] for m in national['matches'] if m['opponent_id']}
              if opponents:
                  opponent=sorted(opponents)[0]
                  with urllib.request.urlopen(base+'h2h-detail.php?manager=MNG001&opponent='+opponent+'&worlds='+gw+'&scope=national_team',timeout=90) as response: h=json.load(response)
                  assert h['ok'] and h['source']=='Results'
                  expected=[m for m in national['matches'] if m['opponent_id']==opponent]
                  assert h['summary']['played']==len(expected)==len(h['matches'])
                  assert h['summary']['reports']==0 and h['team_reports']==0
                  assert all(m['identity_source']=='assignment_dates' for m in h['matches'])
              print('ASSIGNMENT_CHECK',gw,'MNG001',n['played'],'Results;',c['played'],'club;',g['played'],'global; conflicts',national['national_coverage']['ambiguous_sides'])
          with urllib.request.urlopen(base,timeout=30) as r: assert 'Club House' in r.read().decode()
          for i in range(1,11):
              gw=f'GW{i:03d}'
              result=get('?world='+gw+'&manager=MNG001&scope=global&source=results')
              assert result['source']=='Results' and result['coverage']['manager_source']=='Results'
              assert len(result['matches'])==result['managers']['MNG001']['stats']['played']
              for value in result['managers'].values():
                  stats=value['stats']; club=value['ranking_club_stats']; nation=value['national_stats']
                  assert stats['played']==stats['won']+stats['drawn']+stats['lost']==stats['matched_by_id']
                  for key in ['played','won','drawn','lost','gf','ga']:
                      assert stats[key]==club[key]+nation[key], (gw,key,stats,club,nation)
              assert all(m['source']=='Results' and m['identity_source']=='id' for m in result['matches'])
              print('CAREER_RESULTS',gw,result['managers']['MNG001']['stats']['played'])
          print('Club House online; all ten GW verified without database writes')
          PY
