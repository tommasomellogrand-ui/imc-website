name: Deploy minisite GW005 master

on:
  push:
    branches: [main]
    paths:
      - 'minisite/GW005/**'
      - '.github/workflows/deploy-minisite-gw005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GW005 package
        shell: bash
        run: |
          set -euo pipefail
          test -s minisite/GW005/index.html
          test -s minisite/GW005/config.js
          test -s minisite/GW005/pilot-theme.css
          test -s minisite/GW005/app.js
          test -s minisite/GW005/.htaccess
          grep -Fq '/minisite/shared/app-core.js' minisite/GW005/index.html
          grep -Fq "id:'GW005'" minisite/GW005/config.js
          grep -Fq "window.IMC_MINISITE_DATA" minisite/GW005/app.js

      - name: Upload GW005 to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; port=21
          remote='/www.italianmastersclub.it/minisite/GW005'
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect(host,port,timeout=60); ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          def ensure(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)
          ensure(remote)
          for name in ['index.html','config.js','pilot-theme.css','app.js','.htaccess']:
              local=Path('minisite/GW005')/name
              data=local.read_bytes()
              with local.open('rb') as f: ftp.storbinary(f'STOR {name}',f)
              check=io.BytesIO(); ftp.retrbinary(f'RETR {name}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'FTP verify failed: {name}')
              print(f'GW005 {name}: {len(data)} bytes verified')
          ftp.quit()
          PY

      - name: Verify live GW005
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          base='https://www.italianmastersclub.it/minisite/GW005/'
          html=$(curl -fsSL --max-time 30 "${base}?verify=${GITHUB_SHA}")
          printf '%s' "$html" | grep -Fq 'Hall Of Famers · GW005'
          curl -fsSIL --max-time 30 "${base}app.js?verify=${GITHUB_SHA}" | grep -Eq '^HTTP/.* 200'
          curl -fsSIL --max-time 30 "${base}pilot-theme.css?verify=${GITHUB_SHA}" | grep -Eq '^HTTP/.* 200'
          headers=$(curl -fsSIL --max-time 30 "${base}?verify_headers=${GITHUB_SHA}")
          printf '%s\n' "$headers" | grep -Eqi '^cache-control:.*(no-store|no-cache|max-age=0)'
          echo 'GW005 live verification passed.'
