name: Deploy Last Man Standing Demo to Aruba

on:
  push:
    branches: [main]
    paths:
      - 'last-man-standing/**'
      - '.github/workflows/deploy-last-man-standing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: last-man-standing-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and prepare Last Man Standing demo
        shell: bash
        run: |
          set -euo pipefail
          test -s last-man-standing/index.html
          test -s last-man-standing/status-patch.js
          grep -q '<title>Last Man Standing' last-man-standing/index.html
          grep -q 'Tommaso Mello' last-man-standing/index.html
          grep -q 'losingPicksG1' last-man-standing/status-patch.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('last-man-standing/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="status-patch.js?v=${{ github.sha }}"></script>'
          if marker not in s:
              s=s.replace('</body>',marker+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Upload Last Man Standing demo to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host='ftp.italianmastersclub.it'
          port=21
          remote='/www.italianmastersclub.it/last-man-standing'
          username=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']

          ctx=ssl.create_default_context()
          ctx.check_hostname=False

          ftp=None
          last=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try:
                  c.connect(host,port,timeout=60)
                  c.login(username,password)
                  c.prot_p()
                  c.set_pasv(True)
                  ftp=c
                  break
              except Exception as e:
                  last=e
                  try: c.close()
                  except Exception: pass
                  time.sleep(5)

          if ftp is None:
              raise SystemExit(f'FTPS Aruba non riuscito: {last}')

          def ensure_dir(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          ensure_dir(remote)
          for name in ('index.html','status-patch.js'):
              local=Path('last-man-standing')/name
              data=local.read_bytes()
              with local.open('rb') as fh:
                  ftp.storbinary('STOR '+name,fh)
              check=io.BytesIO()
              ftp.retrbinary('RETR '+name,check.write)
              if check.getvalue()!=data:
                  raise SystemExit('Verifica upload fallita: '+name)

          ftp.quit()
          print('Last Man Standing demo pubblicata e verificata')
          PY

      - name: Verify public URL
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, time
          base='https://www.italianmastersclub.it/last-man-standing/'
          last=None
          for _ in range(6):
              try:
                  with urllib.request.urlopen(base,timeout=30) as r:
                      body=r.read().decode('utf-8','replace')
                  with urllib.request.urlopen(base+'status-patch.js?v=${{ github.sha }}',timeout=30) as r:
                      patch=r.read().decode('utf-8','replace')
                  if 'Last Man Standing' in body and 'Tommaso Mello' in body and 'losingPicksG1' in patch and 'ELIMINATO' in patch:
                      print('Public URL verified:',base)
                      raise SystemExit(0)
              except Exception as e:
                  last=e
              time.sleep(10)
          raise SystemExit(f'Public verification failed: {last}')
          PY
