name: Remove Nexus Next from Aruba

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-nexus-next-aruba.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-nexus-next-production
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Nexus Next directory from Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          root='/www.italianmastersclub.it/nexus-next'
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          def rm(path):
              try: items=ftp.nlst(path)
              except error_perm: return
              for item in items:
                  if item.rstrip('/')==path.rstrip('/'): continue
                  try: ftp.delete(item)
                  except error_perm: rm(item); ftp.rmd(item)
          rm(root)
          try: ftp.rmd(root)
          except error_perm: pass
          ftp.quit()
          PY
      - name: Verify Nexus Next is gone
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          url='https://www.italianmastersclub.it/nexus-next/'
          try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'IMC-Remove-Verify/1.0'}),timeout=30)
              raise SystemExit('Nexus Next still reachable: HTTP '+str(r.status))
          except urllib.error.HTTPError as e:
              if e.code not in (404,410): raise
              print('NEXUS NEXT REMOVED: HTTP',e.code)
          PY
