name: IMC DB 001-05 Live Gateway Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/imc-db-001-04-live-check.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Capture manager CORE route response
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.italianmastersclub.it/api/imc-gateway/?game_world_id=GW001&source=core&repository=imc_managers&limit=1'
          status=$(curl -sS --retry 2 --retry-delay 2 -w '%{http_code}' "$URL" -o /tmp/managers.json)
          echo "HTTP_STATUS=$status"
          cat /tmp/managers.json
          echo

      - name: Capture assignment CORE route response
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.italianmastersclub.it/api/imc-gateway/?game_world_id=GW001&source=core&repository=gw_manager_assignments&filter_assignment_type=club&limit=1'
          status=$(curl -sS --retry 2 --retry-delay 2 -w '%{http_code}' "$URL" -o /tmp/assignments.json)
          echo "HTTP_STATUS=$status"
          cat /tmp/assignments.json
          echo
