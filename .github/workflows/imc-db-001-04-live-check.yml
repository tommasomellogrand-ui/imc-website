name: IMC DB 001-05 Live Gateway Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/imc-db-001-04-live-check.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe world discovery route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.italianmastersclub.it/api/imc-gateway/?game_world_id=GW001&action=repositories'
          curl -sS -D /tmp/world.headers -w '\nHTTP_STATUS=%{http_code}\n' "$URL" -o /tmp/world.body || true
          cat /tmp/world.headers
          cat /tmp/world.body
          echo

      - name: Probe manager CORE route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.italianmastersclub.it/api/imc-gateway/?game_world_id=GW001&source=core&repository=imc_managers&limit=1'
          curl -sS -D /tmp/manager.headers -w '\nHTTP_STATUS=%{http_code}\n' "$URL" -o /tmp/manager.body || true
          cat /tmp/manager.headers
          cat /tmp/manager.body
          echo

      - name: Probe assignment CORE route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.italianmastersclub.it/api/imc-gateway/?game_world_id=GW001&source=core&repository=gw_manager_assignments&filter_assignment_type=club&limit=1'
          curl -sS -D /tmp/assignment.headers -w '\nHTTP_STATUS=%{http_code}\n' "$URL" -o /tmp/assignment.body || true
          cat /tmp/assignment.headers
          cat /tmp/assignment.body
          echo
