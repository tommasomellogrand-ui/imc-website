name: Publish manager photos to Aruba
on:
  push:
    branches: [main]
    paths:
      - 'manager-photos-upload/**'
      - '.github/workflows/manager-portrait-folders.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imc-manager-photos
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate, name and publish manager photos
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, ssl, io, hashlib, urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          root='/www.italianmastersclub.it'
          uploads=[]
          for kind in ('faces','busts'):
              folder=Path('manager-photos-upload/tommaso-mello')/kind
              files=[p for p in folder.glob('*') if p.is_file() and p.name != '.gitkeep']
              if len(files)>1:
                  raise SystemExit(f'{folder}: caricare una sola foto per cartella')
              if not files: continue
              p=files[0]
              data=p.read_bytes()
              if data.startswith(b'\xff\xd8\xff'): ext='jpg'
              elif data.startswith(b'\x89PNG\r\n\x1a\n'): ext='png'
              else: raise SystemExit(f'{p}: formato non supportato, usare JPEG o PNG')
              uploads.append((kind,data,ext))
          if not uploads:
              print('Cartelle pronte: nessuna foto ancora caricata')
              raise SystemExit(0)
          ctx=ssl.create_default_context()
          ctx.check_hostname=False
          with FTP_TLS(context=ctx) as ftp:
              ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
              ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              for kind,data,ext in uploads:
                  ftp.cwd(root)
                  for part in ('assets','managers',kind):
                      try: ftp.cwd(part)
                      except error_perm as e:
                          if not str(e).startswith('550'): raise
                          ftp.mkd(part)
                          ftp.cwd(part)
                  name='tommaso-mello.'+ext
                  ftp.storbinary('STOR '+name,io.BytesIO(data))
                  check=io.BytesIO()
                  ftp.retrbinary('RETR '+name,check.write)
                  if check.getvalue()!=data: raise SystemExit('Verifica FTPS fallita')
                  url=f'https://www.italianmastersclub.it/assets/managers/{kind}/{name}'
                  req=urllib.request.Request(url+'?verify='+hashlib.sha256(data).hexdigest()[:16],headers={'User-Agent':'IMC-Manager-Photo-Verify'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      if response.status!=200 or response.read()!=data:
                          raise SystemExit('Verifica pubblica fallita: '+url)
                  print('Pubblicata e verificata:',url)
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                      summary.write(f'- {kind}: [{url}]({url})\n')
          PY
