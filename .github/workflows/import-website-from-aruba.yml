name: Import complete website from Aruba

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imc-website-bootstrap
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticated Publication Bridge diagnostics
        env:
          BRIDGE_TOKEN: ${{ secrets.IMC_PUBLICATION_BRIDGE_TOKEN || secrets.PUBLICATION_BRIDGE_TOKEN || secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BRIDGE_TOKEN:-}" || {
            echo "BRIDGE_TOKEN_SECRET_MISSING"
            exit 2
          }

          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          url='https://www.italianmastersclub.it/bridge/publication-bridge.php'
          token=os.environ['BRIDGE_TOKEN']

          def call(payload):
              data=json.dumps(payload).encode('utf-8')
              headers={
                  'Content-Type':'application/json',
                  'X-IMC-Bridge-Token':token,
              }
              req=urllib.request.Request(url,data=data,headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read(200000).decode('utf-8','replace')
                      print('HTTP',r.status,'PAYLOAD',payload)
                      print(body)
                      return r.status, body
              except urllib.error.HTTPError as e:
                  body=e.read(200000).decode('utf-8','replace')
                  print('HTTP',e.code,'PAYLOAD',payload)
                  print(body)
                  return e.code, body

          status, body = call({'action':'health'})
          if status == 401:
              raise SystemExit('BRIDGE_AUTH_FAILED')
          if status >= 400:
              raise SystemExit(f'BRIDGE_HEALTH_FAILED_HTTP_{status}')

          status, body = call({'action':'list','path':'/'})
          if status == 401:
              raise SystemExit('BRIDGE_AUTH_FAILED')
          if status >= 400:
              raise SystemExit(f'BRIDGE_LIST_FAILED_HTTP_{status}')

          try:
              parsed=json.loads(body)
          except Exception as exc:
              raise SystemExit(f'BRIDGE_LIST_NOT_JSON: {exc}')

          print('BRIDGE_AUTH_OK')
          print('BRIDGE_ROOT_LIST_OK')
          print('ROOT_RESPONSE_KEYS', sorted(parsed.keys()) if isinstance(parsed,dict) else type(parsed).__name__)
          PY

      - name: Contract identified
        shell: bash
        run: |
          echo "Authenticated bridge check completed successfully."
          echo "Next revision can use the confirmed list/read schema for the full import."
