name: Import complete website from Aruba

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imc-website-bootstrap
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose Publication Bridge over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.italianmastersclub.it/bridge"
          BRIDGE="$BASE/publication-bridge.php"
          README="$BASE/README-INSTALL.txt"

          echo "=== HTTPS CHECK ==="
          curl -fsSIL --max-time 20 "https://www.italianmastersclub.it/" | head -n 8

          echo
          echo "=== README-INSTALL.txt ==="
          code=$(curl -sS -L --max-time 20 -o /tmp/readme.txt -w '%{http_code}' "$README" || true)
          echo "HTTP $code"
          if [ -s /tmp/readme.txt ]; then
            sed -n '1,220p' /tmp/readme.txt
          fi

          echo
          echo "=== BRIDGE GET ==="
          code=$(curl -sS -L --max-time 20 -o /tmp/bridge-get.txt -w '%{http_code}' "$BRIDGE" || true)
          echo "HTTP $code"
          sed -n '1,120p' /tmp/bridge-get.txt 2>/dev/null || true

          echo
          echo "=== BRIDGE OPTIONS ==="
          code=$(curl -sS -L -X OPTIONS --max-time 20 -o /tmp/bridge-options.txt -w '%{http_code}' "$BRIDGE" || true)
          echo "HTTP $code"
          sed -n '1,120p' /tmp/bridge-options.txt 2>/dev/null || true

          echo
          echo "=== BRIDGE POST EMPTY JSON ==="
          code=$(curl -sS -L -X POST \
            -H 'Content-Type: application/json' \
            --data '{}' \
            --max-time 20 \
            -o /tmp/bridge-post-empty.txt \
            -w '%{http_code}' \
            "$BRIDGE" || true)
          echo "HTTP $code"
          sed -n '1,160p' /tmp/bridge-post-empty.txt 2>/dev/null || true

          echo
          echo "=== BRIDGE COMMON LIST PROBES ==="
          python3 - <<'PY'
          import json, urllib.request, urllib.error

          url='https://www.italianmastersclub.it/bridge/publication-bridge.php'
          probes=[
              {'action':'list','path':'/'},
              {'action':'list','dir':'/'},
              {'action':'ls','path':'/'},
              {'op':'list','path':'/'},
              {'command':'list','path':'/'},
          ]

          for payload in probes:
              data=json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(12000).decode('utf-8','replace')
                      print('PROBE',payload,'HTTP',r.status)
                      print(body[:4000])
              except urllib.error.HTTPError as e:
                  body=e.read(12000).decode('utf-8','replace')
                  print('PROBE',payload,'HTTP',e.code)
                  print(body[:4000])
              except Exception as e:
                  print('PROBE',payload,'ERROR',type(e).__name__,str(e))
          PY

          echo
          echo "Publication Bridge diagnostics completed"

      - name: Stop before import until bridge contract is identified
        shell: bash
        run: |
          echo "Import not executed in this run: bridge request contract must be identified from the diagnostics above."
          exit 1
