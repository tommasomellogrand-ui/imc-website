name: Import public website from Aruba

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imc-website-bootstrap
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current public website over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          wget \
            --mirror \
            --page-requisites \
            --no-host-directories \
            --no-parent \
            --domains www.italianmastersclub.it \
            --reject-regex='/((nexus|live-match|live-test-3d|pre-match)(/|$))' \
            --directory-prefix="$snapshot" \
            --user-agent='IMC-Website-Backup/1.0' \
            https://www.italianmastersclub.it/

          test -s "$snapshot/index.html"
          cp -a "$snapshot"/. .
          echo "Sito pubblico acquisito correttamente tramite HTTPS"

      - name: Validate imported website
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq 'ITALIAN MASTERS CLUB' index.html
          test ! -d nexus
          test ! -d live-match
          test ! -d live-test-3d
          test ! -d pre-match

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna differenza da importare"
            exit 0
          fi
          git commit -m "Import current public website from Aruba"
          git push
