name: Import complete website from Aruba

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imc-website-bootstrap
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import complete Aruba site through Publication Bridge
        env:
          BRIDGE_TOKEN: ${{ secrets.IMC_PUBLICATION_BRIDGE_TOKEN || secrets.PUBLICATION_BRIDGE_TOKEN || secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BRIDGE_TOKEN:-}" || {
            echo "BRIDGE_TOKEN_SECRET_MISSING"
            exit 2
          }

          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import shutil
          import urllib.error
          import urllib.parse
          import urllib.request

          BRIDGE_URL = 'https://www.italianmastersclub.it/bridge/publication-bridge.php'
          PUBLIC_BASE = 'https://www.italianmastersclub.it/'
          TOKEN = os.environ['BRIDGE_TOKEN']
          SNAPSHOT = pathlib.Path('/tmp/aruba-site')

          if SNAPSHOT.exists():
              shutil.rmtree(SNAPSHOT)
          SNAPSHOT.mkdir(parents=True)

          EXCLUDED = {
              'bridge/publication-config.php',
          }

          stats = {
              'files': 0,
              'dirs': 0,
              'bytes': 0,
              'excluded': 0,
              'https_fallback': 0,
              'unreadable': 0,
          }

          def bridge_request(payload):
              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  BRIDGE_URL,
                  data=data,
                  headers={
                      'Content-Type': 'application/json',
                      'X-IMC-Bridge-Token': TOKEN,
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.headers, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read()

          def api_json(payload):
              status, headers, raw = bridge_request(payload)
              text = raw.decode('utf-8', 'replace')
              try:
                  obj = json.loads(text)
              except Exception as exc:
                  raise RuntimeError(
                      f'BRIDGE_NON_JSON HTTP {status} action={payload.get("action")} '
                      f'path={payload.get("path","")} body={text[:300]!r}'
                  ) from exc
              if status >= 400 or not obj.get('ok', False):
                  raise RuntimeError(
                      f'BRIDGE_ERROR HTTP {status} action={payload.get("action")} '
                      f'path={payload.get("path","")} error={obj.get("error")}'
                  )
              return obj

          health = api_json({'action': 'health'})
          print('BRIDGE_OK', health.get('version'), 'root=', health.get('root'))

          def norm_path(parent, name):
              parent = parent.strip('/')
              return f'{parent}/{name}' if parent else name

          def decode_json_read(obj, path):
              encoding = str(obj.get('encoding') or '').lower()

              for key in ('content_base64', 'base64', 'data_base64'):
                  value = obj.get(key)
                  if isinstance(value, str):
                      return base64.b64decode(value, validate=False)

              content = obj.get('content')
              if isinstance(content, str):
                  if encoding in ('base64', 'b64'):
                      return base64.b64decode(content, validate=False)
                  return content.encode('utf-8')

              data = obj.get('data')
              if isinstance(data, str):
                  if encoding in ('base64', 'b64'):
                      return base64.b64decode(data, validate=False)
                  return data.encode('utf-8')

              return None

          def try_bridge_read(path, encoding=None):
              payload = {'action': 'read', 'path': path}
              if encoding:
                  payload['encoding'] = encoding

              status, headers, raw = bridge_request(payload)
              if status >= 400:
                  print('READ_BRIDGE_HTTP_FAIL', path, status, payload)
                  return None

              if not raw:
                  print('READ_EMPTY', path, 'payload=', payload)
                  return None

              ctype = (headers.get('Content-Type') or '').lower()
              stripped = raw.lstrip()
              looks_json = 'json' in ctype or stripped.startswith(b'{') or stripped.startswith(b'[')

              if looks_json:
                  try:
                      obj = json.loads(raw.decode('utf-8', 'replace'))
                  except Exception:
                      obj = None
                  if isinstance(obj, dict):
                      if obj.get('ok') is False:
                          print('READ_BRIDGE_ERROR', path, obj.get('error'))
                          return None
                      decoded = decode_json_read(obj, path)
                      if decoded is not None:
                          return decoded

              # Some bridge read implementations return the file bytes directly.
              return raw

          def try_public_https(path):
              quoted = '/'.join(urllib.parse.quote(part) for part in path.split('/'))
              url = urllib.parse.urljoin(PUBLIC_BASE, quoted)
              req = urllib.request.Request(url, headers={'User-Agent': 'IMC-GitHub-Importer/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      if r.status < 400 and raw:
                          stats['https_fallback'] += 1
                          print('HTTPS_FALLBACK_OK', path, len(raw))
                          return raw
              except Exception as exc:
                  print('HTTPS_FALLBACK_FAIL', path, type(exc).__name__, str(exc)[:180])
              return None

          def read_file(path):
              # First try bridge base64, then normal bridge read, then public HTTPS.
              for encoding in ('base64', None):
                  blob = try_bridge_read(path, encoding)
                  if blob is not None:
                      return blob

              blob = try_public_https(path)
              if blob is not None:
                  return blob

              stats['unreadable'] += 1
              print('UNREADABLE_FILE', path)
              return None

          def walk(remote_dir=''):
              list_path = '/' + remote_dir.strip('/') if remote_dir else '/'
              listing = api_json({'action': 'list', 'path': list_path})
              items = listing.get('items')
              if not isinstance(items, list):
                  raise RuntimeError(
                      f'LIST_RESPONSE_UNSUPPORTED path={remote_dir} keys={sorted(listing.keys())}'
                  )

              for item in items:
                  name = item.get('name')
                  kind = item.get('type')
                  if not isinstance(name, str) or not name or name in ('.', '..'):
                      continue

                  rel = norm_path(remote_dir, name)

                  if rel in EXCLUDED:
                      stats['excluded'] += 1
                      print('EXCLUDE_SECRET', rel)
                      continue

                  target = SNAPSHOT / rel

                  if kind == 'directory':
                      target.mkdir(parents=True, exist_ok=True)
                      stats['dirs'] += 1
                      print('DIR', rel)
                      walk(rel)
                  elif kind == 'file':
                      blob = read_file(rel)
                      if blob is None:
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(blob)
                      stats['files'] += 1
                      stats['bytes'] += len(blob)
                      print('FILE', rel, len(blob))
                  else:
                      print('SKIP_UNKNOWN_TYPE', rel, kind)

          walk('')

          if stats['files'] == 0:
              raise SystemExit('NO_FILES_IMPORTED')

          print(
              'IMPORT_SNAPSHOT_OK',
              f"files={stats['files']}",
              f"dirs={stats['dirs']}",
              f"bytes={stats['bytes']}",
              f"excluded={stats['excluded']}",
              f"https_fallback={stats['https_fallback']}",
              f"unreadable={stats['unreadable']}"
          )
          PY

      - name: Copy Aruba snapshot into repository
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/aruba-site
          cp -a /tmp/aruba-site/. ./
          echo "Aruba snapshot copied into repository"

      - name: Validate imported site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -d asta-mercato
          echo "Validated index.html and asta-mercato"

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No differences to commit"
            exit 0
          fi

          git commit -m "Import complete Aruba website via Publication Bridge"
          git push origin main
