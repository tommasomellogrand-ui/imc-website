name: Publish world table reads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-table-reads.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-table-reads
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate data services
        run: find site-data -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Publish club services and verify bytes
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, secrets, hashlib, time, urllib.request, json
          from ftplib import FTP_TLS, error_perm
