ue/competitions/competition-ui.js', 'worldleague/competitions/competition-view.js', 'worldleague/competitions/match-report.php', 'worldleague/competitions/match.php', 'worldleague/competitions/results.php', 'worldleague/competitions/schedule.php', 'worldleague/competitions/standings.php', 'worldleague/managers/api.php', 'worldleague/managers/data-room.js', 'worldleague/managers/h2h.js', 'worldleague/managers/history-overview.js', 'worldleague/managers/manager-profile.js', 'worldleague/managers/trophy-room.js', 'worldleague/matchday/data.php', 'worldleague/nations/detail.js', 'worldleague/nations/detail.php', 'worldleague/nations/directory.php', 'worldleague/nations/matches.php', 'worldleague/nations/roster.php', 'worldleague/nations/stats.php', 'worldleague/trophyroom/data.php', 'worldleague/trophyroom/trophy-room.js']
          if os.environ.get('GITHUB_EVENT_NAME')=='push':
              import subprocess
              changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
              files=[p for p in files if p in changed]
          root='/www.italianmastersclub.it'
          ctx=ssl.create_default_context()
          ctx.check_hostname=False # Existing Aruba FTPS alias policy; CA validation remains enabled.
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          def directory(path):
              ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
          for name in files:
              p=Path(name)
              data=p.read_bytes()
              assert data, str(p)
              directory(root+'/'+str(Path(name).parent))
              ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              assert check.getvalue()==data,'Byte verification failed: '+name
          ftp.quit()
          PY

      - name: Verify public feeds for every world
        run: |
          python3 - <<'PYTEST'
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          worlds=['roadtohistory','halloffamers','kickoff','sensiblesocceracademy','subbuteosuperleague','worldleague','masterleagueworld','scudetto']
          def verify(item):
              w,gw=item
              base='https://www.italianmastersclub.it/'
              paths=[w+'/competitions/catalog.php',w+'/matchday/data.php',w+'/matchday/data.php?mode=schedule',w+'/nations/directory.php',w+'/trophyroom/data.php','site-data/managers/index.php?world='+gw]
              for mode in ('overview','data-room','h2h'):
                  paths.append('site-data/h2h/index.php?world='+gw+'&kind=manager&id=MNG001&scope=club&mode='+mode)
              for path in paths:
                  with urllib.request.urlopen(base+path,timeout=120) as r:
                      data=json.load(r)
                      assert data.get('ok'),(path,data.get('error'))
                      assert r.headers.get('X-IMC-Club-Names'),path
                      if path==w+'/matchday/data.php' and w!='scudetto':assert data['rows'],path
              print(w,len(paths),'verified',flush=True)
          with ThreadPoolExecutor(4) as pool:list(pool.map(verify,zip(worlds,['GW001','GW005','GW009','GW010','GW011','GW004','GW006','IMC-008'])))
          PYTEST
