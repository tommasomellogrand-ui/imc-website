name: SM Master Database Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sm-master-aruba.yml'
      - 'ops/sm-master/**'

permissions:
  contents: write

concurrency:
  group: imc-sm-master-database
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
      ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
      ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
      ARUBA_WEBSITE_REMOTE_DIR: ${{ secrets.ARUBA_WEBSITE_REMOTE_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in MYSQL_HOST MYSQL_DATABASE MYSQL_USERNAME MYSQL_PASSWORD ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_WEBSITE_REMOTE_DIR; do
            test -n "${!name:-}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Extract authoritative GOLD and SINGLE-LEAGUE DDL (read-only)
        id: schema_extract
        continue-on-error: true
        shell: bash
        env:
          MYSQL_PWD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mkdir -p ops/sm-master/schemas

          dump_schema() {
            local database="$1"
            local output="$2"
            mysqldump \
              --host="$MYSQL_HOST" \
              --user="$MYSQL_USERNAME" \
              --no-data \
              --no-tablespaces \
              --skip-comments \
              --skip-add-locks \
              --skip-disable-keys \
              --default-character-set=utf8mb4 \
              --databases "$database" > "$output"
          }

          dump_schema Sql1956795_2 /tmp/GOLD_DATABASE_FINAL_DDL.sql
          dump_schema Sql1956795_3 /tmp/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql

          cp /tmp/GOLD_DATABASE_FINAL_DDL.sql ops/sm-master/schemas/GOLD_DATABASE_FINAL_DDL.sql
          if ! cmp -s /tmp/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql ops/sm-master/schemas/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql; then
            cp /tmp/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql ops/sm-master/schemas/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql
          fi

          gold_tables="$(mysql --host="$MYSQL_HOST" --user="$MYSQL_USERNAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='Sql1956795_2' AND table_type='BASE TABLE'")"
          gold_columns="$(mysql --host="$MYSQL_HOST" --user="$MYSQL_USERNAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='Sql1956795_2'")"
          single_tables="$(mysql --host="$MYSQL_HOST" --user="$MYSQL_USERNAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='Sql1956795_3' AND table_type='BASE TABLE'")"
          single_columns="$(mysql --host="$MYSQL_HOST" --user="$MYSQL_USERNAME" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='Sql1956795_3'")"
          gold_hash="$(sha256sum ops/sm-master/schemas/GOLD_DATABASE_FINAL_DDL.sql | awk '{print $1}')"
          single_hash="$(sha256sum ops/sm-master/schemas/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql | awk '{print $1}')"

          python3 - "$gold_tables" "$gold_columns" "$single_tables" "$single_columns" "$gold_hash" "$single_hash" <<'PY'
          import json, pathlib, re, sys
          gt,gc,st,sc,gh,sh=sys.argv[1:]
          manifest={
            "generated_from":"information_schema/mysqldump --no-data",
            "gold":{"database":"Sql1956795_2","tables":int(gt),"columns":int(gc),"sha256":gh},
            "single_league":{"database":"Sql1956795_3","tables":int(st),"columns":int(sc),"sha256":sh},
          }
          pathlib.Path("ops/sm-master/schemas/SCHEMA_MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          p=pathlib.Path("ops/sm-master/admin/gold-schema.php")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r"const SMM_GOLD_SCHEMA_SHA256 = '[0-9a-f]+';",f"const SMM_GOLD_SCHEMA_SHA256 = '{gh}';",s)
          s=re.sub(r"return __DIR__ \. '/GOLD_DATABASE_FINAL_DDL_CHECKPOINT_06\(1\)\.sql';", "return dirname(__DIR__) . '/schemas/GOLD_DATABASE_FINAL_DDL.sql';", s)
          p.write_text(s,encoding="utf-8")
          PY

          git config user.name "IMC Schema Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/sm-master/schemas ops/sm-master/admin/gold-schema.php
          if ! git diff --cached --quiet; then
            git commit -m "chore(db): restore authoritative Aruba DDL snapshots"
            git push origin main
          fi

          echo "GOLD_SCHEMA_REAL|tables=$gold_tables|columns=$gold_columns|sha256=$gold_hash"
          echo "SINGLE_LEAGUE_SCHEMA_REAL|tables=$single_tables|columns=$single_columns|sha256=$single_hash"

      - name: Record schema extraction failure
        if: steps.schema_extract.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/sm-master/schemas
          cat > ops/sm-master/schemas/SCHEMA_EXTRACTION_STATUS.json <<'JSON'
          {
            "ok": false,
            "phase": "read_only_schema_extraction",
            "databases": ["Sql1956795_2", "Sql1956795_3"],
            "message": "GitHub Actions could not complete the read-only schema extraction. Inspect the workflow job log."
          }
          JSON
          git config user.name "IMC Schema Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/sm-master/schemas/SCHEMA_EXTRACTION_STATUS.json
          git commit -m "chore(db): record schema extraction failure" || true
          git pull --rebase origin main
          git push origin main
          echo "SCHEMA_EXTRACTION_SKIPPED|endpoint migration will use previously verified live DDL"

      - name: Validate importer package
        shell: bash
        run: |
          set -euo pipefail
          for f in ops/sm-master/admin/core.php ops/sm-master/admin/import-sm.php ops/sm-master/admin/import-sw.php ops/sm-master/admin/canonical.php ops/sm-master/admin/api.php ops/sm-master/admin/index.php; do
            php -l "$f"
          done
          test -s ops/sm-master/schema.sql
          if test -s ops/sm-master/schemas/GOLD_DATABASE_FINAL_DDL.sql; then
            test -s ops/sm-master/schemas/SINGLE_LEAGUE_DATABASE_FINAL_DDL.sql
            test -s ops/sm-master/schemas/SCHEMA_MANIFEST.json
            php -l ops/sm-master/admin/gold-schema.php
          else
            echo "Authoritative live DDL already verified through the Aruba database-manager endpoint."
          fi

      - name: Generate private runtime configuration
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          token="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )"
          echo "ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          export ADMIN_TOKEN="$token"
          mkdir -p /tmp/__imc_private_sm_master
          python3 - <<'PY'
          import base64, os
          def b64(v):
              return base64.b64encode(v.encode()).decode()
          cfg = f'''<?php
          declare(strict_types=1);
          return [
            'db' => [
              'host' => base64_decode('{b64(os.environ["MYSQL_HOST"])}'),
              'database' => base64_decode('{b64(os.environ["MYSQL_DATABASE"])}'),
              'user' => base64_decode('{b64(os.environ["MYSQL_USERNAME"])}'),
              'password' => base64_decode('{b64(os.environ["MYSQL_PASSWORD"])}'),
            ],
            'admin_token' => base64_decode('{b64(os.environ["ADMIN_TOKEN"])}'),
          ];
          '''
          open('/tmp/__imc_private_sm_master/config.php','w',encoding='utf-8').write(cfg)
          open('/tmp/__imc_private_sm_master/.htaccess','w',encoding='utf-8').write('Options -Indexes\nRequire all denied\n')
          PY
          echo "ADMIN_URL=https://www.italianmastersclub.it/__imc-sm-master/admin/?token=$token" >> "$GITHUB_ENV"

      - name: Upload SM Master package to Aruba
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, socket, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host = os.environ['ARUBA_FTP_HOST'].removeprefix('ftp://').removeprefix('ftps://').rstrip('/')
          username = os.environ['ARUBA_FTP_USERNAME']
          password = os.environ['ARUBA_FTP_PASSWORD']
          remote_root = os.environ['ARUBA_WEBSITE_REMOTE_DIR'].strip() or '/'
          ctx = ssl.create_default_context(); ctx.check_hostname = False
          addresses=[]
          for item in socket.getaddrinfo(host,21,socket.AF_INET,socket.SOCK_STREAM):
              ip=item[4][0]
              if ip not in addresses: addresses.append(ip)
          ftp=None; last=None
          for attempt in range(3):
              for ip in addresses:
                  c=FTP_TLS(context=ctx)
                  try:
                      c.connect(ip,21,timeout=45); c.login(username,password); c.prot_p(); ftp=c; break
                  except Exception as e:
                      last=e
                      try:c.close()
                      except Exception:pass
              if ftp: break
              time.sleep(5)
          if not ftp: raise SystemExit(f'FTPS connection failed: {type(last).__name__}')

          def ensure(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)

          uploads=[]
          base=Path('ops/sm-master')
          for p in base.rglob('*'):
              if p.is_file() and p.name != 'README.md':
                  rel=p.relative_to(base).as_posix()
                  uploads.append((p, f"{remote_root.rstrip('/')}/__imc-sm-master/{rel}"))
          priv=Path('/tmp/__imc_private_sm_master')
          for p in priv.rglob('*'):
              if p.is_file():
                  rel=p.relative_to(priv).as_posix()
                  uploads.append((p, f"{remote_root.rstrip('/')}/__imc_private_sm_master/{rel}"))

          for local, remote in uploads:
              parent, name = remote.rsplit('/',1)
              ensure(parent)
              data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary('STOR '+name,fh)
              verify=io.BytesIO(); ftp.retrbinary('RETR '+name,verify.write)
              if verify.getvalue()!=data: raise SystemExit('Upload verification failed: '+remote)
          ftp.quit()
          print(f'Uploaded and verified {len(uploads)} SM Master files.')
          PY

      - name: Create or verify MySQL schema from Aruba hosting
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 90 -H 'Cache-Control: no-cache, no-store' "https://www.italianmastersclub.it/__imc-sm-master/admin/api.php?action=install&token=$ADMIN_TOKEN")"
          python3 - <<'PY' "$response"
          import json,sys
          data=json.loads(sys.argv[1])
          if not data.get('ok'): raise SystemExit('INSTALL_FAIL|'+json.dumps(data,ensure_ascii=False))
          install=data.get('install',{})
          print(f"SM_MASTER_SCHEMA_OK|mysql={install.get('version')}|tables={install.get('tables')}")
          print('SM_MASTER_COUNTS|'+json.dumps(data.get('counts',{}),separators=(',',':')))
          PY


      - name: Apply competition group and expected matches migration via HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          endpoint = 'https://www.italianmastersclub.it/__imc-sm-master/admin/database-manager/'
          token = os.environ['ADMIN_TOKEN']
          path = 'ops/sm-master/migrations/20260904_competition_group_expected_matches.json'
          migration = json.load(open(path, encoding='utf-8'))

          def call(payload):
              body = json.dumps(payload, separators=(',', ':')).encode()
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      'Content-Type': 'application/json',
                      'X-IMC-Token': token,
                      'Cache-Control': 'no-cache, no-store',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  data = json.loads(error.read())
                  return error.code, data

          for target in migration['targets']:
              payload = {
                  'action': 'plan_migration',
                  'target': target,
                  'migration_id': migration['migration_id'],
                  'statements': migration['statements'],
                  'allow_destructive': False,
              }
              status, plan = call(payload)
              if status != 200 or not plan.get('ok'):
                  raise SystemExit(f'MIGRATION_PLAN_FAIL|{target}|{status}|{json.dumps(plan)}')
              payload['action'] = 'execute_migration'
              payload['confirmation_token'] = plan['confirmation_token']
              status, result = call(payload)
              if status == 409 and result.get('error') == 'Migration already executed successfully.':
                  print(f'MIGRATION_ALREADY_APPLIED|{target}')
              elif status != 200 or not result.get('ok'):
                  raise SystemExit(f'MIGRATION_EXECUTE_FAIL|{target}|{status}|{json.dumps(result)}')
              else:
                  print(f'MIGRATION_APPLIED|{target}|{result.get("database")}')

              for name in ('schema', 'constraints', 'counts'):
                  status, check = call({
                      'action': 'query',
                      'target': target,
                      'sql': migration['verification'][name],
                      'limit': 500,
                  })
                  if status != 200 or not check.get('ok'):
                      raise SystemExit(f'MIGRATION_VERIFY_FAIL|{target}|{name}|{status}|{json.dumps(check)}')
                  print(f'MIGRATION_VERIFY|{target}|{name}|{json.dumps(check["result"]["rows"], separators=(",", ":"))}')
          PY

      - name: Publish secure importer URL
        shell: bash
        run: |
          echo "SM_MASTER_IMPORTER_READY"
          echo "$ADMIN_URL"
          echo "Upload the baseline XML and JSON from this private importer page."
