name: Deploy IMC Universal Gateway to Aruba

on:
  push:
    branches: [main]
    paths:
      - 'imc-universal-gateway/**'
      - '__imc_private_gateway/**'
      - '.github/workflows/deploy-imc-universal-gateway-aruba.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-universal-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Universal Gateway
        shell: bash
        run: |
          set -euo pipefail
          for f in index.php core.php read.php write.php ddl.php minisite.php; do test -s "imc-universal-gateway/$f"; done
          test -s "__imc_private_gateway/config.php"
          test -s "__imc_private_gateway/.htaccess"
          for f in imc-universal-gateway/*.php __imc_private_gateway/config.php; do php -l "$f"; done

      - name: Deploy complete IMC Universal Gateway
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; port=21
          username=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          remote_root='/www.italianmastersclub.it'
          uploads=[
              (Path('imc-universal-gateway')/n, f'{remote_root}/imc-universal-gateway')
              for n in ['index.php','core.php','read.php','write.php','ddl.php','minisite.php']
          ]
          uploads += [
              (Path('__imc_private_gateway/config.php'), f'{remote_root}/__imc_private_gateway'),
              (Path('__imc_private_gateway/.htaccess'), f'{remote_root}/__imc_private_gateway'),
          ]
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ftp=None; last_error=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try:
                  c.connect(host,port,timeout=60); c.login(username,password); c.prot_p(); c.set_pasv(True); ftp=c; break
              except Exception as e:
                  last_error=e
                  try: c.close()
                  except Exception: pass
                  time.sleep(5)
          if ftp is None: raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}: {last_error}')
          def ensure_dir(remote_dir):
              ftp.cwd('/')
              for part in [p for p in remote_dir.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)
          for local, remote_dir in uploads:
              ensure_dir(remote_dir)
              data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary('STOR '+local.name,fh)
              check=io.BytesIO(); ftp.retrbinary('RETR '+local.name,check.write)
              if check.getvalue()!=data: raise SystemExit('Verifica upload fallita: '+local.as_posix())
          ftp.quit(); print('IMC Universal Gateway completo, configurazione privata inclusa, pubblicato e verificato')
          PY
