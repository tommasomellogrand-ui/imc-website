name: Deploy Nexus public runtime
on:
  push:
    branches: [main]
    paths: ['nexus/**', '.github/workflows/deploy-nexus-public.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-public-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public website
        run: |
          php -l nexus/public/trophies.php
          php nexus/public/trophies.test.php
          php -l nexus/public/hub.php
          php nexus/public/competition-names.test.php
          php -l nexus/public/core.php
          php nexus/public/core.test.php
          php -l nexus/public/data.php
          node --check nexus/public/site.js
          node --check nexus/public/clubhouse.js
          node --test nexus/public/news.test.cjs
          node --check nexus/public/match.js
          node --test nexus/public/hub.test.cjs
          ! grep -Eiq 'supabase|v1/app|password|loginView' nexus/index.html nexus/public/site.js
      - name: Publish Nexus to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: python3 nexus/public/deploy.py
      - name: Verify public website and all forty data routes
        run: python3 nexus/public/verify.py



