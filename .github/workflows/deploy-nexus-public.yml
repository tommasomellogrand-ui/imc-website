name: Deploy Nexus public runtime

on:
  push:
    branches: [main]
    paths:
      - 'nexus/**'
      - '.github/workflows/deploy-nexus-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate public runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s nexus/index.html
          test -s nexus/.htaccess
          test -s nexus/v1/app.js
          test -s nexus/v1/public-app.js
          ! grep -Eiq 'AuthType|AuthName|AuthUserFile|Require[[:space:]]+valid-user' nexus/.htaccess
          ! grep -Eiq 'signInWithPassword|sign_in_with_password' nexus/v1/app.js nexus/v1/public-app.js

      - name: Publish Nexus through Publication Bridge
        env:
          BRIDGE_TOKEN: ${{ secrets.IMC_PUBLICATION_BRIDGE_TOKEN || secrets.PUBLICATION_BRIDGE_TOKEN || secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BRIDGE_TOKEN:-}" || { echo "BRIDGE_TOKEN_SECRET_MISSING"; exit 2; }
          python3 - <<'PY'
          import base64,json,os,pathlib,urllib.request,urllib.error
          root=pathlib.Path('nexus'); endpoint='https://www.italianmastersclub.it/bridge/publication-bridge.php'; token=os.environ['BRIDGE_TOKEN']
          def call(payload):
              req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','X-IMC-Bridge-Token':token},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: body=r.read().decode('utf-8','replace'); status=r.status
              except urllib.error.HTTPError as e: body=e.read().decode('utf-8','replace'); status=e.code
              try: data=json.loads(body)
              except Exception: raise SystemExit(f'BRIDGE_NON_JSON HTTP {status}: {body[:500]}')
              if status>=400 or not data.get('ok'): raise SystemExit(f'BRIDGE_FAILED HTTP {status}: {data}')
          files=[p for p in root.rglob('*') if p.is_file()]
          for p in files:
              raw=p.read_bytes(); call({'action':'write','path':p.as_posix(),'encoding':'base64','content':base64.b64encode(raw).decode('ascii')}); print('PUBLISHED',p,len(raw))
          print('NEXUS_PUBLISHED_FILES',len(files))
          PY

      - name: Verify Nexus live public
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,time
          url='https://www.italianmastersclub.it/nexus/?imc_public_verify=1'
          last=None
          for _ in range(6):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'IMC-Nexus-Live-Verify/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode('utf-8','replace')
                      if r.status==200 and not r.headers.get('WWW-Authenticate') and 'IMC Nexus' in body:
                          print('NEXUS_LIVE_PUBLIC_OK',len(body)); break
                      last=f'HTTP {r.status} auth={r.headers.get("WWW-Authenticate")}'
              except Exception as e: last=repr(e)
              time.sleep(5)
          else: raise SystemExit(f'NEXUS_LIVE_VERIFY_FAILED: {last}')
          PY
