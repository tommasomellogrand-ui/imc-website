name: Publish daily player importer
on:
  push:
    branches: [main]
    paths:
      - 'imc-universal-gateway/daily-player.php'
      - 'site-assets/js/daily-player-import.js'
      - '.github/workflows/daily-player-import.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-player-import
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          php -l imc-universal-gateway/daily-player.php
          php -l sensiblesocceracademy/playercodex/daily.php
          node --check sensiblesocceracademy/playercodex/directory.js
          node --check site-assets/js/daily-player-import.js
      - name: Publish daily updates and verify bytes
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, secrets, hashlib, time, urllib.request, json
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          files=["imc-universal-gateway/daily-player.php","roadtohistory/players/index.html","roadtohistory/players/directory.js","roadtohistory/players/daily.php","halloffamers/playercodex/index.html","halloffamers/playercodex/directory.js","halloffamers/playercodex/daily.php","kickoff/playercodex/index.html","kickoff/playercodex/directory.js","kickoff/playercodex/daily.php","subbuteosuperleague/playercodex/index.html","subbuteosuperleague/playercodex/directory.js","subbuteosuperleague/playercodex/daily.php","worldleague/playercodex/index.html","worldleague/playercodex/directory.js","worldleague/playercodex/daily.php","masterleagueworld/playercodex/index.html","masterleagueworld/playercodex/directory.js","masterleagueworld/playercodex/daily.php","scudetto/playercodex/index.html","scudetto/playercodex/directory.js","scudetto/playercodex/daily.php","site-assets/js/daily-player-import.js","sensiblesocceracademy/playercodex/daily.php","sensiblesocceracademy/playercodex/directory.js","sensiblesocceracademy/playercodex/index.html"]
          root='/www.italianmastersclub.it'
          ctx=ssl.create_default_context()
          ctx.check_hostname=False # Existing Aruba FTPS alias policy; CA validation remains enabled.
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          def directory(path):
              ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
          for name in files:
              p=Path(name)
              data=p.read_bytes()
              assert data, str(p)
              directory(root+'/'+str(Path(name).parent))
              ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              assert check.getvalue()==data,'Byte verification failed: '+name
          ftp.quit()
          PY
      - name: Check daily tabs on all eight public directories
        run: |
          python3 - <<'PY'
          import urllib.request,json
          for route in ["roadtohistory/players","halloffamers/playercodex","kickoff/playercodex","sensiblesocceracademy/playercodex","subbuteosuperleague/playercodex","worldleague/playercodex","masterleagueworld/playercodex","scudetto/playercodex"]:
              url='https://www.italianmastersclub.it/'+route+'/'
              html=urllib.request.urlopen(url+'?tab=new&release=${{ github.sha }}',timeout=60).read().decode()
              assert 'Nuovi giocatori in DB' in html and '?tab=changes' in html, route
              for tab in ['changes','new']:
                  data=json.load(urllib.request.urlopen(url+'daily.php?day=2026-11-09&tab='+tab,timeout=60))
                  assert data['ok'] and len(data['rows'])==({'changes':41,'new':18}[tab]),(route,tab)
          PY
