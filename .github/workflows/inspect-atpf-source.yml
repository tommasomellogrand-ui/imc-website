name: Inspect All To Play For source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-atpf-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Read editorial source inventory
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,ssl,io
          from ftplib import FTP_TLS
          ctx=ssl.create_default_context();ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx);ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);ftp.prot_p()
          root='/www.italianmastersclub.it/nexus/alltoplayfor'
          def walk(path):
              for name,facts in ftp.mlsd(path):
                  if name in ['.','..']:continue
                  relative=(path+'/'+name)[len(root)+1:]
                  if facts.get('type')=='dir':walk(path+'/'+name)
                  elif name.endswith(('.html','.php','.json')) or name=='.htaccess':
                      print(relative)
                      if name=='.htaccess':
                          out=io.BytesIO();ftp.retrbinary('RETR '+path+'/'+name,out.write);print(out.getvalue().decode())
          walk(root);ftp.quit()
          PY
