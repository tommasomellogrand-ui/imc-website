name: Publish IMC person name display
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/person-name-display.yml'
      - 'site-assets/names/**'
      - 'nexus/core/person-display.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: person-name-display
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish person name display and verify bytes
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, secrets, hashlib, time, urllib.request, json
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          files=["nexus/core/person-display.php", "site-assets/names/list.php", "site-assets/names/display.js", "FantaArtois/index.html", "FantaArtois/listone.html", "FantaArtois/live.html", "FantaArtois/team-page.js", "clubhouse/imc-passport/index.php", "clubhouse/portraits.js", "imc_campus/club_house/index.php", "imc_campus/one/index.php", "imc_campus/trophy_room/index.php", "imc_campus/world_center/index.php", "imcwheel/index.html", "index.html", "last-man-standing/index.html", "live-match/index.html", "live-match/md14/index.html", "live-match/md15/index.html", "live-match/md15/live.html", "live-match/md16/index.html", "live-results/index.html", "live-scoring/index.html", "live-test-3d/index.html", "match-report/index.html", "matchday-hub/index.html", "minisite/GW001/core-app.js", "minisite/GW001/legacy.html", "minisite/GW001/live-fixtures.js", "minisite/GW001/visual-review.html", "minisite/GW002/index.html", "minisite/GW002/press-v1.html", "minisite/GW002/review.html", "minisite/GW003/index.html", "minisite/GW004/app.js", "minisite/GW004/review.html", "minisite/GW005/index.html", "minisite/GW006/stage.js", "minisite/GW007/data.js", "minisite/GW007/live-fixtures.js", "minisite/GW007/review.html", "minisite/GW008/app.js", "minisite/GW008/responsive.html", "minisite/GW009/kickoff.js", "minisite/GW009/responsive-check.html", "nexus/assets/navigation.js", "nexus/core/bootstrap.php", "nexus/matchday/index.html", "nexus/series/rth/index.html", "platinumlegacy/index.html", "pre-match/16-agosto-2026/index.html", "pre-match/20-agosto-2026/index.html", "pre-match/23-agosto-2026/d4.js", "pre-match/27-agosto-2026/app.js", "sensible-soccer-academy-creation/draw-replay/index.html", "sensible-soccer-academy-creation/draw-waiting-room/index.html", "sensible-soccer-academy-creation/gw-setting/draft-matrix.html", "sensible-soccer-academy/draw/index.html", "sensible-soccer-academy/draw24/index.html", "sensible-soccer-academy/hall-of-famers-draft/index.html", "sensible-soccer-academy/hall-of-famers-draft/live/index.html", "sensible-soccer-academy/hall-of-famers-pick/index.html", "sensible-soccer-academy/hall-of-famers-pick/live/index.html", "sensible-soccer-academy/hall-of-famers-player-draft-v2/index.html", "sensible-soccer-academy/hall-of-famers-player-draft-v2/live/index.html", "sensible-soccer-academy/hall-of-famers-player-draft/index.html", "sensible-soccer-academy/hall-of-famers-player-draft/live/index.html", "sensible-soccer-academy/hall-of-famers-player-lottery/index.html", "sensible-soccer-academy/hall-of-famers-player-lottery/live/index.html", "sensible-soccer-academy/index.html", "sensible-soccer-academy/live/index.html", "sensible-soccer-academy/replay/index.html", "sensible-soccer-academy/start/index.html", "sensible-soccer-academy/world-cup-draw/index.html", "sensible-soccer-academy/world-cup-draw/live/index.html", "site-assets/gameworld/app-core.js", "site-assets/js/world-feed.js", "site-assets/js/world-ui.js", "site-assets/master/api.php", "site-assets/master/homepage-preview.html", "site-assets/master/moodboard.html", "site-assets/master/preview.html", "theroadalmanac/index.html"]
          root='/www.italianmastersclub.it'
          ctx=ssl.create_default_context()
          ctx.check_hostname=False # Existing Aruba FTPS alias policy; CA validation remains enabled.
          def connect():
              ftp=FTP_TLS(context=ctx)
              ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
              ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
              ftp.prot_p();ftp.set_pasv(True)
              return ftp
          def directory(ftp,path):
              ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
          def publish(name,ftp):
              p=Path(name)
              data=p.read_bytes()
              if name=='pre-match/16-agosto-2026/index.html' and b'/site-assets/names/display.js' not in data:
                  data=data.replace(b'</head>',b'<script defer src="/site-assets/names/display.js?v=1"></script></head>',1)
              assert data, str(p)
              directory(ftp,root+'/'+str(Path(name).parent))
              ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              assert check.getvalue()==data,'Byte verification failed: '+name
          import concurrent.futures
          def batch(names):
              ftp=connect()
              try:
                  for name in names:publish(name,ftp)
              finally:ftp.quit()
          batch(files[:3])
          rest=files[3:]
          with concurrent.futures.ThreadPoolExecutor(3) as pool:
              list(pool.map(batch,[rest[i::3] for i in range(3)]))
          PY

      - name: Verify names in production
        run: |
          php -l nexus/core/person-display.php
          php -l site-assets/names/list.php
          node --check site-assets/names/display.js
          python3 - <<'PY'
          import json,urllib.request
          base='https://www.italianmastersclub.it/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=90) as r:return r.read().decode()
          data=json.loads(get('site-assets/names/list.php'))
          assert data['clubs'] and any(' ' in n for n in data['names'])
          for path in ['site-assets/js/world-ui.js','nexus/assets/navigation.js','clubhouse/portraits.js','index.html','clubhouse/imc-passport/']:
              assert '/site-assets/names/display.js' in get(path+'?release=${{ github.sha }}'),path
          for path in ['roadtohistory/transfers/data.php?limit=5','sensiblesocceracademy/playercodex/world.php?player=133061']:
              rows=json.loads(get(path))['rows']
              assert rows and all(not any(len(w)>1 and w.isupper() for w in (r.get('player_name') or r.get('full_name')).split()) for r in rows),path
          PY
