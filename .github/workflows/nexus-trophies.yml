name: Nexus Trophy Room automation
on:
  push:
    branches: [main, nexus-trophy-automation]
    paths: ['nexus/trophies/**', 'tests/nexus-trophies*.php', '.github/workflows/nexus-trophies.yml']
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-trophies-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: trophy-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptrophy-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_TEST_PASSWORD: trophy-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and trophy rules
        run: |
          for file in nexus/trophies/*.php; do php -l "$file"; done
          php tests/nexus-trophies-integration.php
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh dirty Game Worlds
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, urllib.request
          def refresh(i):
              gw=f'GW{i:03d}'
              url='https://www.italianmastersclub.it/nexus/trophies/automation.php?world='+gw
              with urllib.request.urlopen(url,timeout=90) as response:
                  data=json.load(response)
              if not data.get('ok') or data.get('state')=='disabled':
                  raise RuntimeError(f'{gw}: {data}')
              print(gw,data['state'])
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              list(pool.map(refresh,range(1,11)))
          PY
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested Trophy Room files
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl
          from pathlib import Path
          from ftplib import FTP_TLS
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)
          ftp.cwd('/www.italianmastersclub.it/nexus/trophies')
          for name in ['engine.php','sync.php','automation.php','index.php']:
              data=Path('nexus/trophies',name).read_bytes()
              ftp.storbinary('STOR '+name,io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary('RETR '+name,check.write)
              if check.getvalue()!=data: raise RuntimeError('Upload verification failed: '+name)
          ftp.quit()
          print('Trophy Room files uploaded and verified')
          PY
