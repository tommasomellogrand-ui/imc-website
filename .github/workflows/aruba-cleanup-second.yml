name: Aruba second cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aruba-cleanup-second.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove empty ops directory
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, ssl, time
          from ftplib import FTP_TLS, error_perm

          host='ftp.italianmastersclub.it'
          port=21
          username=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']
          root='/www.italianmastersclub.it'

          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=None; last_error=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try:
                  c.connect(host, port, timeout=60)
                  c.login(username, password)
                  c.prot_p(); c.set_pasv(True)
                  ftp=c; break
              except Exception as e:
                  last_error=e
                  try: c.close()
                  except Exception: pass
                  time.sleep(5)
          if ftp is None:
              raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}: {last_error}')

          path=f"{root.rstrip('/')}/ops"
          try:
              entries=[name for name, facts in ftp.mlsd(path) if name not in ('.','..')]
          except error_perm:
              entries=[]
          if entries:
              raise SystemExit(f'ops non vuota: {entries}')
          try:
              ftp.rmd(path)
              print('DELETED DIR ops')
          except error_perm as e:
              if not str(e).startswith('550'):
                  raise
          ftp.quit()
          PY
