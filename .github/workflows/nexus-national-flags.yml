name: Deploy Nexus national flags
on:
  push:
    branches: [main]
    paths: ['nexus/assets/flags/**', '.github/workflows/nexus-national-flags.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imc-public-website-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate national flag assets
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          manifest=json.loads(Path('nexus/assets/flags/nations/manifest.json').read_text())
          assert len(manifest['nations'])==80
          for row in manifest['nations']:
              root=ET.parse(row['path']).getroot()
              assert root.tag=='{http://www.w3.org/2000/svg}svg'
              assert root.get('id')=='flag-icons-'+row['source_code']
          print('80 national flags validated')
          PY
      - name: Publish and verify national flags
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, urllib.request
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          from concurrent.futures import ThreadPoolExecutor
          # Existing Aruba exception; CA verification remains enabled.
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)
          files=sorted(p for p in Path('nexus/assets/flags').rglob('*') if p.is_file())
          for path in files:
              ftp.cwd('/www.italianmastersclub.it')
              for part in path.parent.parts:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)
              data=path.read_bytes()
              ftp.storbinary('STOR '+path.name,io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary('RETR '+path.name,check.write)
              if check.getvalue()!=data: raise RuntimeError('Upload mismatch: '+str(path))
          ftp.quit()
          def verify(path):
              with urllib.request.urlopen('https://www.italianmastersclub.it/'+str(path)+'?verify='+os.environ['GITHUB_SHA'],timeout=30) as response:
                  if response.read()!=path.read_bytes(): raise RuntimeError('Live mismatch: '+str(path))
          list(ThreadPoolExecutor(max_workers=6).map(verify,files))
          print('All national flags uploaded and verified live. No database changes.')
          PY
