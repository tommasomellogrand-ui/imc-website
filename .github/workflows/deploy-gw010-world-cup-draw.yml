name: Deploy GW010 World Cup Draw
on:
  push:
    branches: [main]
    paths:
      - 'sensible-soccer-academy/world-cup-draw/**'
      - '.github/workflows/deploy-gw010-world-cup-draw.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gw010-world-cup-draw-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          test -s sensible-soccer-academy/world-cup-draw/index.html
          test -s sensible-soccer-academy/world-cup-draw/live/index.html
          php -l sensible-soccer-academy/world-cup-draw/api.php
      - name: Upload and verify
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,os,ssl
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path
          root='/www.italianmastersclub.it/sensible-soccer-academy/world-cup-draw'
          ctx=ssl.create_default_context();ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx);ftp.connect('ftp.italianmastersclub.it',21,timeout=60);ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);ftp.prot_p();ftp.set_pasv(True)
          def cd(path):
            ftp.cwd('/')
            for p in path.strip('/').split('/'):
              try:ftp.cwd(p)
              except error_perm:ftp.mkd(p);ftp.cwd(p)
          base=Path('sensible-soccer-academy/world-cup-draw')
          for rel in ['index.html','api.php','live/index.html']:
            p=base/rel;remote=root+'/'+str(Path(rel).parent);cd(remote);data=p.read_bytes();ftp.storbinary('STOR '+p.name,io.BytesIO(data));chk=io.BytesIO();ftp.retrbinary('RETR '+p.name,chk.write);assert chk.getvalue()==data,rel
          cd(root)
          try:ftp.size('state.json')
          except Exception:ftp.storbinary('STOR state.json',io.BytesIO(b'{}\n'))
          try:ftp.sendcmd('SITE CHMOD 666 state.json')
          except Exception:pass
          ftp.quit()
          PY
      - name: Verify live
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          base='https://www.italianmastersclub.it/sensible-soccer-academy/world-cup-draw/'
          for path in ['', 'live/', 'api.php']:
            for i in range(6):
              try:
                with urllib.request.urlopen(base+path+'?v=${{ github.sha }}',timeout=30) as r:data=r.read()
                if r.status==200 and data:break
              except Exception:
                if i==5:raise
                time.sleep(5)
          with urllib.request.urlopen(base+'api.php?v=${{ github.sha }}',timeout=30) as r:s=json.load(r)
          assert s.get('ok') is True
          print('GW010 World Cup Draw live verified')
          PY
