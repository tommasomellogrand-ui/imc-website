name: Nexus assignments admin
on:
  push:
    branches: [main, nexus-admin-assignments]
    paths: ['nexus/admin/**', 'tests/nexus-admin*', '.github/workflows/nexus-admin.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-admin
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -padmin-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_TEST_PASSWORD: admin-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Test assignments without production writes
        run: |
          for file in nexus/admin/*.php; do php -l "$file"; done
          node --check nexus/admin/admin.js
          php tests/nexus-admin.php
          php tests/nexus-admin-results-check.php
          node --check nexus/admin/results-check.js
          python3 tests/nexus-admin-http.py
      - name: Test mobile admin flows
        run: |
          mkdir -p /tmp/nexus-admin-test
          npm install --prefix /tmp/nexus-admin-test --package-lock-only --ignore-scripts playwright@1.62.1
          npm ci --prefix /tmp/nexus-admin-test --ignore-scripts
          NEXUS_PLAYWRIGHT_PATH=/tmp/nexus-admin-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-admin-ui.cjs
          NEXUS_PLAYWRIGHT_PATH=/tmp/nexus-admin-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-admin-results-ui.cjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy admin and verify files
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, json, subprocess, tempfile, urllib.request, http.cookiejar
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)
          root='/www.italianmastersclub.it/'
          try: ftp.mkd(root+'nexus/admin')
          except error_perm: ftp.cwd(root+'nexus/admin')
          for local in [*Path('nexus/admin').glob('*'),Path('nexus/index.html')]:
              if not local.is_file(): continue
              ftp.cwd(root+local.parent.as_posix())
              data=local.read_bytes(); ftp.storbinary('STOR '+local.name,io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary('RETR '+local.name,check.write)
              if check.getvalue()!=data: raise RuntimeError('Upload mismatch: '+str(local))
          ftp.quit()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          base='https://www.italianmastersclub.it/nexus/admin/api.php'
          def call(body=None, query='', csrf=''):
              req=urllib.request.Request(base+query, data=json.dumps(body).encode() if body else None,
                  headers={'Content-Type':'application/json','X-CSRF-Token':csrf})
              with opener.open(req,timeout=30) as response: return json.load(response)
          auth=call({'action':'login','username':'admin','password':'admin'})
          if not auth.get('ok'): raise RuntimeError('Live admin login failed')
          for i in range(1,11):
              gw=f'GW{i:03d}'; result=call(query='?world='+gw)
              if not result.get('ok') or 'rows' not in result: raise RuntimeError('Admin read failed: '+gw)
              print(gw, len(result['rows']), 'assignments readable')
              meta=call(query='?action=check-meta&world='+gw)
              if not meta.get('ok'): raise RuntimeError('Results Check metadata failed: '+gw)
              dated=[d['date'] for d in meta['dates'] if d['date']!='undated' and d['date']<=meta['today']]
              if dated:
                  check=call(query='?action=results-check&world='+gw+'&date='+dated[-1])
                  if not check.get('ok') or 'summary' not in check: raise RuntimeError('Results Check failed: '+gw)
                  print(gw, check['summary'], 'read-only check verified')
          call({'action':'logout'},csrf=auth['csrf'])
          print('Admin deployed, login and all worlds verified; no assignment writes')
          PY
