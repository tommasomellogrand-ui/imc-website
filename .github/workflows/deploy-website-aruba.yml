name: Deploy IMC public website to Aruba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-public-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject GW001 build ID
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/BUILD_ID/${GITHUB_SHA}/g" gameworld001/index.html
          grep -Fq "app.js?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "menu.js?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "menu.css?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "competition-detail.js?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "competition-detail.css?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "competition-table.js?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "competition-table.css?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "competition-groups.js?v=${GITHUB_SHA}" gameworld001/index.html
          grep -Fq "competition-groups.css?v=${GITHUB_SHA}" gameworld001/index.html

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-assets/css/imc-site.css
          test -s site-assets/js/imc-site.js
          test -s site-assets/js/world-feed.js
          test -s site-assets/images/imc-logo.png
          test -s gameworld001/index.html
          test -s gameworld001/app.js
          test -s gameworld001/menu.js
          test -s gameworld001/menu.css
          test -s gameworld001/competition-detail.js
          test -s gameworld001/competition-detail.css
          test -s gameworld001/competition-table.js
          test -s gameworld001/competition-table.css
          test -s gameworld001/competition-groups.js
          test -s gameworld001/competition-groups.css
          test -s gameworld001/team-hub.js
          test -s gameworld001/style.css
          test -s gameworld001/.htaccess
          test -s api/imc-gateway/index.php
          test -s api/imc-gateway/team-hub.php
          test -s api/imc-gateway/config.php
          test -s __imc-gateway/__imc-gateway/index.php
          grep -Fq 'sm_player_stats' api/imc-gateway/config.php
          grep -Fq 'schedule_competition_key' api/imc-gateway/index.php
          grep -Fq 'GW001 · Road To History' gameworld001/index.html
          grep -Fq './app.js?v=' gameworld001/index.html
          grep -Fq './menu.js?v=' gameworld001/index.html
          grep -Fq './menu.css?v=' gameworld001/index.html
          grep -Fq './competition-detail.js?v=' gameworld001/index.html
          grep -Fq './competition-detail.css?v=' gameworld001/index.html
          grep -Fq './competition-table.js?v=' gameworld001/index.html
          grep -Fq './competition-table.css?v=' gameworld001/index.html
          grep -Fq './competition-groups.js?v=' gameworld001/index.html
          grep -Fq './competition-groups.css?v=' gameworld001/index.html
          grep -Fq './team-hub.js?v=' gameworld001/index.html
          grep -Fq './style.css?v=' gameworld001/index.html

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD; do test -n "${!name:-}"; done

      - name: Upload website and GW001 structure
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; port=21
          username=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          remote_root='/www.italianmastersclub.it'
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=None; last_error=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try:
                  c.connect(host,port,timeout=60); c.login(username,password); c.prot_p(); c.set_pasv(True); ftp=c; break
              except Exception as e:
                  last_error=e
                  try: c.close()
                  except Exception: pass
                  time.sleep(5)
          if ftp is None: raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}: {last_error}')
          def ensure_dir(remote_path):
              ftp.cwd('/')
              for part in [p for p in remote_path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)
          excluded={'site-assets/css/game-world.css','site-assets/css/gameworld-engine.css','site-assets/js/gameworld-engine.js','site-assets/js/imc-data-service.js','site-assets/js/team-hub-detail.js'}
          files=[Path('index.html')]
          files += [p for p in sorted(Path('site-assets').rglob('*')) if p.is_file() and p.as_posix() not in excluded]
          files += [
              Path('gameworld001/index.html'),
              Path('gameworld001/app.js'),
              Path('gameworld001/menu.js'),
              Path('gameworld001/menu.css'),
              Path('gameworld001/competition-detail.js'),
              Path('gameworld001/competition-detail.css'),
              Path('gameworld001/competition-table.js'),
              Path('gameworld001/competition-table.css'),
              Path('gameworld001/competition-groups.js'),
              Path('gameworld001/competition-groups.css'),
              Path('gameworld001/team-hub.js'),
              Path('gameworld001/style.css'),
              Path('gameworld001/.htaccess'),
              Path('api/imc-gateway/index.php'),
              Path('api/imc-gateway/team-hub.php'),
              Path('api/imc-gateway/config.php'),
              Path('__imc-gateway/__imc-gateway/index.php')
          ]
          for local in files:
              rel=local.as_posix(); parent=local.parent.as_posix(); dest=remote_root if parent=='.' else f"{remote_root.rstrip('/')}/{parent}"
              ensure_dir(dest); data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary(f'STOR {local.name}',fh)
              check=io.BytesIO(); ftp.retrbinary(f'RETR {local.name}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'Verifica upload fallita: {rel}')
          ftp.quit(); print(f'Pubblicati e verificati {len(files)} file')
          PY
