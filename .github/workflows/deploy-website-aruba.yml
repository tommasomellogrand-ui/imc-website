name: Deploy IMC public website to Aruba

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-public-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-assets/css/imc-site.css
          test -s site-assets/js/imc-site.js
          test -s site-assets/js/world-feed.js
          test -s site-assets/images/imc-logo.png
          test -s gameworld001/index.html
          test -s gameworld001/styles.css
          test -s gameworld001/.htaccess
          grep -Fq 'GW001 · SITE STRUCTURE PREVIEW' gameworld001/index.html

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_WEBSITE_REMOTE_DIR: ${{ secrets.ARUBA_WEBSITE_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_HOST ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD ARUBA_WEBSITE_REMOTE_DIR; do
            test -n "${!name:-}"
          done

      - name: Upload website and GW001 structure
        env:
          ARUBA_FTP_HOST: ${{ secrets.ARUBA_FTP_HOST }}
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          ARUBA_WEBSITE_REMOTE_DIR: ${{ secrets.ARUBA_WEBSITE_REMOTE_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, socket, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host=os.environ['ARUBA_FTP_HOST'].removeprefix('ftp://').removeprefix('ftps://').rstrip('/')
          username=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']
          remote_root=os.environ['ARUBA_WEBSITE_REMOTE_DIR'].strip() or '/'

          addresses=[]
          for item in socket.getaddrinfo(host,21,socket.AF_INET,socket.SOCK_STREAM):
              if item[4][0] not in addresses: addresses.append(item[4][0])
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=None; last_error=None
          for _ in range(3):
              for address in addresses:
                  c=FTP_TLS(context=ctx)
                  try:
                      c.connect(address,21,timeout=45); c.login(username,password); c.prot_p(); ftp=c; break
                  except Exception as e:
                      last_error=e
                      try: c.close()
                      except Exception: pass
              if ftp: break
              time.sleep(5)
          if ftp is None: raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}')

          def ensure_dir(remote_path):
              ftp.cwd('/')
              for part in [p for p in remote_path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)

          excluded={
              'site-assets/css/game-world.css',
              'site-assets/css/gameworld-engine.css',
              'site-assets/js/gameworld-engine.js',
              'site-assets/js/imc-data-service.js',
              'site-assets/js/team-hub-detail.js',
          }

          files=[Path('index.html')]
          files += [p for p in sorted(Path('site-assets').rglob('*')) if p.is_file() and p.as_posix() not in excluded]
          files += [Path('gameworld001/index.html'),Path('gameworld001/styles.css'),Path('gameworld001/.htaccess')]

          for local in files:
              rel=local.as_posix(); parent=local.parent.as_posix()
              dest=remote_root if parent=='.' else f"{remote_root.rstrip('/')}/{parent}"
              ensure_dir(dest)
              data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary(f'STOR {local.name}',fh)
              check=io.BytesIO(); ftp.retrbinary(f'RETR {local.name}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'Verifica upload fallita: {rel}')

          ftp.quit()
          print(f'Pubblicati e verificati {len(files)} file')
          PY

      - name: Verify GW001 online
        shell: bash
        run: |
          set -euo pipefail
          token="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "https://www.italianmastersclub.it/gameworld001/?verify=$token" -o /tmp/gw001.html
          grep -Fq 'GW001 · SITE STRUCTURE PREVIEW' /tmp/gw001.html
          grep -Fq 'WORLD CHRONICLE' /tmp/gw001.html
          echo 'GW001 structure online OK'
