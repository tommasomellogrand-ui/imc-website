name: Deploy IMC public website to Aruba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-public-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Game World build IDs
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/BUILD_ID/${GITHUB_SHA}/g" site-assets/gameworld/app-core.js || true
          for i in $(seq 1 15); do
            n=$(printf "%03d" "$i")
            d="gameworld${n}"
            sed -i "s/BUILD_ID/${GITHUB_SHA}/g" "$d/index.html"
            grep -Fq "pilot-theme.css?v=${GITHUB_SHA}" "$d/index.html"
            grep -Fq "config.js?v=${GITHUB_SHA}" "$d/index.html"
            grep -Fq "/site-assets/gameworld/app-core.js?v=${GITHUB_SHA}" "$d/index.html"
          done

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-assets/css/imc-site.css
          test -s site-assets/js/imc-site.js
          test -s site-assets/images/imc-logo.png
          test -s site-assets/gameworld/app-core.js
          test -s sensible-soccer-academy-creation/gw-setting/draft-matrix.html
          test -s sensible-soccer-academy-creation/gw-setting/.htaccess
          test -s sensible-soccer-academy-creation/gw-setting/sensible-soccer-academy-logo.svg
          test -s sensible-soccer-academy-creation/gw-setting/crest-local-map.js
          test -s sensible-soccer-academy-creation/gw-setting/draft-enhancements.js
          test -s sensible-soccer-academy/assets/crest-overrides.js
          for i in $(seq 1 15); do
            n=$(printf "%03d" "$i")
            d="gameworld${n}"
            test -s "$d/index.html"
            test -s "$d/config.js"
            test -s "$d/pilot-theme.css"
            test -s "$d/.htaccess"
            grep -Fq "GW${n}" "$d/config.js"
            grep -Fq "Game word ${n}" "$d/config.js"
          done
          test -s api/imc-gateway/index.php
          test -s api/imc-gateway/config.php
          test -s api/imc-data/v1/site-ready.php
          test -s api/imc-data/v1/.htaccess
          php -l api/imc-data/v1/site-ready.php
          test -s __imc-gateway/__imc-gateway/index.php
          test -s __imc-sm-master/admin/database-manager/normalizer.php

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD; do test -n "${!name:-}"; done

      - name: Upload website and all Game Worlds
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl, time, urllib.request
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; port=21
          username=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          remote_root='/www.italianmastersclub.it'
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=None; last_error=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try:
                  c.connect(host,port,timeout=60); c.login(username,password); c.prot_p(); c.set_pasv(True); ftp=c; break
              except Exception as e:
                  last_error=e
                  try: c.close()
                  except Exception: pass
                  time.sleep(5)
          if ftp is None: raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}: {last_error}')
          def ensure_dir(remote_path):
              ftp.cwd('/')
              for part in [p for p in remote_path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)
          def clear_dir(remote_path):
              try: names=ftp.nlst(remote_path)
              except error_perm: return
              for item in names:
                  name=item.rsplit('/',1)[-1]
                  if name in ('.','..'): continue
                  try: ftp.delete(item)
                  except error_perm:
                      clear_dir(item)
                      try: ftp.rmd(item)
                      except error_perm: pass
          sensible_remote=f"{remote_root}/sensible-soccer-academy"
          clear_dir(sensible_remote); ensure_dir(sensible_remote)
          for i in range(1,16):
              remote=f"{remote_root}/gameworld{i:03d}"
              clear_dir(remote); ensure_dir(remote)
          excluded={'site-assets/css/game-world.css','site-assets/css/gameworld-engine.css','site-assets/js/gameworld-engine.js','site-assets/js/imc-data-service.js','site-assets/js/team-hub-detail.js'}
          files=[Path('index.html')]
          files += [p for p in sorted(Path('site-assets').rglob('*')) if p.is_file() and p.as_posix() not in excluded]
          files += [Path('sensible-soccer-academy-creation/gw-setting/draft-matrix.html'),Path('sensible-soccer-academy-creation/gw-setting/.htaccess'),Path('sensible-soccer-academy-creation/gw-setting/sensible-soccer-academy-logo.svg')]
          for i in range(1,16):
              d=Path(f'gameworld{i:03d}')
              files += [d/'index.html',d/'config.js',d/'pilot-theme.css',d/'.htaccess']
          files += [Path('api/imc-gateway/index.php'),Path('api/imc-gateway/config.php'),Path('api/imc-data/v1/site-ready.php'),Path('api/imc-data/v1/.htaccess'),Path('__imc-gateway/__imc-gateway/index.php'),Path('__imc-sm-master/admin/database-manager/normalizer.php')]
          for local in files:
              rel=local.as_posix(); parent=local.parent.as_posix(); dest=remote_root if parent=='.' else f"{remote_root.rstrip('/')}/{parent}"
              ensure_dir(dest); data=local.read_bytes()
              with local.open('rb') as fh: ftp.storbinary(f'STOR {local.name}',fh)
              check=io.BytesIO(); ftp.retrbinary(f'RETR {local.name}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'Verifica upload fallita: {rel}')

          crest_sources={
            'penarol.png':('uruguay','penarol'),
            'colo-colo.png':('chile','colo-colo'),
            'millonarios.png':('colombia','millonarios'),
            'bolivar.png':('bolivia','bolivar'),
            'olimpia.png':('paraguay','olimpia'),
            'alianza-lima.png':('peru','alianza-lima'),
            'santos.png':('brazil','santos'),
            'sao-paulo.png':('brazil','sao-paulo'),
            'gremio.png':('brazil','gremio'),
            'argentinos-juniors.png':('argentina','argentinos-juniors'),
            'newells-old-boys.png':('argentina','newells-old-boys'),
            'velez-sarsfield.png':('argentina','velez-sarsfield'),
            'atalanta.png':('italy','atalanta'),
            'ferencvaros.png':('hungary','ferencvaros'),
            'ifk-goteborg.png':('sweden','ifk-goteborg'),
            'aberdeen.png':('scotland','aberdeen'),
            'sevilla.png':('spain','sevilla'),
            'west-ham.png':('england','west-ham'),
            'vfb-stuttgart.png':('germany','vfb-stuttgart'),
            'anderlecht.png':('belgium','anderlecht'),
            'ajax.png':('netherlands','ajax'),
            'lyon.png':('france','lyon'),
            'dinamo-zagreb.png':('croatia','dinamo-zagreb'),
            'benfica.png':('portugal','benfica'),
          }
          crest_remote=f"{remote_root}/sensible-soccer-academy-creation/gw-setting/crests"
          clear_dir(crest_remote); ensure_dir(crest_remote)
          opener=urllib.request.build_opener()
          opener.addheaders=[('User-Agent','Mozilla/5.0 IMC-GW010/1.0'),('Accept','image/png,image/*;q=0.9,*/*;q=0.1')]
          uploaded=0
          for filename,(country,slug) in crest_sources.items():
              data=None; errors=[]
              for size in ('512x512','256x256'):
                  url=f'https://football-logos.cc/logos/{country}/{size}/{slug}.png'
                  try:
                      with opener.open(url,timeout=20) as r:
                          candidate=r.read()
                          if len(candidate)>64 and candidate.startswith(b'\x89PNG'):
                              data=candidate; break
                          errors.append(f'{url}: invalid PNG {len(candidate)} bytes')
                  except Exception as e:
                      errors.append(f'{url}: {type(e).__name__}: {e}')
              if data is None:
                  raise SystemExit('Logo non scaricato '+filename+' | '+' | '.join(errors))
              ftp.storbinary(f'STOR {filename}',io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary(f'RETR {filename}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'Verifica upload fallita crest: {filename}')
              uploaded+=1
          if uploaded!=24: raise SystemExit(f'Attesi 24 crest, caricati {uploaded}')

          crest_local=Path('sensible-soccer-academy/assets/crest-overrides.js')
          crest_map_local=Path('sensible-soccer-academy-creation/gw-setting/crest-local-map.js')
          enhancement_local=Path('sensible-soccer-academy-creation/gw-setting/draft-enhancements.js')
          crest_dest=f"{remote_root}/sensible-soccer-academy-creation/gw-setting"
          ensure_dir(crest_dest)
          crest_data=crest_local.read_bytes()+b'\n'+crest_map_local.read_bytes()+b'\n'+enhancement_local.read_bytes()
          ftp.storbinary('STOR crest-overrides.js',io.BytesIO(crest_data))
          crest_check=io.BytesIO(); ftp.retrbinary('RETR crest-overrides.js',crest_check.write)
          if crest_check.getvalue()!=crest_data: raise SystemExit('Verifica upload fallita: Draft Matrix crest bundle')
          ftp.quit(); print(f'Pubblicati e verificati {len(files)+25} file; GW010 crest locali 24/24')
          PY
