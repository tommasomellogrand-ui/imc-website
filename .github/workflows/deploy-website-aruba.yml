name: Deploy IMC public website to Aruba

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-public-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-assets/css/imc-site.css
          test -s site-assets/js/imc-site.js
          test -s site-assets/js/world-feed.js
          test -s site-assets/images/imc-logo.png
          test -s gameworld001/index.html
          test -s gameworld001/app.js
          test -s gameworld001/style.css
          test -s gameworld001/.htaccess
          grep -Fq 'GW001 · Road To History' gameworld001/index.html
          grep -Fq './app.js' gameworld001/index.html
          grep -Fq './style.css' gameworld001/index.html

      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD; do
            test -n "${!name:-}"
          done

      - name: Upload website and GW001 structure
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host='ftp.italianmastersclub.it'
          port=21
          username=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']

          ctx=ssl.create_default_context()
          ctx.check_hostname=False
          ftp=None
          last_error=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try:
                  c.connect(host,port,timeout=60)
                  c.login(username,password)
                  c.prot_p()
                  c.set_pasv(True)
                  ftp=c
                  break
              except Exception as e:
                  last_error=e
                  try: c.close()
                  except Exception: pass
                  time.sleep(5)
          if ftp is None:
              raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}: {last_error}')

          print('FTP PWD:', ftp.pwd())
          try:
              print('FTP ROOT ENTRIES:', ' | '.join(ftp.nlst()))
          except Exception as e:
              print('FTP ROOT LIST ERROR:', type(e).__name__, str(e))

          raise SystemExit('Diagnostica FTP completata: nessun upload eseguito')
          PY

      - name: Verify GW001 online
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          token="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "https://www.italianmastersclub.it/gameworld001/?verify=$token" -o /tmp/gw001.html
          curl -fsSL -H 'Cache-Control: no-cache, no-store' "https://www.italianmastersclub.it/gameworld001/app.js?verify=$token" -o /tmp/gw001-app.js
          grep -Fq 'GW001 · Road To History' /tmp/gw001.html
          grep -Fq './app.js' /tmp/gw001.html
          grep -Fq 'Tommaso Mello' /tmp/gw001-app.js
          grep -Fq 'manager IMC attivi' /tmp/gw001-app.js
          echo 'GW001 current application online OK'
