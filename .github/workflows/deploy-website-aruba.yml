name: Deploy IMC public website to Aruba

on:
  push:
    branches: [main]
    paths-ignore:
      - 'minisite/GW001/**'
      - 'minisite/GW007/**'
      - 'minisite/api/results-schedule.php'
      - 'minisite/integrations/results-schedule/**'
      - '.github/workflows/deploy-minisite-results-schedule.yml'
      - '.github/workflows/deploy-minisite-gw001.yml'
      - '.github/workflows/deploy-minisite-gw007.yml'
      - 'imc-universal-gateway/**'
      - '__imc_private_gateway/**'
      - 'tests/gateway-world-*'
      - 'docs/gateway-gw015-routing-pending.md'
      - '.github/workflows/test-gateway-world-routing.yml'
      - '.github/workflows/deploy-imc-universal-gateway-aruba.yml'
      - 'minisite/platform/**'
      - 'minisite/tests/**'
      - '.github/workflows/minisite-platform-foundation.yml'
      - 'minisite/GW006/**'
      - '.github/workflows/deploy-minisite-gw006.yml'
      - 'minisite/GW009/**'
      - '.github/workflows/deploy-minisite-gw009.yml'
      - 'minisite/GW004/**'
      - '.github/workflows/deploy-minisite-gw004.yml'
      - 'index.html'
      - 'site-assets/master/**'
      - 'docs/official-website/**'
      - '.github/workflows/deploy-imc-master.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: imc-public-website-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Nexus before publish
        shell: bash
        run: |
          set -euo pipefail
          php -l nexus/public/trophies.php
          php nexus/public/trophies.test.php
          php -l nexus/public/hub.php
          php nexus/public/competition-names.test.php
          php -l nexus/public/core.php
          php nexus/public/core.test.php
          php -l nexus/public/data.php
          node --check nexus/public/site.js
          node --check nexus/public/clubhouse.js
          node --test nexus/public/news.test.cjs
          node --check nexus/public/match.js
          node --test nexus/public/hub.test.cjs
          ! grep -Eiq 'supabase|v1/app|password|loginView' nexus/index.html nexus/public/site.js
      - name: Inject Game World build IDs
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/BUILD_ID/${GITHUB_SHA}/g" site-assets/gameworld/app-core.js || true
          for i in $(seq 1 15); do
            n=$(printf "%03d" "$i"); d="gameworld${n}"
            sed -i "s/BUILD_ID/${GITHUB_SHA}/g" "$d/index.html"
            grep -Fq "pilot-theme.css?v=${GITHUB_SHA}" "$d/index.html"
            grep -Fq "config.js?v=${GITHUB_SHA}" "$d/index.html"
            grep -Fq "/site-assets/gameworld/app-core.js?v=${GITHUB_SHA}" "$d/index.html"
          done
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-assets/css/imc-site.css
          test -s site-assets/js/imc-site.js
          test -s site-assets/images/imc-logo.png
          test -s site-assets/gameworld/app-core.js
          test -s sensible-soccer-academy/world-cup-draw/index.html
          test -s sensible-soccer-academy/world-cup-draw/api.php
          test -s sensible-soccer-academy/world-cup-draw/live/index.html
          php -l sensible-soccer-academy/world-cup-draw/api.php
          test -s sensible-soccer-academy-creation/gw-setting/draft-matrix.html
          test -s sensible-soccer-academy-creation/gw-setting/.htaccess
          test -s sensible-soccer-academy-creation/gw-setting/sensible-soccer-academy-logo.svg
          test -s sensible-soccer-academy-creation/gw-setting/draft-enhancements.js
          test -s sensible-soccer-academy-creation/gw-setting/draft-chat.js
          test -s sensible-soccer-academy-creation/gw-setting/draft-live.js
          test -s sensible-soccer-academy-creation/gw-setting/draw-live.php
          php -l sensible-soccer-academy-creation/gw-setting/draw-live.php
          test -s sensible-soccer-academy-creation/gw-setting/replay-recorder.js
          test -s sensible-soccer-academy-creation/draw-replay/index.html
          test -s sensible-soccer-academy-creation/draw-replay/replay.php
          php -l sensible-soccer-academy-creation/draw-replay/replay.php
          for i in $(seq 1 15); do
            n=$(printf "%03d" "$i"); d="gameworld${n}"
            test -s "$d/index.html"; test -s "$d/config.js"; test -s "$d/pilot-theme.css"; test -s "$d/.htaccess"
            grep -Fq "GW${n}" "$d/config.js"; grep -Fq "Game word ${n}" "$d/config.js"
          done
          test -s api/imc-gateway/index.php
          test -s api/imc-gateway/config.php
          test -s api/imc-gateway/database.php
          php -l api/imc-gateway/index.php
          php -l api/imc-gateway/database.php
          test -s api/imc-data/v1/site-ready.php
          test -s api/imc-data/v1/.htaccess
          php -l api/imc-data/v1/site-ready.php
          test -s __imc-gateway/__imc-gateway/index.php
          test -s __imc-sm-master/admin/database-manager/normalizer.php
      - name: Validate Aruba secrets
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ARUBA_FTP_USERNAME ARUBA_FTP_PASSWORD; do test -n "${!name:-}"; done
      - name: Upload website and all Game Worlds
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl, time
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; port=21; remote_root='/www.italianmastersclub.it'
          username=os.environ['ARUBA_FTP_USERNAME']; password=os.environ['ARUBA_FTP_PASSWORD']
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ftp=None; last_error=None
          for _ in range(3):
              c=FTP_TLS(context=ctx)
              try: c.connect(host,port,timeout=60); c.login(username,password); c.prot_p(); c.set_pasv(True); ftp=c; break
              except Exception as e:
                  last_error=e
                  try:c.close()
                  except Exception:pass
                  time.sleep(5)
          if ftp is None: raise SystemExit(f'FTPS Aruba non riuscito: {type(last_error).__name__}: {last_error}')
          def ensure_dir(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
          def clear_dir(path):
              try:names=ftp.nlst(path)
              except error_perm:return
              for item in names:
                  if item.rsplit('/',1)[-1] in ('.','..'):continue
                  try:ftp.delete(item)
                  except error_perm:
                      clear_dir(item)
                      try:ftp.rmd(item)
                      except error_perm:pass
          sensible_remote=f'{remote_root}/sensible-soccer-academy'; clear_dir(sensible_remote); ensure_dir(sensible_remote)
          for i in range(1,16):
              remote=f'{remote_root}/gameworld{i:03d}'; clear_dir(remote); ensure_dir(remote)
          excluded={'site-assets/css/game-world.css','site-assets/css/gameworld-engine.css','site-assets/js/gameworld-engine.js','site-assets/js/imc-data-service.js','site-assets/js/team-hub-detail.js'}
          files=[Path('index.html')]
          files += [p for p in sorted(Path('site-assets').rglob('*')) if p.is_file() and p.as_posix() not in excluded]
          files += [Path('sensible-soccer-academy/world-cup-draw/index.html'),Path('sensible-soccer-academy/world-cup-draw/api.php'),Path('sensible-soccer-academy/world-cup-draw/live/index.html')]
          files += [Path('sensible-soccer-academy-creation/gw-setting/draft-matrix.html'),Path('sensible-soccer-academy-creation/gw-setting/.htaccess'),Path('sensible-soccer-academy-creation/gw-setting/sensible-soccer-academy-logo.svg'),Path('sensible-soccer-academy-creation/gw-setting/draw-live.php')]
          files += [Path('sensible-soccer-academy-creation/draw-replay/index.html'),Path('sensible-soccer-academy-creation/draw-replay/replay.php')]
          for i in range(1,16):
              d=Path(f'gameworld{i:03d}'); files += [d/'index.html',d/'config.js',d/'pilot-theme.css',d/'.htaccess']
          files += [Path('api/imc-gateway/index.php'),Path('api/imc-gateway/config.php'),Path('api/imc-gateway/database.php'),Path('api/imc-data/v1/site-ready.php'),Path('api/imc-data/v1/.htaccess'),Path('__imc-gateway/__imc-gateway/index.php'),Path('__imc-sm-master/admin/database-manager/normalizer.php')]
          for local in files:
              parent=local.parent.as_posix(); dest=remote_root if parent=='.' else f'{remote_root}/{parent}'
              ensure_dir(dest); data=local.read_bytes()
              with local.open('rb') as fh:ftp.storbinary(f'STOR {local.name}',fh)
              check=io.BytesIO();ftp.retrbinary(f'RETR {local.name}',check.write)
              if check.getvalue()!=data:raise SystemExit(f'Verifica upload fallita: {local}')
          state_dest=f'{remote_root}/sensible-soccer-academy/world-cup-draw'; ensure_dir(state_dest)
          try:ftp.size('state.json')
          except Exception:ftp.storbinary('STOR state.json',io.BytesIO(b'{"event":"waiting","phase":"idle","current_manager":null,"current_slot":null,"assignments":[]}\n'))
          try:ftp.sendcmd('SITE CHMOD 666 state.json')
          except Exception:pass
          enhancement_local=Path('sensible-soccer-academy-creation/gw-setting/draft-enhancements.js'); chat_local=Path('sensible-soccer-academy-creation/gw-setting/draft-chat.js'); live_local=Path('sensible-soccer-academy-creation/gw-setting/draft-live.js'); recorder_local=Path('sensible-soccer-academy-creation/gw-setting/replay-recorder.js')
          runtime_dest=f'{remote_root}/sensible-soccer-academy-creation/gw-setting'; ensure_dir(runtime_dest)
          runtime_data=enhancement_local.read_bytes()+b'\n'+chat_local.read_bytes()+b'\n'+live_local.read_bytes()+b'\n'+recorder_local.read_bytes()
          ftp.storbinary('STOR crest-overrides.js',io.BytesIO(runtime_data)); check=io.BytesIO();ftp.retrbinary('RETR crest-overrides.js',check.write)
          if check.getvalue()!=runtime_data:raise SystemExit('Verifica upload fallita: Draft Matrix runtime bundle')
          ftp.quit(); print(f'Pubblicati e verificati {len(files)+1} file; World Cup Draw incluso')
          PY
      - name: Publish Nexus to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: python3 nexus/public/deploy.py
      - name: Verify GW010 World Cup Draw live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,time
          urls=['https://www.italianmastersclub.it/sensible-soccer-academy/world-cup-draw/','https://www.italianmastersclub.it/sensible-soccer-academy/world-cup-draw/live/','https://www.italianmastersclub.it/sensible-soccer-academy/world-cup-draw/api.php']
          for url in urls:
              last=None
              for _ in range(6):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'IMC-Deploy-Verify/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read()
                          if r.status==200 and body:
                              print(url,'OK',len(body));break
                  except Exception as e:last=e;time.sleep(5)
              else:raise SystemExit(f'Live verification failed: {url}: {last}')
          PY
