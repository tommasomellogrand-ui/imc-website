name: Deploy minisite GW001 clean home

on:
  push:
    branches: [main]
    paths:
      - 'minisite/GW001/**'
      - '.github/workflows/deploy-minisite-gw001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate clean GW001 package
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html home.css road-to-history-hero.webp .htaccess; do test -s "minisite/GW001/$f"; done
          grep -Fq 'home.css' minisite/GW001/index.html
          grep -Fq 'road-to-history-hero.webp' minisite/GW001/index.html

      - name: Upload clean GW001 to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; remote='/www.italianmastersclub.it/minisite/GW001'
          keep=['index.html','home.css','road-to-history-hero.webp','.htaccess']
          obsolete=['app.js','config.js','home-app.js','home-hero.svg','home-master.css','legacy.html','sky-theme.css','hero-note.txt']
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect(host,21,timeout=60); ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          ftp.cwd(remote)
          for name in obsolete:
              try: ftp.delete(name); print('removed',name)
              except error_perm: pass
          for name in keep:
              local=Path('minisite/GW001')/name; data=local.read_bytes()
              with local.open('rb') as f: ftp.storbinary(f'STOR {name}',f)
              check=io.BytesIO(); ftp.retrbinary(f'RETR {name}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'FTP verify failed: {name}')
              print(f'GW001 {name}: {len(data)} bytes verified')
          ftp.quit()
          PY

      - name: Verify clean GW001 live
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          base='https://www.italianmastersclub.it/minisite/GW001/'
          html=$(curl -fsSL --max-time 30 "${base}?verify=${GITHUB_SHA}")
          printf '%s' "$html" | grep -Fq 'home.css'
          printf '%s' "$html" | grep -Fq 'road-to-history-hero.webp'
          for f in home.css road-to-history-hero.webp; do curl -fsSIL --max-time 30 "${base}${f}?verify=${GITHUB_SHA}" | grep -Eq '^HTTP/.* 200'; done
          headers=$(curl -fsSIL --max-time 30 "${base}?verify_headers=${GITHUB_SHA}")
          printf '%s\n' "$headers" | grep -Eqi '^cache-control:.*(no-store|no-cache|max-age=0)'
          echo 'GW001 clean home live verification passed.'
