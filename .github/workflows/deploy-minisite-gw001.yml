name: Deploy minisite GW001 master home

on:
  push:
    branches: [main]
    paths:
      - 'minisite/GW001/**'
      - '.github/workflows/deploy-minisite-gw001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GW001 package
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html config.js home-master.css home-app.js home-hero.svg legacy.html sky-theme.css app.js .htaccess; do test -s "minisite/GW001/$f"; done
          grep -Fq '/minisite/shared/app-core.js' minisite/GW001/index.html
          grep -Fq "id:'GW001'" minisite/GW001/config.js
          grep -Fq 'window.IMC_MINISITE_DATA' minisite/GW001/home-app.js

      - name: Upload GW001 to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path
          host='ftp.italianmastersclub.it'; port=21
          remote='/www.italianmastersclub.it/minisite/GW001'
          files=['index.html','config.js','home-master.css','home-app.js','home-hero.svg','legacy.html','sky-theme.css','app.js','.htaccess']
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect(host,port,timeout=60); ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          def ensure(path):
              ftp.cwd('/')
              for part in [p for p in path.split('/') if p]:
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part); ftp.cwd(part)
          ensure(remote)
          for name in files:
              local=Path('minisite/GW001')/name
              data=local.read_bytes()
              with local.open('rb') as f: ftp.storbinary(f'STOR {name}',f)
              check=io.BytesIO(); ftp.retrbinary(f'RETR {name}',check.write)
              if check.getvalue()!=data: raise SystemExit(f'FTP verify failed: {name}')
              print(f'GW001 {name}: {len(data)} bytes verified')
          ftp.quit()
          PY

      - name: Verify live GW001
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          base='https://www.italianmastersclub.it/minisite/GW001/'
          html=$(curl -fsSL --max-time 30 "${base}?verify=${GITHUB_SHA}")
          printf '%s' "$html" | grep -Fq 'home-master.css'
          printf '%s' "$html" | grep -Fq 'home-app.js'
          for f in home-app.js home-master.css home-hero.svg legacy.html; do curl -fsSIL --max-time 30 "${base}${f}?verify=${GITHUB_SHA}" | grep -Eq '^HTTP/.* 200'; done
          headers=$(curl -fsSIL --max-time 30 "${base}?verify_headers=${GITHUB_SHA}")
          printf '%s\n' "$headers" | grep -Eqi '^cache-control:.*(no-store|no-cache|max-age=0)'
          echo 'GW001 master home live verification passed.'
