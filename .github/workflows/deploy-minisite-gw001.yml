name: Deploy GW001 CORE and Match Report
on:
  push:
    branches: [main]
    paths:
      - 'minisite/GW001/**'
      - '.github/workflows/deploy-minisite-gw001.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minisite-gw001-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GW001 snapshot and contracts
        run: |
          php -l minisite/GW001/api.php
          php -l minisite/GW001/seasons.php
          php minisite/GW001/seasons.test.php
          node --check minisite/GW001/core-app.js
          node --check minisite/GW001/core-views.js
          node --check minisite/GW001/data-client.js
          node --check minisite/GW001/live-fixtures.js
          python3 minisite/GW001/verify.py
          node --test minisite/tests/contracts.test.mjs minisite/tests/gw001-core.test.mjs
          node --test minisite/GW001/world-state.test.mjs
          node --test minisite/GW001/competition-catalog.test.mjs
          node minisite/tests/verify-isolation.mjs
      - name: Deploy only GW001 dependencies and entry points
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: python3 minisite/GW001/deploy.py
      - name: Verify live bytes and every available club report
        run: python3 minisite/GW001/verify.py --live
      - name: Verify competitions desktop and mobile
        run: |
          npm install --prefix "$RUNNER_TEMP/gw001-competitions" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/gw001-competitions/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/gw001-competitions/node_modules" node minisite/GW001/competitions-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gw001-core-match-report-evidence
          path: |
            minisite/GW001/live-evidence.json
            minisite/GW001/competition-evidence/
