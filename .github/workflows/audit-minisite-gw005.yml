name: Audit minisite GW005

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-minisite-gw005.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read GW005 and shared files from Aruba FTP
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import io, os, ssl
          from ftplib import FTP_TLS
          host='ftp.italianmastersclub.it'; port=21
          root='/www.italianmastersclub.it/minisite'
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect(host,port,timeout=60); ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          for d in [f'{root}/GW005',f'{root}/shared']:
              print('\n### LIST', d)
              for x in ftp.nlst(d): print(x)
          for p in [f'{root}/GW005/index.html',f'{root}/GW005/config.js',f'{root}/GW005/pilot-theme.css',f'{root}/GW005/.htaccess',f'{root}/shared/app-core.js']:
              print('\n### FILE', p)
              b=io.BytesIO(); ftp.retrbinary(f'RETR {p}',b.write); print(b.getvalue().decode('utf-8','replace'))
          ftp.quit()
          PY
          # audit-trigger: 2026-09-09T12:00
