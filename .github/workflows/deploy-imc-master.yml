name: Deploy IMC Public Homepage
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-assets/master/**'
      - '.github/workflows/deploy-imc-master.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imc-public-website-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate master application
        run: |
          node --check site-assets/master/homepage.js
          php -l site-assets/master/homepage.php
          python3 -m json.tool site-assets/master/release.json >/dev/null
      - name: Upload bounded master manifest and verify bytes
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,json,os,ssl
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path
          root='/www.italianmastersclub.it'
          ctx=ssl.create_default_context();ctx.check_hostname=False  # Existing Aruba FTPS alias policy; CA validation remains enabled.
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          def directory(path):
              ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
          files=[Path('site-assets/master')/name for name in ['homepage.php','homepage.js','homepage.css','homepage-preview.html','release.json']]
          for p in files:
              directory(root+'/'+p.parent.as_posix())
              data=p.read_bytes();ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              if check.getvalue()!=data:raise SystemExit('Upload verification failed: '+str(p))
          ftp.quit()
          print('Master assets uploaded and byte verified:',len(files))
          PY
      - name: Verify public directory before root publication
        run: |
          python3 - <<'PYCODE'
          import json,urllib.request
          url='https://www.italianmastersclub.it/site-assets/master/homepage.php?release=${{ github.sha }}'
          with urllib.request.urlopen(url,timeout=45) as response:data=json.load(response)
          assert data.get('ok') and data['worlds'] and data['managers'], 'Directory unavailable'
          ids=[m['manager_id'] for m in data['managers']]
          assert len(ids)==len(set(ids)), 'Duplicate managers'
          for world in data['worlds']:
              gw=world['game_world_id']
              assert world['href']=='/nexus/?world='+gw
              assert world['manager_count']==sum(gw in m['worlds'] for m in data['managers'])
          print('Live directory verified:',len(data['worlds']),'worlds,',len(ids),'active managers')
          PYCODE
      - name: Publish root only after data verification
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,json,os,ssl
          from pathlib import Path
          from ftplib import FTP_TLS
          release=json.loads(Path('site-assets/master/release.json').read_text())
          if not release.get('publish_root'):
              print('Review stage only; production homepage preserved.');raise SystemExit(0)
          ctx=ssl.create_default_context();ctx.check_hostname=False  # Existing Aruba FTPS alias policy; CA validation remains enabled.
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);ftp.prot_p()
          ftp.cwd('/www.italianmastersclub.it')
          data=Path('index.html').read_bytes();ftp.storbinary('STOR index.html',io.BytesIO(data))
          check=io.BytesIO();ftp.retrbinary('RETR index.html',check.write)
          assert check.getvalue()==data,'Root byte verification failed'
          ftp.quit();print('Root published and byte verified')
          PY
      - name: Verify published homepage
        run: |
          python3 - <<'PYCODE'
          import urllib.request
          with urllib.request.urlopen('https://www.italianmastersclub.it/?release=${{ github.sha }}',timeout=45) as r:html=r.read().decode()
          assert 'site-assets/master/homepage.js?v=20261007a' in html
          assert 'site-assets/master/homepage.css?v=20261007a' in html
          assert 'THE WORLD IS' in html and 'OUR PLAYGROUND.' in html
          assert '/gameworld001/' not in html
          print('Public homepage verified')
          PYCODE
