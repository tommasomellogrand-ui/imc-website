name: Publish GW001 four competition pages
on:
  push:
    branches: [main]
    paths:
      - 'nexus/gw001/rth-champions-league/**'
      - 'nexus/gw001/rth-europa-league/**'
      - 'nexus/gw001/rth-conference-league/**'
      - 'nexus/gw001/rth-club-world-cup/**'
      - 'nexus/gw001/assets/**'
      - 'nexus/competitions/catalog.php'
      - 'nexus/assets/competition-ui.js'
      - '.github/workflows/deploy-gw001-four-cups.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imc-gw001-four-cups
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify only four pages and four banners
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,io,ssl,hashlib,urllib.request,time
          from pathlib import Path
          from ftplib import FTP_TLS,error_perm
          pages=['rth-champions-league','rth-europa-league','rth-conference-league','rth-club-world-cup']
          images=['champions-league-banner.jpg','europa-league-banner.jpg','conference-league-banner.jpg','club-world-cup-banner.jpg']
          files=[Path('nexus/gw001/assets')/n for n in images]+[Path('nexus/gw001')/n/'index.html' for n in pages]+[Path('nexus/competitions/catalog.php'),Path('nexus/assets/competition-ui.js'),Path('nexus/assets/home.js'),Path('nexus/assets/navigation.js'),Path('nexus/index.html')]
          for p in files:
              assert p.is_file() and p.stat().st_size>1000,p
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD'])
          ftp.prot_p()
          for p in files:
              ftp.cwd('/')
              for part in ('/www.italianmastersclub.it/'+str(p.parent)).split('/'):
                  if not part: continue
                  try: ftp.cwd(part)
                  except error_perm: ftp.mkd(part);ftp.cwd(part)
              data=p.read_bytes()
              ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write)
              assert check.getvalue()==data,p
              print('Uploaded and verified',p,len(data))
          ftp.quit()
          for p in files:
              url='https://www.italianmastersclub.it/'+str(p)+'?world=GW001&verify='+os.environ['GITHUB_SHA']
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=30) as r:
                          data=r.read()
                      if p.suffix=='.php':
                          import json
                          payload=json.loads(data)
                          assert payload.get('ok') is True,p
                          assert all(r.get('competition_group')!='IMC' and r.get('sm_action')!='imc_custom' for r in payload['rows']),p
                      else: assert data==p.read_bytes(),p
                      print('HTTP verified',p)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(3)
          PY
