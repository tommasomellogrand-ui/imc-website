name: Publish reduced Competition Mapping columns
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/competition-mapping-columns.yml'
      - 'database-migrations/20261117_competition_mapping_remove_type_country.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: competition-mapping-columns
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mapping-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pmapping-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Test removed view columns, retained mappings and actual consumer queries
        env:
          MYSQL_TEST_PASSWORD: mapping-ci-only
        run: |
          php tests/competition-codex-unification.php
          php -l nexus/competitions/overview.php
          php -l site-data/competitions/overview.php
          php -l site-data/competitions/custom-cups.php
      - name: Publish updated consumers with byte verification
        env:
          FTP_USER: ${{ secrets.ARUBA_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io,os,ssl
          from pathlib import Path
          from ftplib import FTP_TLS
          ctx=ssl.create_default_context();ctx.check_hostname=False
          with FTP_TLS(context=ctx,timeout=60) as ftp:
              ftp.connect('ftp.italianmastersclub.it');ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASS']);ftp.prot_p()
              for name in ['nexus/competitions/overview.php','site-data/competitions/overview.php','site-data/competitions/custom-cups.php']:
                  p=Path(name);data=p.read_bytes();ftp.cwd('/www.italianmastersclub.it/'+p.parent.as_posix())
                  temporary='.'+p.name+'.mapping-upload'
                  ftp.storbinary('STOR '+temporary,io.BytesIO(data));ftp.rename(temporary,p.name)
                  check=io.BytesIO();ftp.retrbinary('RETR '+p.name,check.write);assert check.getvalue()==data,name
          PY
      - name: Verify competition pages live
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://www.italianmastersclub.it/'
          for endpoint in ['nexus/competitions/overview.php','site-data/competitions/overview.php']:
              url=base+endpoint+'?world=IMC001&season=1&competition=IMC001%7CDOMESTIC%7Cleaguecup'
              with urllib.request.urlopen(url,timeout=90) as r:d=json.load(r)
              assert d['ok'] and d['competition']['competition_key']=='IMC001|DOMESTIC|leaguecup',endpoint
          with urllib.request.urlopen(base+'site-data/competitions/catalog.php?world=IMC004&season=1',timeout=90) as r:d=json.load(r)
          assert d['ok'] and d['rows']
          print('Both competition overviews and Academy cup catalog verified.')
          PY
