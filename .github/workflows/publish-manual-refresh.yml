name: Publish manual-refresh scripts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-manual-refresh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload and verify shared public scripts
        env:
          FTP_USER: ${{ secrets.ARUBA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import io, os, ssl
          from ftplib import FTP_TLS
          from pathlib import Path
          from urllib.request import urlopen
          paths = '''
          clubhouse/h2h.js
          minisite/GW001/fixtures-controller.js
          minisite/GW001/world-state.js
          minisite/integrations/results-schedule/controller.js
          nexus/assets/competition-view.js
          nexus/assets/directory.js
          nexus/assets/h2h.js
          nexus/assets/history-overview.js
          nexus/assets/home.js
          nexus/assets/match.js
          nexus/assets/player-profile.js
          nexus/matchday/live.js
          nexus/matchday/preview.js
          nexus/teams/detail.html
          nexus/the-club/club.js
          nexus/the-club/hub.js
          site-assets/master/homepage.js
          '''.split()
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          with FTP_TLS(context=ctx, timeout=60) as ftp:
              ftp.connect('ftp.italianmastersclub.it')
              ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              for path in paths:
                  data = Path(path).read_bytes()
                  ftp.storbinary('STOR /www.italianmastersclub.it/' + path, io.BytesIO(data))
                  with urlopen('https://www.italianmastersclub.it/' + path + '?release=' + os.environ['GITHUB_SHA'], timeout=60) as response:
                      assert response.read() == data, path
          PYTHON
