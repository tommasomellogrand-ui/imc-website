name: Publish Nexus world competition routes
on:
  push:
    branches: [main]
    paths: ['nexus/world-route.php', 'nexus/assets/world-route.js', 'nexus/assets/competition-catalog.*', '.github/workflows/nexus-world-routes.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imc-public-website-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate routes and scripts
        run: |
          php -l nexus/world-route.php
          node --check nexus/assets/world-route.js
          node --check nexus/assets/competition-catalog.js
          node --check nexus/assets/navigation.js
      - name: Deploy and verify all eleven worlds
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import os,io,ssl,urllib.request,time
          from pathlib import Path
          from ftplib import FTP_TLS
          files=['nexus/assets/competition-ui.js', 'nexus/assets/competition-view.js', 'nexus/assets/home.js', 'nexus/assets/navigation.js', 'nexus/competitions/domestic.html', 'nexus/competitions/family.html', 'nexus/competitions/group.html', 'nexus/competitions/index.html', 'nexus/competitions/view.html', 'nexus/index.html', 'nexus/assets/competition-catalog.css', 'nexus/assets/competition-catalog.js', 'nexus/assets/world-route.js', 'nexus/world-route.php', 'nexus/.htaccess']
          ctx=ssl.create_default_context();ctx.check_hostname=False
          f=FTP_TLS(context=ctx);f.connect('ftp.italianmastersclub.it',21,timeout=60)
          f.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']);f.prot_p()
          for name in files:
              data=Path(name).read_bytes();f.storbinary('STOR /www.italianmastersclub.it/'+name,io.BytesIO(data))
              check=io.BytesIO();f.retrbinary('RETR /www.italianmastersclub.it/'+name,check.write);assert check.getvalue()==data,name
          f.quit()
          for n in range(1,12):
              for suffix in ['', 'competitions/']:
                  path=f'nexus/gw{n:03d}/'+suffix
                  with urllib.request.urlopen('https://www.italianmastersclub.it/'+path+'?verify='+os.environ['GITHUB_SHA'],timeout=45) as r:
                      text=r.read().decode();assert r.status==200 and 'world-route.js' in text,path
                  print('Live route verified',path)
          PYTHON
