name: Nexus Nations
on:
  push:
    branches: [main, nexus-nations]
    paths: ["nexus/teams/page.html","nexus/teams/detail.html","nexus/teams/detail.php","nexus/teams/stats.php","nexus/teams/matches.php","nexus/teams/roster.php","nexus/teams/roster-stats.php","nexus/assets/home.js","nexus/assets/profiles-shell.js","nexus/h2h/index.php","nexus/h2h/engine.php","nexus/trophies/index.php","nexus/index.html","tests/nexus-nations*",".github/workflows/nexus-nations.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and national scopes
        run: |
          for file in nexus/teams/*.php nexus/h2h/*.php nexus/trophies/index.php; do php -l "$file"; done
          php tests/nexus-nations.php
          php tests/nexus-matchday-identity.php
          node --check nexus/assets/home.js
          node --check nexus/assets/profiles-shell.js
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          for name in ['nexus/teams/page.html','nexus/teams/detail.html','nexus/index.html']:
              code='\n'.join(s for a,s in re.findall(r'<script([^>]*)>(.*?)</script>',Path(name).read_text(),re.S) if 'src=' not in a)
              subprocess.run(['node','--check'],input=code,text=True,check=True)
          PY
      - name: Verify Nations and club tabs on mobile
        run: |
          mkdir -p /tmp/nations-test
          npm install --prefix /tmp/nations-test --package-lock-only --ignore-scripts playwright@1.62.1
          npm ci --prefix /tmp/nations-test --ignore-scripts
          NEXUS_PLAYWRIGHT_PATH=/tmp/nations-test/node_modules/playwright CHROME_PATH=/usr/bin/google-chrome node tests/nexus-nations-ui.cjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: imc-public-website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish Nations and shared team pages
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import io, os, ssl, json, urllib.request, urllib.parse
          from pathlib import Path
          from ftplib import FTP_TLS
          ctx=ssl.create_default_context(); ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx); ftp.connect('ftp.italianmastersclub.it',21,timeout=60)
          ftp.login(os.environ['ARUBA_FTP_USERNAME'],os.environ['ARUBA_FTP_PASSWORD']); ftp.prot_p(); ftp.set_pasv(True)
          files=["nexus/teams/page.html","nexus/teams/detail.html","nexus/teams/detail.php","nexus/teams/stats.php","nexus/teams/matches.php","nexus/teams/roster.php","nexus/teams/roster-stats.php","nexus/assets/home.js","nexus/assets/profiles-shell.js","nexus/h2h/index.php","nexus/h2h/engine.php","nexus/trophies/index.php","nexus/index.html"]
          for name in files:
              p=Path(name); data=p.read_bytes()
              ftp.cwd('/www.italianmastersclub.it/'+str(p.parent))
              ftp.storbinary('STOR '+p.name,io.BytesIO(data))
              check=io.BytesIO(); ftp.retrbinary('RETR '+p.name,check.write)
              if check.getvalue()!=data: raise RuntimeError('Upload mismatch: '+name)
          ftp.quit()
          base='https://www.italianmastersclub.it/nexus/'
          def get(path,**params):
              with urllib.request.urlopen(base+path+'?'+urllib.parse.urlencode(params),timeout=60) as r:
                  j=json.load(r)
              assert j.get('ok'), (path,j)
              return j
          for i in range(1,11):
              gw=f'GW{i:03d}'
              rows=get('teams/directory.php',world=gw,type='nations')['rows']
              if not rows:
                  print(gw,'no national mappings'); continue
              n=rows[0]; d=get('teams/detail.php',world=gw,type='nation',id=n['world_id'])
              assert str(d['team']['world_id'])==str(n['world_id'])
              print(gw,'national directory and identity OK')
          nation=1869096
          d=get('teams/detail.php',world='GW001',type='nation',id=nation)
          assert d['team']['name']=='England'
          overview=get('h2h/index.php',world='GW001',kind='nation',id=nation,mode='overview')
          h2h=get('h2h/index.php',world='GW001',kind='nation',id=nation)
          stats=get('teams/stats.php',world='GW001',type='nation',sm_club=nation)
          assert overview['global']['stats']['played']>0 and h2h['summary']['played']==stats['stats']['played']
          assert all('|NATIONS|' in k for k in h2h['competitions'])
          roster=get('teams/roster.php',world='GW001',type='nation',sm_club=nation)
          assert roster['roster_source']=='latest_match_report' and roster['rows']
          club=get('teams/directory.php',world='GW001',type='clubs')['rows'][0]
          get('teams/detail.php',world='GW001',type='club',id=club['world_id'])
          get('h2h/index.php',world='GW001',kind='club',id=club['world_id'],mode='overview')
          for name in files:
              if name.endswith('.php'): continue
              with urllib.request.urlopen('https://www.italianmastersclub.it/'+name+'?verify='+os.environ['GITHUB_SHA'],timeout=30) as r:
                  assert r.read()==Path(name).read_bytes(), name
          print('Nations online. Ten-world identities, national stats/H2H/roster and club regression verified.')
          PY

