<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMC Village · Italian Masters Club</title>
<style>
* { box-sizing:border-box }
body { margin:0; font-family:Inter,system-ui,sans-serif; background:#10182a }
header { height:64px; display:flex; align-items:center; justify-content:center; gap:10px; background:white; color:#182943 }
header img { width:44px; height:44px; object-fit:contain }
h1 { margin:0; font-size:21px }
main { position:relative; height:calc(100vh - 64px); height:calc(100dvh - 64px); overflow:hidden; display:grid; justify-items:center; align-items:end; isolation:isolate }
main::before { content:""; position:absolute; inset:-20px; background:center/cover url(village.webp); filter:blur(18px) brightness(.6); z-index:-1 }
.scene { position:relative; height:100%; aspect-ratio:1122/1402; background:center/100% 100% url(village.webp) }
a { position:absolute; left:49%; top:87%; transform:translate(-50%,-50%); padding:12px 22px; background:#131d32; color:white; border:2px solid #c8ae69; border-radius:5px; font-weight:750; text-decoration:none; letter-spacing:.08em }
a:focus-visible { outline:3px solid white; outline-offset:3px }
</style>
<header><img src="/site-assets/images/imc-logo.png" alt=""><h1>IMC Village</h1></header>
<main><div class="scene"><a href="/clubhouse/">ENTRA</a></div></main>
</html>
