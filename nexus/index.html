<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tutti i mondi Italian Masters Club: risultati, match report, calendario e trasferimenti."><title>IMC Nexus</title><link rel="icon" href="assets/imc-logo.png"><link rel="stylesheet" href="public/site.css?v=2"><script defer src="public/site.js?v=2"></script></head>
<body><header><a class="brand" href="./"><img src="assets/imc-logo.png" alt="Italian Masters Club"><span>NEXUS<small>ITALIAN MASTERS CLUB</small></span></a><span class="tag">EVERY WORLD. EVERY MATCH.</span></header>
<main><section class="intro"><p class="eyebrow">IL TUO UNIVERSO IMC</p><h1>Dieci mondi.<br>Un solo Nexus.</h1><p>Risultati, partite e mercato. Tutto in un unico posto.</p></section>
<section class="panel"><label for="world">GAME WORLD</label><select id="world" aria-label="Seleziona Game World"></select><nav id="tabs" aria-label="Sezioni"><button data-resource="results">Risultati</button><button data-resource="match_report">Match report</button><button data-resource="schedule">Calendario</button><button data-resource="transfers">Trasferimenti</button></nav></section>
<form id="filters"><label class="search">Cerca<input id="search" type="search" placeholder="Squadra, competizione o giocatore" maxlength="100"></label><label>Dal<input id="from" type="date"></label><label>Al<input id="to" type="date"></label><button type="submit">Cerca</button><button type="button" id="reset" class="quiet">Azzera</button></form>
<section aria-labelledby="sectionTitle"><div class="section-heading"><div><p id="worldLabel" class="eyebrow"></p><h2 id="sectionTitle">Risultati</h2></div><button id="refresh" class="quiet">Aggiorna</button></div><p id="status" role="status" aria-live="polite"></p><div id="rows"></div><div class="pagination"><button id="previous" class="quiet">← Precedenti</button><span id="page"></span><button id="next" class="quiet">Successivi →</button></div></section>
</main><footer>IMC NEXUS · EVERY WORLD · EVERY MATCH · EVERY MANAGER</footer>
<dialog id="report"><button id="closeReport" class="quiet">Chiudi ×</button><div id="reportContent"></div></dialog><noscript>Attiva JavaScript per consultare i dati di Nexus.</noscript></body></html>
