<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Global football transfer routes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152d"/>
      <stop offset=".55" stop-color="#0b2d57"/>
      <stop offset="1" stop-color="#087444"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="42%" r="60%">
      <stop offset="0" stop-color="#2ee67f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2ee67f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- abstract world map -->
  <g fill="#7fa0bb" opacity=".18">
    <path d="M88 100l42-31 54-6 38 18 29-7 34 22-5 31-34 11-16 28-38 8-21-21-41 3-34-26z"/>
    <path d="M238 171l27 12 18 35-10 34-25 24-13-38-20-25z"/>
    <path d="M395 81l50-18 56 5 27 20 38-5 28 19 2 27-29 11-38-6-36 18-33-8-22-27-43-9z"/>
    <path d="M509 152l39 8 29 34-8 44-30 29-24-23-8-42-22-22z"/>
    <path d="M590 92l68-24 96 7 40 23 72-7 59 24 38 33-16 25-55-5-39 22-62-9-38 20-60-16-44-29-41-18z"/>
    <path d="M925 204l44-18 42 8 26 27-18 23-45 4-31-20z"/>
  </g>

  <!-- route lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M154 126 Q388 16 619 130" stroke="#36e482" stroke-width="3" opacity=".9" stroke-dasharray="8 9"/>
    <path d="M278 194 Q500 258 746 130" stroke="#78b9ff" stroke-width="2.5" opacity=".78" stroke-dasharray="7 10"/>
    <path d="M466 105 Q714 14 950 181" stroke="#36e482" stroke-width="3" opacity=".85" stroke-dasharray="8 9"/>
    <path d="M602 176 Q794 268 1001 213" stroke="#7dbdff" stroke-width="2.5" opacity=".72" stroke-dasharray="7 10"/>
  </g>

  <g fill="#48ee8c">
    <circle cx="154" cy="126" r="6"/>
    <circle cx="619" cy="130" r="6"/>
    <circle cx="466" cy="105" r="6"/>
    <circle cx="950" cy="181" r="6"/>
  </g>
  <g fill="#48ee8c" opacity=".28" filter="url(#soft)">
    <circle cx="154" cy="126" r="18"/>
    <circle cx="619" cy="130" r="18"/>
    <circle cx="950" cy="181" r="18"/>
  </g>

  <!-- travelling footballer silhouette -->
  <g transform="translate(990 38)" filter="url(#shadow)">
    <circle cx="73" cy="31" r="23" fill="#07111e"/>
    <path d="M50 55c23-15 54-12 72 8l17 46-31 12-12-32-7 66-42 2 4-72-23 39-27-17 29-45z" fill="#081522"/>
    <path d="M50 153l-9 77 30 2 12-75zm41 2l26 70 27-10-21-78z" fill="#07111e"/>
    <path d="M8 108h42v48H8z" rx="6" fill="#081522"/>
    <path d="M17 108v-14c0-11 7-18 19-18s19 7 19 18v14" fill="none" stroke="#081522" stroke-width="8"/>
    <circle cx="-8" cy="231" r="25" fill="#edf2f4"/>
    <path d="M-8 214l13 9-5 16h-16l-5-16z" fill="#0a2038"/>
    <path d="M-8 206v8M16 223l-11 1M7 250l-7-11M-23 247l7-9M-33 224l12-1" stroke="#0a2038" stroke-width="3.5"/>
  </g>

  <path d="M0 270C245 238 389 278 591 258c203-20 397-42 609-18v60H0z" fill="#03101f" opacity=".52"/>
</svg>