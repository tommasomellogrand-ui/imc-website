<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Teams</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;margin-bottom:22px}.back{color:var(--b);text-decoration:none;font-weight:800}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:5px 0}.hero p{color:var(--m)}.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--l);padding:5px;border-radius:15px;background:#fff}.tab{border:0;border-radius:11px;padding:13px;background:#fff;color:var(--m);font-weight:800}.tab.active{background:var(--b);color:#fff}.summary{border:1px solid var(--l);background:#fff;border-radius:16px;padding:16px;text-align:center;margin:16px 0}.summary b{font-size:28px;display:block}.summary span{font-size:11px;color:var(--m)}.search{width:100%;padding:16px;border:1px solid var(--l);border-radius:15px;background:#fff;font:inherit;margin-bottom:15px}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.team{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--l);background:#fff;border-radius:18px;padding:20px 14px;min-height:190px}.team img{width:68px;height:68px;object-fit:contain;margin-bottom:14px}.team .fallback{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--s);font-size:30px;margin-bottom:14px}.team b{font-size:17px}.team span{font-size:12px;color:var(--m);margin-top:7px}@media(max-width:650px){.list{grid-template-columns:repeat(2,1fr)}}.empty{text-align:center;color:var(--m);padding:25px}</style></head><body><main class="shell"><header class="top"><a class="back" href="../">← Nexus</a><b id="gw"></b></header><section class="hero"><small>IMC · TEAM DIRECTORY</small><h1>Teams</h1><p id="meta"></p></section><div class="tabs"><button class="tab active" data-type="clubs">CLUBS</button><button class="tab" data-type="nations">NATIONS</button></div><section class="summary"><b id="count">—</b><span id="label">CLUB</span></section><input id="search" class="search" placeholder="Cerca team…"><section id="list" class="list"><div class="empty">Caricamento…</div></section></main><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',list=document.getElementById('list'),search=document.getElementById('search');let rows=[],type='clubs';localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('meta').textContent=gw+' · Team directory';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){let q=search.value.toLowerCase(),a=rows.filter(x=>String(x.name).toLowerCase().includes(q));list.innerHTML=a.length?a.map(x=>'<article class="team" onclick="location.href=\'detail.html?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(localStorage.getItem('imc_nexus_season_'+gw)||'')+'&type='+encodeURIComponent(type==='clubs'?'club':'nation')+'&id='+encodeURIComponent(x.entity_id)+'\'">'+(x.image_url?'<img src="'+esc(String(x.image_url).replace(/^http:/i,'https:'))+'" alt="">':'<div class="fallback">'+(type==='clubs'?'◈':'⚑')+'</div>')+'<b>'+esc(x.name)+'</b><span>ID '+esc(x.world_id??'—')+'</span></article>').join(''):'<div class="empty">Nessun team.</div>'}async function load(t){type=t;const j=await fetch('directory.php?world='+encodeURIComponent(gw)+'&type='+t,{cache:'no-store'}).then(r=>r.json());rows=j.rows||[];document.getElementById('count').textContent=j.count??rows.length;document.getElementById('label').textContent=t==='clubs'?'CLUB':'NAZIONALI';render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.type)});search.oninput=render;load('clubs');</script></body></html>
