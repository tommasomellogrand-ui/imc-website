<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nexus · Clubs</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;margin-bottom:22px}.back{color:var(--b);text-decoration:none;font-weight:800}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:5px 0}.hero p{color:var(--m)}.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--l);padding:5px;border-radius:15px;background:#fff}.tab{border:0;border-radius:11px;padding:13px;background:#fff;color:var(--m);font-weight:800}.tab.active{background:var(--b);color:#fff}.summary{border:1px solid var(--l);background:#fff;border-radius:16px;padding:16px;text-align:center;margin:16px 0}.summary b{font-size:28px;display:block}.summary span{font-size:11px;color:var(--m)}.search{width:100%;padding:16px;border:1px solid var(--l);border-radius:15px;background:#fff;font:inherit;margin-bottom:15px}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.team{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--l);background:#fff;border-radius:18px;padding:20px 14px;min-height:190px}.team img{width:68px;height:68px;object-fit:contain;margin-bottom:14px}.team .fallback{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--s);font-size:30px;margin-bottom:14px}.team b{font-size:17px}.team span{font-size:12px;color:var(--m);margin-top:7px}@media(max-width:650px){.list{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.team{padding:10px 5px;min-height:132 ing:3px 5px}}.directory-filters{min-width:0;margin:0 0 16px}.directory-filters nav{width:100%;margin:0 0 10px!important}.directory-filters button{gap:7px}.directory-filters img{object-fit:contain}#manager-filter button{flex:1 1 0!important}#directory-country-filter{max-width:100%;overflow-x:auto}</style><meta name="theme-color" content="#101238"><link rel="stylesheet" href="../assets/profiles.css?v=20260927"><script src="../assets/profiles-shell.js?v=20261004nations" defer></script><script src="../assets/the-club-links.js?v=20260928club" defer></script><link rel="stylesheet" href="../assets/navigation.css?v=20261007sport1"><script src="../assets/navigation.js?v=20261007sport1" defer></script></head><body data-profile-family="teams" data-profile-detail="false"><header class="profile-banner"><div class="profile-wrap"><div class="profile-top"><a id="nexus-brand" class="nexus-brand" href="../" aria-label="Nexus home"><span class="logo-crop"><img src="/site-assets/images/imc-logo.png" alt="IMC"></span>NEXUS</a><select id="profile-world" aria-label="Mondo di gioco"></select><span id="gw" hidden></span></div><section class="hero profile-hero"><small>IMC · CLUB DIRECTORY</small><h1>Clubs</h1><p id="meta"></p></section></div></header><main class="shell"><div class="profile-back"><a class="back" href="../">← Nexus</a></div><section class="summary"><b id="count">—</b><span id="label">CLUB</span></section><section class="directory-filters"><nav id="manager-filter" class="selection-tabs" aria-label="Filtro manager"><button type="button" data-manager-filter="all" aria-pressed="true">Tutti</button><button type="button" data-manager-filter="imc" aria-pressed="false">Manager IMC</button></nav><nav id="directory-country-filter" class="selection-tabs" aria-label="Filtro country" hidden></nav></section><input id="search" class="search" placeholder="Cerca team…"><section id="list" class="list"><div class="empty">Caricamento…</div></section></main><nav class="profile-nav" id="profile-nav" aria-label="Navigazione principale"></nav><dialog id="profile-more"><div class="profile-dialog-head"><h2>Esplora il mondo</h2><button id="profile-close" aria-label="Chiudi menu">×</button></div><div id="profile-more-links"></div></dialog><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',list=document.getElementById('list'),search=document.getElementById('search');let country='',managerFilter='all';let rows=[],type=p.get('type')==='nations'?'nations':'clubs';localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.body.dataset.profileFamily=type==='nations'?'nations':'teams';document.title='Nexus · '+(type==='nations'?'Nations':'Clubs');document.querySelector('.hero h1').textContent=type==='nations'?'Nations':'Clubs';document.querySelector('.hero small').textContent=type==='nations'?'IMC · NATIONS DIRECTORY':'IMC · CLUB DIRECTORY';document.getElementById('meta').textContent=gw+(type==='nations'?' · Nations directory':' · Club directory');search.placeholder=type==='nations'?'Cerca nazionale…':'Cerca club…';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){let q=search.value.toLowerCase(),a=rows.filter(x=>String(x.name).toLowerCase().includes(q)&&(managerFilter!=='imc'||x.manager?.is_imc===true)&&(!country||(country==='unknown'?!x.country_code:x.country_code===country)));document.getElementById('count').textContent=a.length;document.getElementById('label').textContent=(type==='clubs'?'CLUB':'NAZIONALI')+(a.length!==rows.length?' · '+rows.length+' TOTALI':'');list.innerHTML=a.length?a.map(x=>{const m=x.manager,teamHref='detail.html?world='+encodeURIComponent(gw)+'&type='+(type==='clubs'?'club':'nation')+'&id='+encodeURIComponent(x.world_id);const managerHref=m?(m.is_imc?'../managers/profile.html?world='+encodeURIComponent(gw)+'&manager='+encodeURIComponent(m.manager_id):'../managers/page.html?world='+encodeURIComponent(gw)+'&mode=ext_active&search='+encodeURIComponent(m.full_name)):'';return '<article class="team"><a class="team-main" href="'+esc(teamHref)+'">'+(x.image_url?'<img src="'+esc(String(x.image_url).replace(/^http:/i,'https:'))+'" alt="">':'<div class="fallback">'+(type==='clubs'?'◈':'⚑')+'</div>')+'<b>'+esc(x.name)+'</b><span>ID '+esc(x.world_id??'—')+'</span></a><div class="team-manager">'+(m?'<a href="'+esc(managerHref)+'">'+esc(m.full_name)+'</a>'+(m.is_imc?'<span class="imc-badge" aria-label="Manager IMC">IMC</span>':''):'<span class="manager-empty">Nessun manager assegnato</span>')+'</div></article>'}).join(''):'<div class="empty">Nessun team.</div>'}async function load(t){type=t;const j=await fetch('directory.php?world='+encodeURIComponent(gw)+'&type='+t,{cache:'no-store'}).then(r=>r.json());rows=j.rows||[];setupCountries(j.country_filter===true);document.getElementById('count').textContent=j.count??rows.length;document.getElementById('label').textContent=t==='clubs'?'CLUB':'NAZIONALI';render()}
const countryFlags={KSA:79,ARG:46,BEL:27,BRA:47,CZE:5,DEN:17,ENG:1,ESP:8,FRA:2,GER:3,GRE:9,ITA:4,JPN:76,NED:7,POR:6,SCO:23,SUI:16,SWE:10,TUR:14,USA:57,MEX:58,POL:13};
function setupCountries(enabled){const rail=document.getElementById('directory-country-filter');rail.hidden=!enabled;if(!enabled){country='';return;}const codes=[...new Set(rows.map(x=>x.country_code).filter(Boolean))].sort();rail.innerHTML='<button type="button" data-country="" aria-pressed="true">Tutti i country</button>'+codes.map(code=>'<button type="button" data-country="'+esc(code)+'" aria-pressed="false">'+(countryFlags[code]?'<img src="/nexus/assets/flags/nations/'+countryFlags[code]+'.svg" alt="" width="22" height="16">':'')+esc(code)+'</button>').join('')+(rows.some(x=>!x.country_code)?'<button type="button" data-country="unknown" aria-pressed="false">Non disponibile</button>':'');}
