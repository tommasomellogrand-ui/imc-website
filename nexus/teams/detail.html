<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Team</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:1000px;margin:auto;padding:20px 14px 70px}.top{display:flex;justify-content:space-between}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--b),#173267);color:#fff;border-radius:22px;padding:24px;margin-top:18px}.hero img,.crest{width:80px;height:80px;object-fit:contain}.hero small{color:#e8c46d;font-weight:800}.hero h1{margin:5px 0;font-size:34px}.hero p{margin:0;color:#dbe2ef}.tabs{display:flex;gap:4px;overflow:auto;border:1px solid var(--l);border-radius:15px;padding:5px;background:#fff;margin:16px 0}.tab{border:0;background:#fff;color:var(--m);border-radius:10px;padding:12px 13px;white-space:nowrap;font:inherit;font-size:11px;font-weight:800}.tab.active{background:var(--b);color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:18px}.manager b{display:block;font-size:20px}.manager span,.muted{color:var(--m);font-size:12px}.empty{text-align:center;color:var(--m);padding:30px}@media(max-width:500px){.hero{grid-template-columns:65px 1fr;padding:18px}.hero img,.crest{width:58px;height:58px}.hero h1{font-size:27px}.tab{padding:10px 11px}}</style></head><body><main class="shell"><header class="top"><a class="back" id="back">← Teams</a><b id="gw"></b></header><section class="hero"><div id="image"></div><div><small id="kind"></small><h1 id="name">Team</h1><p id="meta"></p></div></section><nav class="tabs" id="tabs"></nav><div id="view"></div></main><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||localStorage.getItem('imc_nexus_season_'+gw)||'',type=p.get('type')==='nation'?'nation':'club',id=p.get('id')||'',tabs=document.getElementById('tabs'),view=document.getElementById('view');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('back').href='page.html?world='+encodeURIComponent(gw);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let D;const names=type==='club'?['OVERVIEW','MANAGER','ROSTER','STATS','H2H','TRANSFERS','TROPHY ROOM']:['OVERVIEW','MANAGER','ROSTER','STATS','H2H','TROPHY ROOM'];function show(n){if(n==='OVERVIEW')view.innerHTML='<div class="card"><b>'+esc(D.team?.name||'')+'</b><p class="muted">ID '+esc(D.team?.world_id||'—')+' · '+esc(gw)+(season?' · Season '+esc(season):'')+'</p></div>';else if(n==='MANAGER')view.innerHTML=D.manager?'<div class="card manager"><b>'+esc(D.manager.full_name)+'</b><span>'+esc(D.manager.manager_id)+' · dal '+esc(D.manager.start_date||'—')+(D.manager.end_date?' al '+esc(D.manager.end_date):'')+'</span></div>':'<div class="card empty">Nessun manager assegnato.</div>';else view.innerHTML='<div class="card empty">'+esc(n)+' · sezione pronta per il relativo motore.</div>'}async function init(){D=await fetch('detail.php?world='+encodeURIComponent(gw)+'&type='+type+'&id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json());document.getElementById('kind').textContent=type==='club'?'CLUB':'NATIONAL TEAM';document.getElementById('name').textContent=D.team?.name||'Team';document.getElementById('meta').textContent='ID '+(D.team?.world_id||'—')+' · '+gw+(season?' · Season '+season:'');document.getElementById('image').innerHTML=D.team?.image_url?'<img src="'+esc(String(D.team.image_url).replace(/^http:/i,'https:'))+'" alt="">':'<div class="crest"></div>';tabs.innerHTML=names.map((n,i)=>'<button class="tab '+(!i?'active':'')+'" data-n="'+n+'">'+n+'</button>').join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.n)});show('OVERVIEW')}init();</script></body></html>
