<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Team</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:1000px;margin:auto;padding:20px 14px 70px}.top{display:flex;justify-content:space-between}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--b),#173267);color:#fff;border-radius:22px;padding:24px;margin-top:18px}.hero img,.crest{width:80px;height:80px;object-fit:contain}.hero small{color:#e8c46d;font-weight:800}.hero h1{margin:5px 0;font-size:34px}.hero p{margin:0;color:#dbe2ef}.tabs{display:flex;gap:4px;overflow:auto;border:1px solid var(--l);border-radius:15px;padding:5px;background:#fff;margin:16px 0}.tab{border:0;background:#fff;color:var(--m);border-radius:10px;padding:12px 13px;white-space:nowrap;font:inherit;font-size:11px;font-weight:800}.tab.active{background:var(--b);color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:18px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px}.kpi{background:#fff;padding:13px 6px;text-align:center}.kpi b{display:block;font-size:21px}.kpi span{font-size:9px;color:var(--m)}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:10px;border-bottom:1px solid #edf0f4;font-size:12px}.row .away{text-align:right}.score{font-weight:900}.player{display:grid;grid-template-columns:1fr repeat(4,auto);gap:10px;padding:10px;border-bottom:1px solid #edf0f4;font-size:11px}.player b{font-size:12px}.section-title{font-size:15px;margin:18px 0 9px}.manager b{display:block;font-size:20px}.manager span,.muted{color:var(--m);font-size:12px}.empty{text-align:center;color:var(--m);padding:30px}@media(max-width:500px){.hero{grid-template-columns:65px 1fr;padding:18px}.hero img,.crest{width:58px;height:58px}.hero h1{font-size:27px}.tab{padding:10px 11px}}html,body{max-width:100%;overflow-x:hidden}img{max-width:100%}button,select,input{max-width:100%}.shell{width:100%;overflow-x:hidden}@media(max-width:500px){body{font-size:14px}.shell{padding-left:10px!important;padding-right:10px!important}.top{max-width:100%;gap:8px}.hero{max-width:100%}.tabs,.country,.subtabs{max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar,.country::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}}</style></head><body><main class="shell"><header class="top"><a class="back" id="back">← Teams</a><b id="gw"></b></header><section class="hero"><div id="image"></div><div><small id="kind"></small><h1 id="name">Team</h1><p id="meta"></p></div></section><nav class="tabs" id="tabs"></nav><div id="view"></div></main><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||localStorage.getItem('imc_nexus_season_'+gw)||'',type=p.get('type')==='nation'?'nation':'club',id=p.get('id')||'',tabs=document.getElementById('tabs'),view=document.getElementById('view');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('back').href='page.html?world='+encodeURIComponent(gw);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let D,C;const names=type==='club'?['OVERVIEW','MANAGER','ROSTER','STATS','H2H','TRANSFERS','TROPHY ROOM']:['OVERVIEW','MANAGER','ROSTER','STATS','H2H','TROPHY ROOM'];function matchRows(a){return '<div class="card rows">'+(a||[]).slice(0,10).map(r=>'<div class="row"><b>'+esc(r.home_name)+'</b><span class="score">'+esc(r.home_score)+' - '+esc(r.away_score)+'</span><b class="away">'+esc(r.away_name)+'</b></div>').join('')+'</div>'}
function show(n){if(n==='OVERVIEW'){const s=C?.summary||{};view.innerHTML='<div class="kpis">'+[['PARTITE',s.played],['VITTORIE',s.won],['PAREGGI',s.drawn],['SCONFITTE',s.lost],['GF',s.gf],['GS',s.ga],['DIFF.',s.gd],['WIN %',(s.win_pct??0)+'%']].map(x=>'<div class="kpi"><b>'+esc(x[1]??0)+'</b><span>'+x[0]+'</span></div>').join('')+'</div><h3 class="section-title">ULTIME PARTITE</h3>'+matchRows(C?.matches)}
else if(n==='MANAGER')view.innerHTML=D.manager?'<div class="card manager"><b>'+esc(D.manager.full_name)+'</b><span>'+esc(D.manager.manager_id)+' · dal '+esc(D.manager.start_date||'—')+(D.manager.end_date?' al '+esc(D.manager.end_date):'')+'</span></div>':'<div class="card empty">Nessun manager assegnato.</div>';
else if(n==='ROSTER')view.innerHTML='<div class="card">'+(C?.players?.length?C.players.map(x=>'<div class="player"><b>'+esc(x.name)+'</b><span>PG '+x.appearances+'</span><span>G '+x.goals+'</span><span>A '+x.assists+'</span><span>V '+esc(x.rating??'—')+'</span></div>').join(''):'<div class="empty">Nessun dato giocatore nei Match Report.</div>')+'</div>';
else if(n==='STATS'){const s=C?.summary||{};view.innerHTML='<div class="kpis">'+[['GF',s.gf],['GS',s.ga],['DIFF.',s.gd],['WIN %',(s.win_pct??0)+'%'],['SPETT. MEDI',s.attendance_avg],['MAX SPETT.',s.attendance_max]].map(x=>'<div class="kpi"><b>'+esc(x[1]??0)+'</b><span>'+x[0]+'</span></div>').join('')+'</div>'}
else if(n==='H2H')view.innerHTML='<div class="card">'+(C?.h2h?.length?C.h2h.map(x=>'<div class="player"><b>'+esc(x.opponent)+'</b><span>PG '+x.played+'</span><span>V '+x.won+'</span><span>N '+x.drawn+'</span><span>P '+x.lost+'</span></div>').join(''):'<div class="empty">Nessun H2H disponibile.</div>')+'</div>';
else if(n==='TRANSFERS')view.innerHTML='<div class="card">'+(C?.transfers?.length?C.transfers.map(x=>'<div class="player"><b>'+esc(x.player_name||'Player')+'</b><span>'+esc(x.club_from||'—')+' → '+esc(x.club_to||'—')+'</span><span>'+esc(x.normalized_transfer_date||'—')+'</span><span>S'+esc(x.imc_season||x.normalized_season||'—')+'</span><span>'+esc(x.amount_text||'')+'</span></div>').join(''):'<div class="empty">Nessun transfer del club.</div>')+'</div>';
else view.innerHTML='<div class="card empty">Trophy Room del club.</div>'}
async function init(){D=await fetch('detail.php?world='+encodeURIComponent(gw)+'&type='+type+'&id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json());C=type==='club'?await fetch('club-data.php?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json()):{};document.getElementById('kind').textContent=type==='club'?'CLUB':'NATIONAL TEAM';document.getElementById('name').textContent=D.team?.name||'Team';document.getElementById('meta').textContent='ID '+(D.team?.world_id||'—')+' · '+gw+(season?' · Season '+season:'');document.getElementById('image').innerHTML=D.team?.image_url?'<img src="'+esc(String(D.team.image_url).replace(/^http:/i,'https:'))+'" alt="">':'<div class="crest"></div>';tabs.innerHTML=names.map((n,i)=>'<button class="tab '+(!i?'active':'')+'" data-n="'+n+'">'+n+'</button>').join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.n)});show('OVERVIEW')}init();</script></body></html>
