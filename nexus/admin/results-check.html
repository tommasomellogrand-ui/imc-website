<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Nexus Admin · Results Check</title><link rel="stylesheet" href="admin.css?v=3"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap"><script src="results-check.js?v=1" defer></script><script src="admin-nav.js?v=1" defer></script></head>
<body><header><a href="../">NEXUS</a><span>Amministrazione</span><button id="logout" hidden>Esci</button></header><nav class="admin-nav" aria-label="Menu amministrazione"><a href="index.html">Assegnazioni Manager</a><a href="results-check.html" aria-current="page">Results Check</a></nav>
<main><h1>Results Check</h1><p class="muted">Controllo per data: Schedule → Results → Match Report. Sola lettura, nessuna modifica ai dati.</p><p id="message" role="status" aria-live="polite"></p><section id="login" class="panel"><h2>Accesso personale</h2><p>Apri il tuo link personale per entrare nel pannello.</p></section>
<section id="workspace" hidden><div class="toolbar check-toolbar"><label>Game World<select id="world"></select></label><label>Stagione<select id="season"><option value="">Tutte le stagioni</option></select></label><label>Data · righe Schedule / Results / Report<select id="date"></select></label></div>
<div class="actions"><button id="run" class="primary" disabled>Esegui controllo</button><button id="reload">Aggiorna date</button><span class="muted">Collegamento tramite Fixture ID nello stesso GW</span></div><div id="summary" class="check-summary" aria-live="polite"></div>
<div id="filters" class="check-tools" hidden><label>Stato<select id="state"><option value="all">Tutte le partite</option><option value="issues">Solo anomalie</option><option value="complete">Complete</option><option value="missing_results">Risultato mancante</option><option value="missing_report">Report mancante</option><option value="orphan_results">Results senza Schedule</option><option value="orphan_report">Report senza Results</option><option value="pending">Da giocare</option><option value="today">In programma oggi</option></select></label><label id="country-label">Country<select id="country"><option value="">Tutti</option></select></label><label>Competizione<select id="competition"><option value="">Tutte</option></select></label></div>
<p id="check-count"></p><div id="checks" aria-live="polite"></div><button id="more" hidden>Mostra altre 100 partite</button></section></main></body></html>
