<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Domestic</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:1000px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{padding:32px 0 18px}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:6px 0}.hero p{color:var(--m)}.tabs{display:flex;gap:5px;overflow:auto;border:1px solid var(--l);border-radius:15px;padding:5px;background:#fff;margin-bottom:16px}.tab{border:0;background:#fff;color:var(--m);border-radius:10px;padding:12px 16px;white-space:nowrap;font:inherit;font-weight:800}.tab.active{background:var(--b);color:#fff}.subtabs{display:flex;gap:5px;overflow:auto;margin-bottom:14px}.subtab{border:1px solid var(--l);background:#fff;color:var(--b);border-radius:10px;padding:9px 12px;white-space:nowrap;font:inherit;font-size:12px;font-weight:800}.subtab.active{border-color:var(--g);background:#fffaf0}.frame{border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#fff}.frame iframe{display:block;width:100%;height:1150px;border:0}.empty{padding:30px;text-align:center;color:var(--m)}@media(max-width:600px){.shell{padding:14px 10px 50px}.hero{padding:24px 0 12px}.hero h1{font-size:34px}.frame iframe{height:1250px}}</style></head><body><main class="shell"><header class="top"><a class="back" id="back">← Domestic</a><b id="gw"></b></header><section class="hero"><small>DOMESTIC</small><h1 id="title">Leagues</h1><p id="meta"></p></section><nav class="tabs" id="tabs"></nav><div id="content"><div class="empty">Caricamento…</div></div></main><script>
const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||'',section=(p.get('section')||'leagues').toLowerCase(),tabs=document.getElementById('tabs'),content=document.getElementById('content');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('title').textContent=section==='cups'?'Cups':'Leagues';document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');document.getElementById('back').href='group.html?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&group=DOMESTIC';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
(async()=>{const j=await fetch('catalog.php?world='+gw,{cache:'no-store'}).then(r=>r.json());let rows=(j.rows||[]).filter(x=>String(x.competition_group||'').toUpperCase()==='DOMESTIC');rows=rows.filter(x=>section==='leagues'?/^Div\s*\d+/i.test(String(x.nexus_view||'')):!/^Div\s*\d+/i.test(String(x.nexus_view||'')));if(section==='leagues')rows.sort((a,b)=>(parseInt(String(a.nexus_view).match(/\d+/)?.[0]||99)-parseInt(String(b.nexus_view).match(/\d+/)?.[0]||99)));tabs.innerHTML=rows.map((x,i)=>'<button class="tab '+(!i?'active':'')+'" data-i="'+i+'">'+esc(x.nexus_view)+'</button>').join('');function show(i){document.querySelectorAll('.tab').forEach((b,k)=>b.classList.toggle('active',k===i));const x=rows[i];if(!x){content.innerHTML='<div class="empty">Nessuna competizione.</div>';return}const u='view.html?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&competition='+encodeURIComponent(x.competition_key)+'&name='+encodeURIComponent(x.nexus_view)+'&embedded=1';content.innerHTML='<div class="frame"><iframe src="'+u+'" title="'+esc(x.nexus_view)+'"></iframe></div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(Number(b.dataset.i)));show(0)})();
</script></body></html>
