<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Competition Family</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:1050px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{padding:30px 0 16px}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:6px 0}.hero p{color:var(--m)}.country,.tabs{display:flex;gap:5px;overflow:auto;padding:5px;border:1px solid var(--l);border-radius:14px;background:#fff;margin-bottom:10px}.country button,.tab{border:0;background:#fff;color:var(--m);border-radius:9px;padding:11px 14px;white-space:nowrap;font:inherit;font-size:12px;font-weight:800}.country button.active{background:var(--g);color:#fff}.tab.active{background:var(--b);color:#fff}.frame{border:1px solid var(--l);border-radius:18px;overflow:hidden}.frame iframe{display:block;width:100%;height:1200px;border:0}.empty{padding:30px;text-align:center;color:var(--m)}@media(max-width:600px){.shell{padding:14px 10px 50px}.hero{padding:22px 0 12px}.hero h1{font-size:34px}.frame iframe{height:1300px}}html,body{max-width:100%;overflow-x:hidden}img{max-width:100%}button,select,input{max-width:100%}.shell{width:100%;overflow-x:hidden}@media(max-width:500px){body{font-size:14px}.shell{padding-left:10px!important;padding-right:10px!important}.top{max-width:100%;gap:8px}.hero{max-width:100%}.tabs,.country,.subtabs{max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar,.country::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}}</style></head><body><main class="shell"><header class="top"><a class="back" id="back">← Competitions</a><b id="gw"></b></header><section class="hero"><small id="ey"></small><h1 id="title"></h1><p id="meta"></p></section><nav class="country" id="countries" hidden></nav><nav class="tabs" id="tabs"></nav><div id="content"><div class="empty">Caricamento…</div></div></main><script>
const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||'',family=p.get('family')||'domestic-leagues',countries=document.getElementById('countries'),tabs=document.getElementById('tabs'),content=document.getElementById('content');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('back').href='./?world='+encodeURIComponent(gw);document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');const labels={'domestic-leagues':['DOMESTIC','Leagues'],'domestic-playoffs':['DOMESTIC','Playoffs'],'domestic-cups':['DOMESTIC','Cups'],'international-cups':['INTERNATIONAL','Cups'],'world-cup':['NATIONS','World Cup']};document.getElementById('ey').textContent=labels[family]?.[0]||'';document.getElementById('title').textContent=labels[family]?.[1]||'Competitions';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function familyRows(all){const allowed={ 'domestic-leagues':['league'],'domestic-playoffs':['playoff'],'domestic-cups':['charityshield','nationalcup','leaguecup'],'international-cups':['smfacup','smfashield','supercup'],'world-cup':['interqualifier','worldcup']};return all.filter(x=>(allowed[family]||[]).includes(String(x.sm_action||'').toLowerCase()))}
function tabName(x){if(family==='domestic-leagues'||family==='domestic-playoffs'){const d=String(x.sm_division||'').match(/\d+/)?.[0]||String(x.nexus_view||'').match(/Div\s*(\d+)/i)?.[1];return d?'DIV '+d:String(x.nexus_view||'').replace(/\s*Playoff/i,'').trim()}if(family==='domestic-cups'){const a=String(x.sm_action||'').toLowerCase();return a==='charityshield'?'CHARITY SHIELD':a==='nationalcup'?'NATIONAL CUP':'LEAGUE CUP'}if(family==='international-cups'){const a=String(x.sm_action||'').toLowerCase();return a==='smfacup'?'SMFA CHAMPIONS':a==='smfashield'?'SMFA SHIELD':'SMFA SUPER CUP'}if(family==='world-cup')return String(x.sm_action||'').toLowerCase()==='interqualifier'?'QUALIFIERS':'WORLD CUP';return x.nexus_view||x.sm_action}
(async()=>{const j=await fetch('catalog.php?world='+gw,{cache:'no-store'}).then(r=>r.json());let all=familyRows(j.rows||[]),country=null;const isDomestic=family.startsWith('domestic-'),multi=all.some(x=>String(x.world_type||'').toUpperCase().includes('MULTI'));function render(){let rows=country?all.filter(x=>String(x.sm_country||'')===country):all;const unique=[];rows.forEach(x=>{const n=tabName(x);if(!unique.some(y=>y.name===n))unique.push({name:n,row:x})});tabs.innerHTML=unique.map((x,i)=>'<button class="tab '+(!i?'active':'')+'" data-i="'+i+'">'+esc(x.name)+'</button>').join('');function show(i){document.querySelectorAll('.tab').forEach((b,k)=>b.classList.toggle('active',k===i));const x=unique[i]?.row;if(!x){content.innerHTML='<div class="empty">Nessuna competizione.</div>';return}content.innerHTML='<div class="frame"><iframe src="view.html?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&competition='+encodeURIComponent(x.competition_key)+'&name='+encodeURIComponent(x.nexus_view)+'&embedded=1"></iframe></div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(Number(b.dataset.i)));show(0)}if(isDomestic&&multi){const cs=[...new Set(all.map(x=>String(x.sm_country||'')).filter(Boolean))];if(cs.length){country=cs[0];countries.hidden=false;countries.innerHTML=cs.map((x,i)=>'<button class="'+(!i?'active':'')+'" data-country="'+esc(x)+'">'+esc(x)+'</button>').join('');countries.querySelectorAll('button').forEach(b=>b.onclick=()=>{country=b.dataset.country;countries.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}}render()})();
</script></body></html>
