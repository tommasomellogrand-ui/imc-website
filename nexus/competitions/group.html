<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Competitions</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding-bottom:18px}.back{color:var(--b);text-decoration:none;font-weight:800}.gw{color:var(--g);font-size:12px;font-weight:800}.hero{padding:36px 0 22px}.hero small{color:var(--g);font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(38px,8vw,62px);margin:7px 0}.hero p{color:var(--m);margin:0}.list{display:grid;gap:12px}.card{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--l);border-left:4px solid var(--g);border-radius:16px;background:#fff;color:var(--b);padding:20px;text-align:left;font:inherit;cursor:pointer}.card b{font-size:20px}.card span{font-size:28px;color:var(--g)}.empty{color:var(--m);padding:30px;text-align:center;border:1px solid var(--l);border-radius:16px}</style></head><body><main class="shell"><header class="top"><a class="back" id="back" href="./">← Competitions</a><div class="gw" id="gw"></div></header><section class="hero"><small>COMPETITIONS</small><h1 id="title"></h1><p id="meta"></p></section><section class="list" id="list"><div class="empty">Caricamento…</div></section></main><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||'',group=(p.get('group')||'DOMESTIC').toUpperCase(),list=document.getElementById('list');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('title').textContent=group;document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');document.getElementById('back').href='./?world='+encodeURIComponent(gw);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));(async()=>{const j=await fetch('catalog.php?world='+gw,{cache:'no-store'}).then(r=>r.json()),rows=(j.rows||[]).filter(x=>String(x.competition_group||'').toUpperCase()===group);list.innerHTML=rows.length?rows.map(x=>'<button class="card" data-key="'+esc(x.competition_key)+'" data-name="'+esc(x.nexus_view)+'"><b>'+esc(x.nexus_view)+'</b><span>›</span></button>').join(''):'<div class="empty">Nessuna competizione.</div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>location.href='view.html?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&competition='+encodeURIComponent(x.dataset.key)+'&name='+encodeURIComponent(x.dataset.name))})();</script></body></html>
