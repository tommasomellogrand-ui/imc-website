<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Competition</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:24px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{color:var(--b);text-decoration:none;font-weight:800}.world{font-size:12px;color:var(--g);font-weight:800}.hero{background:linear-gradient(135deg,var(--b),#173267);color:#fff;border-radius:22px;padding:28px;margin-bottom:16px}.hero small{color:#e8c46d;font-weight:800}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px 0}.hero p{margin:0;color:#dbe2ef}.tabs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--l);border-radius:16px;padding:6px;margin-bottom:24px}.tab{border:0;background:#fff;color:var(--m);padding:14px 6px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}.tab.active{background:var(--b);color:#fff}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.q{border:1px solid var(--l);border-radius:16px;padding:18px;background:#fff}.q b{display:block;margin-bottom:5px}.q span{color:var(--m);font-size:13px}.section{margin:22px 0}.section h2{font-size:21px}.card{border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#fff}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #edf0f4}.match:last-child{border-bottom:0}.match .away{text-align:right}.score{font-size:20px;font-weight:900;background:var(--s);padding:8px 12px;border-radius:10px}.stand{width:100%;border-collapse:collapse}.stand th,.stand td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left}.stand th{font-size:11px;color:var(--m)}.pts{background:var(--b);color:#fff;border-radius:9px;padding:6px 9px;font-weight:800}.muted{color:var(--m)}.loading{padding:28px;text-align:center;color:var(--m)}@media(max-width:700px){.tabs{grid-template-columns:repeat(5,auto);overflow:auto}.tab{font-size:11px;padding:13px 10px}.quick{grid-template-columns:1fr 1fr}.match{font-size:13px}.hero{padding:22px}.shell{padding-left:14px;padding-right:14px}}</style></head>
<body><main class="shell"><header class="top"><a class="back" href="./">← Competitions</a><div class="world" id="world"></div></header>
<section class="hero"><small id="group">COMPETITION</small><h1 id="title">Competition</h1><p id="meta"></p></section>
<nav class="tabs"><button class="tab active" data-tab="overview">OVERVIEW</button><button class="tab" data-tab="results">RESULTS</button><button class="tab" data-tab="standings">STANDINGS</button><button class="tab" data-tab="stats">STATS</button><button class="tab" data-tab="schedule">SCHEDULE</button></nav>
<div id="view"><div class="loading">Caricamento dati…</div></div></main>
<script>
const p=new URLSearchParams(location.search),gw=p.get('world')||'GW001',season=p.get('season')||'',key=p.get('competition')||'',name=p.get('name')||'Competition',view=document.getElementById('view');document.getElementById('world').textContent=gw;document.getElementById('title').textContent=name;document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q='?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&competition='+encodeURIComponent(key);
async function api(file){const r=await fetch(file+q,{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Errore');return j}
function matches(rows,score=true){return '<div class="card">'+(rows||[]).slice(0,20).map(r=>'<div class="match"><b>'+esc(r.home_name)+'</b><span class="score">'+(score?esc(r.home_score)+' - '+esc(r.away_score):'VS')+'</span><b class="away">'+esc(r.away_name)+'</b></div>').join('')+'</div>'}
async function show(tab){view.innerHTML='<div class="loading">Caricamento dati…</div>';try{if(tab==='overview'){const j=await api('overview.php');document.getElementById('group').textContent=(j.competition?.competition_group||'COMPETITION');view.innerHTML='<div class="quick"><div class="q"><b>Results</b><span>'+j.summary.results+'</span></div><div class="q"><b>Schedule</b><span>'+j.summary.upcoming+'</span></div><div class="q"><b>Match Reports</b><span>'+j.summary.match_reports+'</span></div><div class="q"><b>Season</b><span>'+esc(season||'—')+'</span></div></div><section class="section"><h2>Ultimi risultati</h2>'+matches(j.latest_results,true)+'</section><section class="section"><h2>Prossime partite</h2>'+matches(j.next_matches,false)+'</section>'}
if(tab==='results'){const j=await api('results.php');view.innerHTML='<section class="section"><h2>Results</h2>'+matches(j.rows,true)+'</section>'}
if(tab==='schedule'){const j=await api('schedule.php');view.innerHTML='<section class="section"><h2>Schedule</h2>'+matches(j.rows,false)+'</section>'}
if(tab==='standings'){const j=await api('standings.php');view.innerHTML='<section class="section"><h2>Standings</h2><div class="card"><table class="stand"><thead><tr><th>#</th><th>Club</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>PT</th></tr></thead><tbody>'+j.rows.map(r=>'<tr><td>'+r.position+'</td><td><b>'+esc(r.team_name)+'</b></td><td>'+r.played+'</td><td>'+r.won+'</td><td>'+r.drawn+'</td><td>'+r.lost+'</td><td>'+r.gd+'</td><td><span class="pts">'+r.points+'</span></td></tr>').join('')+'</tbody></table></div></section>'}
if(tab==='stats')view.innerHTML='<section class="section"><h2>Stats</h2><div class="card"><div class="loading">Goals · Assists · Rating · MOM · Yellow · Red<br><br>Il motore statistiche Competition verrà collegato ai Match Report.</div></div></section>'}catch(e){view.innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});show('overview');
</script></body></html>
