<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Competition</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:24px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{color:var(--b);text-decoration:none;font-weight:800}.world{font-size:12px;color:var(--g);font-weight:800}.hero{background:linear-gradient(135deg,var(--b),#173267);color:#fff;border-radius:22px;padding:28px;margin-bottom:16px}.hero small{color:#e8c46d;font-weight:800}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px 0}.hero p{margin:0;color:#dbe2ef}.tabs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--l);border-radius:16px;padding:6px;margin-bottom:24px}.tab{border:0;background:#fff;color:var(--m);padding:14px 6px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}.tab.active{background:var(--b);color:#fff}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}.q{border:1px solid var(--l);border-radius:16px;padding:18px;background:#fff}.q b{display:block;margin-bottom:5px}.q span{color:var(--m);font-size:13px}.section{margin:22px 0}.section h2{font-size:21px}.card{border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#fff}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #edf0f4}.match:last-child{border-bottom:0}.match .away{text-align:right}.score{font-size:20px;font-weight:900;background:var(--s);padding:8px 12px;border-radius:10px}.stand{width:100%;border-collapse:collapse}.stand th,.stand td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left}.stand th{font-size:11px;color:var(--m)}.pts{background:var(--b);color:#fff;border-radius:9px;padding:6px 9px;font-weight:800}.muted{color:var(--m)}.loading{padding:28px;text-align:center;color:var(--m)}@media(max-width:700px){.tabs{grid-template-columns:repeat(5,auto);overflow:auto}.tab{font-size:11px;padding:13px 10px}.quick{grid-template-columns:1fr 1fr}.match{font-size:13px}.hero{padding:22px}.shell{padding-left:14px;padding-right:14px}}html,body{max-width:100%;overflow-x:hidden}img{max-width:100%}button,select,input{max-width:100%}.shell{width:100%;overflow-x:hidden}@media(max-width:500px){body{font-size:14px}.shell{padding-left:10px!important;padding-right:10px!important}.top{max-width:100%;gap:8px}.hero{max-width:100%}.tabs,.country,.subtabs{max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar,.country::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}}.round-box{margin-bottom:18px}.round-head{padding:16px 18px;background:var(--s);border-bottom:1px solid var(--l)}.round-head h3{margin:0 0 5px;font-size:17px}.round-head span,.round-head small{display:block;font-size:12px;color:var(--m)}.round-head small{font-size:10px;margin-top:5px}.round-group+ .round-group{border-top:1px solid var(--l)}.round-group h4{margin:0;padding:12px 18px;color:var(--g);font-size:14px}.round-group h4 span{font-weight:500;font-size:11px}.match-date{grid-column:1/-1;color:var(--m);font-size:11px}.q small{display:block;color:var(--m);margin-top:6px}@media(max-width:500px){.match{padding:12px 10px;gap:8px}.score{font-size:16px;padding:6px 8px}.round-head{padding:13px 12px}}</style></head>
<body><main class="shell"><header class="top"><a class="back" href="./">← Competitions</a><div class="world" id="world"></div></header>
<section class="hero"><small id="group">COMPETITION</small><h1 id="title">Competition</h1><p id="meta"></p></section>
<nav class="tabs"><button class="tab active" data-tab="overview">OVERVIEW</button><button class="tab" data-tab="results">RESULTS</button><button class="tab" data-tab="standings">STANDINGS</button><button class="tab" data-tab="stats">STATS</button><button class="tab" data-tab="schedule">SCHEDULE</button></nav>
<div id="view"><div class="loading">Caricamento dati…</div></div></main>
<script>
const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||'',key=p.get('competition')||'',name=p.get('name')||'Competition',view=document.getElementById('view');localStorage.setItem('imc_nexus_world',gw);document.getElementById('world').textContent=gw;document.getElementById('title').textContent=name;document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q='?world='+encodeURIComponent(gw)+'&season='+encodeURIComponent(season)+'&competition='+encodeURIComponent(key);
async function api(file){const r=await fetch(file+q,{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Errore');return j}
let matchRequest,activeTab;
const clean=v=>String(v??'').trim();
const dateLabel=value=>{const d=clean(value).slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(d)?d.split('-').reverse().join('/'):'Data non disponibile'};
function fixtureKey(r){return clean(r.sm_fixture_id)||[r.match_date,r.home_sm_club_id||r.home_sm_team_id||r.home_name,r.away_sm_club_id||r.away_sm_team_id||r.away_name].join('|')}
function distinct(rows){const seen=new Set;return rows.filter(r=>{const id=fixtureKey(r);if(seen.has(id))return false;seen.add(id);return true})}
function groupName(r){const explicit=clean(r.competition_group_name);if(explicit)return explicit;const stage=clean(r.competition_stage);return /^(?:group|gruppo|girone)\s+[A-Z0-9]+$/i.test(stage)?stage:''}
function roundMeta(r){const stage=clean(r.competition_stage),group=groupName(r),phase=stage===group?'':stage,round=clean(r.competition_round),day=clean(r.match_date).slice(0,10);return {phase,round,day,group,id:JSON.stringify([phase,round||day])}}
function makeRounds(rows,allRows,descending){
 const all=new Map;for(const r of allRows){const m=roundMeta(r);if(!all.has(m.id))all.set(m.id,{...m,first:m.day,last:m.day,action:r.sm_action,hasGroups:!!m.group});const x=all.get(m.id);if(m.day){x.first=!x.first||m.day<x.first?m.day:x.first;x.last=m.day>x.last?m.day:x.last}x.hasGroups||=!!m.group;}
 const numbers=new Map;[...all.values()].sort((a,b)=>a.first.localeCompare(b.first)||a.id.localeCompare(b.id)).forEach(x=>{const category=x.phase||'regular';const n=(numbers.get(category)||0)+1;numbers.set(category,n);x.number=n;const numeric=x.round.match(/^(?:(?:giornata|turno|round|matchday)\s*)?(\d+)$/i);const prefix=x.action==='league'?'Giornata':'Turno';x.label=x.phase?x.phase+(x.round?' · '+x.round:(!/final|ottav|quart|sparegg/i.test(x.phase)?' · '+prefix+' '+n:'')):(numeric?prefix+' '+numeric[1]:x.round||prefix+' '+n);x.inferred=!x.round&&!/final|ottav|quart|sparegg/i.test(x.phase);});
 const buckets=new Map;for(const r of rows){const id=roundMeta(r).id;if(!buckets.has(id))buckets.set(id,{...all.get(id),rows:[]});buckets.get(id).rows.push(r)}
 return [...buckets.values()].sort((a,b)=>(descending?b.last.localeCompare(a.last):a.first.localeCompare(b.first))||a.number-b.number);
}
async function loadMatches(){if(!matchRequest)matchRequest=Promise.all([api('results.php'),api('schedule.php')]).then(([r,s])=>{const results=distinct((r.rows||[]).filter(x=>x.home_score!=null&&x.away_score!=null)),played=new Set(results.map(fixtureKey)),schedule=distinct(s.rows||[]).filter(x=>!played.has(fixtureKey(x))),all=[...results,...schedule];return {results:makeRounds(results,all,true),schedule:makeRounds(schedule,all,false)}}).catch(e=>{matchRequest=null;throw e});return matchRequest}
function matches(rows,score=true){return rows.map(r=>'<div class="match"><div class="match-date">'+esc(dateLabel(r.match_date))+(!score&&r.match_time?' · '+esc(String(r.match_time).slice(0,5)):'')+'</div><b>'+esc(r.home_name)+'</b><span class="score">'+(score?esc(r.home_score)+' - '+esc(r.away_score):'VS')+'</span><b class="away">'+esc(r.away_name)+'</b></div>').join('')}
function roundsHtml(rounds,score){if(!rounds.length)return '<div class="card loading">'+(score?'Nessun risultato disponibile.':'Nessuna partita in calendario.')+'</div>';return rounds.map(round=>{const groups=new Map;for(const r of round.rows){const name=groupName(r);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(r)}const hasGroups=[...groups.keys()].some(Boolean),dates=[...new Set(round.rows.map(r=>clean(r.match_date).slice(0,10)))].sort(),dateRange=dates.length?dateLabel(dates[0])+(dates.length>1?' – '+dateLabel(dates.at(-1)):''):'Data non disponibile';return '<section class="card round-box"><header class="round-head"><h3>'+esc(round.label)+'</h3><span>'+esc(dateRange)+' · '+round.rows.length+' partite</span>'+(round.inferred?'<small>Numero ricavato dall’ordine cronologico dei turni disponibili.</small>':'')+'</header>'+[...groups.entries()].sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true})).map(([name,rows])=>'<div class="round-group">'+(hasGroups?'<h4>'+esc(name||'Girone non indicato')+' <span>· '+rows.length+' partite</span></h4>':'')+matches(rows,score)+'</div>').join('')+'</section>'}).join('')}
async function show(tab){activeTab=tab;view.innerHTML='<div class="loading">Caricamento dati…</div>';try{if(['overview','results','schedule'].includes(tab)){const j=await loadMatches();if(activeTab!==tab)return;const group=key.split('|').find(x=>['DOMESTIC','INTERNATIONAL','NATIONS'].includes(x));document.getElementById('group').textContent=group||'COMPETITION';if(tab==='overview'){const last=j.results[0],next=j.schedule[0];view.innerHTML='<div class="quick"><div class="q"><b>Results · Ultimo turno</b><span>'+(last?.rows.length??0)+' partite</span><small>'+esc(last?.label||'Nessun risultato')+'</small></div><div class="q"><b>Schedule · Prossimo turno</b><span>'+(next?.rows.length??0)+' partite</span><small>'+esc(next?.label||'Nessuna partita')+'</small></div></div><section class="section"><h2>Ultimo turno · Results</h2>'+roundsHtml(last?[last]:[],true)+'</section><section class="section"><h2>Prossimo turno · Schedule</h2>'+roundsHtml(next?[next]:[],false)+'</section>'}else view.innerHTML='<section class="section"><h2>'+ (tab==='results'?'Results':'Schedule')+'</h2>'+roundsHtml(j[tab],tab==='results')+'</section>';return}
if(tab==='standings'){const j=await api('standings.php');if(activeTab!==tab)return;view.innerHTML='<section class="section"><h2>Standings</h2><div class="card"><table class="stand"><thead><tr><th>#</th><th>Club</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>PT</th></tr></thead><tbody>'+j.rows.map(r=>'<tr><td>'+r.position+'</td><td><b>'+esc(r.team_name)+'</b></td><td>'+r.played+'</td><td>'+r.won+'</td><td>'+r.drawn+'</td><td>'+r.lost+'</td><td>'+r.gd+'</td><td><span class="pts">'+r.points+'</span></td></tr>').join('')+'</tbody></table></div></section>'}
if(tab==='stats')view.innerHTML='<section class="section"><h2>Stats</h2><div class="card"><div class="loading">Goals · Assists · Rating · MOM · Yellow · Red<br><br>Il motore statistiche Competition verrà collegato ai Match Report.</div></div></section>'}catch(e){if(activeTab!==tab)return;view.innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});show('overview');
</script></body></html>
