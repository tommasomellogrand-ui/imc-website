<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Competitions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{--blue:#0B103A;--gold:#D5A13A;--white:#FFF;--charcoal:#1A1A1A;--line:#D9DDE5;--soft:#F5F6F8}
*{box-sizing:border-box}body{margin:0;background:var(--white);color:var(--charcoal);font-family:Inter,Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:24px}.back{color:var(--blue);text-decoration:none;font-weight:800}.context{display:flex;gap:8px}select{font:inherit;background:#fff;color:var(--blue);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.hero{padding:42px 0 30px}.ey{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:800}.hero h1{margin:8px 0;font-size:clamp(40px,7vw,72px);line-height:.95;color:var(--blue);font-weight:900}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.group{font:inherit;text-align:left;background:#fff;color:var(--blue);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:24px;min-height:160px;cursor:pointer}.group small{color:var(--gold);font-weight:800}.group b{display:block;font-size:24px;margin:12px 0}.group span{color:#667085}.group:hover{background:#fffaf0}.list{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:20px}.row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:#fff;width:100%;font:inherit;text-align:left;cursor:pointer}.row span{color:var(--gold);font-size:24px}.row b{color:var(--blue)}.muted{color:#667085}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.groups{grid-template-columns:1fr}.context{width:100%}select{flex:1;min-width:0}}
</style></head><body><main class="shell">
<header class="top"><a class="back" href="../">← NEXUS</a><div class="context"><select id="world"></select><select id="season"><option value="">Season</option></select></div></header>
<section class="hero"><div class="ey">NEXUS · COMPETITIONS</div><h1>Competitions</h1><p class="muted" id="worldName">Seleziona il Game World.</p></section>
<section class="groups">
<button class="group" data-family="domestic-leagues"><small>01 · DOMESTIC</small><b>LEAGUES</b><span>Campionati</span></button>
<button class="group" data-family="domestic-playoffs"><small>02 · DOMESTIC</small><b>PLAYOFFS</b><span>Playoff divisioni</span></button>
<button class="group" data-family="domestic-cups"><small>03 · DOMESTIC</small><b>CUPS</b><span>Coppe nazionali</span></button>
<button class="group" data-family="international-cups"><small>04 · INTERNATIONAL</small><b>CUPS</b><span>Competizioni SMFA</span></button>
<button class="group" data-family="world-cup"><small>05 · NATIONS</small><b>WORLD CUP</b><span>Qualifiers · World Cup</span></button>
</section>

</main><script>
const $=x=>document.getElementById(x),w=$('world'),s=$('season');let catalog=[];
for(let i=1;i<=10;i++){let g='GW'+String(i).padStart(3,'0');w.add(new Option(g,g))}w.value=new URLSearchParams(location.search).get('world')||localStorage.getItem('imc_nexus_world')||'GW001';localStorage.setItem('imc_nexus_world',w.value);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){let ctx=await fetch('../core/context.php?world='+w.value,{cache:'no-store'}).then(r=>r.json());$('worldName').textContent=(ctx.world?.game_world_name||w.value)+' · '+w.value;s.innerHTML='<option value="">Season</option>';(ctx.seasons||[]).forEach(x=>s.add(new Option('Season '+x.imc_season,x.imc_season)));if(ctx.seasons?.length)s.value=ctx.seasons.at(-1).imc_season;let j=await fetch('catalog.php?world='+w.value,{cache:'no-store'}).then(r=>r.json());catalog=j.rows||[]}
document.querySelectorAll('.group').forEach(b=>b.onclick=()=>location.href='family.html?world='+encodeURIComponent(w.value)+'&season='+encodeURIComponent(s.value||'')+'&family='+encodeURIComponent(b.dataset.family));w.onchange=()=>{localStorage.setItem('imc_nexus_world',w.value);history.replaceState(null,'','?world='+encodeURIComponent(w.value));load()};load();
</script></body></html>
