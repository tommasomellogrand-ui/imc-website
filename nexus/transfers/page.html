<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Transfers</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:950px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{padding:34px 0 20px}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:5px 0}.hero p{color:var(--m)}.tools{display:flex;gap:10px;margin-bottom:16px}.search{flex:1;padding:14px;border:1px solid var(--l);border-radius:13px;font:inherit}.count{background:#fff;border:1px solid var(--l);border-radius:13px;padding:13px 18px;font-weight:900}.list{display:grid;gap:7px}.transfer{background:#fff;border:1px solid var(--l);border-radius:14px;overflow:hidden}.transfer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid #edf0f4}.name{font-size:14px;font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{font-size:10px;color:var(--m);font-weight:700;white-space:nowrap}.transfer-body{display:grid;grid-template-columns:1fr 2fr;min-height:92px}.photo-wrap{display:flex;align-items:center;justify-content:center;border-right:1px solid #edf0f4;padding:8px}.pic{width:72px;height:72px;border-radius:12px;background:var(--s);object-fit:cover}.details{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px}.club{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700}.club img,.club-fallback{width:24px;height:24px;object-fit:contain}.club-fallback{display:grid;place-items:center;background:var(--s);border-radius:50%;font-size:11px}.arrow{font-size:10px;color:var(--g);padding-left:8px}.amount{font-size:12px;color:var(--g);font-weight:900;margin-top:1px}.empty{padding:30px;text-align:center;color:var(--m)}@media(max-width:430px){.shell{padding:14px 10px 55px}.hero{padding:24px 0 14px}.hero h1{font-size:34px}.tools{gap:6px;margin-bottom:10px}.search{padding:11px}.count{padding:10px 12px}.transfer-head{padding:7px 9px}.transfer-body{min-height:84px}.photo-wrap{padding:6px}.pic{width:64px;height:64px}.details{padding:6px 8px;gap:3px}.club img,.club-fallback{width:21px;height:21px}}</style></head><body><main class="shell"><header class="top"><a class="back" href="../">← Nexus</a><b id="gw"></b></header><section class="hero"><small>IMC · TRANSFER MARKET</small><h1>Transfers</h1><p id="meta"></p></section><div class="tools"><input id="search" class="search" placeholder="Cerca giocatore o club…"><div class="count" id="count">—</div></div><section class="list" id="list"><div class="empty">Caricamento…</div></section></main><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||'',list=document.getElementById('list'),search=document.getElementById('search');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('it-IT'):'—';function render(){const q=search.value.toLowerCase(),a=rows.filter(x=>[x.player_name,x.club_from,x.club_to].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('count').textContent=a.length;list.innerHTML=a.length?a.map(x=>{const pi=x.player_image_resolved||x.player_image,seasonLabel=x.imc_season||x.normalized_season||'—',dateLabel=x.normalized_transfer_date?fmt(x.normalized_transfer_date):'Data da normalizzare';const club=(name,img)=>'<div class="club">'+(img?'<img src="'+esc(String(img).replace(/^http:/i,'https:'))+'" alt="">':'<span class="club-fallback">◈</span>')+'<span>'+esc(name||'—')+'</span></div>';return '<article class="transfer"><div class="transfer-head"><div class="name">'+esc(x.player_name||'Giocatore')+'</div><div class="when">'+dateLabel+' · SEASON '+esc(seasonLabel)+'</div></div><div class="transfer-body"><div class="photo-wrap">'+(pi?'<img class="pic" src="'+esc(String(pi).replace(/^http:/i,'https:'))+'" alt="">':'<div class="pic"></div>')+'</div><div class="details">'+club(x.club_from,x.club_from_image)+'<div class="arrow">↓</div>'+club(x.club_to,x.club_to_image)+'<div class="amount">'+esc(x.amount_text||'')+'</div></div></div></article>'}).join(''):'<div class="empty">Nessun trasferimento.</div>'}(async()=>{const j=await fetch('index.php?world='+encodeURIComponent(gw)+(season?'&season='+encodeURIComponent(season):''),{cache:'no-store'}).then(r=>r.json());rows=j.rows||[];render()})();search.oninput=render;</script></body></html>
