<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Transfers</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:950px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{padding:34px 0 20px}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:5px 0}.hero p{color:var(--m)}.tools{display:flex;gap:10px;margin-bottom:16px}.search{flex:1;padding:14px;border:1px solid var(--l);border-radius:13px;font:inherit}.count{background:#fff;border:1px solid var(--l);border-radius:13px;padding:13px 18px;font-weight:900}.list{display:grid;gap:10px}.transfer{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--l);border-radius:17px;padding:15px}.pic{width:58px;height:58px;border-radius:50%;background:var(--s);object-fit:cover}.name{font-weight:900}.route{font-size:12px;color:var(--m);margin-top:5px}.meta{text-align:right}.date{font-weight:800}.num{font-size:11px;color:var(--m);margin-top:4px}.amount{font-size:12px;color:var(--g);font-weight:800;margin-top:4px}.empty{padding:30px;text-align:center;color:var(--m)}@media(max-width:600px){.transfer{grid-template-columns:52px 1fr}.pic{width:44px;height:44px}.meta{grid-column:2;text-align:left}.hero h1{font-size:36px}}</style></head><body><main class="shell"><header class="top"><a class="back" href="../">← Nexus</a><b id="gw"></b></header><section class="hero"><small>IMC · TRANSFER MARKET</small><h1>Transfers</h1><p id="meta"></p></section><div class="tools"><input id="search" class="search" placeholder="Cerca giocatore o club…"><div class="count" id="count">—</div></div><section class="list" id="list"><div class="empty">Caricamento…</div></section></main><script>const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',season=p.get('season')||'',list=document.getElementById('list'),search=document.getElementById('search');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('meta').textContent=gw+(season?' · Season '+season:'');let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('it-IT'):'—';function render(){const q=search.value.toLowerCase(),a=rows.filter(x=>[x.player_name,x.club_from,x.club_to].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('count').textContent=a.length;list.innerHTML=a.length?a.map(x=>'<article class="transfer">'+(x.player_image?'<img class="pic" src="'+esc(String(x.player_image).replace(/^http:/i,'https:'))+'" alt="">':'<div class="pic"></div>')+'<div><div class="name">'+esc(x.player_name||'Giocatore')+'</div><div class="route">'+esc(x.club_from||'—')+' → '+esc(x.club_to||'—')+'</div></div><div class="meta"><div class="date">'+(x.normalized_transfer_date?fmt(x.normalized_transfer_date):'Data da normalizzare')+'</div><div class="num">#'+esc(x.imc_transfer_number)+'</div><div class="amount">'+esc(x.amount_text||'')+'</div></div></article>').join(''):'<div class="empty">Nessun trasferimento.</div>'}(async()=>{const j=await fetch('index.php?world='+encodeURIComponent(gw)+(season?'&season='+encodeURIComponent(season):''),{cache:'no-store'}).then(r=>r.json());rows=j.rows||[];render()})();search.oninput=render;</script></body></html>
