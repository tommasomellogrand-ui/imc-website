<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carriera manager | Nexus</title><link rel="stylesheet" href="/nexus/assets/archive.css?v=1"></head><body><header class="top"><div class="wrap"><a class="brand" href="/nexus/"><img src="/site-assets/images/imc-logo.png" alt="IMC">NEXUS</a><nav><a href="/nexus/worlds/">Worlds</a><a href="/nexus/managers/">Managers</a></nav></div></header><main class="wrap"><section class="hero"><div class="eyebrow" id="id">NEXUS / MANAGERS</div><div id="identity" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><div><h1 id="name">Caricamento…</h1><p>Carriera globale Italian Masters Club</p></div></div></section><h2>Statistiche nei mondi</h2><div class="grid" id="totals"></div><h2>Mondi e club allenati</h2><div class="grid" id="worlds"></div><p class="muted" id="status">Caricamento dati ufficiali…</p></main><footer class="footer"><div class="wrap">Italian Masters Club · Nexus</div></footer><script>
const id=new URLSearchParams(location.search).get('manager')||'';const status=document.getElementById('status');const mapping={'GW001':['IMC-001','Road To History','roadtohistory'],'GW005':['IMC-002','Hall Of Famers','halloffamers'],'GW009':['IMC-003','Kick Off','kickoff'],'GW010':['IMC-004','Sensible Soccer Academy','sensiblesocceracademy'],'GW011':['IMC-005','Subbuteo Super League','subbuteosuperleague'],'GW004':['IMC-006','World League','worldleague'],'GW006':['IMC-007','Master League World','masterleagueworld'],'IMC-008':['IMC-008','Scudetto','scudetto']};
function tile(label,value){const el=document.createElement('div');el.className='card';const t=document.createElement('small');t.textContent=label;const v=document.createElement('strong');v.textContent=String(value);el.append(t,v);return el}
if(!/^MNG[0-9]+$/i.test(id)){status.textContent='Identificativo manager non valido'}else fetch('/nexus/managers/index.php?manager='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json()).then(async d=>{if(!d.ok||!d.manager)throw Error('Manager non trovato');const m=d.manager;document.getElementById('name').textContent=m.full_name;document.getElementById('id').textContent='NEXUS / MANAGERS / '+m.manager_id;document.title=m.full_name+' | Nexus';const src=m.face_image_url||m.bust_image_url;if(src&&/^https:\/\//i.test(src)){const img=document.createElement('img');img.src=src;img.alt='Foto di '+m.full_name;img.style.cssText='width:125px;height:150px;object-fit:cover;border-radius:14px';document.getElementById('identity').prepend(img)}const a=d.assignments||[];const distinct=[...new Set(a.map(x=>x.game_world_id).filter(x=>mapping[x]))];const box=document.getElementById('totals');box.append(tile('Mondi di gioco',distinct.length));const worlds=document.getElementById('worlds');for(const gw of distinct){const w=mapping[gw];const jobs=a.filter(x=>x.game_world_id===gw);const card=document.createElement('div');card.className='card';const h=document.createElement('strong');h.textContent=w[1];card.append(h);for(const j of jobs){const p=document.createElement('span');p.textContent=j.assignment_name||j.team_name||'Assegnazione registrata';card.append(p)}const link=document.createElement('a');link.href='/nexus/worlds/'+w[0]+'/';link.textContent='Scheda mondo →';link.style.marginTop='14px';card.append(link);worlds.append(card)}const sm=Number(m.sm_manager_id);if(sm>0&&distinct.length){const results=await Promise.allSettled(distinct.map(async gw=>{const r=await fetch('/nexus/managers/stats.php?world='+encodeURIComponent(gw)+'&sm_manager='+sm,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error('stats');return d.stats}));if(results.every(x=>x.status==='fulfilled')){const keys=[['played','Partite'],['won','Vittorie'],['drawn','Pareggi'],['lost','Sconfitte'],['gf','Gol fatti'],['ga','Gol subiti']];for(const [k,label] of keys)box.append(tile(label,results.reduce((n,x)=>n+Number(x.value[k]||0),0)));status.textContent='Statistiche calcolate dai Results dei mondi associati'}else status.textContent='Statistiche parzialmente non disponibili; i conteggi non vengono mostrati per evitare totali errati.'}else status.textContent='Assegnazioni ufficiali caricate.'}).catch(()=>{status.textContent='Dati manager temporaneamente non disponibili';document.getElementById('name').textContent='Manager non disponibile'});
</script></body></html>
