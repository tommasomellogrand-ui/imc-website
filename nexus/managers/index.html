<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Managers | IMC Nexus</title><link rel="stylesheet" href="/nexus/assets/archive.css?v=2"></head><body><header class="top"><div class="wrap"><a class="brand" href="/nexus/"><img src="/site-assets/images/imc-logo.png" alt="IMC">NEXUS</a><nav><a href="/nexus/worlds/">Worlds</a><a href="/nexus/managers/">Managers</a><a href="/imc_campus/world_center/">World Center</a></nav></div></header><main class="wrap"><section class="hero"><div class="eyebrow">NEXUS / MANAGERS</div><h1>Archivio manager</h1><p>Consulta i manager IMC. I nominativi vengono letti dall'anagrafica globale CORE, senza copie locali.</p></section><label for="search" class="muted">Cerca per nome o ID manager</label><div><input class="search" id="search" type="search" placeholder="Cerca un manager…"></div><p class="muted" id="status" role="status">Caricamento manager…</p><div id="results" class="grid"></div><script>
const results=document.getElementById('results'),status=document.getElementById('status'),search=document.getElementById('search');let managers=[];
function render(){const q=search.value.trim().toLocaleLowerCase('it');const filtered=managers.filter(x=>String(x.full_name||'').toLocaleLowerCase('it').includes(q)||String(x.manager_id||'').toLowerCase().includes(q));results.replaceChildren();for(const x of filtered){const a=document.createElement('a');a.className='card';a.href='/nexus/managers/view.html?manager='+encodeURIComponent(x.manager_id);const small=document.createElement('small');small.textContent=x.manager_id||'';const strong=document.createElement('strong');strong.textContent=x.full_name||'Manager';const span=document.createElement('span');span.textContent='Apri scheda manager ↗';const photo=x.face_image_url||x.bust_image_url;if(photo&&/^https:\/\//i.test(photo)){const img=document.createElement('img');img.src=photo;img.alt='Foto di '+(x.full_name||'manager');img.loading='lazy';img.style.cssText='height:95px;width:95px;object-fit:cover;border-radius:12px;margin-bottom:10px';a.append(img)}a.append(small,strong,span);results.append(a)}status.textContent=filtered.length+' manager'+(filtered.length===1?'':' disponibili')}
search.addEventListener('input',render);fetch('/nexus/managers/index.php',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{if(!d.ok||!Array.isArray(d.rows))throw Error('Risposta non valida');managers=d.rows;render()}).catch(()=>{status.textContent='Anagrafica temporaneamente non disponibile. Riprova più tardi.'});
</script></main><footer class="footer"><div class="wrap">Italian Masters Club · Archivio globale</div></footer></body></html>
