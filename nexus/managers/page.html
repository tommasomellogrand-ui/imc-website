<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nexus · Managers</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.back{color:var(--b);text-decoration:none;font-weight:800}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:5px 0}.hero p{color:var(--m);margin:0 0 18px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--l);padding:5px;border-radius:15px;background:#fff}.tab{border:0;border-radius:11px;padding:13px;background:#fff;color:var(--m);font-weight:800}.tab.active{background:var(--b);color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:16px;overflow:hidden;margin:16px 0}.kpi{background:#fff;padding:16px;text-align:center}.kpi b{font-size:24px;display:block}.kpi span{font-size:11px;color:var(--m);font-weight:700}.search{width:100%;border:1px solid var(--l);background:#fff;border-radius:15px;padding:16px;font:inherit;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--l);background:#fff;border-radius:18px;padding:20px 14px;min-height:190px;cursor:pointer}.name{font-size:17px;font-weight:900}.id{font-size:12px;color:var(--m);margin-top:7px}@media(max-width:650px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px 5px;min-height:132px;border-radius:13px;min-width:0}.name{font-size:11px;line-height:1.1;overflow-wrap:anywhere}.id{font-size:8px;margin-top:5px;overflow-wrap:anywhere}}.empty{color:var(--m);padding:24px;text-align:center}@media(max-width:600px){.summary{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}}html,body{max-width:100%;overflow-x:hidden}img{max-width:100%}button,select,input{max-width:100%}.shell{width:100%;overflow-x:hidden}@media(max-width:500px){body{font-size:14px}.shell{padding-left:10px!important;padding-right:10px!important}.top{max-width:100%;gap:8px}.hero{max-width:100%}.tabs,.country,.subtabs{max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar,.country::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}}</style><meta name="theme-color" content="#101238"><link rel="stylesheet" href="../assets/profiles.css?v=20260927"><script src="../assets/profiles-shell.js?v=20260928club" defer></script><script src="../assets/the-club-links.js?v=20260928club" defer></script></head><body data-profile-family="managers" data-profile-detail="false"><header class="profile-banner"><div class="profile-wrap"><div class="profile-top"><a id="nexus-brand" class="nexus-brand" href="../" aria-label="Nexus home"><span class="logo-crop"><img src="/site-assets/images/imc-logo.png" alt="IMC"></span>NEXUS</a><select id="profile-world" aria-label="Mondo di gioco"></select><span id="gw" hidden></span></div><section class="hero profile-hero"><small>IMC · MANAGER NETWORK</small><h1>Managers</h1><p id="meta">Game World</p></section></div></header><main class="shell"><div class="profile-back"><a class="back" href="../">← Nexus</a></div><div class="tabs"><button class="tab active" data-mode="imc_active">IMC Active</button><button class="tab" data-mode="ext_active">EXT Active</button><button class="tab" data-mode="imc_career">IMC Career</button></div><section class="summary" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b id="tot">—</b><span id="tot-label">MANAGER ATTIVI</span></div><div class="kpi"><b id="clubs">—</b><span>CLUB</span></div><div class="kpi"><b id="nations">—</b><span>NAZIONALI</span></div></section><input class="search" id="search" placeholder="Cerca manager…"><section class="cards" id="cards"><div class="empty">Caricamento…</div></section></main><nav class="profile-nav" id="profile-nav" aria-label="Navigazione principale"></nav><dialog id="profile-more"><div class="profile-dialog-head"><h2>Esplora il mondo</h2><button id="profile-close" aria-label="Chiudi menu">×</button></div><div id="profile-more-links"></div></dialog><script>
const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',cards=document.getElementById('cards'),search=document.getElementById('search');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('meta').textContent=gw+' · Manager directory';let data=[],extData=[],mode='imc_active';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('it-IT'):'—';
function filteredAssignments(x){return (x.assignments||[]).filter(a=>mode==='imc_active'?!a.end_date:!!a.end_date)}
function render(){const q=search.value.toLowerCase();if(mode==='ext_active'){const a=extData.filter(x=>(x.manager_name||'').toLowerCase().includes(q));cards.innerHTML=a.length?a.map(x=>'<article class="card"><div class="name">'+esc(x.manager_name)+'</div><div class="id">SM #'+esc(x.sm_manager_id)+'</div><div class="id">'+esc(x.team_name||'')+'</div></article>').join(''):'<div class="empty">Nessun manager.</div>';return}const a=data.filter(x=>x.full_name.toLowerCase().includes(q)&&filteredAssignments(x).length);cards.innerHTML=a.length?a.map(x=>'<article class="card" role="link" tabindex="0" onclick="location.href=\'profile.html?world='+encodeURIComponent(gw)+'&manager='+encodeURIComponent(x.manager_id)+'\'"><div class="name">'+esc(x.full_name)+'</div><div class="id">'+esc(x.manager_id)+'</div></article>').join(''):'<div class="empty">Nessun manager.</div>'}
function stats(){const active=data.filter(x=>(x.assignments||[]).some(a=>!a.end_date));tot.textContent=active.length;clubs.textContent=active.filter(x=>x.assignments.some(a=>!a.end_date&&a.assignment_type==='club')).length;nations.textContent=active.filter(x=>x.assignments.some(a=>!a.end_date&&a.assignment_type==='national_team')).length;document.getElementById('tot-label').textContent='MANAGER ATTIVI'}
function extStats(){const ids=new Set(extData.map(x=>String(x.sm_manager_id)));const clubIds=new Set(extData.filter(x=>x.assignment_type==='club').map(x=>String(x.sm_manager_id)));const nationIds=new Set(extData.filter(x=>x.assignment_type==='national_team').map(x=>String(x.sm_manager_id)));tot.textContent=ids.size;clubs.textContent=clubIds.size;nations.textContent=nationIds.size;document.getElementById('tot-label').textContent='EXTERNAL MANAGER'}
(async()=>{const [j,e]=await Promise.all([fetch('index.php?world='+gw,{cache:'no-store'}).then(r=>r.json()),fetch('index.php?world='+gw+'&external=1',{cache:'no-store'}).then(r=>r.json())]);extData=(e.rows||[]).filter(x=>x.game_world_id===gw);data=await Promise.all((j.rows||[]).map(async m=>{try{const d=await fetch('index.php?world='+gw+'&manager='+encodeURIComponent(m.manager_id),{cache:'no-store'}).then(r=>r.json());return {...m,assignments:d.assignments||[]}}catch(e){return {...m,assignments:[]}}}));stats();render()})();search.oninput=render;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');mode=t.dataset.mode;const summary=document.querySelector('.summary');summary.style.display=mode==='imc_career'?'none':'grid';if(mode==='ext_active')extStats();else if(mode==='imc_active')stats();render()});
</script></body></html>
