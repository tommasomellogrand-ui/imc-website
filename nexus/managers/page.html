<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Managers</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.back{color:var(--b);text-decoration:none;font-weight:800}.hero small{color:var(--g);font-weight:800}.hero h1{font-size:42px;margin:5px 0}.hero p{color:var(--m);margin:0 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--l);padding:5px;border-radius:15px;background:#fff}.tab{border:0;border-radius:11px;padding:13px;background:#fff;color:var(--m);font-weight:800}.tab.active{background:var(--b);color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--l);border:1px solid var(--l);border-radius:16px;overflow:hidden;margin:16px 0}.kpi{background:#fff;padding:16px;text-align:center}.kpi b{font-size:24px;display:block}.kpi span{font-size:11px;color:var(--m);font-weight:700}.search{width:100%;border:1px solid var(--l);background:#fff;border-radius:15px;padding:16px;font:inherit;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--l);background:#fff;border-radius:18px;padding:18px;cursor:pointer;text-align:center}.manager-icon{width:66px;height:66px;border-radius:50%;margin:0 auto 12px;background:var(--b);color:#fff;display:grid;place-items:center;font-size:30px}.card .assign{justify-content:center}@media(max-width:650px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px 5px;border-radius:13px;min-width:0}.manager-icon{width:42px;height:42px;font-size:20px;margin-bottom:7px}.name{font-size:12px;line-height:1.1;overflow-wrap:anywhere}.id{font-size:9px}.assign{gap:4px;margin-top:7px}.badge{padding:5px 4px;font-size:8px;max-width:100%;overflow-wrap:anywhere}}.name{font-size:21px;font-weight:900}.id{color:var(--m);font-size:12px;margin-top:3px}.assign{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.badge{background:var(--s);border-radius:10px;padding:8px 10px;font-size:12px}.badge strong{color:var(--g)}.empty{color:var(--m);padding:24px;text-align:center}@media(max-width:600px){.summary{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}}html,body{max-width:100%;overflow-x:hidden}img{max-width:100%}button,select,input{max-width:100%}.shell{width:100%;overflow-x:hidden}@media(max-width:500px){body{font-size:14px}.shell{padding-left:10px!important;padding-right:10px!important}.top{max-width:100%;gap:8px}.hero{max-width:100%}.tabs,.country,.subtabs{max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar,.country::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}}</style></head><body><main class="shell"><header class="top"><a class="back" href="../">← Nexus</a><b id="gw">GW001</b></header><section class="hero"><small>IMC · MANAGER NETWORK</small><h1>Managers</h1><p id="meta">Game World</p></section><div class="tabs"><button class="tab active">ATTIVI</button><button class="tab">STORICO</button></div><section class="summary" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b id="tot">—</b><span>MANAGER ATTIVI</span></div><div class="kpi"><b id="clubs">—</b><span>CLUB</span></div><div class="kpi"><b id="nations">—</b><span>NAZIONALI</span></div></section><input class="search" id="search" placeholder="Cerca manager…"><section class="cards" id="cards"><div class="empty">Caricamento…</div></section></main><script>
const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',cards=document.getElementById('cards'),search=document.getElementById('search');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('meta').textContent=gw+' · Manager directory';let data=[],mode='active';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('it-IT'):'—';
function filteredAssignments(x){return (x.assignments||[]).filter(a=>mode==='active'?!a.end_date:!!a.end_date)}
function render(){const q=search.value.toLowerCase();const a=data.filter(x=>x.full_name.toLowerCase().includes(q)&&filteredAssignments(x).length);cards.innerHTML=a.length?a.map(x=>'<article class="card" onclick="location.href=\'profile.html?world='+encodeURIComponent(gw)+'&manager='+encodeURIComponent(x.manager_id)+'\'"><div class="manager-icon">♟</div><div class="name">'+esc(x.full_name)+'</div><div class="id">'+esc(x.manager_id)+'</div><div class="assign">'+filteredAssignments(x).sort((a,b)=>(a.assignment_type==='club'?0:1)-(b.assignment_type==='club'?0:1)).map(y=>'<span class="badge"><strong>'+esc(y.assignment_type==='national_team'?'NAZIONALE':'CLUB')+'</strong> · '+esc(y.assignment_name||y.national_team_name||y.national_name||y.team_name||'')+'<br><small>dal '+fmt(y.start_date)+(mode==='history'?' al '+fmt(y.end_date):'')+'</small></span>').join('')+'</div></article>').join(''):'<div class="empty">Nessun manager.</div>'}
function stats(){const active=data.filter(x=>(x.assignments||[]).some(a=>!a.end_date));tot.textContent=active.length;clubs.textContent=active.filter(x=>x.assignments.some(a=>!a.end_date&&a.assignment_type==='club')).length;nations.textContent=active.filter(x=>x.assignments.some(a=>!a.end_date&&a.assignment_type==='national_team')).length}
(async()=>{const j=await fetch('index.php?world='+gw,{cache:'no-store'}).then(r=>r.json());data=await Promise.all((j.rows||[]).map(async m=>{try{const d=await fetch('index.php?world='+gw+'&manager='+encodeURIComponent(m.manager_id),{cache:'no-store'}).then(r=>r.json());return {...m,assignments:d.assignments||[]}}catch(e){return {...m,assignments:[]}}}));stats();render()})();search.oninput=render;
document.querySelectorAll('.tab').forEach((t,i)=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');mode=i?'history':'active';document.querySelector('.summary').style.display=i?'none':'grid';render()});
</script></body></html>
