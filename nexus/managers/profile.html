<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus · Manager</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--b:#0B103A;--g:#D5A13A;--l:#DDE3EC;--s:#F5F7FA;--m:#6B768A}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--b);font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.back{color:var(--b);text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,var(--b),#173267);color:#fff;border-radius:22px;padding:26px}.hero small{color:#e8c46d;font-weight:800}.hero h1{font-size:38px;margin:7px 0}.hero p{margin:0;color:#dbe2ef}.assign{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-14px;padding:0 14px}.assignment{background:#fff;border:1px solid var(--l);border-radius:15px;padding:16px}.assignment small{color:var(--g);font-weight:800}.assignment b{display:block;margin-top:5px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;border:1px solid var(--l);background:#fff;border-radius:15px;padding:5px;margin:18px 0}.tab{border:0;background:#fff;color:var(--m);font-size:11px;font-weight:800;padding:13px 5px;border-radius:10px}.tab.active{background:var(--b);color:#fff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--l);border-radius:16px;overflow:hidden;background:var(--l);gap:1px}.k{background:#fff;padding:17px;text-align:center}.k b{display:block;font-size:24px}.k span{font-size:10px;color:var(--m)}.section{margin-top:22px}.section h2{font-size:18px}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:18px}.timeline{border-left:2px solid var(--l);margin-left:8px;padding-left:22px}.job{position:relative;padding:0 0 22px}.job:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--b);left:-28px;top:5px}.job b{display:block}.job span{color:var(--m);font-size:12px}.empty{color:var(--m);padding:25px;text-align:center}@media(max-width:650px){.tabs{overflow:auto;grid-template-columns:repeat(6,auto)}.assign{grid-template-columns:1fr 1fr}.hero h1{font-size:31px}}</style></head><body><main class="shell"><header class="top"><a class="back" id="back" href="./page.html">← Managers</a><b id="gw"></b></header><section class="hero"><small>IMC MANAGER</small><h1 id="name">Manager</h1><p id="mid"></p></section><section class="assign" id="assign"></section><nav class="tabs"><button class="tab active" data-tab="overview">OVERVIEW</button><button class="tab" data-tab="career">CAREER</button><button class="tab" data-tab="stats">STATS</button><button class="tab" data-tab="matches">MATCHES</button><button class="tab" data-tab="trophies">TROPHIES</button><button class="tab" data-tab="h2h">H2H</button></nav><div id="view"></div></main><script>
const p=new URLSearchParams(location.search),gw=p.get('world')||localStorage.getItem('imc_nexus_world')||'GW001',id=p.get('manager')||'',view=document.getElementById('view');localStorage.setItem('imc_nexus_world',gw);document.getElementById('gw').textContent=gw;document.getElementById('back').href='page.html?world='+gw;let D;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function jobs(a){return '<div class="card timeline">'+a.map(x=>'<div class="job"><b>'+esc(x.club_name||x.national_name||x.team_name||x.club_id||x.national_id||'Incarico')+'</b><span>'+esc(x.game_world_id||gw)+' · '+esc(x.start_date||'')+(x.end_date?' → '+esc(x.end_date):' → Attuale')+'</span></div>').join('')+'</div>'}
function show(t){if(t==='overview')view.innerHTML='<section class="kpis"><div class="k"><b>—</b><span>PARTITE</span></div><div class="k"><b>—</b><span>VITTORIE</span></div><div class="k"><b>—</b><span>PAREGGI</span></div><div class="k"><b>—</b><span>SCONFITTE</span></div></section><section class="section"><h2>Incarichi attuali</h2>'+jobs(D.assignments||[])+'</section><section class="section"><h2>Ultime partite</h2><div class="card empty">Il modulo Matches verrà collegato ai Results del manager.</div></section><section class="section"><h2>Trophy Cabinet</h2><div class="card empty">I trofei verranno letti da IMC Trophy Room.</div></section>';else if(t==='career')view.innerHTML='<section class="section"><h2>Carriera IMC</h2>'+jobs(D.assignments||[])+'</section>';else view.innerHTML='<section class="section"><h2>'+t.toUpperCase()+'</h2><div class="card empty">Sezione pronta per il relativo motore autonomo.</div></section>'}
(async()=>{D=await fetch('index.php?world='+gw+'&manager='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json());document.getElementById('name').textContent=D.manager?.full_name||id;document.getElementById('mid').textContent=id+' · '+gw;document.getElementById('assign').innerHTML=(D.assignments||[]).slice(0,2).map(x=>'<div class="assignment"><small>'+esc(x.assignment_type||'INCARICO')+'</small><b>'+esc(x.club_name||x.national_name||x.team_name||x.club_id||x.national_id||'')+'</b></div>').join('');show('overview')})();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});
</script></body></html>
