<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RTH Live · MD15</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f7faff;font-family:Inter,sans-serif}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7faff}.dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;width:min(94vw,560px);background:#071a33f2;color:#fff;border:1px solid #ffffff2e;border-radius:22px;padding:10px;box-shadow:0 18px 45px #071a3350;backdrop-filter:blur(14px)}.top{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;margin-bottom:8px}.small{font-size:8px;font-weight:900;letter-spacing:.08em;color:#9cc4ff}.min{text-align:center;font-size:28px;font-weight:900}.right{text-align:right}.tabs,.ctrl{display:grid;gap:6px}.tabs{grid-template-columns:repeat(4,1fr);margin-bottom:6px}.ctrl{grid-template-columns:repeat(4,1fr)}button{border:1px solid #ffffff24;background:#ffffff0d;color:#dbe7f8;border-radius:12px;padding:10px 4px;font:900 8px Inter}button.on,button.play{background:#fff;color:#071a33;border-color:#fff}.note{font-size:7px;text-align:center;color:#9fb0c7;margin-top:7px}</style></head><body><iframe id="frame" src="./index.html?v=63101dc2"></iframe><div class="dock"><div class="top"><div class="small">RTH · LIVE PLAYER</div><div id="minute" class="min">0'</div><div id="status" class="small right">READY</div></div><div id="tabs" class="tabs"></div><div class="ctrl"><button onclick="resetLive()">↺ RESET</button><button id="play" class="play" onclick="togglePlay()">▶ START LIVE</button><button onclick="nextGoal()">⚽ NEXT GOAL</button><button onclick="goFT()">FT 90'</button></div><div class="note">I gol aprono automaticamente il popup RTH con club voice, marcatore, assist, manager reaction e classifica live.</div></div><script>const f=document.getElementById('frame'),mins=document.getElementById('minute'),stat=document.getElementById('status'),play=document.getElementById('play'),tabs=document.getElementById('tabs');let d='PLATINUM',m=0,t=null,q=[],ready=false;function W(s){return f.contentWindow.eval(s)}function events(){return JSON.parse(W(`JSON.stringify(R['${d}'].flatMap((g,gi)=>g[4].map((e,ei)=>({m:e[0],gi,ei}))).sort((a,b)=>a.m-b.m||a.gi-b.gi))`))}function patch(){W(`partial=function(d,min){const base=Object.fromEntries(B[d].map(x=>[x[0],{p:x[1],gd:x[2]}]));for(const g of R[d]){let h=0,a=0;for(const e of g[4]){if(e[0]<=min)e[1]===g[0]?h++:a++}base[g[0]].gd+=h-a;base[g[1]].gd+=a-h;if(min>0){if(h>a)base[g[0]].p+=3;else if(a>h)base[g[1]].p+=3;else{base[g[0]].p++;base[g[1]].p++}}}return Object.entries(base).sort((x,y)=>y[1].p-x[1].p||y[1].gd-x[1].gd||x[0].localeCompare(y[0]))}`)}function sync(){if(!ready)return;W(`div='${d}';render()`);const games=JSON.parse(W(`JSON.stringify(R['${d}'])`));const doc=f.contentDocument;[...doc.querySelectorAll('.n')].forEach((el,i)=>{let h=0,a=0;games[i][4].forEach(e=>{if(e[0]<=${m})e[1]===games[i][0]?h++:a++});el.textContent=h+'-'+a});[...doc.querySelectorAll('.ev')].forEach((el,i)=>{el.innerHTML='';games[i][4].filter(e=>e[0]<=${m}).forEach(e=>{let s=doc.createElement('span');s.className='e';s.textContent=`⚽ ${e[0]}' ${e[2]}${e[3]?' · 🅰 '+e[3]:''}`;el.appendChild(s)})});let live=JSON.parse(W(`JSON.stringify(partial('${d}',${m}))`));const table=doc.querySelector('.table');if(table)table.innerHTML=live.map((r,i)=>`<div class="r"><b>${i+1}</b>${W(`L(${JSON.stringify(r[0])})`)}<span class="club">${r[0]}</span><span class="gd">${r[1].gd>=0?'+':''}${r[1].gd}</span><b class="pts">${r[1].p} PT</b></div>`).join('');mins.textContent=m+"'";stat.textContent=m>=90?'FULL TIME':t?'PLAYING':'PAUSED'}function fire(e){W(`show(R['${d}'][${e.gi}],R['${d}'][${e.gi}][4][${e.ei}])`)}function step(){if(m>=90){clearInterval(t);t=null;play.textContent='▶ START LIVE';sync();return}m++;let hits=q.filter(e=>e.m===m);hits.forEach((e,i)=>setTimeout(()=>fire(e),i*6400));sync()}function togglePlay(){if(!ready)return;if(t){clearInterval(t);t=null;play.textContent='▶ START LIVE';sync();return}if(m>=90)m=0;q=events();t=setInterval(step,900);play.textContent='Ⅱ PAUSE';sync()}function nextGoal(){if(!ready)return;q=events();let e=q.find(x=>x.m>m);if(!e){goFT();return}m=e.m;sync();fire(e)}function goFT(){if(!ready)return;clearInterval(t);t=null;m=90;play.textContent='▶ START LIVE';sync()}function resetLive(){if(!ready)return;clearInterval(t);t=null;m=0;play.textContent='▶ START LIVE';sync()}function setD(x){if(!ready)return;clearInterval(t);t=null;d=x;m=0;q=[];W(`div='${d}';render()`);renderTabs();sync()}function renderTabs(){tabs.innerHTML=['PLATINUM','GOLD','SILVER','BRONZE'].map(x=>`<button class="${x===d?'on':''}" onclick="setD('${x}')">${x}</button>`).join('')}f.onload=()=>{try{patch();ready=true;renderTabs();sync();stat.textContent='READY'}catch(e){stat.textContent='RELOAD'}};renderTabs();</script></body></html>
