 class="r"><b>${i+1}</b>${logo(r[0])}<span class="club">${r[0]}</span><b class="pts">${r[1].pts} PT</b></div>`).join('')}</div></section>`}function step(){if(busy||m>=90)return;m++;events().forEach(x=>{let k=x.e[0]+'|'+x.e[1]+'|'+x.e[2];if(!seen.has(k)){seen.add(k);queue.push(x)}});render();if(queue.length){busy=true;clearInterval(timer);timer=null;show(queue.shift())}else if(m>=90){run=false;clearInterval(timer);timer=null}}function show(x){let team=x.e[1],colors=['#071a33','#0d3260','#f1cb70'];if(team==='Torino')colors=['#651022','#28040b','#f3c76d'];if(team==='Palermo FC')colors=['#411425','#a8466f','#ffc1d6'];if(team==='AEK Athens'||team==='Borussia Dortmund')colors=['#171717','#5b4a00','#ffd84a'];ov.style.setProperty('--c1',colors[0]);ov.style.setProperty('--c2',colors[1]);ov.style.setProperty('--lite',colors[2]);let movement=x.moved.slice(0,4).map(y=>`<div class="move"><div class="pos">${y.now}°</div>${logo(y.team)}<b>${y.team}</b><b>${y.pts} PT</b><div class="delta ${y.now<y.old?'up':'dn'}">${y.now<y.old?'↑':'↓'}${Math.abs(y.old-y.now)}</div></div>`).join('');let s=storyText(x);ov.classList.add('show');ov.innerHTML=`<div class="panel"><img class="wm" src="${U(team)}"><div id="story" class="story"><img class="crest" src="${U(team)}"><div class="kicker">${x.e[0]}' · ${x.c.type}</div><div class="headline">${s.club}</div><div class="playerline">${s.player}</div><div class="managerline">${s.manager}</div><div class="scorer">${x.e[2]}</div><div class="assist">${x.e[3]?`Assist: <b>${x.e[3]}</b>`:'Assist: —'}${x.e[4]?' · RIGORE':''}</div><div class="match">${x.g[0]} ${x.c.aft[0]}–${x.c.aft[1]} ${x.g[1]}</div></div><div id="movement" class="movement"><img class="crest" src="${U(team)}"><h3>CLASSIFICA LIVE · EFFETTO DEL GOL</h3>${movement||'<div class="headline" style="font-size:27px">POSIZIONI INVARIATE</div>'}</div></div>`;const STORY_MS=x.moved.length?4700:6600, TOTAL_MS=x.moved.length?8200:6600;if(x.moved.length)setTimeout(()=>{let a=document.getElementById('story'),b=document.getElementById('movement');if(a&&b){a.style.display='none';b.style.display='block'}},STORY_MS);setTimeout(()=>{ov.classList.remove('show');busy=false;if(queue.length){busy=true;show(queue.shift())}else if(run)timer=setInterval(step,700)},TOTAL_MS)}function toggle(){run=!run;if(run&&!busy&&!timer)timer=setInterval(step,700);else if(!run&&timer){clearInterval(timer);timer=null}render()}function jump(){for(let i=0;i<5;i++)if(!busy)step()}function restart(){clearInterval(timer);timer=null;run=false;m=0;queue=[];busy=false;seen=new Set();ov.classList.remove('show');render()}function finish(){m=90;run=false;clearInterval(timer);timer=null;render()}function setD(d){clearInterval(timer);timer=null;run=false;m=0;queue=[];busy=false;seen=new Set();ov.classList.remove('show');div=d;render()}render();</script></body></html>
