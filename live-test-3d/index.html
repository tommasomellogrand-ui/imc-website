<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RTH Live · MD13</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');:root{--navy:#071a33;--navy2:#0c2b52;--blue:#2874ff;--gold:#d6ad52;--text:#0b172a;--muted:#718096;--line:#dfe7f1;--soft:#f5f8fc;--white:#fff;--shadow:0 16px 40px rgba(15,37,66,.11),0 3px 10px rgba(15,37,66,.08)}*{box-sizing:border-box}html{background:#fff}body{margin:0;background:linear-gradient(180deg,#fff 0,#f7faff 42%,#fff 100%);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}.w{max-width:590px;margin:auto;padding:0 14px 52px}header{height:78px;display:flex;align-items:center;justify-content:space-between;margin:0 -14px 18px;padding:11px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);z-index:10;box-shadow:0 4px 16px rgba(20,49,85,.04)}.brand{display:flex;gap:10px;align-items:center}.brand img{width:48px;height:48px;object-fit:contain}.brand b{font-size:11px;letter-spacing:.14em;color:var(--navy);font-weight:900}.brand small,.date small{display:block;color:var(--muted);font-size:7px;margin-top:3px}.date{text-align:right;font-size:9px;color:var(--navy);font-weight:800}.hero{position:relative;overflow:hidden;border-radius:28px;padding:24px 20px;background:linear-gradient(145deg,#071a33,#0d3260 72%,#194f8d);color:#fff;box-shadow:0 22px 55px rgba(7,26,51,.2);margin-bottom:14px}.hero:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-65px;top:-80px;background:radial-gradient(circle,rgba(72,152,255,.5),transparent 68%)}.hero>*{position:relative}.ey{font-size:8px;letter-spacing:.18em;color:#80b7ff;font-weight:900}.hero h1{font-size:43px;line-height:.88;letter-spacing:-.06em;margin:9px 0 8px;font-weight:900}.hero h1 span{color:#f1cb70}.hero p{margin:0;color:#c9d8e9;font-size:9px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:sticky;top:78px;z-index:8;background:#f9fbfeee;padding:9px 0;backdrop-filter:blur(12px)}button{border:1px solid #dbe4ee;background:linear-gradient(145deg,#fff,#f1f6fb);color:#6f7d90;border-radius:14px;padding:11px 3px;font-family:inherit;font-weight:900;font-size:8px;box-shadow:4px 4px 10px rgba(36,65,98,.06)}button.on,button.p{color:var(--navy);border-color:var(--a);box-shadow:inset 0 -3px var(--a),4px 4px 10px rgba(36,65,98,.06)}.box{border:1px solid #dfe7f0;background:#fff;border-radius:24px;overflow:hidden;margin-top:10px;box-shadow:var(--shadow)}.ctrl{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;padding:13px 14px;border-bottom:1px solid #edf1f6;font-size:8px;color:var(--muted);font-weight:900}.clock{font-size:28px;text-align:center;color:var(--navy);font-weight:900}.right{text-align:right}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;background:#f7faff}.g{padding:14px;border-top:1px solid #edf1f6}.score{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;gap:7px}.t{display:flex;align-items:center;gap:7px;font-weight:800;font-size:11px;color:var(--navy)}.away{justify-content:flex-end;text-align:right}.t img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 5px 7px rgba(16,37,63,.11))}.n{text-align:center;font-size:27px;font-weight:900;color:var(--navy)}.ev{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}.e{font-size:8px;padding:5px 7px;border:1px solid #dfe7f0;background:#f6f9fd;border-radius:999px;color:#52647a}.wait{font-size:8px;color:#9aa6b6;margin-top:8px}.sec{margin-top:18px}.sec h2{font-size:24px;letter-spacing:-.04em;color:var(--navy);margin:0 0 9px}.table{border:1px solid #dfe7f0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.r{display:grid;grid-template-columns:27px 32px 1fr 46px 30px;align-items:center;padding:8px 10px;border-bottom:1px solid #edf1f6;font-size:9px}.r:first-child{background:linear-gradient(90deg,#eaf3ff,#fff)}.r:last-child{border:0}.r img{width:28px;height:28px;object-fit:contain}.club{font-weight:800;color:var(--navy)}.pts,.chg{text-align:right;font-weight:900}.up{color:#3baa78}.dn{color:#e85868}.ov{position:fixed;inset:0;z-index:30;background:rgba(7,26,51,.92);display:none;align-items:center;justify-content:center;padding:22px;text-align:center;backdrop-filter:blur(8px)}.ov.show{display:flex}.panel{width:min(88vw,430px);padding:26px 20px;border:1px solid rgba(255,255,255,.22);border-radius:28px;background:linear-gradient(145deg,#071a33,#0d3260);box-shadow:0 30px 90px #00152ccc;animation:pop 6.4s both;color:#fff}.panel img{width:82px;height:82px;object-fit:contain}.small{font-size:9px;color:#f1cb70;font-weight:900;letter-spacing:.17em}.big{font-size:78px;font-weight:900;line-height:.84;margin:12px 0;text-shadow:0 0 28px var(--a)}.name{font-size:21px;font-weight:900}.match{margin-top:12px;font-size:12px;color:#d7e3ef}@keyframes pop{0%{opacity:0;transform:scale(.75)}15%,88%{opacity:1;transform:none}100%{opacity:0;transform:scale(.95)}}</style></head><body><div class="w"><header><div class="brand"><img src="/nexus/assets/imc-logo.png"><div><b>ROAD TO HISTORY</b><small>LIVE CENTER · MATCHDAY 13</small></div></div><div class="date"><b>23 AUG 2026</b><small>KICK-OFF 20:00</small></div></header><div id="tabs" class="tabs"></div><main id="app"></main></div><div id="ov" class="ov"></div><script>const IDS={"1. FC Kaiserslautern":405,"Académica de Coimbra":214,"AEK Athens":372,"AS Reggina 1914":122,"AS Roma":123,"Atalanta BC":96,"Atlético Madrid":139,"Boca Juniors":270,"Bologna FC":98,"Borussia Dortmund":392,"Campobasso Calcio":3874,"Celtic":421,"Club América":439,"CR Flamengo":294,"Dynamo Dresden":394,"Dynamo Kyiv":347,"Eintracht Frankfurt":395,"FC Schalke 04":398,"Fenerbahçe SK":350,"Feyenoord":192,"FK Partizan":381,"Genoa CFC":108,"Guangzhou FC":1521,"Hertha BSC":404,"Legia Warszawa":65 o":{"pts":7,"gf":10,"ga":24}}};const DATA={"PLATINUM":{"accent":"#6d5dfc","games":[["Parma Calcio 1913","AS Reggina 1914",[]],["Dynamo Dresden","Torino",[]],["AEK Athens","TSV 1860 München",[]],["Palermo FC","Atalanta BC",[]],["Académica de Coimbra","FK Partizan",[]]]},"GOLD":{"accent":"#d6ad52","games":[["Eintracht Frankfurt","Genoa CFC",[]],["Palmeiras","Fenerbahçe SK",[]],["Boca Juniors","1. FC Kaiserslautern",[]],["Feyenoord","Sampdoria",[]],["Sunderland","Bologna FC",[]]]},"SILVER":{"accent":"#8b98aa","games":[["Tottenham Hotspur","SSC Napoli",[]],["Celtic","Atlético Madrid",[]],["Guangzhou FC","FC Schalke 04",[]],["São Paulo FC","Shakhtar Donetsk",[]],["Valencia CF","Olympique Marseille",[]]]},"BRONZE":{"accent":"#bd7445","games":[["Campobasso Calcio","Legia Warszawa",[]],["AS Roma","Dynamo Kyiv",[]],["SS Lazio","CR Flamengo",[]],["Club América","River Plate",[]],["Hertha BSC","Borussia Dortmund",[]]]}};const URL=n=>`https://cdn.soccerwiki.org/images/logos/clubs/${IDS[n]}.png`;let div='PLATINUM',q=[],busy=false;let S={};Object.keys(DATA).forEach(d=>S[d]={m:0,run:false,t:null,seen:new Set()});function logo(n){return IDS[n]?`<img src="${URL(n)}" alt="">`:''}function sc(d,m){return DATA[d].games.map(g=>{let h=0,a=0;g[2].forEach(e=>{if(+e[0]<=m){if(e[1]===g[0])h++;else a++}});return[h,a]})}function table(d,m){let r={};Object.entries(BASE[d]).forEach(([c,s])=>r[c]={...s});let z=sc(d,m);DATA[d].games.forEach((g,i)=>{let[h,a]=z[i];r[g[0]].gf+=h;r[g[0]].ga+=a;r[g[1]].gf+=a;r[g[1]].ga+=h;if(h>a)r[g[0]].pts+=3;else if(a>h)r[g[1]].pts+=3;else{r[g[0]].pts++;r[g[1]].pts++}});return Object.entries(r).sort((a,b)=>b[1].pts-a[1].pts||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||b[1].gf-a[1].gf)}function rank(d,c,m){return table(d,m).findIndex(x=>x[0]===c)+1}function events(d,m){let z=[];DATA[d].games.forEach((g,i)=>g[2].forEach(e=>{if(+e[0]===m){let s=sc(d,m)[i];z.push({min:e[0],team:e[1],player:e[2],h:g[0],a:g[1],z:s,old:rank(d,e[1],Math.max(0,m-1)),now:rank(d,e[1],m)})}}));return run)x.t=setInterval(step,1000);return}show(q.shift(),next)}function show(e,done){let changed=e.old!==e.now&&e.old>0&&e.now>0;ov.classList.add('show');ov.innerHTML=`<div class="panel"><div id="gp">${logo(e.team)}<div class="small">${e.min}' · GOL</div><div class="big">GOAL</div><div class="name">${e.player}</div><div class="match">${e.h} ${e.z[0]}–${e.z[1]} ${e.a}</div></div><div id="tp" style="display:none"><div class="small">CLASSIFICA LIVE</div><div class="name" style="margin:18px 0">${e.team}</div><div class="big" style="font-size:48px">${e.old}° → ${e.now}°</div></div></div>`;if(changed)setTimeout(()=>{gp.style.display='none';tp.style.display='block'},2900);setTimeout(()=>{ov.classList.remove('show');done()},6400)}function toggle(){let x=S[div];x.run=!x.run;if(x.run&&!busy&&!q.length)x.t=setInterval(step,1000);else if(x.t){clearInterval(x.t);x.t=null}render()}function jump(){for(let i=0;i<5;i++)step()}function reset(){let x=S[div];if(x.t)clearInterval(x.t);S[div]={m:0,run:false,t:null,seen:new Set()};q=[];busy=false;ov.classList.remove('show');render()}function setD(d){let x=S[div];if(x.t)clearInterval(x.t);x.run=false;x.t=null;q=[];busy=false;div=d;render()}render();</script></body></html>
