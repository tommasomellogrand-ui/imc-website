<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05080d">
<title>IMC | Road To History · Pre Match 20 Agosto</title>
<style>
:root{--bg:#05080d;--gold:#d6ad52;--txt:#f5f7fb;--muted:#8d97a6;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}.top{height:74px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#070b11;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:50px;height:50px;object-fit:contain}.brand b{font-size:12px;letter-spacing:.12em}.brand small,.date small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.date{text-align:right;font-size:10px}
#app{height:calc(100% - 74px);overflow:auto}.page{min-height:100%;padding:18px 15px 30px}.ey{font-size:9px;letter-spacing:.2em;color:var(--gold);font-weight:900}
.opening{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 16px;background:radial-gradient(circle at 50% 26%,rgba(214,173,82,.18),transparent 34%)}
.opening img{width:92px;height:92px;object-fit:contain;margin-bottom:14px}.opening h1{font-size:48px;line-height:.84;letter-spacing:-.06em;margin:10px 0}.opening h1 em{font-style:normal;color:var(--gold)}.opening p{font-size:10px;color:#a9b0bd;letter-spacing:.08em}
.heroBox{width:100%;max-width:350px;margin:22px 0;border:1px solid rgba(214,173,82,.38);border-radius:20px;padding:15px;background:#090e16dd}.heroBox small{font-size:8px;letter-spacing:.14em;color:var(--gold)}.heroBox b{display:block;margin-top:6px}
.enter,.continue{border:0;border-radius:999px;background:var(--gold);color:#07101a;padding:14px 22px;font-size:11px;font-weight:950;letter-spacing:.08em}.back{border:0;background:none;color:var(--gold);padding:0;margin-bottom:13px;font-size:10px;font-weight:900}
.bigpage h2,.selector h2,.intro h2,.tablepage h2{font-size:36px;line-height:.95;letter-spacing:-.045em;margin:7px 0 4px}.bigpage>p,.selector>p,.sub{font-size:10px;color:var(--muted)}
.biglist,.divgrid{display:grid;gap:11px;margin-top:17px}.bigcard,.divcard{border:1px solid var(--line);border-radius:20px;padding:16px;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent);color:white;text-align:left}.bigcard.motn{border-color:rgba(214,173,82,.45);background:linear-gradient(135deg,rgba(214,173,82,.12),transparent)}
.bt,.divcard small{font-size:8px;letter-spacing:.14em;color:var(--muted);font-weight:900}.bt{color:var(--gold)}.bigteams{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;text-align:center;margin-top:9px}.bigteams img{width:52px;height:52px;object-fit:contain}.bigteams b{display:block;font-size:10px;margin-top:4px}.bigmeta{text-align:center;color:var(--muted);font-size:8px;margin-top:7px}.continue{width:100%;margin-top:14px}
.divcard b{display:block;font-size:25px;margin:3px 0}.divcard span{font-size:10px;color:#c8ced8}.storyline{font-size:25px;line-height:1.03;margin:15px 0;color:var(--a)}
.quick,.signals,.infographic{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick div,.signal,.metric{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.025)}.quick small,.signal small,.metric small,.question small{display:block;color:var(--muted);font-size:7px;letter-spacing:.14em}.quick b,.signal b{display:block;font-size:11px;margin-top:5px}
.fixtures{margin-top:15px;border-top:1px solid var(--line)}.fixture{display:grid;grid-template-columns:30px 1fr 30px;gap:8px;align-items:center;text-align:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:9px}.fixture img{width:27px;height:27px;object-fit:contain}.fixture b{font-size:9px}
.table{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px}.row{display:grid;grid-template-columns:21px 29px 1fr 28px 28px 28px 28px 32px;gap:4px;align-items:center;min-height:40px;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.055)}.row:first-child{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 15%,transparent),transparent)}.row img{width:26px;height:26px;object-fit:contain}.row i{font-style:normal;color:var(--muted);font-size:9px}.row span{font-size:9px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{text-align:right;color:var(--muted);font-size:8px}.row b{text-align:right;font-size:10px}
.signals{margin-top:10px}.matchhead{display:grid;grid-template-columns:1fr 42px 1fr;align-items:start;text-align:center;margin-top:20px}.team img{width:86px;height:86px;object-fit:contain}.team h3{font-size:14px;margin:7px 0 3px}.team small{color:var(--muted);font-size:8px}.vs{padding-top:30px;font-size:18px;font-weight:900}.vs small{display:block;color:var(--muted);font-size:8px}
.angle{color:var(--gold);font-size:11px;letter-spacing:.1em;font-weight:950;margin-top:23px}.infographic{margin-top:10px}.metric b{display:block;font-size:17px;margin-top:3px}.story{font-size:14px;line-height:1.55;color:#cbd2dc}.question{border-left:3px solid var(--a);padding:12px;background:rgba(255,255,255,.03);border-radius:0 14px 14px 0}.question b{display:block;font-size:18px;margin-top:5px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.nav button{border:1px solid rgba(255,255,255,.13);background:#0b1119;color:white;border-radius:999px;padding:10px 14px;font-size:9px;font-weight:900}.nav .gold{background:var(--gold);color:#07101a;border:0}
</style>
</head>
<body>
<header class="top">
<div class="brand"><img src="/nexus/assets/imc-logo.png" alt="IMC"><div><b>ROAD TO HISTORY</b><small>PRE MATCH · MATCH 12</small></div></div>
<div class="date"><b>20 AUG 2026</b><small>KICK-OFF 20:00</small></div>
</header>
<main id="app"></main>
<script>
const X={"divisions":{"1":{"name":"PLATINUM","accent":"#e5edf7","table":[["AEK Athens",11,7,2,2,20,8,12,23],["Dynamo Dresden",11,7,2,2,15,8,7,23],["Atalanta BC",11,7,1,3,21,13,8,22],["Torino",11,5,3,3,22,11,11,18],["AS Reggina 1914",11,6,0,5,23,17,6,18],["TSV 1860 München",11,4,4,3,18,21,-3,16],["Palermo FC",11,3,3,5,14,20,-6,12],["Académica de Coimbra",11,3,1,7,13,26,-13,10],["Parma Calcio 1913",11,1,4,6,10,19,-9,7],["FK Partizan",11,1,2,8,7,20,-13,5]],"fixtures":[["Torino","Parma Calcio 1913"],["TSV 1860 München","Dynamo Dresden"],["Atalanta BC","AEK Athens"],["FK Partizan","Palermo FC"],["AS Reggina 1914","Académica de Coimbra"]],"big":["Atalanta BC","AEK Athens","ONE POINT. ONE SUMMIT.","3RD vs 1ST · 22–23 PT"],"editorials":[["HOME PRESSURE","Torino parte da 18 punti e da una differenza reti di +11. Contro il Parma, penultimo a quota 7, l'occasione è trasformare il fattore campo in pressione sulla zona alta.","CAN TORINO KEEP CLIMBING?"],["THE CHASER ON THE ROAD","Dynamo Dresden è a quota 23, appaiata all'AEK in vetta. Il 1860 è sesto, ma in casa può diventare un ostacolo pesantissimo.","CAN DRESDEN HOLD THE PACE?"],["ONE POINT. ONE SUMMIT.","Atalanta 22, AEK 23. La miglior partita della Platinum mette di fronte due delle tre squadre che stanno decidendo il campionato.","WHO OWNS THE SUMMIT TONIGHT?"],["DANGER ZONE","Partizan è ultimo a 5 punti, Palermo settimo a 12. Per i padroni di casa ogni partita ormai pesa doppio.","WHO FINDS A WAY OUT?"],["ATTACK vs DEFENCE","La Reggina ha già segnato 23 gol. L'Académica ne ha subiti 26: il dato racconta da solo dove può nascere la partita.","CAN ACADÉMICA SURVIVE THE PRESSURE?"]]},"2":{"name":"GOLD","accent":"#d6ad52","table":[["Fenerbahçe SK",11,6,5,0,24,10,14,23],["Sampdoria",11,7,2,2,16,12,4,23],["Bologna FC",11,6,4,1,27,13,14,22],["Eintracht Frankfurt",11,4,4,3,13,15,-2,16],["Boca Juniors",11,4,3,4,20,15,5,15],["Genoa CFC",11,4,2,5,22,23,-1,14],["1. FC Kaiserslautern",11,2,6,3,17,17,0,12],["Feyenoord",11,3,2,6,15,20,-5,11],["Sunderland",11,1,4,6,9,20,-11,7],["Palmeiras",11,1,2,8,8,26,-18,5]],"fixtures":[["Fenerbahçe SK","Eintracht Frankfurt"],["1. FC Kaiserslautern","Palmeiras"],["Sampdoria","Boca Juniors"],["Bologna FC","Feyenoord"],["Genoa CFC","Sunderland"]],"big":["Fenerbahçe SK","Eintracht Frankfurt","STILL UNBEATEN.","THE LEADER · 0 LOSSES"],"editorials":[["STILL UNBEATEN","Fenerbahçe guida la Gold a 23 punti ed è ancora imbattuto: 6 vittorie, 5 pareggi, zero sconfitte. L'Eintracht arriva da quarto e proverà a spezzare la serie.","DOES THE UNBEATEN RUN CONTINUE?"],["SURVIVAL LINE","Kaiserslautern è settimo a 12, Palmeiras ultimo a 5. Non è una sfida di vertice, ma può spostare parecchio nella parte bassa.","WHO TAKES THE BREATHING ROOM?"],["DEFENDING THE SUMMIT","Sampdoria è a 23, esattamente come Fenerbahçe. Contro Boca, quinto a 15, ogni punto serve per restare in testa alla corsa.","CAN SAMP HOLD THE LINE?"],["HEAVY ARTILLERY","Bologna ha il miglior attacco della Gold: 27 gol in 11 partite. Feyenoord ne ha subiti 20. La domanda è quanto a lungo possa reggere.","CAN FEYENOORD STOP THE FIREPOWER?"],["GOAL THREAT","Genoa ha segnato 22 gol, Sunderland soltanto 9. I rossoblù hanno l'occasione di trasformare il divario offensivo in tre punti.","DO GOALS MAKE THE DIFFERENCE?"]]},"3":{"name":"SILVER","accent":"#aeb9c7","table":[["Valencia CF",11,7,1,3,23,14,9,22],["Atlético Madrid",11,5,3,3,22,16,6,18],["Celtic",11,4,5,2,22,18,4,17],["SSC Napoli",11,4,5,2,15,14,1,17],["Tottenham Hotspur",11,5,2,4,19,21,-2,17],["Shakhtar Donetsk",11,4,2,5,29,25,4,14],["Olympique Marseille",11,4,2,5,22,21,1,14],["FC Schalke 04",11,4,2,5,13,16,-3,14],["São Paulo FC",11,2,3,6,10,22,-12,9],["Guangzhou FC",11,1,5,5,9,17,-8,8]],"fixtures":[["Atlético Madrid","Tottenham Hotspur"],["FC Schalke 04","Celtic"],["Shakhtar Donetsk","Guangzhou FC"],["Olympique Marseille","São Paulo FC"],["SSC Napoli","Valencia CF"]],"big":["SSC Napoli","Valencia CF","THE LEADER COMES TO NAPLES.","4TH vs 1ST · 17–22 PT"],"editorials":[["THE CHASE","Atlético 18, Tottenham 17. Seconda contro quinta, ma separati da un solo punto: una partita che può ribaltare il gruppo alle spalle del Valencia.","WHO TAKES SECOND PLACE PRESSURE?"],["CLOSE THE GAP","Celtic è terzo a 17, Schalke ottavo a 14. Tre punti soltanto separano le due squadre in una Silver compressa e imprevedibile.","WHO BREAKS THE PACK?"],["HEAVY ARTILLERY","Shakhtar ha segnato 29 gol, più di chiunque altro nella divisione. Guangzhou ne ha fatti appena 9: due mondi offensivi opposti.","CAN GUANGZHOU SILENCE THE GUNS?"],["MUST WIN","Marseille è a 14 punti e non può lasciare troppo spazio al gruppo davanti. São Paulo, nono a 9, cerca invece una scossa.","WHO CHANGES THE MOMENTUM?"],["THE LEADER COMES TO NAPLES","Valencia comanda a 22. Napoli è quarto a 17. Cinque punti di distanza e una notte che può riaprire oppure allungare la corsa al titolo.","CAN NAPOLI PULL THE LEADER BACK?"]]},"4":{"name":"BRONZE","accent":"#b97949","table":[["Borussia Dortmund",11,8,2,1,24,8,16,26],["SS Lazio",11,7,1,3,24,16,8,22],["Legia Warszawa",11,6,2,3,19,15,4,20],["Dynamo Kyiv",11,5,4,2,19,7,12,19],["AS Roma",11,5,4,2,16,11,5,19],["Hertha BSC",11,5,1,5,19,19,0,16],["River Plate",11,3,1,7,13,22,-9,10],["Campobasso Calcio",11,2,3,6,17,21,-4,9],["CR Flamengo",11,1,4,6,10,22,-12,7],["Club América",11,1,2,8,11,31,-20,5]],"fixtures":[["Dynamo Kyiv","Campobasso Calcio"],["CR Flamengo","AS Roma"],["River Plate","SS Lazio"],["Borussia Dortmund","Club América"],["Legia Warszawa","Hertha BSC"]],"big":["Legia Warszawa","Hertha BSC","THE CHASE CONTINUES.","3RD vs 6TH · 20–16 PT"],"editorials":[["THE WALL","Dynamo Kyiv è quarta a 19 punti e ha subito appena 7 gol, miglior difesa della Bronze. Campobasso dovrà trovare una crepa nel muro.","CAN CAMPOBASSO BREAK THE WALL?"],["THE RESPONSE","Roma è quinta a 19 e non può perdere terreno dalle prime quattro. Flamengo è penultimo e ha già subito 22 gol.","CAN ROMA STAY IN THE CHASE?"],["SECOND PLACE ON THE ROAD","La Lazio è seconda a 22, quattro punti dietro il Dortmund. River è settimo a 10: per i biancocelesti è una trasferta da non sbagliare.","CAN LAZIO KEEP THE PRESSURE ON?"],["TOP vs BOTTOM","Borussia Dortmund 26, Club América 5. Miglior squadra contro ultima, +16 contro -20 di differenza reti.","CAN ANYTHING STOP DORTMUND?"],["THE CHASE CONTINUES","Legia è terzo a 20, Hertha sesto a 16. Quattro punti separano chi vuole restare sul podio da chi vuole rientrare nella corsa.","WHO OWNS THE NIGHT IN WARSAW?"]]}},"logos":{"TSV 1860 München":"https://cdn.soccerwiki.org/images/logos/clubs/415.png","Académica de Coimbra":"https://cdn.soccerwiki.org/images/logos/clubs/214.png","AEK Athens":"https://cdn.soccerwiki.org/images/logos/clubs/372.png","Atalanta BC":"https://cdn.soccerwiki.org/images/logos/clubs/96.png","Atlético Madrid":"https://cdn.soccerwiki.org/images/logos/clubs/139.png","Boca Juniors":"https://cdn.soccerwiki.org/images/logos/clubs/270.png","Bologna FC":"https://cdn.soccerwiki.org/images/logos/clubs/98.png","Borussia Dortmund":"https://cdn.soccerwiki.org/images/logos/clubs/392.png","Campobasso Calcio":"https://cdn.soccerwiki.org/images/logos/clubs/3874.png","Celtic":"https://cdn.soccerwiki.org/images/logos/clubs/421.png","Club América":"https://cdn.soccerwiki.org/images/logos/clubs/439.png","Dynamo Dresden":"https://cdn.soccerwiki.org/images/logos/clubs/394.png","Dynamo Kyiv":"https://cdn.soccerwiki.org/images/logos/clubs/347.png","Eintracht Frankfurt":"https://cdn.soccerwiki.org/images/logos/clubs/395.png","Fenerbahçe SK":"https://cdn.soccerwiki.org/images/logos/clubs/350.png","Feyenoord":"https://cdn.soccerwiki.org/images/logos/clubs/192.png","CR Flamengo":"https://cdn.soccerwiki.org/images/logos/clubs/294.png","Genoa CFC":"https://cdn.soccerwiki.org/images/logos/clubs/108.png","Guangzhou FC":"https://cdn.soccerwiki.org/images/logos/clubs/1521.png","Hertha BSC":"https://cdn.soccerwiki.org/images/logos/clubs/404.png","1. FC Kaiserslautern":"https://cdn.soccerwiki.org/images/logos/clubs/405.png","SS Lazio":"https://cdn.soccerwiki.org/images/logos/clubs/111.png","Legia Warszawa":"https://cdn.soccerwiki.org/images/logos/clubs/651.png","SSC Napoli":"https://cdn.soccerwiki.org/images/logos/clubs/746.png","Olympique Marseille":"https://cdn.soccerwiki.org/images/logos/clubs/330.png","Palermo FC":"https://cdn.soccerwiki.org/images/logos/clubs/117.png","Palmeiras":"https://cdn.soccerwiki.org/images/logos/clubs/300.png","Parma Calcio 1913":"https://cdn.soccerwiki.org/images/logos/clubs/118.png","FK Partizan":"https://cdn.soccerwiki.org/images/logos/clubs/381.png","AS Reggina 1914":"https://cdn.soccerwiki.org/images/logos/clubs/122.png","River Plate":"https://cdn.soccerwiki.org/images/logos/clubs/282.png","AS Roma":"https://cdn.soccerwiki.org/images/logos/clubs/123.png","Sampdoria":"https://cdn.soccerwiki.org/images/logos/clubs/125.png","São Paulo FC":"https://cdn.soccerwiki.org/images/logos/clubs/306.png","FC Schalke 04":"https://cdn.soccerwiki.org/images/logos/clubs/398.png","Shakhtar Donetsk":"https://cdn.soccerwiki.org/images/logos/clubs/348.png","Sunderland":"https://cdn.soccerwiki.org/images/logos/clubs/76.png","Torino":"https://cdn.soccerwiki.org/images/logos/clubs/128.png","Tottenham Hotspur":"https://cdn.soccerwiki.org/images/logos/clubs/80.png","Valencia CF":"https://cdn.soccerwiki.org/images/logos/clubs/172.png"}};
const app=document.getElementById("app");let screen={type:"opening"};const logo=n=>X.logos[n];
function rowFor(d,n){let i=X.divisions[d].table.findIndex(r=>r[0]===n);return [i+1,...X.divisions[d].table[i].slice(1)]}
function go(s){screen=s;render();app.scrollTop=0}
function opening(){return `<section class="opening"><img src="/nexus/assets/imc-logo.png" alt="IMC"><div class="ey">GW001 · MATCH 12</div><h1>PRE MATCH<br><em>TONIGHT</em></h1><p>20 MATCHES · 4 DIVISIONS · KICK-OFF 20:00</p><div class="heroBox"><small>MATCH OF THE NIGHT</small><b>ATALANTA BC vs AEK ATHENS</b></div><button class="enter" onclick='go({type:"big"})'>ENTRA NEL PRE MATCH</button></section>`}
function big(){return `<section class="page bigpage"><button class="back" onclick='go({type:"opening"})'>← OPENING</button><div class="ey">MATCH 12 · TONIGHT</div><h2>BIG MATCHES</h2><p>Una partita da seguire per ogni divisione.</p><div class="biglist">${["1","2","3","4"].map(d=>{let q=X.divisions[d],b=q.big;return `<div class="bigcard ${d==="1"?"motn":""}"><div class="bt">DIVISION ${d} · ${q.name} · ${b[2]}</div><div class="bigteams"><div><img src="${logo(b[0])}"><b>${b[0]}</b></div><strong>VS</strong><div><img src="${logo(b[1])}"><b>${b[1]}</b></div></div><div class="bigmeta">${b[3]}</div></div>`}).join("")}</div><button class="continue" onclick='go({type:"selector"})'>CHOOSE YOUR DIVISION →</button></section>`}
function selector(){return `<section class="page selector"><div class="ey">CHOOSE YOUR SHOW</div><h2>4 DIVISIONS.<br>4 STORIES.</h2><p>Ogni divisione ha il suo Pre-Match Show.</p><div class="divgrid">${["1","2","3","4"].map(d=>{let q=X.divisions[d];return `<button class="divcard" onclick='go({type:"intro",d:"${d}"})'><small>DIVISION ${d}</small><b style="color:${q.accent}">${q.name}</b><span>${q.big[2]}</span></button>`}).join("")}</div></section>`}
function intro(d){let q=X.divisions[d],z=q.table;return `<section class="page intro" style="--a:${q.accent}"><button class="back" onclick='go({type:"selector"})'>← DIVISIONS</button><div class="ey">DIVISION ${d} · ${q.name}</div><h2>TONIGHT IN<br>${q.name}</h2><div class="storyline">${q.big[2]}</div><div class="quick"><div><small>LEADER</small><b>${z[0][0]} · ${z[0][8]} PT</b></div><div><small>MATCH STATUS</small><b>MATCH 12 · 20:00</b></div></div><div class="fixtures">${q.fixtures.map((m,i)=>`<div class="fixture"><img src="${logo(m[0])}"><b>${m[0]}<br><span style="color:var(--a)">${q.editorials[i][0]}</span><br>${m[1]}</b><img src="${logo(m[1])}"></div>`).join("")}</div><div class="nav"><button onclick='go({type:"selector"})'>BACK</button><button class="gold" onclick='go({type:"table",d:"${d}"})'>THE TABLE →</button></div></section>`}
function table(d){let q=X.divisions[d],z=q.table;return `<section class="page tablepage" style="--a:${q.accent}"><button class="back" onclick='go({type:"intro",d:"${d}"})'>← DIVISION INTRO</button><div class="ey">DIVISION ${d} · ${q.name}</div><h2>THE TABLE</h2><div class="sub">AFTER MATCH 11</div><div class="table">${z.map((r,i)=>`<div class="row"><i>${i+1}</i><img src="${logo(r[0])}"><span>${r[0]}</span><small>G ${r[1]}</small><small>V ${r[2]}</small><small>N ${r[3]}</small><small>P ${r[4]}</small><b>${r[8]}</b></div>`).join("")}</div><div class="signals"><div class="signal"><small>LEADER</small><b>${z[0][0]}</b></div><div class="signal"><small>GOAL DIFFERENCE</small><b>${z[0][7]>=0?"+":""}${z[0][7]}</b></div></div><div class="nav"><button onclick='go({type:"intro",d:"${d}"})'>BACK</button><button class="gold" onclick='go({type:"match",d:"${d}",i:0})'>MATCH 1 →</button></div></section>`}
function match(d,i){let q=X.divisions[d],f=q.fixtures[i],e=q.editorials[i],a=rowFor(d,f[0]),b=rowFor(d,f[1]),gap=Math.abs(a[8]-b[8]);return `<section class="page" style="--a:${q.accent}"><button class="back" onclick='go({type:"intro",d:"${d}"})'>← ${q.name} HOME</button><div class="ey">DIVISION ${d} · MATCH ${i+1}/5</div><div class="matchhead"><div class="team"><img src="${logo(f[0])}"><h3>${f[0]}</h3><small>#${a[0]} · ${a[8]} PT</small></div><div class="vs">VS<small>20:00</small></div><div class="team"><img src="${logo(f[1])}"><h3>${f[1]}</h3><small>#${b[0]} · ${b[8]} PT</small></div></div><div class="angle">${e[0]}</div><div class="infographic"><div class="metric"><small>POINTS GAP</small><b>${gap} PT</b></div><div class="metric"><small>GOAL DIFFERENCE</small><b>${a[7]>=0?"+":""}${a[7]} · ${b[7]>=0?"+":""}${b[7]}</b></div></div><p class="story">${e[1]}</p><div class="question"><small>THE QUESTION</small><b>${e[2]}</b></div><div class="nav"><button onclick="${i?`go({type:'match',d:'${d}',i:${i-1}})`:`go({type:'table',d:'${d}'})`}">← PREV</button><button class="gold" onclick="${i<4?`go({type:'match',d:'${d}',i:${i+1}})`:`go({type:'selector'})`}">${i<4?"NEXT MATCH →":"DIVISIONS →"}</button></div></section>`}
function render(){app.innerHTML=screen.type==="opening"?opening():screen.type==="big"?big():screen.type==="selector"?selector():screen.type==="intro"?intro(screen.d):screen.type==="table"?table(screen.d):match(screen.d,screen.i)}
render();
</script>
</body></html>
