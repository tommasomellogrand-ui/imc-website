<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RTH Pre Match · MD13</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#071a33;--navy2:#0c2b52;--blue:#2874ff;--sky:#eaf3ff;--gold:#d6ad52;--text:#0b172a;--muted:#718096;--line:#dfe7f1;--soft:#f5f8fc;--white:#fff;--shadow:0 16px 40px rgba(15,37,66,.11),0 3px 10px rgba(15,37,66,.08)}*{box-sizing:border-box}html{background:#fff}body{margin:0;background:linear-gradient(180deg,#fff 0,#f7faff 42%,#fff 100%);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);z-index:20;box-shadow:0 4px 16px rgba(20,49,85,.04)}header img{width:50px;height:50px;object-fit:contain}.brand{display:flex;gap:11px;align-items:center}.brand b{font-size:12px;letter-spacing:.15em;color:var(--navy);font-weight:900}.brand small,.date small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.date{text-align:right;font-size:10px;color:var(--navy);font-weight:800}main{max-width:520px;margin:auto}.page{min-height:calc(100vh - 78px);padding:22px 16px 42px}.ey{font-size:9px;letter-spacing:.19em;color:var(--blue);font-weight:900;text-transform:uppercase}.muted{color:var(--muted);font-size:9px}.cover{padding-top:26px}.hero{position:relative;overflow:hidden;border-radius:30px;padding:28px 22px;background:linear-gradient(145deg,#071a33,#0d3260 72%,#194f8d);color:#fff;box-shadow:0 24px 60px rgba(7,26,51,.22)}.hero:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-70px;top:-85px;background:radial-gradient(circle,rgba(72,152,255,.55),rgba(72,152,255,0) 68%)}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:40px;left:-95px;bottom:-115px;transform:rotate(28deg);background:linear-gradient(145deg,rgba(214,173,82,.36),rgba(214,173,82,0))}.hero>*{position:relative;z-index:2}.hero .ey{color:#80b7ff}.hero h1{font-size:52px;line-height:.86;letter-spacing:-.065em;margin:12px 0 10px;font-weight:900}.hero h1 span{color:#f1cb70}.hero p{margin:0;color:#c8d7ea;font-size:10px;line-height:1.5}.data-banner{margin-top:15px;border-radius:24px;background:#fff;padding:18px;box-shadow:var(--shadow);border:1px solid #e5edf6}.data-banner h2{font-size:25px;line-height:1.02;margin:6px 0 14px;letter-spacing:-.04em}.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chip{min-height:88px;border-radius:18px;padding:13px;background:linear-gradient(145deg,#ffffff,#eef4fb);border:1px solid #e1e8f1;box-shadow:7px 7px 16px rgba(36,65,98,.08),-5px -5px 14px rgba(255,255,255,.95)}.chip i{display:flex;width:28px;height:28px;border-radius:10px;align-items:center;justify-content:center;background:var(--sky);font-style:normal;font-size:14px}.chip small{display:block;margin-top:10px;color:var(--muted);font-size:7px;letter-spacing:.08em;font-weight:800}.chip b{display:block;color:var(--navy);font-size:13px;margin-top:2px}.cta,.navbtn,.backbtn{display:inline-flex;text-decoration:none;align-items:center;justify-content:center;border-radius:999px;padding:14px 18px;background:linear-gradient(145deg,#0d315e,#06182e);box-shadow:0 8px 20px rgba(7,26,51,.22);font-weight:900;color:#fff;touch-action:manipulation;font-size:10px;letter-spacing:.02em}.cover .cta{width:100%;margin-top:15px;padding:16px}.section h2{font-size:38px;line-height:.96;letter-spacing:-.05em;margin:7px 0 8px;color:var(--navy)}.divs,.matches{display:grid;gap:12px;margin-top:18px}.divbtn{display:grid;grid-template-columns:54px 1fr auto;align-items:center;width:100%;border:1px solid #dde6f0;background:linear-gradient(145deg,#fff,#f1f6fb);color:var(--text);border-radius:22px;padding:14px;text-decoration:none;touch-action:manipulation;box-shadow:9px 9px 22px rgba(36,65,98,.08),-6px -6px 18px rgba(255,255,255,1)}.divbtn:active{transform:translateY(2px);box-shadow:3px 4px 10px rgba(36,65,98,.08)}.divlogo{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e6edf5}.divlogo img{width:38px;height:38px;object-fit:contain}.divbtn h3{margin:2px 0;font-size:21px;color:var(--navy);letter-spacing:-.03em}.divbtn .lead{font-size:10px;color:var(--muted);font-weight:700}.arrow{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:900}.tablehead{display:flex;align-items:center;gap:12px}.backbtn{width:46px;height:46px;padding:0}.table-card{margin-top:14px;background:#fff;border:1px solid #e2e9f2;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.row{display:grid;grid-template-columns:26px 34px 1fr 48px 48px 34px;gap:5px;padding:9px 10px;border-bottom:1px solid #edf1f6;align-items:center;font-size:9px;min-height:52px}.row:last-child{border-bottom:0}.row:first-child{background:linear-gradient(90deg,#eaf3ff,#fff)}.row .crest{width:30px;height:30px;object-fit:contain}.row .name{font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .stat{color:var(--muted);font-size:8px;text-align:right}.row .pts{text-align:right;font-size:11px;color:var(--navy);font-weight:900}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.nav a{font-size:9px;min-width:118px}.match-shell{margin-top:14px}.match-card{position:relative;border-radius:28px;padding:20px;background:linear-gradient(145deg,#fff,#f3f7fc);border:1px solid #dfe7f0;box-shadow:12px 12px 28px rgba(28,58,92,.11),-8px -8px 20px rgba(255,255,255,1);overflow:hidden}.match-card:after{content:"";position:absolute;inset:auto -38px -58px auto;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#d9eaff 0,rgba(217,234,255,0) 70%)}.fixture{position:relative;z-index:1;display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;text-align:center;gap:7px}.team img{width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 8px 9px rgba(16,37,63,.13))}.team b{display:block;font-size:12px;margin-top:7px;color:var(--navy);font-weight:900}.vs{font-size:13px;font-weight:900;color:var(--blue)}.rank{display:block;font-size:8px;color:var(--muted);margin-top:3px}.storybox{margin-top:14px;border-radius:20px;padding:16px;background:linear-gradient(135deg,#071a33,#0d3260);color:#fff;box-shadow:0 10px 24px rgba(7,26,51,.16)}.storybox .ey{color:#80b7ff}.storybox h2{color:#fff;font-size:24px;line-height:1.02;margin:6px 0 8px}.formline{font-size:9px;color:#c9d7e7;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.metric{position:relative;overflow:hidden;min-height:118px;padding:13px;border:1px solid #dfe7f0;border-radius:20px;background:linear-gradient(145deg,#fff,#edf4fb);box-shadow:8px 8px 18px rgba(36,65,98,.08),-5px -5px 14px rgba(255,255,255,1)}.metric:before{content:"";position:absolute;width:66px;height:66px;border-radius:50%;right:-28px;top:-28px;background:#ddebff}.metric small{position:relative;z-index:1;color:var(--muted);display:block;font-size:7px;letter-spacing:.08em;font-weight:800}.metric .metric-v{position:relative;z-index:1;display:grid;grid-template-columns:28px 1fr 1fr;align-items:center;gap:5px;margin-top:13px}.metric img{width:27px;height:27px;object-fit:contain}.metric b{font-size:17px;color:var(--navy)}.metric .away{text-align:right;color:var(--blue)}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.player{border-radius:20px;padding:13px;background:#fff;border:1px solid #dfe7f0;box-shadow:var(--shadow)}.player-top{display:flex;align-items:center;gap:9px}.player img{width:38px;height:38px;object-fit:contain}.player small{font-size:7px;color:var(--muted);display:block}.player b{display:block;font-size:11px;color:var(--navy);margin-top:2px}.data-q{margin-top:13px;border-radius:22px;padding:16px;background:linear-gradient(135deg,#edf5ff,#fff);border:1px solid #dce8f5}.data-q h2{font-size:22px;margin:5px 0;color:var(--navy)}.dual-crests{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dual-crests img{width:35px;height:35px;object-fit:contain}.dual-crests span{font-size:9px;color:var(--muted);font-weight:800}.mini-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini{border-radius:16px;padding:10px;background:#fff;border:1px solid #e2e8f1;text-align:center}.mini small{display:block;font-size:6px;color:var(--muted);letter-spacing:.07em}.mini b{display:block;font-size:12px;color:var(--navy);margin-top:3px}@media(max-width:380px){.hero h1{font-size:46px}.section h2{font-size:34px}.row{grid-template-columns:22px 30px 1fr 42px 42px 30px}.team img{width:70px;height:70px}}</style></head><body><header><div class="brand"><img src="/nexus/assets/imc-logo.png"><div><b>ROAD TO HISTORY</b><small>PRE MATCH · MATCHDAY 13</small></div></div><div class="date"><b>23 AUG 2026</b><small>KICK-OFF 20:00</small></div></header><main id="app"></main><script>window.RTH={T:{},D:{},F:{}};</script><script src="d1.js?v=4"></script><script src="d2.js?v=4"></script><script src="d3.js?v=4"></script><script src="d4.js?v=4"></script><script>const{T,D,F}=RTH,A=document.getElementById('app');function rk(d,id){return D[d].indexOf(id)+1}function leaderLogo(d){return T[D[d][0]][8]}function cover(){return `<section class="page cover"><div class="hero"><div class="ey">RTH · MATCHDAY 13</div><h1>PRE MATCH<br><span>DATA ERA</span></h1><p>Il Pre-Match entra nella nuova era Nexus: non solo classifica, ma lettura reale delle prestazioni attraverso i Match Report.</p></div><div class="data-banner"><div class="ey">NEW · POWERED BY NEXUS</div><h2>PIÙ DATI.<br>PIÙ CONTESTO.<br>PIÙ PARTITA.</h2><div class="chips"><div class="chip"><i>◉</i><small>CONTROL</small><b>POSSESSO</b></div><div class="chip"><i>↗</i><small>THREAT</small><b>TIRI + SOT</b></div><div class="chip"><i>◆</i><small>MOMENTUM</small><b>ULTIME 5</b></div><div class="chip"><i>★</i><small>STAR POWER</small><b>VOTI · GOL · MVP</b></div></div></div><div class="mini-info"><div class="mini"><small>MATCHES</small><b>20</b></div><div class="mini"><small>TEAMS</small><b>40</b></div><div class="mini"><small>PAGES / MATCH</small><b>2</b></div></div><a class="cta" href="#divs">ENTRA NEL PRE MATCH →</a></section>`}function divs(){return `<section class="page section"><div class="ey">CHOOSE YOUR SHOW</div><h2>4 DIVISIONS.<br>40 STORIES.</h2><p class="muted">Scegli la divisione e entra nel suo Matchday 13.</p><div class="divs">${[1,2,3,4].map(d=>`<a class="divbtn" href="#table-${d}"><div class="divlogo"><img src="${leaderLogo(d)}"></div><div><span class="muted">DIVISION ${d}</span><h3>${['','PLATINUM','GOLD','SILVER','BRONZE'][d]}</h3><span class="lead">Leader: ${T[D[d][0]][0]} · ${T[D[d][0]][1]} PT</span></div><div class="arrow">→</div></a>`).join('')}</div></section>`}function table(d){return `<section class="page section"><div class="tablehead"><a class="backbtn" href="#divs">←</a><div><div class="ey">DIVISION ${d}</div><h2 style="margin-bottom:0">THE TABLE</h2><p class="muted" style="margin:5px 0 0">DOPO MATCHDAY 12</p></div></div><div class="table-card">${D[d].map((id,i)=>{let t=T[id];return `<div class="row"><b>${i+1}</b><img class="crest" src="${t[8]}"><span class="name">${t[0]}</span><span class="stat">${t[2]} GF</span><span class="stat">${t[3]} GS</span><b class="pts">${t[1]}</b></div>`}).join('')}</div><div class="nav"><a class="navbtn" href="#divs">DIVISIONI</a><a class="navbtn" href="#match-${d}-0">MATCH 1 →</a></div></section>`}function match(d,i,room){let[a,b]=F[d][i],x=T[a],y=T[b];if(!room)return `<section class="page section"><div class="ey">DIVISION ${d} · MATCH ${i+1}/5 · THE MATCH</div><div class="match-shell"><div class="match-card"><div class="fixture"><div class="team"><img src="${x[8]}"><b>${x[0]}</b><span class="rank">#${rk(d,a)} · ${x[1]} PT</span></div><div class="vs">VS</div><div class="team"><img src="${y[8]}"><b>${y[0]}</b><span class="rank">#${rk(d,b)} · ${y[1]} PT</span></div></div></div><div class="storybox"><div class="ey">WHY THIS MATCH MATTERS</div><h2>${Math.abs(x[1]-y[1])<=3?'POINTS ARE CLOSE. THE MARGINS ARE NOT.':'ONE NIGHT CAN CHANGE THE TABLE.'}</h2><div class="formline">FORMA · ${x[4]} &nbsp; | &nbsp; ${y[4]}</div></div><div class="mini-info"><div class="mini"><small>POINTS GAP</small><b>${Math.abs(x[1]-y[1])}</b></div><div class="mini"><small>TABLE</small><b>#${rk(d,a)} · #${rk(d,b)}</b></div><div class="mini"><small>KICK-OFF</small><b>20:00</b></div></div></div><div class="nav"><a class="navbtn" href="#table-${d}">CLASSIFICA</a><a class="navbtn" href="#data-${d}-${i}">DATA ROOM →</a></div></section>`;return `<section class="page section"><div class="ey">DIVISION ${d} · MATCH ${i+1}/5 · DATA ROOM</div><h2>${x[0]} <span style="color:var(--blue)">vs</span> ${y[0]}</h2><div class="dual-crests"><img src="${x[8]}"><span>HEAD-TO-HEAD DATA VIEW</span><img src="${y[8]}"></div><div class="metrics"><div class="metric"><small>POSSESSO MEDIO</small><div class="metric-v"><img src="${x[8]}"><b>${x[5]}%</b><b class="away">${y[5]}%</b></div></div><div class="metric"><small>TIRI / MATCH</small><div class="metric-v"><img src="${x[8]}"><b>${x[6]}</b><b class="away">${y[6]}</b></div></div><div class="metric"><small>IN PORTA / MATCH</small><div class="metric-v"><img src="${x[8]}"><b>${x[7]}</b><b class="away">${y[7]}</b></div></div><div class="metric"><small>GOL FATTI</small><div class="metric-v"><img src="${x[8]}"><b>${x[2]}</b><b class="away">${y[2]}</b></div></div><div class="metric"><small>GOL SUBITI</small><div class="metric-v"><img src="${x[8]}"><b>${x[3]}</b><b class="away">${y[3]}</b></div></div><div class="metric"><small>POINTS GAP</small><div class="metric-v"><img src="${x[8]}"><b>${Math.abs(x[1]-y[1])}</b><b class="away">PT</b></div></div></div><div class="players"><div class="player"><div class="player-top"><img src="${x[8]}"><div><small>PLAYER TO WATCH</small><b>${x[9]}</b></div></div><span class="muted">${x[0]}</span></div><div class="player"><div class="player-top"><img src="${y[8]}"><div><small>PLAYER TO WATCH</small><b>${y[9]}</b></div></div><span class="muted">${y[0]}</span></div></div><div class="data-q"><div class="ey">THE DATA QUESTION</div><h2>${x[6]>y[6]?x[0]:y[0]} PRODUCE PIÙ VOLUME. BASTERÀ?</h2></div><div class="nav"><a class="navbtn" href="#match-${d}-${i}">← THE MATCH</a><a class="navbtn" href="${i<4?`#match-${d}-${i+1}`:'#divs'}">${i<4?'NEXT MATCH →':'DIVISIONI →'}</a></div></section>`}function render(){let h=location.hash||'#cover';if(h==='#cover')A.innerHTML=cover();else if(h==='#divs')A.innerHTML=divs();else{let m=h.match(/^#table-(\d)$/);if(m)A.innerHTML=table(Number(m[1]));else{m=h.match(/^#(match|data)-(\d)-(\d)$/);if(m)A.innerHTML=match(Number(m[2]),Number(m[3]),m[1]==='data'?1:0);else A.innerHTML=cover();}}window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();</script></body></html>
