<style>
.nx-manager-wizard-list{
  display:grid;
  gap:12px;
}
.nx-manager-wizard-card{
  padding:0;
  overflow:hidden;
}
.nx-manager-compact-details{
  width:100%;
}
.nx-manager-compact-details > summary{
  list-style:none;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px 16px;
  align-items:center;
  padding:17px 18px;
  cursor:pointer;
  background:#fff;
}
.nx-manager-compact-details > summary::-webkit-details-marker{
  display:none;
}
.nx-manager-compact-details > summary::after{
  content:"▸";
  grid-column:2;
  grid-row:1 / span 2;
  color:#0d1b39;
  font-size:18px;
  transition:transform .18s ease;
}
.nx-manager-compact-details[open] > summary::after{
  transform:rotate(90deg);
}

  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}

  color:#0d1b39;

  font-size:12px;
  font-weight:800;
}
