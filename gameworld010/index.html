<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06142f">
  <title>GW010 · Sensible Soccer Academy</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#02070e;color:#fff;font-family:"Courier New",monospace}body{min-height:100vh;background:linear-gradient(#061f4e 0 280px,#0a376e 280px 420px,#168a48 420px 100%)}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(760px,94vw);background:#071425;border:4px solid #f4c73f;box-shadow:0 0 0 4px #000,inset 0 0 0 2px #35557e;text-align:center;padding:28px}
    h1{margin:0 0 8px;font-size:clamp(42px,8vw,86px);line-height:.9;color:#fff;text-shadow:4px 4px #000;-webkit-text-stroke:2px #d51e1e}h2{margin:0 0 18px;color:#f4c73f;letter-spacing:2px}.gw{font-weight:900;letter-spacing:3px;margin-bottom:24px}.actions{display:grid;gap:12px}.btn{display:block;padding:15px 18px;border:3px solid #fff;background:#123d79;color:#fff;text-decoration:none;font-weight:900;box-shadow:0 5px #000}.btn.primary{background:#b91f1f}.btn.secondary{background:#0f6d43}.note{margin-top:18px;color:#c9d4e5;font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>SENSIBLE SOCCER</h1>
      <h2>ACADEMY</h2>
      <div class="gw">GAME WORLD 010</div>
      <div class="actions">
        <a class="btn primary" href="/sensible-soccer-academy/draw/">🎡 APRI MANAGER DRAW</a>
        <a class="btn secondary" href="/sensible-soccer-academy/replay/">▶ APRI REPLAY</a>
      </div>
      <div class="note">Cartella ufficiale GW010 creata. La waiting room e il live draw verranno pubblicati qui, mantenendo il sorteggio sotto il Game World 010.</div>
    </section>
  </main>
</body>
</html>
